<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>배움퀘스트</title>
<!-- 표식: v7_patch.js 글자 = 옛 서비스워커 주입 방지(sw.js:309, 이 글자가 없는 화면에 v3~v7 을 끼움). 실제로 불러오지 않음. v2_patch.js v3_patch.js v4_patch.js v5_patch.js v6_patch.js v7_patch.js -->
<!-- 새 아이 화면 1판(그림자 운용, 2026-09-26). 예전 앱(../index.html)과 따로 돈다: 저장 키 bq_kid_v1 하나만 쓰고, 예전 저장소·게임 창·서비스워커 등록·manifest 없음.
     표식 약속 = 배움퀘스트 예산 문지기(kid_checks) README 2절 (data-kid-screen · data-kid · data-adult). 글꼴 Jua(SIL OFL 1.1, assets/font/OFL.txt) — 이 화면 글자만 남긴 부분 글꼴. -->
<style>
@font-face{font-family:'BQJua';src:url('assets/font/bq-jua-kid.woff2') format('woff2');font-display:swap}
:root{
  color-scheme:light;
  --bg:#F4F7FF;--c1:#FFFFFF;--c2:#E9EFFB;--tx:#1A2140;--t2:#525C7A;--t3:#6E7897;--p:#6B45F0;--line:#D8DFEE;
  --book:#C2410C;--book-t:#FFF1E9;--book-e:#F3C4A6;
  --music:#7C3AED;--music-t:#F1EAFE;--music-e:#D5C4F9;
  --play:#15803D;--play-t:#E7F7EC;--play-e:#B3DFC1;
  --letter:#B91C1C;--letter-t:#FEECEC;--letter-e:#F4C1C1;
  --math:#1D4ED8;
  --sun:#FFF3C8;--sun-e:#F2B84B;--sun-d:#B26A00;
  --glow:#FFC83D;--ok:#12874A;--pd:#C9D0DE;
  --kid:'BQJua','Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
  --adult:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--adult);font-size:16px}
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-touch-callout:none}
#stage{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.scr{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
.scr.in{animation:scrIn .22s ease-out}
@keyframes scrIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
img{max-width:100%;-webkit-user-drag:none}
svg.hb{display:block;width:100%;height:100%;overflow:visible}
.hb-o{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0)}
.talking .hb-live .hb-o{animation:talk .2s ease-in-out infinite alternate}
.talking .hb-live{animation:bob .45s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2.5%)}}
.lab{font-family:var(--kid);line-height:1;letter-spacing:.01em;font-weight:400}

/* 아이용 버튼 공통 */
.kb{position:absolute;display:block;border:0;margin:0;padding:0;background:transparent;color:inherit;font:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;transition:transform .08s ease-out,box-shadow .08s ease-out}
.kb:focus-visible{outline:5px solid var(--p);outline-offset:4px}
.kb.pressed{transform:translateY(5px)}
.glow{animation:glow 1.1s ease-in-out 3!important}
@keyframes glow{0%,100%{filter:none}50%{filter:drop-shadow(0 0 16px rgba(255,190,40,.95)) brightness(1.07)}}
.strong{animation:strong 1s ease-in-out infinite!important}
@keyframes strong{0%,100%{filter:drop-shadow(0 0 6px rgba(255,190,40,.7))}50%{filter:drop-shadow(0 0 22px rgba(255,190,40,1)) brightness(1.08)}}
.wig{animation:wig .42s ease-in-out}
@keyframes wig{25%{translate:-9px 0}75%{translate:9px 0}}
.pic{position:absolute;inset:0;display:block;width:100%;height:100%;overflow:hidden}
.pic img,.pic svg{width:100%;height:100%;object-fit:cover;display:block}

/* 홈 */
.today{border-radius:36px;background:radial-gradient(120% 90% at 30% 18%,#FFFCEB 0%,var(--sun) 52%,#FFE79A 100%);box-shadow:0 9px 0 var(--sun-e),0 14px 26px rgba(178,106,0,.16)}
.today.pressed{box-shadow:0 3px 0 var(--sun-e),0 5px 10px rgba(178,106,0,.14)}
.today .tm{position:absolute}
.today .tlab{position:absolute;font-family:var(--kid);font-size:24px;line-height:1;color:var(--sun-d)}
.slot{position:absolute;border-radius:22px;background:rgba(255,255,255,.62);border:3px dashed #E6C25E;overflow:hidden;box-sizing:border-box}
.slot.full{border:5px solid #fff;background:#fff;box-shadow:0 3px 9px rgba(26,33,64,.16)}
.slot.next{border:5px solid var(--glow);background:#fff;animation:nextPulse 1.6s ease-in-out infinite}
.slot.next .pic{opacity:.82}
.slot .star{position:absolute;right:4px;top:4px;width:30%;height:30%;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
@keyframes nextPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,200,61,0)}50%{box-shadow:0 0 0 9px rgba(255,200,61,.55)}}
.door{border-radius:30px;background:var(--t);box-shadow:0 8px 0 var(--e),0 12px 22px rgba(26,33,64,.10)}
.door.pressed{box-shadow:0 3px 0 var(--e),0 5px 10px rgba(26,33,64,.10)}
.door .hbw{position:absolute}
.door .lab{position:absolute;left:0;right:0;text-align:center;color:var(--a)}
.pdoor{position:absolute;width:48px;height:48px;border-radius:50%;background:var(--pd);border:0;padding:0;cursor:pointer;box-shadow:inset 0 -3px 0 rgba(26,33,64,.12);z-index:4}
.pdoor::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#AEB7C9}
.pdoor:focus-visible{outline:4px solid var(--p);outline-offset:3px}
.meadow{position:absolute;left:0;right:0;bottom:0;height:90px;pointer-events:none;background:
  radial-gradient(60% 120% at 18% 120%,#CFEBC9 0 60%,transparent 61%),
  radial-gradient(55% 110% at 70% 125%,#DDF2D5 0 60%,transparent 61%),
  linear-gradient(transparent 55%,#E6F5DF 55%)}
.heart{position:absolute;width:44px;height:44px;animation:bob .7s ease-in-out infinite alternate}
.heart svg{width:100%;height:100%;display:block}

/* 위 띠: 집·다시 듣기 */
.k-home,.k-rep{width:120px;height:120px;border-radius:30px;background:#fff;box-shadow:0 6px 0 #D5DCEB,0 10px 18px rgba(26,33,64,.08);z-index:8}
.k-home{transform-origin:0 0}.k-rep{transform-origin:100% 0}
.k-home>svg,.k-rep>svg{position:absolute;left:18px;top:18px;width:84px;height:84px}
.k-home.confirm{transform:scale(1.3333);box-shadow:0 0 0 6px var(--glow),0 6px 0 #D5DCEB}
.k-home.confirm.pressed{transform:scale(1.3333) translateY(4px)}
.fcenter{position:absolute;pointer-events:none}
.dots{position:absolute;display:flex;align-items:center;justify-content:center;pointer-events:none;gap:var(--dg,14px)}
.dots i{width:var(--ds,18px);height:var(--ds,18px);border-radius:50%;background:#D6DCEA;transition:all .2s}
.dots i.done{background:var(--a)}
.dots i.cur{width:calc(var(--ds,18px) + 8px);height:calc(var(--ds,18px) + 8px);background:var(--a)}

/* 방 */
.card{border-radius:26px;background:#fff;box-shadow:0 7px 0 var(--e),0 10px 20px rgba(26,33,64,.10)}
.card.pressed{box-shadow:0 2px 0 var(--e),0 4px 8px rgba(26,33,64,.1)}
.card>.pic{inset:8px;width:auto;height:auto;border-radius:19px}
.card.off>.pic{filter:grayscale(.75);opacity:.45}
.card .stamp{position:absolute;right:-10px;top:-10px;width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 2px 7px rgba(26,33,64,.22);padding:5px;box-sizing:border-box}
.card .stamp svg{width:100%;height:100%}

/* 활동 */
.cm-panel{border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 6px 18px rgba(26,33,64,.16)}
.cm-panel img{width:100%;height:100%;object-fit:contain;display:block}
.k-nav{border-radius:28px;background:#fff;box-shadow:0 6px 0 var(--e,#D5DCEB),0 8px 16px rgba(26,33,64,.08)}
.k-nav svg{position:absolute;left:50%;top:50%;width:64px;height:64px;transform:translate(-50%,-50%)}
.k-nav[data-off="1"]{opacity:.3}
.bigmas{position:absolute;pointer-events:none}
.seecard{border-radius:36px;background:#fff;box-shadow:0 8px 0 var(--e),0 12px 24px rgba(26,33,64,.1);display:flex;align-items:center;justify-content:center;overflow:hidden}
.seecard.pressed{box-shadow:0 3px 0 var(--e)}
.bigch{font-family:var(--kid);line-height:1;color:var(--a)}
.row3{position:absolute;display:flex;gap:16px;justify-content:center;align-items:center;pointer-events:none}
.row3 .mini{border-radius:22px;background:#fff;box-shadow:0 5px 0 var(--e);display:flex;align-items:center;justify-content:center;overflow:hidden}
.choice{border-radius:28px;background:#fff;box-shadow:0 7px 0 var(--e),0 10px 18px rgba(26,33,64,.08);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .25s,filter .25s,transform .08s}
.choice[data-wait="1"]{opacity:.42;filter:saturate(.35)}
.choice.right{box-shadow:0 0 0 8px #86DDA7,0 7px 0 var(--e)}
.choice>.pic{inset:8px;width:auto;height:auto;border-radius:20px}
.stim{position:absolute;border-radius:28px;background:#fff;box-shadow:0 5px 0 var(--e);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;align-content:center;gap:8%;pointer-events:none;padding:6%;box-sizing:border-box}
.dot{border-radius:50%;background:#F5B82E;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.key{border-radius:0 0 22px 22px;background:var(--kc);box-shadow:inset 0 -16px 0 rgba(26,33,64,.10),0 6px 0 rgba(26,33,64,.14)}
.key.pad{border-radius:26px}
.key.hit{filter:brightness(1.1) saturate(1.2);transform:translateY(5px);box-shadow:inset 0 -8px 0 rgba(26,33,64,.10),0 1px 0 rgba(26,33,64,.14)}
.mcard{perspective:900px}
.mcard .in{position:absolute;inset:0;transition:transform .34s ease;transform-style:preserve-3d}
.mcard.up .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.mcard .b{background:linear-gradient(150deg,#2BAE66,#15803D);box-shadow:0 6px 0 #0F6B32}
.mcard .b svg{position:absolute;left:50%;top:50%;width:44%;height:44%;transform:translate(-50%,-50%);opacity:.9}
.mcard .f{transform:rotateY(180deg);background:#fff;box-shadow:0 6px 0 var(--play-e)}
.mcard .f img{position:absolute;inset:7px;width:calc(100% - 14px);height:calc(100% - 14px);object-fit:cover;border-radius:16px}
.mcard.gone .f{box-shadow:0 0 0 6px #86DDA7,0 6px 0 var(--play-e)}
.vwrap{border-radius:22px;overflow:hidden;background:#11152A;box-shadow:0 8px 22px rgba(26,33,64,.2)}
.vwrap video{width:100%;height:100%;display:block;object-fit:contain;background:#11152A}
.vplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.55);pointer-events:none}
.vplay .hbw{width:34%;max-width:220px;aspect-ratio:120/134}
.vplay svg.tri{position:absolute;width:18%;max-width:120px;right:18%;bottom:14%}
.mini-board{position:absolute;display:flex;gap:12px;padding:12px;border-radius:24px;background:rgba(255,255,255,.92);box-shadow:0 8px 24px rgba(26,33,64,.16);z-index:9;pointer-events:none}
.mini-board .slot{position:relative}
.flyer{position:fixed;transform-origin:0 0;border-radius:20px;overflow:hidden;box-shadow:0 10px 26px rgba(26,33,64,.3);background:#fff}
.flyer .pic{position:absolute;inset:0}

/* 끝 화면 */
.k3{background:radial-gradient(90% 70% at 50% 30%,#FFFBEA,#FFF1C2)}
.k3pic{position:absolute;border-radius:30px;background:#fff;box-shadow:0 10px 28px rgba(26,33,64,.18);border:8px solid #fff;overflow:hidden;box-sizing:border-box}
.k3pic .pic{border-radius:22px}
.bigtxt{position:absolute;left:0;right:0;text-align:center;font-family:var(--kid);color:var(--sun-d);line-height:1}
.k3 .slots{position:absolute;display:flex;gap:14px}
.k3 .slots .slot{position:relative}
.k4{background:linear-gradient(#FFF8E0,#FFEFD6)}
.album{position:absolute;border-radius:26px;background:#FFFDF6;box-shadow:0 10px 28px rgba(26,33,64,.16);background-image:linear-gradient(#F3EBD6 1px,transparent 1px),linear-gradient(90deg,#F3EBD6 1px,transparent 1px);background-size:28px 28px;overflow:hidden}
.album .stk{position:absolute;border:6px solid #fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 10px rgba(26,33,64,.2);background:#fff;box-sizing:border-box}
.album .stk.now{animation:stick .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes stick{from{transform:scale(1.6) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(-4deg);opacity:1}}
.endbtn{border-radius:32px;background:#fff;box-shadow:0 8px 0 #E7D2A6,0 12px 22px rgba(26,33,64,.1)}
.endbtn .hbw{position:absolute}
.endbtn .lab{position:absolute;left:0;right:0;text-align:center;color:var(--sun-d)}
.k5{background:linear-gradient(#EFEAFF,#E3E9FB);transition:background 2s}
.k5 .moon{position:absolute;border-radius:50%;background:#FFE9A3;box-shadow:0 0 40px 10px rgba(255,233,163,.6)}
.k5 .dimmer{position:absolute;inset:0;background:#1A2140;opacity:0;transition:opacity 3s;pointer-events:none}
.k5.dim .dimmer{opacity:.6}
.k5all{inset:0;width:100%;height:100%}
.k5 .bigtxt{color:#4B3FA0}

/* 부모 문 */
.p0{background:#F7F8FC}
.p0box{position:absolute;display:flex;gap:var(--pg,28px);align-items:center;justify-content:safe center;flex-wrap:wrap;align-content:safe center;overflow-x:hidden;overflow-y:auto;touch-action:pan-y}
.p0col{display:flex;flex-direction:column;align-items:center;gap:var(--cg,14px);max-width:320px}
.p0 h1{font-family:var(--kid);font-weight:400;font-size:26px;margin:0;text-align:center;word-break:keep-all}
.p0 .msg{margin:0;color:var(--t2);font-size:17px;text-align:center;word-break:keep-all}
.pins{display:flex;gap:12px}
.pins b{width:48px;height:56px;border-radius:14px;background:#fff;border:2px solid #CBD3E6;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--tx)}
.pins b.on{border-color:var(--p)}
.pins.shake{animation:wig .4s}
.pad{display:grid;grid-template-columns:repeat(3,var(--k,72px));gap:var(--kg,12px)}
.pad button{width:var(--k,72px);height:var(--k,72px);padding:0;border-radius:18px;border:0;background:#fff;box-shadow:0 3px 0 #D5DCEB;font-family:var(--adult);font-size:28px;color:var(--tx);cursor:pointer}
.pad button.sm{font-size:16px}
.pad button:active{transform:translateY(3px);box-shadow:none}
.pad button:disabled{opacity:.4}
.pad button:focus-visible{outline:3px solid var(--p);outline-offset:2px}
.p0 .hint{font-size:16px;color:var(--t3);margin:0;text-align:center;word-break:keep-all}
.p0 .hint.err{color:#B45309}
.p0 .lock{color:#B45309;font-size:16px;margin:0;text-align:center;word-break:keep-all}
/* 아주 작은 창(Z플립 바깥 화면 등): 번호 칸·번호판을 나란히, 숫자판 48px 까지 줄임 */
.p0box.tight{flex-wrap:nowrap}
.p0box.tight .p0info{max-width:none;flex:1 1 0;min-width:0}
.p0box.tight h1{font-size:20px}
.p0box.tight .msg{font-size:16px}
.p0box.tight .pins{gap:6px}
.p0box.tight .pins b{box-sizing:border-box;width:34px;height:42px;font-size:22px;border-radius:10px}
.p0box.tight .pad button.sm{font-size:16px;line-height:1.1}

/* 부모 화면 */
.scr-p1{overflow-y:auto;overflow-x:hidden;-webkit-user-select:text;user-select:text;background:#F6F7FB;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.pw{max-width:780px;margin:0 auto;padding:16px 16px 56px;box-sizing:border-box}
.ph{display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#F6F7FB;padding:6px 0 10px;z-index:2}
.ph h1{font-family:var(--kid);font-weight:400;font-size:24px;margin:0;flex:1;text-align:right}
.ph .pmark{width:40px;height:40px}
.ctl{min-height:48px;padding:0 16px;border-radius:14px;border:1.5px solid #CBD3E6;background:#fff;font-family:var(--adult);font-size:16px;color:var(--tx);cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-align:left;box-sizing:border-box;text-decoration:none}
.ctl:hover{border-color:#9FAACB}
.ctl:focus-visible,.scr-p1 select:focus-visible,.scr-p1 input:focus-visible,.scr-p1 textarea:focus-visible{outline:3px solid var(--p);outline-offset:2px}
.ctl.pri{background:var(--p);border-color:var(--p);color:#fff}
.ctl.warn{border-color:#E7B08A;color:#9A3412}
.ctl.warn.armed{background:#FFF1E6;border-color:#C2410C;color:#9A3412}
.n{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:14px;background:#EFEAFE;color:#4C2FC7;font-size:16px;font-variant-numeric:tabular-nums;padding:0 6px;box-sizing:border-box}
.sec{background:#fff;border-radius:20px;padding:18px;margin-top:14px;border:1px solid var(--line)}
.sec h2{font-family:var(--kid);font-weight:400;font-size:21px;margin:0 0 12px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sec p{margin:6px 0;line-height:1.55}
.big{font-size:19px}
.sub{color:var(--t2)}
.note{font-size:16px;color:var(--t3)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;min-height:52px;border-top:1px solid #EEF1F7;padding:6px 0}
.row:first-of-type{border-top:0}
.row label{display:inline-flex;align-items:center;gap:8px}
.scr-p1 select,.scr-p1 input[type=text],.scr-p1 input:not([type]),.scr-p1 textarea{min-height:48px;border-radius:12px;border:1.5px solid #CBD3E6;background:#fff;font-family:var(--adult);font-size:16px;color:var(--tx);padding:0 12px;box-sizing:border-box;max-width:100%}
.scr-p1 textarea{padding:10px 12px;width:100%;font-size:16px;font-family:ui-monospace,Consolas,monospace}
.scr-p1 input[type=range]{width:200px;max-width:100%;accent-color:var(--p);min-height:48px}
/* 스위치: 보이는 크기 56×32, 누름 영역은 투명 테두리로 72×48 */
.sw{appearance:none;-webkit-appearance:none;box-sizing:content-box;width:56px;height:32px;border-radius:24px;border:8px solid transparent;background:#CBD3E6;background-clip:padding-box;position:relative;cursor:pointer;margin:0 -8px 0 0;transition:background .2s}
.sw::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.sw:checked{background-color:var(--p)}
.sw:checked::after{left:28px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:12px 0 6px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:16px;color:var(--t3)}
.week .cell{width:100%;max-width:64px;aspect-ratio:1;border-radius:12px;background:#F1F3F9;position:relative;overflow:hidden}
.week .cell.today{box-shadow:0 0 0 2px var(--sun-e)}
.week .cell .pic{border:3px solid #fff;border-radius:12px;box-sizing:border-box}
.albumrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.albumrow .st{width:64px;height:64px;border-radius:12px;position:relative;overflow:hidden;box-shadow:0 2px 6px rgba(26,33,64,.18);border:3px solid #fff;box-sizing:border-box}
.drawer{margin-top:12px;padding:14px;border-radius:14px;background:#F7F8FC;border:1px dashed #CBD3E6;display:flex;flex-direction:column;gap:10px}
.drawer canvas,.drawer .wkimg{width:100%;max-width:560px;height:auto;border-radius:12px;box-shadow:0 2px 8px rgba(26,33,64,.15)}
.drawer .danger{margin-top:8px;padding-top:12px;border-top:1px solid #E3E7F1;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:48px;border-radius:24px;border:1px solid #CBD3E6;background:#fff;padding:0 14px;font:inherit;font-size:16px;cursor:pointer}
fieldset{border:1px solid #E3E7F1;border-radius:12px;margin:0;padding:8px 12px}
legend{padding:0 6px;color:var(--t2)}
.chk{display:flex;align-items:center;gap:10px;min-height:48px}
.chk input{width:22px;height:22px;accent-color:var(--p)}
.info{margin:10px 0 0;padding-left:18px;color:var(--t2);font-size:16px;line-height:1.7}
.pfoot{margin-top:22px;font-size:16px;color:var(--t3);line-height:1.6;text-align:center}
.pfoot small{font-size:inherit}
.pfoot a{color:var(--t2);display:inline-flex;align-items:center;min-height:48px;padding:0 8px}
.pnav{display:none}
.ld .pw{max-width:none;padding:16px 24px 40px}
.ld .pgrid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:22px;align-items:start}
.ld .pnav{display:flex;flex-direction:column;gap:8px;position:sticky;top:70px;margin-top:14px}
.ld .pnav button{justify-content:flex-start;width:100%}
.ld .pnav button.on{border-color:var(--p);background:#F3EFFF}
.ld .sec{display:none}
.ld .sec.on{display:block}

/* 같이 보기 */
.tg{background:#FBF6EE}
.tpage{position:absolute;background:#fff;box-shadow:0 6px 18px rgba(26,33,64,.16);overflow:hidden}
.tpage img{width:100%;height:100%;display:block;object-fit:contain}
.qcol{position:absolute;display:flex;flex-direction:column;gap:12px;overflow:auto;padding:4px 2px 10px;box-sizing:border-box}
.qcol h3{margin:0;font-family:var(--kid);font-weight:400;font-size:20px;color:var(--book)}
.qcard{background:#fff;border-radius:18px;padding:16px;border:1px solid #F0DCCB;box-shadow:0 4px 0 #F3E2D2;font-family:var(--adult);font-size:18px;line-height:1.5;color:var(--tx)}
.qtip{font-size:16px;color:var(--t3);line-height:1.5;margin:0}
.qtoggle{position:absolute;min-height:48px;padding:0 8px;white-space:nowrap;border-radius:14px;border:1.5px solid #E7CDB7;background:#fff;font-family:var(--adult);font-size:16px;color:var(--book);cursor:pointer;z-index:6}
.qsolo{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.qsolo .qcard{font-size:22px;max-width:560px;text-align:center}
.qsolo .kb{flex-shrink:0}
@media (max-height:480px){.qsolo{flex-direction:row}.qsolo .qcard{font-size:16px}}

@media (prefers-reduced-motion: reduce){
  .scr.in,.talking .hb-live,.talking .hb-live .hb-o,.slot.next,.glow,.strong,.wig,.heart,.album .stk.now{animation:none!important}
  .glow,.strong{outline:6px solid var(--glow);outline-offset:3px}
  .kb,.mcard .in,.choice,.dots i,.k5,.k5 .dimmer{transition:none!important}
}

<script>
(() => {

/* ================= 저장 (이 기기 이 브라우저, 새 화면 전용 키 하나) =================
   예전 앱 저장소(lp6·lp_user·lp_v3_data 등)는 읽지도 쓰지도 않는다 — 기록 옮기기는 3-6 단계. */

function ymd(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

  parent: { pin: '', end: '', oneMore: true, off: {}, vol: 80, name: '', age: 'kid' } });
let ST = DEF();
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && typeof s === 'object') { ST = Object.assign(DEF(), s); ST.parent = Object.assign(DEF().parent, s.parent || {}); } } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) {} }
function rollDay() { const t = ymd(); if (ST.day !== t) { ST.day = t; ST.board = []; ST.picked = null; } if (!ST.opens.includes(t)) { ST.opens.push(t); ST.opens = ST.opens.slice(-60); } }

/* ================= 한범 (DESIGN_SPEC 유아 변주를 몸통·소품과 합친 그림) ================= */

/* ================= 문제(소리 듣고 고르기) 엔진 — 3단계 도움 ================= */
function quizLayout(st, mas, stim, chs) {
  const g = st.M.g, n = chs.length;
  if (st.tiny) {
    // 아주 작은 창: 한범을 접고 보기를 한 줄로(보기 120 이상), 점 그림은 위 띠 가운데 틈에
    mas.hidden = true;
    if (stim) { const M = st.M, L = M.m + 132, R = M.W - M.m - 132, sw = Math.max(40, Math.min(110, R - L)); place(stim, (M.W - sw) / 2, 8 + (120 - sw) / 2, sw, sw); }
    const s = Math.max(0, Math.min((st.w - (n - 1) * g) / n, st.h, 320));
    const ox = st.x + (st.w - (n * s + (n - 1) * g)) / 2, oy = st.y + (st.h - s) / 2;
    chs.forEach((c, i) => place(c, ox + i * (s + g), oy, s, s));
    return s;
  }
  mas.hidden = false;
  let ax, ay, aw, ah, stack = false;
  if (st.w > st.h * 1.15) {
    const lw = Math.min(st.w * 0.34, st.h * 0.8 / HBR + 20);
    if (stim) { const mh = Math.min(st.h * 0.42, lw * HBR * .8), mw = mh / HBR; place(mas, st.x + (lw - mw) / 2, st.y, mw, mh); const sh = Math.min(st.h - mh - 16, lw); place(stim, st.x + (lw - sh) / 2, st.y + mh + 16, sh, sh); }
    else { const mw = lw, mh = Math.min(mw * HBR, st.h); place(mas, st.x, st.y + (st.h - mh) / 2, mh / HBR, mh); }
    ax = st.x + lw + g; ay = st.y; aw = st.w - lw - g; ah = st.h;
  } else {
    // 보기 2개가 나란히 240 미만이면(폰 세로) 위아래로 쌓고 한범을 줄여 보기를 240 이상으로
    stack = n === 2 && !stim && (st.w - g) / 2 < 240;
    const th = stack ? Math.max(80, Math.min(200, st.h - 2 * Math.min(st.w, 260) - 2 * g)) : Math.min(st.h * 0.3, 240); // 360x780: 한범 80 → 보기 242
    if (stim) { const mh = th, mw = mh / HBR; const sw = Math.min(th, st.w - mw - 16); const tot = mw + 16 + sw; place(mas, st.x + (st.w - tot) / 2, st.y, mw, mh); place(stim, st.x + (st.w - tot) / 2 + mw + 16, st.y + (th - sw) / 2, sw, sw); }
    else { const mh = th, mw = mh / HBR; place(mas, st.x + (st.w - mw) / 2, st.y, mw, mh); }
    ax = st.x; ay = st.y + th + g; aw = st.w; ah = st.h - th - g;
  }
  const cols = stack ? 1 : 2, rows = stack ? 2 : (n <= 2 ? 1 : 2);
  const s = Math.max(0, Math.min((aw - (cols - 1) * g) / cols, (ah - (rows - 1) * g) / rows, 320));
  const tw = cols * s + (cols - 1) * g, tth = rows * s + (rows - 1) * g, ox = ax + (aw - tw) / 2, oy = ay + (ah - tth) / 2;
  chs.forEach((c, i) => { let px = ox + (i % cols) * (s + g); if (n === 3 && i === 2) px = ox + (tw - s) / 2; place(c, px, oy + Math.floor(i / cols) * (s + g), s, s); });
  return s;
}
function makeQuiz(inst, q, onDone) {
  const r = inst.r;
  (r.chs || []).forEach(c => c.remove()); r.chs = [];
  let wrong = 0, alive = true, tok = 0, target = null;
  const setWait = v => r.chs.forEach(b => { if (v) b.dataset.wait = '1'; else delete b.dataset.wait; });
  function ask(text) {
    const t = ++tok; setWait(true); Idle.clear();
    // 보기는 '말이 끝남'과 '화면 바뀐 뒤 0.8초 쉼'이 둘 다 지난 뒤에 선명해진다 — 선명한데 눌러도 무시되는 순간 0
    return say(text).then(res => {
      if (!alive || t !== tok || res.cut) return;
      const go = () => { if (!alive || t !== tok) return; setWait(false); Idle.set({ ms: 4000, max: 2, reset: true, text: q.prompt, el: null }); };
      const dl = S.lastT + 820 - now(); if (dl > 0) later(go, dl); else go();
    });
  }
  q.choices.forEach(c => {
    const b = kbtn('choice', c.html, () => {
      if (!alive) return; Idle.clear();
      if (c.ok) {
        alive = false; setWait(true); b.classList.add('right'); b.classList.remove('strong'); chime();
        say(c.name + '! 맞아!', { repeat: false }).then(() => { if (S.cur.inst === inst) onDone(); });
      } else {
        wrong++; wig(b);
        if (wrong === 1) ask(c.name + '! 다시 해 볼까? ' + q.prompt);
        else if (wrong === 2) { glow(target); ask(q.prompt + ' ' + q.hint); }
        else { target.classList.add('strong'); ask('이걸 눌러 봐!'); }
      }
    }, c.name, 'choice');
    if (c.ok) target = b;
    b.dataset.wait = '1'; inst.root.append(b); r.chs.push(b);
  });
  relayout(); ask(q.prompt);
  return { reask() { if (alive) ask(q.prompt); }, kill() { alive = false; } };
}

        place(r.panel, lx, top, P, P); place(r.prev, lx, top + P + 16, 120, 120); place(r.next, lx + P - 120, top + P + 16, 120, 120);

      }
    } else if (this.phase === 'explain') {
      if (st.w > st.h * 1.15) { const mh = Math.min(st.h, st.w * .45 * HBR), mw = mh / HBR, cs = Math.min(st.h * .7, st.w - mw - 60); const tot = mw + 40 + cs; place(r.mas, st.x + (st.w - tot) / 2, st.y + (st.h - mh) / 2, mw, mh); place(r.cover, st.x + (st.w - tot) / 2 + mw + 40, st.y + (st.h - cs) / 2, cs, cs); }
      else { const cs = Math.min(st.w * .7, st.h * .38), mh = Math.min(st.h - cs - 30, st.w * HBR * .8), mw = mh / HBR; place(r.cover, st.x + (st.w - cs) / 2, st.y, cs, cs); place(r.mas, st.x + (st.w - mw) / 2, st.y + cs + 24, mw, mh); }

      if (land) { const mh = Math.min(st.h * .8, (st.w - cs - 40) * HBR * .8), mw = mh / HBR, tot = cs + 40 + mw; place(r.see, st.x + (st.w - tot) / 2, st.y + (st.h - cs) / 2, cs, cs); place(r.mas, st.x + (st.w - tot) / 2 + cs + 40, st.y + st.h - mh, mw, mh); }

      if (land) { const rw = 3 * ms + 32, mh = Math.max(0, Math.min(st.h, st.w * .4 * HBR, (st.w - 40 - rw) * HBR)), mw = mh / HBR, tot = mw + 40 + rw; /* 작은 창에서 한범을 줄여 줄이 화면 안에 */ place(r.mas, st.x + (st.w - tot) / 2, st.y + (st.h - mh) / 2, mw, mh); place(r.row, st.x + (st.w - tot) / 2 + mw + 40, st.y + (st.h - ms) / 2, rw, ms); }
      else { const mh = Math.min(st.h - ms - 40, st.w * .7 * HBR), mw = mh / HBR; place(r.mas, st.x + (st.w - mw) / 2, st.y, mw, mh); place(r.row, st.x, st.y + mh + 30, st.w, ms); }
      [...r.row.children].forEach((c, i) => { c.style.width = c.style.height = ms + 'px'; c.innerHTML = this.L.view(this.L.items[i], ms * .62); });
    } else {
      const s = quizLayout(st, r.mas, this.L.stim ? r.stim : null, r.chs || []);
      (r.chs || []).forEach((c, i) => { const it = c._it; if (it) c.innerHTML = this.L.stim ? `<span class="bigch" style="font-size:${s * .62}px">${it.big}</span>` : this.L.view(it, s * .62); });
      if (this.L.stim && this.stimN) { const sw = parseFloat(r.stim.style.width) || 100; const d = sw * .2; r.stim.innerHTML = ('<span class="dot" style="width:' + d + 'px;height:' + d + 'px"></span>').repeat(this.stimN); }
    }
  },
  renderSee(cs) { const it = this.L.items[this.k]; this.r.see.innerHTML = this.L.view(it, cs * .66); },
  enter() { const tok = ++this.seq; setDots(this.r.F, 0); say(ACTS[this.p.id].say, { repeat: false }).then(res => { if (tok === this.seq && !res.cut && S.cur.inst === this) this.startSee(); }); },
  startSee() { this.phase = 'see'; setDots(this.r.F, 0); relayout(); this.playSee(); },
  playSee() {

  toExplain() {

    const ti = list[qi], it = L.items[ti];

    if (r.st && r.st.tiny) { const w = order.find(k => k !== ti); order = order.filter(k => k === ti || k === w); } // 아주 작은 창은 보기 2개

      if (qi + 1 < list.length) this.toQuiz(step, qi + 1);

/* ================= K2 활동: 음악방 꼬마 8건반 ================= */
SCR.piano = {
  kid: true, activity: true,
  build(root) {
    const r = this.r;
    root.style.background = 'var(--music-t)'; root.style.setProperty('--a', 'var(--music)'); root.style.setProperty('--e', 'var(--music-e)');
    r.F = mkFrame(root, { center: 'piano' });
    // 건반 = 색만(게임 안 글자 0 — 6절 8번 완료 기준). 음 이름은 읽어 주는 이름표(aria-label)에만
    r.keys = NOTE.map((nm, i) => { const k = kbtn('key', '', () => this.hit(i, k), nm, 'key'); k.style.setProperty('--kc', KEYC[i]); root.append(k); return k; });
    this.count = 0; this.t0 = now(); this.filled = ST.board.includes('piano');
  },
  layout(W, H) {
    const r = this.r, st = frameLayout(r.F, W, H), gap = st.M.big ? 12 : 8;
    let cols = 2;
    for (const c of [8, 4, 2]) { const rows = 8 / c, kw = (st.w - (c - 1) * gap) / c, kh = (st.h - (rows - 1) * gap) / rows; if (Math.min(kw, kh) >= 120) { cols = c; break; } }
    const rows = 8 / cols; let kw = (st.w - (cols - 1) * gap) / cols, kh = (st.h - (rows - 1) * gap) / rows;
    if (cols === 2) { const s = Math.min(kw, kh * 1.3); kw = s; }
    const ox = st.x + (st.w - (cols * kw + (cols - 1) * gap)) / 2;
    r.keys.forEach((k, i) => { place(k, ox + (i % cols) * (kw + gap), st.y + Math.floor(i / cols) * (kh + gap), kw, kh); k.classList.toggle('pad', cols < 8); });
    this.cols = cols;
    if (r.mb) this.placeMB();
  },
  // 20번 채움 때 뜨는 작은 판: 위 띠(집·다시 듣기 사이)에 들어가면 거기에(건반과 겹침 0), 폰처럼 좁으면 건반 위(누름은 아래 건반으로 통과)
  placeMB() {
    const r = this.r, mb = r.mb; if (!mb) return;
    const { W, H } = size(), M = metrics(W, H), bw = 3 * 72 + 2 * 12 + 24, bh = 72 + 24;
    const c = r.F.center, ww = 118 / HBR, withC = !c.hidden, need = bw + (withC ? ww + 12 : 0);
    const L = M.m + 120 + 12, R = W - M.m - 120 - 12;
    if (!(H < 480 && W > H) && R - L >= need) {
      const x0 = (W - need) / 2;
      if (withC) place(c, x0, 9, ww, 118);
      place(mb, x0 + (withC ? ww + 12 : 0), 8 + (120 - bh) / 2);
    } else place(mb, (W - bw) / 2, STAGE_Y + 4);
  },
  hit(i, k) {
    Voice.cancel(); Idle.poke();
    tone(FREQ[i], 1.3, 0.34);
    k.classList.add('hit'); setTimeout(() => k.classList.remove('hit'), 160);
    this.count++;
    if (!this.filled && (this.count >= 20 || (now() - this.t0 >= 180000 && this.count >= 10))) { this.filled = true; this.fill(); }
  },
  fill() {
    const isNew = !ST.board.includes('piano') && ST.board.length < 3, before = ST.board.slice();
    if (isNew) ST.board.push('piano'); logDone('piano'); save();
    const r = this.r;
    const mb = $('div', 'mini-board'); const sl = [0, 1, 2].map(() => { const s = $('span', 'slot'); mb.append(s); return s; });
    const s = 72; sl.forEach(x => { x.style.width = x.style.height = s + 'px'; });
    fillSlots(sl, before, null); this.root.append(mb);
    r.mb = mb; this.placeMB();
    say('다 했다! 더 해도 돼!', { repeat: false });
    if (isNew) later(() => fly(r.F.center, sl[before.length], picHTML('piano'), () => { fillSlots(sl, ST.board, null); }), 150);
    later(() => { mb.remove(); r.mb = null; relayout(); if (isNew && ST.board.length === 3 && !ST.picked) show('k4'); }, 2600);
  },
  enter() { say(ACTS.piano.say).then(res => { if (!res.cut) Idle.set({ ms: 7000, max: 2, reset: true, text: '건반을 눌러 봐!', el: () => this.r.keys[0] }); }); },
};

/* ================= K2 활동: 놀이방 기억력 카드 (카드 사이 24px) ================= */
SCR.memory = {
  kid: true, activity: true,
  build(root) {
    const r = this.r;
    root.style.background = 'var(--play-t)'; root.style.setProperty('--a', 'var(--play)'); root.style.setProperty('--e', 'var(--play-e)');
    r.F = mkFrame(root, { center: 'blocks' });
    this.deck = null; this.open = []; this.lock = false; this.pairs = 0;
  },
  grid(n, land) { return n === 12 ? (land ? [4, 3] : [3, 4]) : (land ? [3, 2] : [2, 3]); },
  layout(W, H) {
    const r = this.r, st = frameLayout(r.F, W, H), g = 24, land = st.w > st.h;
    if (!this.deck) {
      const [c12, r12] = this.grid(12, land), m12 = Math.min((st.w - (c12 - 1) * g) / c12, (st.h - (r12 - 1) * g) / r12);
      const n = m12 >= 140 ? 12 : 6, faces = MEMF.slice(0, n / 2);
      const deck = faces.concat(faces).map((f, i) => ({ f, i })).sort(() => Math.random() - 0.5);
      this.deck = deck.map(d => { const c = kbtn('mcard', `<span class="in"><span class="b">${I_PAW}</span><span class="f">${IMG('assets/thumbs/' + d.f.f + '.jpg')}</span></span>`, () => this.flip(c), '카드', 'piece'); c.dataset.face = d.f.f; c._f = d.f; this.root.append(c); return c; });
    }
    const n = this.deck.length, [cols, rows] = this.grid(n, land);
    let cw = (st.w - (cols - 1) * g) / cols, ch = (st.h - (rows - 1) * g) / rows;
    ch = Math.min(ch, cw * 1.35); cw = Math.min(cw, ch * 1.35);
    const ox = st.x + (st.w - (cols * cw + (cols - 1) * g)) / 2, oy = st.y + (st.h - (rows * ch + (rows - 1) * g)) / 2;
    this.deck.forEach((c, i) => place(c, ox + (i % cols) * (cw + g), oy + Math.floor(i / cols) * (ch + g), cw, ch));
  },
  flip(c) {
    if (this.lock || c.classList.contains('up')) return;
    c.classList.add('up'); say(c._f.n + '!', { repeat: false });
    this.open.push(c);
    if (this.open.length < 2) return;
    const [a, b] = this.open; this.open = []; this.lock = true;
    if (a._f === b._f) {
      later(() => {
        a.classList.add('gone'); b.classList.add('gone'); a.dataset.off = b.dataset.off = '1'; chime(); this.pairs++;
        if (this.pairs === this.deck.length / 2) later(() => say('다 찾았다!').then(() => { if (S.cur.inst === this) complete('memory'); }), 400);
        else { say('짝!', { repeat: false }); this.lock = false; }
      }, 420);
    } else later(() => { a.classList.remove('up'); b.classList.remove('up'); this.lock = false; }, 1000);
  },
  enter() { say(ACTS.memory.say).then(res => { if (!res.cut) Idle.set({ ms: 7000, max: 2, reset: true, text: '카드를 눌러 봐!', el: () => this.deck && this.deck.find(c => !c.classList.contains('up')) }); }); },
};

/* ================= K4 오늘 끝: 스티커 1장 고르기 ================= */
SCR.k4 = {
  kid: true,
  build(root) {
    const r = this.r; root.classList.add('k4'); this.phase = 'pick';
    r.rep = kbtn('k-rep', I_REP, () => doReplay(), '다시 듣기', 'replay');
    r.mas = $('div', 'bigmas', HB('cheer', true));
    r.txt = $('div', 'bigtxt', '하나 골라!');
    r.opts = ST.board.filter(id => ACTS[id]).map(id => { const b = kbtn('card', picHTML(id), () => this.pick(id), ACTS[id].name, 'sticker'); b.style.setProperty('--e', '#EBD7AE'); return b; });
    r.album = $('div', 'album'); r.album.hidden = true;
    r.stop = kbtn('endbtn', `<span class="hbw">${HB('sleep')}</span><span class="lab">그만</span>`, () => { say('그만! 잘 자.', { repeat: false }); show('k5', {}, { keepVoice: true }); }, '그만', 'stop');
    r.more = kbtn('endbtn', `<span class="hbw">${HB('one')}</span><span class="lab">하나 더</span>`, () => { say('하나 더!', { repeat: false }); goHome({ keepVoice: true }); }, '하나 더', 'more');
    r.stop.hidden = r.more.hidden = true;
    root.append(r.rep, r.mas, r.txt, ...r.opts, r.album, r.stop, r.more);
    this.seq = 0;
  },
  layout(W, H) {
    const r = this.r, M = metrics(W, H), g = M.g;
    place(r.rep, W - M.m - 120, 8);
    const fs = Math.min(52, Math.max(34, W * .07)); r.txt.style.fontSize = fs + 'px';
    if (this.phase === 'pick') {
      // 한범은 가운데, 단 오른쪽 위 '다시 듣기'(120)와 겹치지 않게 왼쪽으로 비킴(좁은 폰)
      const aw = W - 2 * M.m, g3 = 24;
      let mh = Math.min(170, H * .15);
      // 좁은 세로 폰: 세 장을 세로로 쌓을 때 그림 180 이상(최종안 K4 '각 180 이상') — 한범을 줄여 자리를 냄(360x780: 117 → 88)
      if (W < H && (aw - 2 * g) / 3 < 180) mh = Math.min(mh, Math.max(72, H - M.bottom - (3 * 182 + 2 * g3) - 12 - 12 - fs - 24));
      const mw = mh / HBR, mx = Math.max(M.m, Math.min((W - mw) / 2, W - M.m - 120 - 12 - mw));
      place(r.mas, mx, 12, mw, mh); place(r.txt, 0, 12 + mh + 12);
      r.txt.style.right = (W < 480 && 12 + mh + 12 < 136) ? (M.m + 132) + 'px' : ''; // 글자 줄이 '다시 듣기' 높이에 걸리면 그 왼쪽 칸 가운데로(겹침 0)
      const top = Math.max(STAGE_Y, 12 + mh + 12 + fs + 24), ah = H - top - M.bottom;
      const s1 = Math.min((aw - 2 * g) / 3, ah), s2 = Math.min((aw - g) / 2, (ah - g) / 2), s3 = Math.min(aw, (ah - 2 * g3) / 3);
      const best = Math.max(s1, s2, s3), s = Math.min(best, 300);
      // 아주 낮은 창(바깥 화면 360x374 등): 한범·글자를 접고 왼쪽 위부터 2x2(오른쪽 위 칸은 '다시 듣기') — 그림 120 이상, 간격 24 이상
      const tiny = best < 120; r.mas.hidden = r.txt.hidden = tiny;
      if (tiny) {
        const t = Math.min((aw - g) / 2, (H - 16 - M.bottom - g) / 2, W - 2 * M.m - 144, 200);
        [[M.m, 16], [M.m, 16 + t + g], [M.m + t + g, 16 + t + g]].forEach(([x, y], i) => r.opts[i] && place(r.opts[i], x, y, t, t));
        return;
      }
      r.opts.forEach((b, i) => {
        let x, y;
        if (best === s1) { x = M.m + (aw - (3 * s + 2 * g)) / 2 + i * (s + g); y = top + (ah - s) / 2; }
        else if (best === s2) { const tw = 2 * s + g; x = M.m + (aw - tw) / 2 + (i % 2) * (s + g); if (i === 2) x = M.m + (aw - s) / 2; y = top + (ah - (2 * s + g)) / 2 + Math.floor(i / 2) * (s + g); }
        else { x = M.m + (aw - s) / 2; y = top + (ah - (3 * s + 2 * g3)) / 2 + i * (s + g3); }
        place(b, x, y, s, s);
      });
    } else {
      const land = W > H * 1.1;
      r.mas.hidden = true; r.txt.hidden = false; r.album.hidden = false; r.txt.style.right = '';
      place(r.txt, 0, 44);
      const top = 136, nb = this.showMore ? 2 : 1;
      if (land) {
        const ah = H - top - M.bottom;
        const btnS = Math.min(Math.max(200, Math.min(260, ah * .62)), (W - 2 * M.m - 2 * g - (nb - 1) * g - 160) / nb); // 좁은 가로 창에서 화면 밖으로 나가지 않게 폭으로 한 번 더 줄임
        const as = Math.max(160, Math.min(ah, W - 2 * M.m - 2 * g - (nb * btnS + (nb - 1) * g)));
        const tot = as + 2 * g + nb * btnS + (nb - 1) * g, ox = (W - tot) / 2;
        place(r.album, ox, top + (ah - as) / 2, as, as);
        const bx = ox + as + 2 * g, by = Math.max(STAGE_Y, top + (ah - btnS) / 2);
        place(r.stop, bx, by, btnS, btnS); place(r.more, bx + btnS + g, by, btnS, btnS);
      } else {
        const bw = W - 2 * M.m, bh = Math.max(200, Math.min(240, (H - top - M.bottom) * .3));
        const ah = H - top - M.bottom - nb * (bh + g), as = Math.max(160, Math.min(bw, ah));
        if (this.phase === 'end' && ah < 160) {
          // 낮은 창(바깥 화면 360x374 등): 앨범을 접고 [그만]·[하나 더]를 한 줄로 — 버튼이 화면 밖으로 나가지 않게, '다시 듣기' 아래 24px부터
          r.album.hidden = true;
          const av = H - STAGE_Y - M.bottom, s = Math.min(240, av, (bw - (nb - 1) * g) / nb), ox = (W - (nb * s + (nb - 1) * g)) / 2, y = STAGE_Y + (av - s) / 2;
          place(r.stop, ox, y, s, s); place(r.more, ox + s + g, y, s, s);
        } else {
          place(r.album, (W - as) / 2, top, as, as);
          const by = top + as + g; place(r.stop, M.m, by, bw, bh); place(r.more, M.m, by + bh + g, bw, bh);
        }
      }
      [r.stop, r.more].forEach(b => { const w = parseFloat(b.style.width), h = parseFloat(b.style.height); const mh = h * .62, mw = mh / HBR; place(b.firstChild, (w - mw) / 2, h * .06, mw, mh); b.lastChild.style.fontSize = Math.min(40, h * .15) + 'px'; b.lastChild.style.bottom = h * .08 + 'px'; });
      this.layoutAlbum();
    }
  },
  layoutAlbum() {
    const a = this.r.album, w = parseFloat(a.style.width) || 300, list = ST.stickers.filter(s => ACTS[s.act]).slice(-9);
    a.innerHTML = '';
    const today = list[list.length - 1];
    list.slice(0, -1).forEach((s, i) => { const e = $('span', 'stk', picHTML(s.act)); const ss = w * .2; place(e, 12 + (i % 4) * (ss + 10), w - ss - 12 - Math.floor(i / 4) * (ss + 10), ss, ss); e.style.transform = `rotate(${(i % 3 - 1) * 5}deg)`; a.append(e); });
    if (today) { const e = $('span', 'stk now', picHTML(today.act)); const ss = w * .56; place(e, (w - ss) / 2, w * .1, ss, ss); e.style.transform = 'rotate(-4deg)'; a.append(e); }
  },
  pick(id) {
    if (this.phase !== 'pick') return;
    ST.picked = id; ST.stickers.push({ d: ST.day, act: id, dev: '이 기기' }); save();
    const r = this.r; this.phase = 'album'; r.opts.forEach(b => b.hidden = true); r.txt.textContent = '';
    r.album.hidden = false; this.showMore = oneMoreAllowed(); relayout(); chime();
    say(ACTS[id].nm + '! 앨범에 붙였어!', { repeat: false });
    later(() => {
      this.phase = 'end'; r.stop.hidden = false; r.more.hidden = !this.showMore; relayout(); S.lastT = now();
      this.askEnd();
    }, 1400);
  },
  // "그만할까?"를 말할 때 [그만]이, "하나 더 할까?"를 말할 때 [하나 더]가 빛남 — 글 못 읽는 아이가 소리로 버튼을 짚음
  askEnd() { askPair(this, this.r.stop, this.showMore ? this.r.more : null, '', '오늘은 여기까지! 잘했어.'); },
  onReplay() { if (this.phase === 'end') this.askEnd(); else if (S.lastSay) say(S.lastSay); },
  enter() { say('오늘 세 개 다 했다! 하나 골라!').then(res => { if (!res.cut) Idle.set({ ms: 5000, max: 2, reset: true, text: '하나 골라!', el: () => this.r.opts[0] }); }); },

function askPair(inst, stop, more, lead, only) {
  const tok = ++inst.seq, alive = () => tok === inst.seq && S.cur && S.cur.inst === inst;
  stop.classList.remove('glow'); if (more) more.classList.remove('glow');
  if (!more) { glow(stop); say(lead + only); return; }
  const ask = () => { glow(stop, 2400); say('그만할까?', { repeat: false }).then(res => { if (!alive() || res.cut) return; stop.classList.remove('glow'); glow(more, 2400); say('하나 더 할까?', { repeat: false }); }); };
  if (lead) say(lead, { repeat: false }).then(res => { if (alive() && !res.cut) ask(); }); else ask();
}

/* ================= P0 부모 문 (보호자 확인, 최종안 2-2 부모 문 방식) =================
   번호가 없으면 '처음 한 번': 보호자 태어난 해(1940~2010만 통과) → 새 번호 4자리 두 번.
   평소: 4자리, 3번 틀리면 1분 쉼(반복). 번호 잊음: 태어난 해 → 30초 기다림 → 새 번호. 10초 무입력·뒤로가기 = 홈. */
const BIRTH_MIN = 1940, BIRTH_MAX = 2010, LOCK_MS = 60000, FORGOT_WAIT_MS = 30000;
SCR.p0 = {
  kid: true, pad: 8,
  build(root) {
    const r = this.r; root.classList.add('p0'); this.code = ''; this.first = ''; this.note = '';
    this.mode = ST.parent.pin ? 'normal' : 'first'; this.stage = ST.parent.pin ? 'pin' : 'birth';
    r.back = kbtn('k-home', I_HOME, () => { say('돌아가자!', { repeat: false }); goHome({ keepVoice: true }); }, '돌아가기', 'home'); // 다른 화면과 같은 집 그림
    r.rep = kbtn('k-rep', I_REP, () => say('엄마 아빠를 불러 줘!'), '다시 듣기', 'replay');
    r.box = $('div', 'p0box');
    const dg = n => `<button type="button" data-d="${n}" data-adult="digit" data-digit="${n}">${n}</button>`;
    r.box.innerHTML = `<div class="p0col p0info"><h1 id="p0-h"></h1><p class="msg" id="p0-msg"></p><div class="pins" id="p0-pins"><b></b><b></b><b></b><b></b></div><p class="lock" id="p0-lock" hidden></p><p class="hint" id="p0-hint"></p></div>
      <div class="p0col"><div class="pad" id="p0-pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(dg).join('')}<button type="button" class="sm" data-d="del" data-adult="pad">지우기</button>${dg(0)}<button type="button" class="sm" data-d="forgot" data-adult="pad">번호<br>잊음</button></div></div>`;
    root.append(r.back, r.rep, r.box);
    r.box.querySelector('#p0-pad').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || b.disabled) return; this.key(b.dataset.d); });
    this.render();
  },
  layout(W, H) {
    const r = this.r, M = metrics(W, H);
    place(r.back, M.m, 8); place(r.rep, W - M.m - 120, 8);
    place(r.box, M.m, 136, W - 2 * M.m, H - 136 - M.bottom);
    this.fit();
  },
  // 내용이 칸보다 크면 숫자판(어른용)과 간격을 줄인다: 72 → 64 → 56 → (나란히 붙인 작은 판) 52 → 48. 그래도 넘치면 안내 한 줄을 접는다.
  fit() {
    const b = this.r.box; if (!b || !b.clientHeight) return;
    const hint = b.querySelector('#p0-hint'), info = b.querySelector('.p0info');
    const over = () => b.scrollHeight > b.clientHeight + 1 || b.scrollWidth > b.clientWidth + 1 || info.scrollWidth > info.clientWidth + 1;
    const set = ([k, kg, pg, cg]) => { b.style.setProperty('--k', k + 'px'); b.style.setProperty('--kg', kg + 'px'); b.style.setProperty('--pg', pg + 'px'); b.style.setProperty('--cg', cg + 'px'); };
    b.classList.remove('tight'); hint.hidden = false;
    for (const v of [[72, 12, 28, 14], [64, 10, 20, 12], [56, 8, 14, 10]]) { set(v); if (!over()) return; }
    b.classList.add('tight');
    for (const v of [[52, 8, 12, 8], [48, 6, 12, 6]]) { set(v); if (!over()) return; }
    hint.hidden = true;
  },
  texts() {
    const s = this.stage;
    if (s === 'pin') return ['보호자 확인', '정해 둔 번호 4자리를 눌러 주세요', '4자리를 3번 틀리면 1분 쉬어요'];
    if (s === 'birth') return this.mode === 'first'
      ? ['처음 한 번 · 보호자 확인', '보호자가 태어난 해를 4자리로 눌러 주세요', '맞으면 부모 번호 4자리를 새로 정해요']
      : ['번호 잊음', '보호자가 태어난 해를 4자리로 눌러 주세요', '맞으면 30초 기다린 뒤 새 번호를 정해요'];
    if (s === 'wait') return ['번호 잊음', '30초만 기다려 주세요', '다 되면 새 번호를 정해요'];
    if (s === 'new1') return ['새 번호 정하기', '새 번호 4자리를 눌러 주세요', '아이가 모르는 번호로 정해 주세요'];
    return ['새 번호 정하기', '같은 번호를 한 번 더 눌러 주세요', '아이가 모르는 번호로 정해 주세요'];
  },
  armIdle() { clearTimeout(this.idleT); this.idleT = later(() => goHome(), 10000); },
  locked() { return ST.lockUntil && Date.now() < ST.lockUntil; },
  render() {
    const q = s => this.root.querySelector(s), [h, msg, hint] = this.texts();
    q('#p0-h').textContent = h; q('#p0-msg').textContent = msg;
    const hn = q('#p0-hint'); hn.textContent = this.note || hint; hn.classList.toggle('err', !!this.note);
    this.root.querySelectorAll('#p0-pins b').forEach((b, i) => { b.textContent = i < this.code.length ? '●' : ''; b.classList.toggle('on', i === this.code.length); });
    const lk = q('#p0-lock'), btns = this.root.querySelectorAll('#p0-pad button'), locked = this.locked(), waiting = this.stage === 'wait';
    q('#p0-pad [data-d="forgot"]').style.visibility = this.stage === 'pin' ? '' : 'hidden';
    if (locked) { lk.hidden = false; lk.textContent = `잠깐 쉬어요 · ${Math.ceil((ST.lockUntil - Date.now()) / 1000)}초 뒤 다시 누를 수 있어요`; }
    else if (waiting) { lk.hidden = false; lk.textContent = `${Math.max(0, Math.ceil((this.waitUntil - Date.now()) / 1000))}초 남았어요`; }
    else lk.hidden = true;
    btns.forEach(b => { b.disabled = locked || waiting; });
    clearTimeout(this.lockT); if (locked || waiting) this.lockT = later(() => this.tick(), 500);
    this.fit();
  },
  tick() {
    if (this.stage === 'wait' && Date.now() >= this.waitUntil) { this.stage = 'new1'; this.code = ''; this.note = ''; this.armIdle(); }
    this.render();
  },
  key(d) {
    if (this.stage !== 'wait') this.armIdle();
    if (d === 'forgot') { if (this.stage !== 'pin' || this.locked()) return; this.mode = 'forgot'; this.stage = 'birth'; this.code = ''; this.note = ''; this.render(); return; }
    if (this.locked() || this.stage === 'wait') return;
    if (d === 'del') { this.code = this.code.slice(0, -1); this.render(); return; }
    if (this.code.length >= 4) return;
    this.code += d; this.note = ''; this.render();
    if (this.code.length === 4) later(() => this.check(), 160);
  },
  fail(note) {
    ST.fails = (ST.fails || 0) + 1; this.code = ''; this.note = note; wig(this.root.querySelector('#p0-pins'));
    if (ST.fails >= 3) { ST.fails = 0; ST.lockUntil = Date.now() + LOCK_MS; this.note = ''; }
    save(); this.render();
  },
  check() {
    const c = this.code;
    if (this.stage === 'pin') {
      if (c === ST.parent.pin) { ST.fails = 0; save(); this.open(); return; }
      this.fail('번호가 달라요. 다시 눌러 주세요'); return;
    }
    if (this.stage === 'birth') {
      const y = Number(c);
      if (y >= BIRTH_MIN && y <= BIRTH_MAX) {
        ST.fails = 0; save(); this.code = ''; this.note = '';
        if (this.mode === 'forgot') { this.stage = 'wait'; this.waitUntil = Date.now() + FORGOT_WAIT_MS; clearTimeout(this.idleT); }
        else this.stage = 'new1';
        this.render(); return;
      }
      this.fail('태어난 해가 맞지 않아요. 다시 눌러 주세요'); return;
    }
    if (this.stage === 'new1') { this.first = c; this.code = ''; this.stage = 'new2'; this.render(); return; }
    if (this.stage === 'new2') {
      if (c === this.first) { ST.parent.pin = c; ST.fails = 0; ST.lockUntil = 0; save(); this.open(); return; }
      this.first = ''; this.code = ''; this.stage = 'new1'; this.note = '두 번 누른 번호가 달라요. 새로 정해 주세요';
      wig(this.root.querySelector('#p0-pins')); this.render();
    }
  },
  open() { try { history.replaceState({ bq: Hs.depth, k: 'p1' }, ''); } catch (e) {} show('p1'); },
  enter() { say('엄마 아빠를 불러 줘!'); this.armIdle(); },
};

      place(r.solo, st.x, st.y, st.w, st.h);
    } else {
      const land = W > H, bs = Math.max(120, Math.min(280, land ? st.h * .6 : (st.h - 120) / 2 - M.g));
      if (land) { const tot = 2 * bs + M.g; place(r.stop, (W - tot) / 2, st.y + (st.h - bs) / 2 + 40, bs, bs); place(r.more, (W - tot) / 2 + bs + M.g, st.y + (st.h - bs) / 2 + 40, bs, bs); }
      else {
        const nb = r.more.hidden ? 1 : 2;
        if (st.y + 80 + nb * bs + (nb - 1) * M.g <= H - M.bottom) { const bw = st.w; place(r.stop, st.x, st.y + 80, bw, bs); place(r.more, st.x, st.y + 80 + bs + M.g, bw, bs); }
        else { const s = Math.min(280, st.h - 60, (st.w - (nb - 1) * M.g) / nb), ox = st.x + (st.w - (nb * s + (nb - 1) * M.g)) / 2, y = st.y + 60 + (st.h - 60 - s) / 2; place(r.stop, ox, y, s, s); place(r.more, ox + s + M.g, y, s, s); } // 낮은 창: 한 줄로(화면 밖 0)
      }
      [r.stop, r.more].forEach(b => { const w = parseFloat(b.style.width), h = parseFloat(b.style.height); const mh = h * .62, mw = mh / HBR; place(b.firstChild, (w - mw) / 2, h * .06, mw, mh); b.lastChild.style.fontSize = Math.min(40, h * .15) + 'px'; b.lastChild.style.bottom = h * .08 + 'px'; });
      if (!this.endTxt) { this.endTxt = $('div', 'bigtxt', '끝!'); this.root.append(this.endTxt); }
      this.endTxt.style.fontSize = Math.min(44, W * .065) + 'px'; place(this.endTxt, 0, st.y + 10);
    }
  },
  turn(d) {
    if (this.stage !== 'read') return;
    const sps = this.spreads(), i = this.curIdx() + d;
    if (i < 0) return;
    if (i >= sps.length) {
      const hadCol = this.mode === 'spread' && size().W >= 1100 && this.colOpen;
      this.qs = hadCol ? [] : Object.values(TQ).flat().slice(0, 3); this.qi = 0;
      if (this.qs.length) this.showQ(); else this.toEnd();
      return;
    }
    this.page = sps[i][0]; relayout();
  },
  showQ() {
    this.stage = 'q'; const r = this.r;
    r.solo.innerHTML = `<div class="qcard">${this.qs[this.qi]}</div>`;
    const nx = kbtn('k-nav', I_NEXT, () => { this.qi++; if (this.qi < this.qs.length) this.showQ(); else this.toEnd(); }, '다음 질문', 'page');
    nx.style.position = 'relative'; nx.style.width = nx.style.height = '120px'; r.solo.append(nx);
    relayout(); S.lastT = now();
  },
  toEnd() { this.stage = 'end'; relayout(); S.lastT = now(); this.askEnd(); },
  askEnd() { askPair(this, this.r.stop, this.r.more.hidden ? null : this.r.more, '끝!', ' 오늘은 여기까지!'); },
  finish() { if (this.fin) return; this.fin = true; if (picks().includes('comic1') && !ST.board.includes('comic1') && ST.board.length < 3) ST.board.push('comic1'); logDone('comic1'); save(); },
  onReplay() { const sp = this.spreads()[Math.max(0, this.curIdx())] || [1]; const t = (TQ[sp[0]] || [])[0]; if (this.stage === 'read' && t) say(t); else if (this.stage === 'q') say(this.qs[this.qi]); else this.askEnd(); },
  enter() { say('같이 보자! 곰님, 백 일만 참으세요!'); },
};

/* ================= 화면에 있던 시간 (부모 ①) ================= */
setInterval(() => { if (document.hidden || !S.cur || S.cur.inst.kid === false) return; const t = ymd(); ST.secs[t] = (ST.secs[t] || 0) + 1; if (ST.secs[t] % 10 === 0) save(); }, 1000);

show('home');
})();
</script>
