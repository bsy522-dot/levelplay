<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================
// MODULE: textures.js (절차적 Canvas 텍스처)
// ============================================================
const TEX_SIZE = 256;
function makeTexCanvas(){
  if(typeof OffscreenCanvas!=='undefined'){
    try{return new OffscreenCanvas(TEX_SIZE,TEX_SIZE);}catch(e){}
  }
  const c=document.createElement('canvas');c.width=TEX_SIZE;c.height=TEX_SIZE;return c;
}
function finalizeTex(canvas){
  const tex=new THREE.CanvasTexture(canvas);
  tex.wrapS=THREE.RepeatWrapping;tex.wrapT=THREE.RepeatWrapping;
  tex.colorSpace=THREE.SRGBColorSpace;
  // 비스듬한 시점에서도 텍스처 디테일 유지 (어둠 방지)
  try{tex.anisotropy=16;}catch(e){}
  tex.needsUpdate=true;return tex;
}
function clamp(v,lo,hi){return v<lo?lo:v>hi?hi:v;}

function makeBrickTex(){
  const c=makeTexCanvas(),x=c.getContext('2d');
  x.fillStyle='#a06040';x.fillRect(0,0,TEX_SIZE,TEX_SIZE);
  const bw=TEX_SIZE/6,bh=TEX_SIZE/12;
  for(let row=0;row<12;row++){
    const off=(row%2)*(bw/2);
    for(let col=-1;col<7;col++){
      const dr=(Math.random()*30-15)|0;
      const r=clamp(160+dr,100,220),g=clamp(96+dr,50,160),b=clamp(64+dr,30,130);
      x.fillStyle=`rgb(${r},${g},${b})`;x.fillRect(col*bw+off,row*bh,bw,bh);
    }
  }
  x.fillStyle='#3a2618';
  for(let row=0;row<=12;row++)x.fillRect(0,row*bh-1,TEX_SIZE,2);
  for(let row=0;row<12;row++){
    const off=(row%2)*(bw/2);
    for(let col=-1;col<7;col++)x.fillRect(col*bw+off-1,row*bh,2,bh);
  }
  return finalizeTex(c);
}

function makeWoodTex(){
  const c=makeTexCanvas(),x=c.getContext('2d');
  x.fillStyle='#c8a878';x.fillRect(0,0,TEX_SIZE,TEX_SIZE);
  for(let i=0;i<TEX_SIZE;){
    const w=2+(Math.random()*3)|0,t=Math.random();
    x.fillStyle=`rgb(${(176+t*40)|0},${(136+t*32)|0},${(88+t*32)|0})`;
    x.fillRect(i,0,w,TEX_SIZE);i+=w;
  }
  x.fillStyle='#8a6838';
  for(let i=0;i<3;i++){
    x.beginPath();x.ellipse(Math.random()*TEX_SIZE,Math.random()*TEX_SIZE,4+Math.random()*6,2+Math.random()*3,0,0,Math.PI*2);x.fill();
  }
  return finalizeTex(c);
}

function makeMarbleTex(){
  const c=makeTexCanvas(),x=c.getContext('2d');
  x.fillStyle='#e8e5e0';x.fillRect(0,0,TEX_SIZE,TEX_SIZE);
  x.strokeStyle='#b0b0b0';x.lineWidth=1.5;
  for(let i=0;i<14;i++){
    x.beginPath();const off=i*20-60;
    for(let j=0;j<=TEX_SIZE;j+=4){
      const y=j+off+Math.sin(j*0.05+i)*8+(Math.random()*6-3);
      if(j===0)x.moveTo(j,y);else x.lineTo(j,y);
    }
    x.stroke();
  }
  return finalizeTex(c);
}

function makeGrassTex(){
  const c=makeTexCanvas(),x=c.getContext('2d');
  x.fillStyle='#5a9a3a';x.fillRect(0,0,TEX_SIZE,TEX_SIZE);
  x.fillStyle='#7aba4a';
  for(let i=0;i<1000;i++)x.fillRect((Math.random()*TEX_SIZE)|0,(Math.random()*TEX_SIZE)|0,1,1);
  for(let i=0;i<400;i++){
    const t=Math.random();
    x.fillStyle=`rgb(${(100+t*50)|0},${(160+t*40)|0},${(70+t*30)|0})`;
    x.fillRect((Math.random()*TEX_SIZE)|0,(Math.random()*TEX_SIZE)|0,1,8+((Math.random()*9)|0));
  }
  return finalizeTex(c);
}

// ============================================================
// MODULE: meshes.js (3D 메시 빌더)
// ============================================================
const FLOOR_HEIGHT=3,WALL_HEIGHT=2.8,WALL_THICK=0.1,FLOOR_THICK=0.1;
const matCache=new Map();

function floorToY(floor){
  if(floor===-1)return -FLOOR_HEIGHT;
  if(floor===4){
    // 옥상은 가장 높은 활성 일반 층 바로 위 (2층집이면 6m, 3층집이면 9m)
    let maxF=1;
    if(typeof rooms==='object'){
      for(const k of [1,2,3])if(rooms[k]&&rooms[k].length>0)maxF=k;
    }
    return maxF*FLOOR_HEIGHT;
  }
  return (floor-1)*FLOOR_HEIGHT;
}
function getMat(key,fac){if(!matCache.has(key))matCache.set(key,fac());return matCache.get(key);}
function materialParams(idx){
  switch(idx){
    case 1:return{roughness:0.95,metalness:0.0};
    case 2:return{roughness:0.85,metalness:0.05};
    case 3:return{roughness:0.2,metalness:0.1};
    default:return{roughness:0.7,metalness:0.0};
  }
}
function makeStdMat(color,matIdx,tex){
  const key=`std_${color}_${matIdx}_${tex?'t':'n'}`;
  return getMat(key,()=>{
    const p=materialParams(matIdx);const opts={color,roughness:p.roughness,metalness:p.metalness};
    if(tex)opts.map=tex;return new THREE.MeshStandardMaterial(opts);
  });
}
function textureFor(matIdx,opts){
  if(!opts)return null;
  if(matIdx===0)return opts.woodTex||null;
  if(matIdx===1)return opts.brickTex||null;
  if(matIdx===6)return opts.marbleTex||null;
  return null;
}

function buildRoomMesh(room,floor,opts={}){
  const group=new THREE.Group();
  group.userData={kind:'room',refId:room.id};
  const w=room.w,h=room.h;
  const wallColor=room.wallColor||'#b0a090';
  const floorColor=room.floorColor||'#8b6b3d';
  const matIdx=room.material??0;
  const tex=textureFor(matIdx,opts);

  const floorMesh=new THREE.Mesh(new THREE.BoxGeometry(w,FLOOR_THICK,h),makeStdMat(floorColor,matIdx,tex));
  floorMesh.position.y=FLOOR_THICK/2;floorMesh.receiveShadow=true;
  floorMesh.userData={kind:'room',refId:room.id,part:'floor'};
  group.add(floorMesh);

  const wallMat=makeStdMat(wallColor,matIdx,tex);
  const addWall=(sx,sz,sw,sd,name)=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(sw,WALL_HEIGHT,sd),wallMat);
    m.position.set(sx,FLOOR_THICK+WALL_HEIGHT/2,sz);m.castShadow=true;m.receiveShadow=true;
    m.userData={kind:'room',refId:room.id,part:name};group.add(m);
  };
  addWall(0,-h/2,w,WALL_THICK,'wall_north');
  addWall(0,h/2,w,WALL_THICK,'wall_south');
  addWall(-w/2,0,WALL_THICK,h,'wall_west');
  addWall(w/2,0,WALL_THICK,h,'wall_east');

  if(room.windowStyle&&room.windowStyle>0){
    const winW=Math.min(1.5,w*0.4),winH=1.0;
    const winMat=getMat('window_glass',()=>new THREE.MeshStandardMaterial({color:0x88ccee,roughness:0.1,metalness:0.4,transparent:true,opacity:0.6}));
    const win=new THREE.Mesh(new THREE.BoxGeometry(winW,winH,WALL_THICK+0.02),winMat);
    win.position.set(0,FLOOR_THICK+WALL_HEIGHT/2+0.1,-h/2);
    win.userData={kind:'room',refId:room.id,part:'window'};group.add(win);
  }

  // ===== 문짝 (실내 방만, 남쪽 벽에) =====
  const indoorTypes=['living','bedroom','kitchen','bathroom','garage'];
  if(indoorTypes.includes(room.type)){
    const doorW=Math.min(0.9,w*0.25),doorH=2.0;
    // 문짝 본체
    const doorMat=makeStdMat('#3a2818',0,null);
    const door=new THREE.Mesh(new THREE.BoxGeometry(doorW,doorH,WALL_THICK+0.06),doorMat);
    // 남쪽 벽 한쪽에 (좌측에서 1/3 지점)
    const doorX=-w/2+doorW*0.6+0.2;
    door.position.set(doorX,FLOOR_THICK+doorH/2,h/2);
    door.castShadow=true;door.receiveShadow=true;
    door.userData={kind:'room',refId:room.id,part:'door'};
    group.add(door);
    // 문 손잡이 (작은 노란 구)
    const handleMat=getMat('door_handle',()=>new THREE.MeshStandardMaterial({color:0xddaa00,roughness:0.3,metalness:0.7}));
    const handle=new THREE.Mesh(new THREE.SphereGeometry(0.06,10,10),handleMat);
    handle.position.set(doorX+doorW/2-0.1,FLOOR_THICK+1.05,h/2+WALL_THICK/2+0.05);
    group.add(handle);
    // 문틀 (어두운 테두리)
    const frameMat=makeStdMat('#2a1808',0,null);
    const frameT=0.04;
    // 좌
    const fL=new THREE.Mesh(new THREE.BoxGeometry(frameT,doorH+frameT,WALL_THICK+0.08),frameMat);
    fL.position.set(doorX-doorW/2-frameT/2,FLOOR_THICK+doorH/2,h/2);group.add(fL);
    // 우
    const fR=new THREE.Mesh(new THREE.BoxGeometry(frameT,doorH+frameT,WALL_THICK+0.08),frameMat);
    fR.position.set(doorX+doorW/2+frameT/2,FLOOR_THICK+doorH/2,h/2);group.add(fR);
    // 위
    const fT=new THREE.Mesh(new THREE.BoxGeometry(doorW+frameT*2,frameT,WALL_THICK+0.08),frameMat);
    fT.position.set(doorX,FLOOR_THICK+doorH+frameT/2,h/2);group.add(fT);
  }

  // ===== 천장 (지붕 토글 또는 명시적 _ceiling) =====
  if(opts.ceiling){
    const ceilMat=makeStdMat('#e8e4dc',0,null);
    const ceil=new THREE.Mesh(new THREE.BoxGeometry(w,FLOOR_THICK,h),ceilMat);
    ceil.position.y=FLOOR_THICK+WALL_HEIGHT+FLOOR_THICK/2;
    ceil.castShadow=true;ceil.receiveShadow=true;
    ceil.userData={kind:'room',refId:room.id,part:'ceiling'};
    group.add(ceil);
  }

  group.position.set(room.x+w/2,floorToY(floor),room.z+h/2);
  return group;
}

function buildFurnMesh(furn,room){
  const group=new THREE.Group();
  group.userData={kind:'furn',refId:furn.id};
  const type=furn.type;
  const color=furn.c||furnDefColor(type);
  const w=furn.w,d=furn.h;

  switch(type){
    case 'bed':buildBed(group,w,d,color);break;
    case 'sofa':buildSofa(group,w,d,color);break;
    case 'table':buildTable(group,w,d,color);break;
    case 'tv':buildTV(group,w,d);break;
    case 'fridge':buildFridge(group,w,d,color);break;
    default:buildSimpleBox(group,type,w,d,color);break;
  }

  if(room){
    group.position.set(room.x+(furn.rx??0),floorToY(room.floor??1)+FLOOR_THICK,room.z+(furn.rz??0));
  }
  group.rotation.y=(furn.rot||0)*Math.PI/180;
  return group;
}

function furnDefColor(t){
  return{bed:'#ccaaaa',sofa:'#8888cc',table:'#bb8844',tv:'#333333',fridge:'#cccccc',
    desk:'#aa9966',chair:'#996633',wardrobe:'#8b6b3d',bookshelf:'#775533',
    bathtub:'#ddddee',washer:'#eeeeee',plant:'#5a8a5a',lamp:'#ffd700',rug:'#b08060'}[t]||'#888';
}

function buildBed(g,w,d,c){
  const matBed=makeStdMat(c,0,null),matSheet=makeStdMat('#ffffff',0,null);
  const matt=new THREE.Mesh(new THREE.BoxGeometry(w,0.4,d),matBed);
  matt.position.y=0.2;matt.castShadow=true;matt.receiveShadow=true;g.add(matt);
  const pg=new THREE.BoxGeometry(w*0.35,0.1,d*0.25);
  const p1=new THREE.Mesh(pg,matSheet);p1.position.set(-w*0.2,0.45,-d*0.3);p1.castShadow=true;g.add(p1);
  const p2=new THREE.Mesh(pg,matSheet);p2.position.set(w*0.2,0.45,-d*0.3);p2.castShadow=true;g.add(p2);
}
function buildSofa(g,w,d,c){
  const m=makeStdMat(c,0,null);
  const seat=new THREE.Mesh(new THREE.BoxGeometry(w,0.3,d),m);seat.position.y=0.3;seat.castShadow=true;seat.receiveShadow=true;g.add(seat);
  const back=new THREE.Mesh(new THREE.BoxGeometry(w,0.6,0.2),m);back.position.set(0,0.7,-d/2+0.1);back.castShadow=true;g.add(back);
  const ag=new THREE.BoxGeometry(0.2,0.5,d);
  const aL=new THREE.Mesh(ag,m);aL.position.set(-w/2+0.1,0.55,0);aL.castShadow=true;g.add(aL);
  const aR=new THREE.Mesh(ag,m);aR.position.set(w/2-0.1,0.55,0);aR.castShadow=true;g.add(aR);
}
function buildTable(g,w,d,c){
  const m=makeStdMat(c,0,null);
  const top=new THREE.Mesh(new THREE.BoxGeometry(w,0.06,d),m);top.position.y=0.74;top.castShadow=true;g.add(top);
  const lg=new THREE.CylinderGeometry(0.04,0.04,0.7,8);
  const dx=w/2-0.1,dz=d/2-0.1;
  for(const[lx,lz]of[[-dx,-dz],[dx,-dz],[-dx,dz],[dx,dz]]){
    const leg=new THREE.Mesh(lg,m);leg.position.set(lx,0.35,lz);leg.castShadow=true;g.add(leg);

function buildSkyDome(scene){
  const c=document.createElement('canvas');c.width=16;c.height=256;
  const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,256);
  g.addColorStop(0.0,'#3a6db5');g.addColorStop(0.5,'#88aaff');g.addColorStop(0.85,'#ffd9a8');g.addColorStop(1.0,'#ffb877');
  x.fillStyle=g;x.fillRect(0,0,16,256);
  const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;
  const sky=new THREE.Mesh(new THREE.SphereGeometry(80,32,24),new THREE.MeshBasicMaterial({map:tex,side:THREE.BackSide,depthWrite:false,fog:false}));
  sky.name='SkyDome';scene.add(sky);return sky;
}

function buildLights(scene,opts={}){
  const lowSpec=!!opts.lowSpec;
  const sz=lowSpec?1024:2048;
  // 강한 환경광으로 그림자 부분도 디테일 살림
  const ambient=new THREE.AmbientLight(0xffffee,1.1);scene.add(ambient);
  // 태양: 집 거의 머리 위에서 (그림자 짧게, 화면 밖으로)
  const sun=new THREE.DirectionalLight(0xffffff,1.4);
  sun.position.set(8,40,6);sun.castShadow=true;
  // 태양 타깃을 집 중심으로 → 그림자 카메라가 집 영역 커버
  sun.target.position.set(5,0,4.5);
  sun.shadow.mapSize.set(sz,sz);
  sun.shadow.camera.left=-40;sun.shadow.camera.right=40;
  sun.shadow.camera.top=40;sun.shadow.camera.bottom=-40;
  sun.shadow.camera.near=0.1;sun.shadow.camera.far=100;
  sun.shadow.bias=-0.0005;
  sun.shadow.normalBias=0.05;
  scene.add(sun);scene.add(sun.target);
  // 하늘/땅 환경광도 강화
  const hemi=new THREE.HemisphereLight(0xc0e0ff,0xa08866,0.8);scene.add(hemi);
  return{ambient,sun,hemi};
}

function setTimeOfDay(time,lights,sky,scene){
  const p=TIME_PRESETS[time|0]||TIME_PRESETS[0];
  if(lights){
    lights.sun.color.setHex(p.sunColor);lights.sun.intensity=p.sunIntensity;
    lights.sun.position.set(p.sunPos.x,p.sunPos.y,p.sunPos.z);

function createWeatherSystem(scene){
  const RAIN=200,SNOW=150;
  const dummy=new THREE.Object3D();
  let elapsed=0,curType=0;
  // 비: 더 굵고 진한 색으로 시인성 강화
  const rainGeo=new THREE.CylinderGeometry(0.04,0.04,0.7,4);
  const rainMat=new THREE.MeshBasicMaterial({color:0x4488dd,transparent:true,opacity:0.85,fog:false});
  const rain=new THREE.InstancedMesh(rainGeo,rainMat,RAIN);rain.visible=false;rain.frustumCulled=false;
  for(let i=0;i<RAIN;i++){
    dummy.position.set(Math.random()*60-30,Math.random()*25,Math.random()*60-30);
    dummy.updateMatrix();rain.setMatrixAt(i,dummy.matrix);
  }
  rain.instanceMatrix.needsUpdate=true;scene.add(rain);

  const snowGeo=new THREE.SphereGeometry(0.05,6,6);
  const snowMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.9,fog:false});
  const snow=new THREE.InstancedMesh(snowGeo,snowMat,SNOW);snow.visible=false;snow.frustumCulled=false;
  const snowPhase=new Float32Array(SNOW);
  for(let i=0;i<SNOW;i++){
    snowPhase[i]=Math.random()*Math.PI*2;
    dummy.position.set(Math.random()*60-30,Math.random()*25,Math.random()*60-30);
    dummy.updateMatrix();snow.setMatrixAt(i,dummy.matrix);
  }
  snow.instanceMatrix.needsUpdate=true;scene.add(snow);

  const tmpMat=new THREE.Matrix4(),tmpPos=new THREE.Vector3(),tmpQ=new THREE.Quaternion(),tmpS=new THREE.Vector3();
  return{
    setWeather(t){curType=t|0;rain.visible=curType===1;snow.visible=curType===2;},
    update(dt){
      elapsed+=dt;
      if(curType===1&&rain.visible){
        for(let i=0;i<RAIN;i++){
          rain.getMatrixAt(i,tmpMat);tmpMat.decompose(tmpPos,tmpQ,tmpS);
          tmpPos.y-=30*dt;
          if(tmpPos.y<0){tmpPos.y=20+Math.random()*5;tmpPos.x=Math.random()*60-30;tmpPos.z=Math.random()*60-30;}
          tmpMat.compose(tmpPos,tmpQ,tmpS);rain.setMatrixAt(i,tmpMat);
        }
        rain.instanceMatrix.needsUpdate=true;
      }else if(curType===2&&snow.visible){
        for(let i=0;i<SNOW;i++){
          snow.getMatrixAt(i,tmpMat);tmpMat.decompose(tmpPos,tmpQ,tmpS);
          tmpPos.y-=2*dt;tmpPos.x+=Math.sin(elapsed+snowPhase[i])*0.5*dt;
          if(tmpPos.y<0){tmpPos.y=20+Math.random()*5;tmpPos.x=Math.random()*60-30;tmpPos.z=Math.random()*60-30;}
          tmpMat.compose(tmpPos,tmpQ,tmpS);snow.setMatrixAt(i,tmpMat);
        }
        snow.instanceMatrix.needsUpdate=true;
      }
    },
    get type(){return curType;}
  };
}

function enterWalkthrough(controls,room){
  const r=room||{x:-1,z:-1,w:2,h:2};
  const tx=r.x+r.w/2,tz=r.z+r.h/2,ty=1.6;
  controls.userData=controls.userData||{};
  controls.userData._prev={target:controls.target.clone(),position:controls.object.position.clone(),minDistance:controls.minDistance,maxDistance:controls.maxDistance,maxPolarAngle:controls.maxPolarAngle};
  controls.target.set(tx,ty,tz);
  controls.object.position.set(tx+1.0,ty+0.5,tz+1.0);
  controls.minDistance=0.5;controls.maxDistance=5;controls.maxPolarAngle=Math.PI/1.8;
  controls.update();
}
function exitWalkthrough(controls){
  const p=controls.userData&&controls.userData._prev;if(!p)return;
  controls.target.copy(p.target);controls.object.position.copy(p.position);
  controls.minDistance=p.minDistance;controls.maxDistance=p.maxDistance;controls.maxPolarAngle=Math.PI/2.2;
  delete controls.userData._prev;controls.update();
}
function screenshot(renderer,scene,camera){
  renderer.render(scene,camera);
  return new Promise(res=>{
    renderer.domElement.toBlob(blob=>{
      if(!blob){res();return;}
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download=`house-${Date.now()}.png`;
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);res();
    },'image/png');
  });
}
function detectQualityLevel(){
  if(globalThis._qLvl)return globalThis._qLvl;
  const mem=navigator.deviceMemory||4;
  const ua=(navigator.userAgent||'').toLowerCase();
  const isMobile=/android|iphone|ipad|ipod|mobile/i.test(ua);
  const oldAndroid=/android\s([0-5])\./.test(ua);
  let lvl;
  if(mem<4||(isMobile&&oldAndroid))lvl='low';
  else if(isMobile)lvl='mid';
  else if(mem>=8)lvl='high';
  else lvl='mid';
  globalThis._qLvl=lvl;return lvl;
}

// ============================================================
function setupInput(renderer,camera,scene,controls,callbacks){
  const dom=renderer.domElement;
  const raycaster=new THREE.Raycaster();
  const mouse=new THREE.Vector2();
  const groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
  const DRAG_TH=5;
  let dx0=0,dy0=0,down=false;
  function nfo(e){const r=dom.getBoundingClientRect();mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;}
  function onDown(e){down=true;dx0=e.clientX;dy0=e.clientY;}
  function onUp(e){
    if(!down)return;down=false;
    const dx=e.clientX-dx0,dy=e.clientY-dy0;
    if(Math.sqrt(dx*dx+dy*dy)>DRAG_TH)return;
    nfo(e);raycaster.setFromCamera(mouse,camera);
    const hits=raycaster.intersectObjects(scene.children,true);
    for(const hit of hits){
      let obj=hit.object;
      while(obj&&!(obj.userData&&obj.userData.kind))obj=obj.parent;
      if(obj&&obj.userData&&(obj.userData.kind==='room'||obj.userData.kind==='furn'||obj.userData.kind==='ext')){
        if(callbacks.onObjectClick)callbacks.onObjectClick(obj);
        return;
      }
    }
    const point=new THREE.Vector3();
    if(raycaster.ray.intersectPlane(groundPlane,point))if(callbacks.onGroundClick)callbacks.onGroundClick(point);
  }
  dom.addEventListener('pointerdown',onDown);
  dom.addEventListener('pointerup',onUp);
  dom.addEventListener('pointercancel',()=>{down=false;});
}

const EXTERIOR=[
{id:'fence',n:'울타리',ic:'🏗️',cost:5000},
{id:'pool',n:'수영장',ic:'🏊',cost:30000},
{id:'tree',n:'나무',ic:'🌲',cost:2000},
{id:'driveway',n:'진입로',ic:'🛤️',cost:8000},
{id:'flower',n:'꽃밭',ic:'🌸',cost:3000},
];
const WEATHERS=['☀️','🌧️','❄️','☁️'];
const TIMES=['🌞','🌇','🌙'];

// ============================================================
// STATE (from v3 + 3D 메시 매핑)
// ============================================================
let budget=500000;
let currentFloor=1;
let rooms={};
for(let f=-1;f<=4;f++)rooms[f]=[];
let exteriors=[];
let selRoom=null,selFurn=null,selRoomType='living';
let curWallColor=WALL_COLORS[0],curFloorType=FLOOR_TYPES[0],curMaterial=0,curWindowStyle=1;
let curTab='rooms';
let weather=0,timeOfDay=0;
let nextId=1,undoStack=[];
let walkMode=false;
let roofOn=false; // 지붕(천장) 토글
let moveMode=false; // 방 이동 모드

// 메시 매핑 (id → THREE.Group)
const meshMap=new Map();
// 선택 하이라이트 헬퍼
let roomHelper=null,furnHelper=null;

// ============================================================
// THREE.js 초기화
// ============================================================
const cvs=document.getElementById('cvs3d');
const qLevel=detectQualityLevel();
const renderer=new THREE.WebGLRenderer({canvas:cvs,antialias:qLevel!=='low',preserveDrawingBuffer:true,powerPreference:'high-performance'});
renderer.setPixelRatio(qLevel==='high'?window.devicePixelRatio:Math.min(window.devicePixelRatio,1.5));

renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;

renderer.setClearColor(0xa0c8f8,1);
renderer.outputColorSpace=THREE.SRGBColorSpace;

const scene=new THREE.Scene();
// 배경색 명시 (SkyDome이 못 가리는 영역도 하늘색으로 채움)
scene.background=new THREE.Color(0xa0c8f8);
scene.fog=new THREE.Fog(0xb8d0f0,50,100);

const camera=new THREE.PerspectiveCamera(35,1,0.1,200);
camera.position.set(20,22,24);

const controls=new OrbitControls(camera,cvs);
controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=50;
controls.maxPolarAngle=Math.PI/2.2;

// 텍스처 생성 (한 번)
const brickTex=makeBrickTex();
const woodTex=makeWoodTex();
const marbleTex=makeMarbleTex();
const grassTex=makeGrassTex();
const TEX_OPTS={brickTex,woodTex,marbleTex};

// 환경
const sky=buildSkyDome(scene);
const lights=buildLights(scene,{lowSpec:qLevel==='low'});
const ground=buildGround(scene,grassTex);

ground.userData={kind:'ground'};

function resize(){
  const w=window.innerWidth,h=window.innerHeight-70-70;
  renderer.setSize(w,h);
  camera.aspect=w/h;camera.updateProjectionMatrix();
}
resize();window.addEventListener('resize',resize);

// WebGL context lost/restored 핸들러 (텍스처 재업로드)
cvs.addEventListener('webglcontextlost',e=>{e.preventDefault();console.warn('[v4] WebGL context lost');});
cvs.addEventListener('webglcontextrestored',()=>{
  console.log('[v4] WebGL context restored, re-uploading textures');
  [brickTex,woodTex,marbleTex,grassTex].forEach(t=>{if(t)t.needsUpdate=true;});
  if(sky&&sky.material&&sky.material.map)sky.material.map.needsUpdate=true;
  if(typeof rebuildAll==='function')setTimeout(rebuildAll,50);
});

// ============================================================
// SCENE 동기화 (state ↔ 메시)
// ============================================================
function addRoomMesh(room,floor){
  const m=buildRoomMesh(room,floor,{...TEX_OPTS,ceiling:roofOn&&room.type!=='rooftop'&&room.type!=='balcony'&&room.type!=='garden'});
  m.userData.refId=room.id;room.floor=floor;
  // Y축 떨어지는 애니메이션
  const targetY=m.position.y;
  m.position.y=targetY+5;
  meshMap.set('room_'+room.id,m);
  scene.add(m);
  const start=performance.now();
  function fall(){
    const t=Math.min(1,(performance.now()-start)/400);
    const ease=1-Math.pow(1-t,3);
    m.position.y=targetY+5*(1-ease);
    if(t<1)requestAnimationFrame(fall);
  }
  fall();
}
function addFurnMesh(furn,room){
  const m=buildFurnMesh(furn,room);
  meshMap.set('furn_'+furn.id,m);
  scene.add(m);
  // scale 0→1
  m.scale.set(0.01,0.01,0.01);
  const start=performance.now();
  function pop(){
    const t=Math.min(1,(performance.now()-start)/300);
    const ease=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    m.scale.setScalar(ease);
    if(t<1)requestAnimationFrame(pop);
  }
  pop();
}
function addExtMesh(ext){
  const m=buildExtMesh(ext);
  meshMap.set('ext_'+ext.id,m);
  scene.add(m);
}
function disposeMeshDeep(m){
  m.traverse(o=>{
    if(o.geometry)o.geometry.dispose();
    // material은 matCache에서 공유되므로 dispose 금지
  });
}

// 선택 하이라이트 갱신
function updateSelHighlight(){
  if(roomHelper){scene.remove(roomHelper);roomHelper.geometry&&roomHelper.geometry.dispose();roomHelper=null;}
  if(furnHelper){scene.remove(furnHelper);furnHelper.geometry&&furnHelper.geometry.dispose();furnHelper=null;}
  if(selRoom){
    const rm=meshMap.get('room_'+selRoom.id);
    if(rm){
      roomHelper=new THREE.BoxHelper(rm,0xffeb00);
      roomHelper.material.depthTest=false;
      roomHelper.material.linewidth=3;
      roomHelper.renderOrder=999;
      scene.add(roomHelper);
    }
  }
  if(selFurn){
    const fm=meshMap.get('furn_'+selFurn.id);
    if(fm){
      furnHelper=new THREE.BoxHelper(fm,0x00ff88);
      furnHelper.material.depthTest=false;
      furnHelper.material.linewidth=2;
      furnHelper.renderOrder=999;
      scene.add(furnHelper);
    }
  }
}

// 외관 지붕 (roofOn 시 모든 층 위에 슬레이트 평면)
function applyRoofMode(){
  const old=scene.getObjectByName('GlobalRoof');
  if(old){scene.remove(old);old.geometry&&old.geometry.dispose();old.material&&old.material.dispose();}
  if(!roofOn)return;
  // 모든 활성 층의 방 발자국 bounding box
  let minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity,maxF=1;
  for(const f of [1,2,3,4]){
    if(!rooms[f])continue;
    for(const r of rooms[f]){
      minX=Math.min(minX,r.x);
      maxX=Math.max(maxX,r.x+r.w);
      minZ=Math.min(minZ,r.z);
      maxZ=Math.max(maxZ,r.z+r.h);
      if(r.type!=='garden')maxF=Math.max(maxF,f===4?4:f);
    }
  }
  if(minX===Infinity)return;
  const w=(maxX-minX)+0.6,d=(maxZ-minZ)+0.6;
  const cx=(minX+maxX)/2,cz=(minZ+maxZ)/2;
  const topY=floorToY(maxF)+WALL_HEIGHT+0.6;
  // 슬레이트 평면 지붕 (어두운 갈색 + 약간 비스듬)
  const roofMat=new THREE.MeshStandardMaterial({color:0x6b4226,roughness:0.6,metalness:0.05});
  const roof=new THREE.Mesh(new THREE.BoxGeometry(w,0.5,d),roofMat);
  roof.position.set(cx,topY,cz);
  roof.castShadow=true;roof.receiveShadow=true;
  roof.name='GlobalRoof';
  scene.add(roof);
}
function removeMesh(key){
  const m=meshMap.get(key);
  if(m){scene.remove(m);disposeMeshDeep(m);meshMap.delete(key);}
}
function rebuildAll(){
  // 하이라이트도 같이 제거 (메시 사라지면 BoxHelper도 무효)
  if(roomHelper){scene.remove(roomHelper);roomHelper=null;}
  if(furnHelper){scene.remove(furnHelper);furnHelper=null;}
  for(const m of meshMap.values()){scene.remove(m);disposeMeshDeep(m);}
  meshMap.clear();
  for(let f=-1;f<=4;f++){
    for(const r of rooms[f]){
      r.floor=f;
      const useCeiling=roofOn&&r.type!=='rooftop'&&r.type!=='balcony'&&r.type!=='garden';
      const m=buildRoomMesh(r,f,{...TEX_OPTS,ceiling:useCeiling});
      meshMap.set('room_'+r.id,m);scene.add(m);
      for(const fu of (r.furniture||[])){
        const fm=buildFurnMesh(fu,r);
        meshMap.set('furn_'+fu.id,fm);scene.add(fm);
      }
    }
  }
  for(const e of exteriors){
    const em=buildExtMesh(e);
    meshMap.set('ext_'+e.id,em);scene.add(em);
  }
}

// ============================================================
// INPUT 셋업
// ============================================================
setupInput(renderer,camera,scene,controls,{
  onGroundClick(point){
    if(walkMode)return;
    const gx=Math.round(point.x),gz=Math.round(point.z);
    // 방 이동 모드
    if(moveMode&&selRoom){
      saveUndo();
      // 방 위치 변경 (좌측상단 좌표)
      selRoom.x=gx-Math.floor(selRoom.w/2);
      selRoom.z=gz-Math.floor(selRoom.h/2);
      // 메시 재빌드
      removeMesh('room_'+selRoom.id);
      for(const fu of (selRoom.furniture||[]))removeMesh('furn_'+fu.id);
      addRoomMesh(selRoom,currentFloor);
      for(const fu of (selRoom.furniture||[]))addFurnMesh(fu,selRoom);
      moveMode=false;
      document.getElementById('aMove').classList.remove('act');
      status('✓ 방 이동 완료');
      return;
    }
    if(curTab==='rooms'){
      placeRoom(gx,gz);
    }else if(curTab==='ext'){
      placeExterior(gx,gz);
    }
  },
  onObjectClick(obj){
    if(walkMode)return;
    const k=obj.userData.kind;
    const id=obj.userData.refId;
    if(k==='room'){
      for(let f=-1;f<=4;f++){
        const r=rooms[f].find(rr=>rr.id===id);
        if(r){selRoom=r;selFurn=null;currentFloor=f;updFloor();status(`✓ ${ROOMS.find(rt=>rt.id===r.type).n} 선택됨 (노란 박스)`);updatePanel();updateSelHighlight();return;}
      }
    }else if(k==='furn'){
      for(let f=-1;f<=4;f++){
        for(const r of rooms[f]){
          const fu=(r.furniture||[]).find(ff=>ff.id===id);
          if(fu){selRoom=r;selFurn=fu;currentFloor=f;updFloor();status(`✓ ${FURN.find(ft=>ft.id===fu.type).n} 선택됨 (녹색 박스)`);updatePanel();updateSelHighlight();return;}
        }
      }
    }
  }
});

// ============================================================
// ACTIONS (v3 로직 + 3D 메시 동기화)
// ============================================================
function saveUndo(){undoStack.push(JSON.stringify({rooms,exteriors,budget}));if(undoStack.length>30)undoStack.shift();}

function placeRoom(x,z){
  const rt=ROOMS.find(r=>r.id===selRoomType);if(!rt)return;
  const cost=Math.round(rt.cost*MAT_COSTS[curMaterial]);
  if(budget<cost){status('💰 예산 부족!');return;}
  saveUndo();budget-=cost;
  const room={id:nextId++,type:rt.id,x:x-Math.floor(rt.w/2),z:z-Math.floor(rt.h/2),w:rt.w,h:rt.h,
    wallColor:curWallColor.h,floorColor:curFloorType.c,floorType:curFloorType.id,
    material:curMaterial,windowStyle:curWindowStyle,furniture:[]};
  rooms[currentFloor].push(room);
  addRoomMesh(room,currentFloor);
  selRoom=room;selFurn=null;
  status(`${rt.n} 배치 (-${cost.toLocaleString()})`);updBudget();updatePanel();updateSelHighlight();refreshGameState(false);tutAdvance('roomPlaced');
}

function addFurniture(furnId){
  if(!selRoom)return;
  const ft=FURN.find(f=>f.id===furnId);if(!ft)return;
  if(budget<ft.cost){status('💰 예산 부족!');return;}
  saveUndo();budget-=ft.cost;
  const furn={id:nextId++,type:ft.id,c:ft.c,rx:selRoom.w/2,rz:selRoom.h/2,w:ft.w,h:ft.h,rot:0};
  selRoom.furniture.push(furn);
  selRoom.floor=currentFloor;
  addFurnMesh(furn,selRoom);
  selFurn=furn;
  status(`${ft.n} 배치 (-${ft.cost.toLocaleString()})`);updBudget();updatePanel();updateSelHighlight();refreshGameState(false);tutAdvance('furnAdded');
}

function placeExterior(x,z){
  const sel=document.querySelector('.ext-btn.sel');if(!sel)return;
  const type=sel.dataset.type;
  const ed=EXTERIOR.find(e=>e.id===type);if(!ed)return;
  if(budget<ed.cost){status('💰 예산 부족!');return;}
  saveUndo();budget-=ed.cost;
  const ext={id:nextId++,type,x,z};
  exteriors.push(ext);
  addExtMesh(ext);
  status(`${ed.n} 배치 (-${ed.cost.toLocaleString()})`);updBudget();updatePanel();refreshGameState(false);
}

function deleteSelected(){
  if(selFurn&&selRoom){
    saveUndo();
    const ft=FURN.find(f=>f.id===selFurn.type);
    budget+=Math.round((ft?ft.cost:0)*0.5);
    removeMesh('furn_'+selFurn.id);
    selRoom.furniture=selRoom.furniture.filter(f=>f.id!==selFurn.id);
    selFurn=null;status('가구 삭제 (50% 환불)');
  }else if(selRoom){
    saveUndo();
    const rt=ROOMS.find(r=>r.id===selRoom.type);
    budget+=Math.round((rt?rt.cost:0)*0.5);
    // 방의 모든 가구 메시도 제거
    for(const fu of (selRoom.furniture||[]))removeMesh('furn_'+fu.id);
    removeMesh('room_'+selRoom.id);
    rooms[currentFloor]=rooms[currentFloor].filter(r=>r.id!==selRoom.id);
    selRoom=null;status('방 삭제 (50% 환불)');
  }
  updBudget();updatePanel();updateSelHighlight();refreshGameState(false);
}

function rotateSelected(){
  if(selFurn){
    saveUndo();
    const t=selFurn.w;selFurn.w=selFurn.h;selFurn.h=t;
    selFurn.rot=(selFurn.rot+90)%360;
    // 메시 회전 (전체 재빌드 대신 직접)
    const m=meshMap.get('furn_'+selFurn.id);
    if(m){
      removeMesh('furn_'+selFurn.id);
      addFurnMesh(selFurn,selRoom);
    }
  }
}

document.getElementById('aUndo').onclick=()=>{
  if(!undoStack.length)return;
  const d=JSON.parse(undoStack.pop());rooms=d.rooms;exteriors=d.exteriors;budget=d.budget;
  selRoom=null;selFurn=null;updBudget();updatePanel();rebuildAll();refreshGameState(false);
};
document.getElementById('aMove').onclick=()=>{
  if(!selRoom){status('⚠ 먼저 이동할 방을 클릭하세요');return;}
  moveMode=!moveMode;
  document.getElementById('aMove').classList.toggle('act',moveMode);
  status(moveMode?'✋ 이동: 빈 공간을 클릭하세요':'이동 취소');
};
document.getElementById('aDel').onclick=deleteSelected;
document.getElementById('aRot').onclick=rotateSelected;
document.getElementById('aFloorUp').onclick=()=>changeFloor(1);
document.getElementById('aFloorDn').onclick=()=>changeFloor(-1);

function updFloor(){
  const labels={'-1':'B1','1':'1F','2':'2F','3':'3F','4':'옥상'};
  document.getElementById('floorDisp').textContent=labels[currentFloor]||currentFloor+'F';
  // updFloor는 onObjectClick에서도 호출되므로 selRoom 초기화 안 함 (이미 설정됨)
  updatePanel();
}
// 층 업/다운 시에는 선택 해제
function changeFloor(d){
  const nf=currentFloor+d;
  if(nf<-1||nf>4)return;
  currentFloor=nf;selRoom=null;selFurn=null;
  updFloor();updateSelHighlight();
}
function updBudget(){document.getElementById('budgetDisp').textContent='💰 '+budget.toLocaleString();}
function status(t){document.getElementById('statusTxt').textContent=t;}

// 날씨 / 시간 토글
document.getElementById('weatherIcon').onclick=()=>{
  weather=(weather+1)%4;

};
document.getElementById('timeIcon').onclick=()=>{

document.getElementById('btnShot').onclick=()=>{screenshot(renderer,scene,camera);status('📷 스크린샷 저장됨');};

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&walkMode)exitWalk();});

document.querySelectorAll('.ptab').forEach(t=>t.onclick=()=>{
  curTab=t.dataset.t;
  document.querySelectorAll('.ptab').forEach(x=>x.classList.remove('act'));t.classList.add('act');

function updatePanel(){
  const pc=document.getElementById('pcontent');
  if(curTab==='rooms'){
    let h='<div class="sec">🏠 방 종류</div><div class="grid2">';
    ROOMS.forEach(r=>{
      const cost=Math.round(r.cost*MAT_COSTS[curMaterial]);
      h+=`<div class="item-btn ${r.id===selRoomType?'sel':''}" onclick="pickRoom('${r.id}')"><span class="ic">${r.ic}</span><span class="nm">${r.n} ${r.w}x${r.h}</span><span class="pr">$${cost.toLocaleString()}</span></div>`;
    });
    h+='</div>';
    if(selRoom){
      const rt=ROOMS.find(r=>r.id===selRoom.type);
      h+=`<div class="sec">선택: ${rt.ic} ${rt.n}</div>`;
      h+=`<div style="font-size:10px;color:#888;margin-bottom:4px">위치(${selRoom.x},${selRoom.z}) 크기${selRoom.w}x${selRoom.h}m 가구${selRoom.furniture.length}개</div>`;
    }
    pc.innerHTML=h;
  }else if(curTab==='furn'){
    let h='';
    if(!selRoom){h='<p style="padding:16px;text-align:center;color:#888">방을 먼저 선택하세요</p>';}
    else{
      const rt=ROOMS.find(r=>r.id===selRoom.type);
      h+=`<div class="sec">가구 - ${rt.ic} ${rt.n}</div><div class="grid2">`;
      FURN.forEach(f=>{
        const ok=f.room.includes(selRoom.type);
        h+=`<div class="item-btn" ${!ok?'style="opacity:.3"':''} ${ok?`onclick="pickFurn('${f.id}')"`:''}><span class="ic">${f.ic}</span><span class="nm">${f.n}</span><span class="pr">$${f.cost.toLocaleString()}</span></div>`;
      });
      h+='</div>';
      if(selRoom.furniture.length){
        h+='<div class="sec">배치된 가구</div>';
        selRoom.furniture.forEach(f=>{
          const ft=FURN.find(fi=>fi.id===f.type);
          const isSel=selFurn&&selFurn.id===f.id;

function escapeHtml(s){
  return String(s||'').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'})[c]);
}
document.getElementById('aSave').onclick=()=>{
  const name=prompt('저장 이름:','내 집 '+new Date().toLocaleDateString());
  if(!name)return;
  try{
    const saves=JSON.parse(localStorage.getItem('hb_v4_saves')||'[]');
    saves.push({name,date:new Date().toISOString(),data:{rooms,exteriors,budget,nextId}});
    if(saves.length>10)saves.shift();
    localStorage.setItem('hb_v4_saves',JSON.stringify(saves));
    status('💾 저장 완료!');
  }catch(e){
    status(e.name==='QuotaExceededError'?'💾 저장공간 부족':'💾 저장 실패: '+e.message);
  }
};
document.getElementById('aGal').onclick=()=>{

  saves.forEach((s,i)=>{

    h+=`<div class="gal-item" onclick="loadDesign(${i})"><span class="gn">${escapeHtml(s.name)}</span>${tag}<br><span style="color:#888;font-size:10px">${new Date(s.date).toLocaleDateString()} | 방 ${totalRooms}개</span></div>`;
  });
  h+=`<br><button onclick="document.getElementById('galleryModal').style.display='none'">닫기</button>`;

function normalizeRooms(r){
  const out={};
  for(let f=-1;f<=4;f++)out[f]=[];
  if(r&&typeof r==='object'){
    for(const k of Object.keys(r)){
      const arr=Array.isArray(r[k])?r[k]:[];
      const fk=parseInt(k,10);
      if(!isNaN(fk)&&out[fk])out[fk]=arr.map(rr=>({...rr,furniture:rr.furniture||[]}));
    }
  }
  return out;
}
window.loadDesign=(i)=>{
  const saves=window.__gal_saves||[];
  if(!saves[i])return;
  const d=saves[i].data;
  rooms=normalizeRooms(d.rooms);
  exteriors=Array.isArray(d.exteriors)?d.exteriors:[];
  budget=typeof d.budget==='number'?d.budget:500000;
  nextId=d.nextId||1;
  selRoom=null;selFurn=null;currentFloor=1;updFloor();updBudget();updatePanel();
  document.getElementById('galleryModal').style.display='none';
  rebuildAll();
  completedMissions.clear();refreshGameState(true);
  status('📂 불러오기 완료!');
};

function startTutorial(){ensureTutDom();tutActive=true;tutStep=0;window.addEventListener('resize',tutReposition);showTutStep(0);}
function hideTutDom(){['tutDimTop','tutDimBottom','tutDimLeft','tutDimRight','tutRing','tutHand','tutCard'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.display='none';});}
function skipTutorial(){tutActive=false;window.removeEventListener('resize',tutReposition);hideTutDom();localStorage.setItem('hb_v4_tutDone','1');status('튜토리얼 종료 — ❓로 다시 볼 수 있어요');}
function finishTutorial(){tutActive=false;window.removeEventListener('resize',tutReposition);hideTutDom();fireConfetti();status('🎉 멋진 건축가가 됐어요! 이제 마음껏 지어봐요');localStorage.setItem('hb_v4_tutDone','1');}

function showTutStep(i){
  const step=TUT_STEPS[i];if(!step)return;tutStep=i;
  if(step.id==='finish'){finishTutorial();return;}
  if(step.pre)step.pre();
  setTimeout(()=>{
    if(!tutActive)return;
    let t=step.target?step.target():null;
    if(step.target && t instanceof Element && !tutVisible(t)){ if(step.id==='openMenu')tutOpenPanel(); showTutStep(i+1); return; }
    const rect=t?((t instanceof Element)?t.getBoundingClientRect():t):null;
    positionTutSpotlight(rect);
    renderTutCardRaw(TUT_COPY[step.id]||{},rect,step.trigger==='next');
  },360);
}
function tutReposition(){if(!tutActive)return;const step=TUT_STEPS[tutStep];if(!step||step.id==='finish')return;const t=step.target?step.target():null;const rect=t?((t instanceof Element)?t.getBoundingClientRect():t):null;positionTutSpotlight(rect);renderTutCardRaw(TUT_COPY[step.id]||{},rect,step.trigger==='next');}

function positionTutSpotlight(rect){
  const W=innerWidth,H=innerHeight;
  const top=document.getElementById('tutDimTop'),bot=document.getElementById('tutDimBottom'),lf=document.getElementById('tutDimLeft'),rt=document.getElementById('tutDimRight'),ring=document.getElementById('tutRing'),hand=document.getElementById('tutHand');
  if(!rect){top.style.display='block';top.style.left='0';top.style.top='0';top.style.width=W+'px';top.style.height=H+'px';bot.style.display='none';lf.style.display='none';rt.style.display='none';ring.style.display='none';hand.style.display='none';return;}
  const p=8,x=rect.left-p,y=rect.top-p,w=rect.width+p*2,h=rect.height+p*2;
  top.style.display='block';bot.style.display='block';lf.style.display='block';rt.style.display='block';
  top.style.left='0';top.style.top='0';top.style.width=W+'px';top.style.height=Math.max(0,y)+'px';
  bot.style.left='0';bot.style.top=(y+h)+'px';bot.style.width=W+'px';bot.style.height=Math.max(0,H-(y+h))+'px';
  lf.style.left='0';lf.style.top=y+'px';lf.style.width=Math.max(0,x)+'px';lf.style.height=h+'px';
  rt.style.left=(x+w)+'px';rt.style.top=y+'px';rt.style.width=Math.max(0,W-(x+w))+'px';rt.style.height=h+'px';
  ring.style.display='block';ring.style.left=x+'px';ring.style.top=y+'px';ring.style.width=w+'px';ring.style.height=h+'px';
  hand.style.display='block';
  if(w>180||h>180){hand.style.left=(x+w/2-20)+'px';hand.style.top=(y+h/2-20)+'px';}
  else{hand.style.left=(x+w-14)+'px';hand.style.top=(y+h-10)+'px';}
}
function renderTutCardRaw(c,rect,showNext){
  const card=document.getElementById('tutCard');card.style.display='block';
  document.getElementById('tutMascot').textContent=c.mascot||'🏠';
  document.getElementById('tutBig').textContent=c.big||'';
  document.getElementById('tutSmall').textContent=c.small||'';
  document.getElementById('tutProgress').textContent=(TUT_STEPS[tutStep]&&TUT_STEPS[tutStep].id==='finish')?'':((tutStep+1)+' / 8');

// --- 코어: 집 가치 ---
function computeHouseValue(){
  let construction=0,furniture=0,exterior=0,roomCount=0,furnCount=0,floorsUsed=0;
  for(let f=-1;f<=4;f++){
    const arr=rooms[f]||[];
    if(!arr.length)continue;
    floorsUsed++;
    for(const rm of arr){
      roomCount++;
      const rdef=ROOMS.find(r=>r.id===rm.type);
      if(rdef){const mi=(rm.material>=0&&rm.material<MAT_COSTS.length)?rm.material:0;construction+=rdef.cost*MAT_COSTS[mi];}
      for(const fu of (rm.furniture||[])){furnCount++;const fd=FURN.find(x=>x.id===fu.type);if(fd)furniture+=fd.cost;}
    }
  }
  for(const ex of (exteriors||[])){const ed=EXTERIOR.find(e=>e.id===ex.type);if(ed)exterior+=ed.cost;}
  let mul=1.0+Math.min(roomCount/8,1)*0.25+Math.min(furnCount/16,1)*0.20+Math.min(floorsUsed/6,1)*0.15;
  if(mul>1.6)mul=1.6;mul=Math.round(mul*1000)/1000;
  const total=Math.round((construction+furniture+exterior)*mul);
  return {total,breakdown:{construction:Math.round(construction),furniture:Math.round(furniture),exterior:Math.round(exterior),appreciationMul:mul}};
}

// --- 코어: 거주 만족도 ---
function computeSatisfaction(){
  const all=[];for(let f=-1;f<=4;f++)for(const r of (rooms[f]||[]))all.push(r);
  const n=all.length;
  const has=t=>all.some(r=>r.type===t);
  const windowed=all.filter(r=>(r.windowStyle|0)>0).length;
  const lightRatio=n>0?windowed/n:0;
  let totF=0;for(const r of all)totF+=(r.furniture||[]).length;
  const avgF=n>0?totF/n:0;const furnRatio=Math.min(1,avgF/2);
  let fc=0;for(let f=-1;f<=4;f++)if((rooms[f]||[]).length)fc++;
  const floorRatio=Math.min(1,fc/4);
  const garden=has('garden')||(exteriors||[]).some(e=>e.type==='tree'||e.type==='flower');
  const factors=[
    {label:'침실 있음',ok:has('bedroom'),pts:has('bedroom')?15:0},
    {label:'주방 있음',ok:has('kitchen'),pts:has('kitchen')?12:0},
    {label:'욕실 있음',ok:has('bathroom'),pts:has('bathroom')?12:0},
    {label:'거실 있음',ok:has('living'),pts:has('living')?11:0},
    {label:'채광(창문)',ok:lightRatio>=0.5,pts:Math.round(15*lightRatio)},
    {label:'가구 충분',ok:avgF>=2,pts:Math.round(15*furnRatio)},
    {label:'층 다양성',ok:fc>=2,pts:Math.round(10*floorRatio)},
    {label:'정원/조경',ok:garden,pts:garden?10:0},
  ];
  let score=0;for(const f of factors)score+=f.pts;score=Math.max(0,Math.min(100,Math.round(score)));
  return {score,factors};
}

// --- 코어: 별점 등급 ---
function computeRating(value,satisfaction,missionsDone,missionsTotal){
  let sat=Math.max(0,Math.min(100,Number(satisfaction)||0));
  let done=Math.max(0,Number(missionsDone)||0);
  let total=Math.max(0,Number(missionsTotal)||0);
  if(total>0&&done>total)done=total;
  const val=Number(value)||0;
  const valueTier=val<200000?0:val<400000?50:val<700000?80:100;
  const missionPct=(done/Math.max(1,total))*100;
  let score=sat*0.5+missionPct*0.3+valueTier*0.2;
  score=Math.max(0,Math.min(100,score));
  let stars,grade,title,message;
  if(score>=90){stars=5;grade='S';title='드림하우스';message='완벽합니다! 모두가 꿈꾸는 최고의 집이에요.';}
  else if(score>=75){stars=4;grade='A';title='럭셔리 저택';message='훌륭해요! 손님들이 부러워할 멋진 집이네요.';}
  else if(score>=60){stars=3;grade='B';title='아늑한 보금자리';message='좋아요! 살기 편안하고 정감 가는 집이에요.';}
  else if(score>=40){stars=2;grade='C';title='소박한 우리집';message='나쁘지 않아요. 조금만 더 꾸미면 훨씬 좋아져요.';}
  else{stars=1;grade='D';title='공사중';message='아직 공사중! 방과 가구를 더 채워볼까요?';}
  return {stars,grade,title,message,score:Math.round(score)};
}

function _cntRoom(t){return _flatRooms().filter(r=>r.type===t).length;}
function _cntFurn(){return _flatRooms().reduce((s,r)=>s+(r.furniture||[]).length,0);}
function _usedFloors(){let c=0;for(let f=-1;f<=4;f++)if((rooms[f]||[]).length)c++;return c;}
function _cntExt(t){return (exteriors||[]).filter(e=>e.type===t).length;}
function _rawCost(){const b=computeHouseValue().breakdown;return b.construction+b.furniture+b.exterior;}
function checkMissionCond(m){
  const th=m.threshold||1;
  switch(m.condType){
    case 'hasRoom':return _cntRoom(m.targetType)>=1;
    case 'roomTypeCount':return _cntRoom(m.targetType)>=th;
    case 'roomCount':return _flatRooms().length>=th;
    case 'satisfaction':return computeSatisfaction().score>=th;
    case 'value':return computeHouseValue().total>=th;
    case 'spentUnder':return _flatRooms().length>0&&_rawCost()<=(m.threshold||0);
    case 'floors':return _usedFloors()>=th;
    case 'furnitureCount':return _cntFurn()>=th;
    case 'hasExterior':return _cntExt(m.targetType)>=(m.threshold||1);
    default:return false;
  }
}
function refreshMissions(silent){
  const newly=[];
  for(const m of MISSIONS){
    if(!completedMissions.has(m.id)&&checkMissionCond(m)){
      completedMissions.add(m.id);
      if(!silent){budget+=m.reward;newly.push(m);}
    }
  }
  if(newly.length&&!silent){
    updBudget();
    const sum=newly.reduce((a,n)=>a+n.reward,0);
    status('🎯 미션 달성! '+newly.map(n=>n.title).join(', ')+' (+₩'+sum.toLocaleString()+')');
    updatePanel();
  }
  return {done:completedMissions.size,total:MISSIONS.length,newly};
}
function refreshGameState(silent){const r=refreshMissions(silent);renderHUD(r.done,r.total);}

// --- HUD 스트립 ---
function ensureHUD(){
  if(!document.getElementById('gameHudStyle')){
    const st=document.createElement('style');st.id='gameHudStyle';
    st.textContent=`#gameHud{position:fixed;top:44px;left:0;right:0;height:26px;z-index:99;display:flex;align-items:center;gap:6px;padding:0 8px;box-sizing:border-box;background:linear-gradient(135deg,rgba(20,12,44,.95),rgba(30,18,68,.95));border-bottom:1px solid #4a2a7a;font-size:11px;line-height:1;white-space:nowrap;overflow:hidden;pointer-events:none;font-family:inherit}
#gameHud .hud-i{display:flex;align-items:center;gap:3px;flex-shrink:0}
#gameHud .hud-sep{width:1px;height:13px;background:rgba(255,255,255,.12);flex-shrink:0}
#hudValue{color:#ffd700;font-weight:700}
#hudSatBar{position:relative;width:36px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;flex-shrink:0}
#hudSatBar>i{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,#ff5a5a,#ffd24a,#5ad17a);transition:width .35s}
#hudSat{color:#d0b0ff;font-weight:700;min-width:22px}
#hudMission{color:#9ad}
#hudGrade{color:#fff;font-weight:700;padding:1px 6px;border-radius:8px;background:rgba(140,80,255,.35);border:1px solid #a070ff;flex-shrink:0}
@media(max-width:430px){#gameHud{gap:4px;padding:0 5px;font-size:10px}#hudSatBar{width:28px}}
#cvs3d{top:70px !important}#panel{top:70px !important}#panelToggle{top:76px !important}#walkBadge{top:76px !important}`;
    document.head.appendChild(st);
  }
  if(!document.getElementById('gameHud')){
    const hud=document.createElement('div');hud.id='gameHud';
    hud.innerHTML='<span class="hud-i" title="집 가치">💰<span id="hudValue">0</span></span><span class="hud-sep"></span><span class="hud-i" title="만족도">😊<span id="hudSatBar"><i></i></span><span id="hudSat">0</span></span><span class="hud-sep"></span><span class="hud-i" title="미션">🎯<span id="hudMission">0/0</span></span><span class="hud-sep"></span><span id="hudGrade" title="등급">🏆 D</span>';
    document.body.appendChild(hud);
  }
}
function renderHUD(done,total){
  ensureHUD();
  let v=0;try{v=computeHouseValue().total;}catch(e){}
  document.getElementById('hudValue').textContent=Math.round(v).toLocaleString();
  let s=0;try{s=computeSatisfaction().score;}catch(e){}
  s=Math.max(0,Math.min(100,Math.round(s)));
  const bar=document.querySelector('#hudSatBar>i');if(bar)bar.style.width=s+'%';
  document.getElementById('hudSat').textContent=s;
  document.getElementById('hudMission').textContent=(done||0)+'/'+(total||0);
  const r=computeRating(v,s,done||0,total||0);
  document.getElementById('hudGrade').textContent='🏆 '+r.grade;
}

// --- 평가 결과 모달 ---
function openEvaluation(){
  const hv=computeHouseValue();
  const cs=computeSatisfaction();
  const done=completedMissions.size,total=MISSIONS.length;
  const r=computeRating(hv.total,cs.score,done,total);
  const gradeColors={S:'#ffd700',A:'#a070ff',B:'#5acc88',C:'#ffaa55',D:'#ff6b6b'};
  const gc=gradeColors[r.grade]||'#a070ff';
  const starStr='⭐'.repeat(r.stars)+'☆'.repeat(5-r.stars);
  let roomCount=0,furnCount=0;for(let f=-1;f<=4;f++){const a=rooms[f]||[];roomCount+=a.length;for(const rm of a)furnCount+=(rm.furniture||[]).length;}

  }).join('');
  let modal=document.getElementById('evalModal');
  if(!modal){modal=document.createElement('div');modal.id='evalModal';modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:300;display:none;align-items:center;justify-content:center;padding:16px;box-sizing:border-box';document.body.appendChild(modal);modal.addEventListener('click',e=>{if(e.target===modal)modal.style.display='none';});}
  modal.innerHTML=`<div style="background:linear-gradient(160deg,#1a1a2e,#16122b 55%,#1c1438);border:2px solid ${gc};border-radius:18px;padding:20px;width:340px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.6),0 0 30px ${gc}33;color:#fff;box-sizing:border-box">
    <div style="text-align:center;font-size:12px;letter-spacing:3px;color:#a070ff;font-weight:700">집짓기 · 평가 결과</div>
    <div style="text-align:center;font-size:13px;color:#888;margin-bottom:12px">🏠 ${r.title}</div>
    <div style="text-align:center"><div style="display:inline-block;padding:6px 18px;border:2px solid ${gc};border-radius:14px;background:${gc}1a"><span style="font-size:13px;color:#cfc0ff">등급</span> <span style="font-size:34px;font-weight:800;color:${gc};vertical-align:middle">${r.grade}</span></div></div>
    <div style="text-align:center;font-size:26px;letter-spacing:2px;margin:10px 0 2px">${starStr}</div>
    <div style="text-align:center;font-size:12px;color:#bbb;margin-bottom:14px">${r.score}점</div>
    <div style="background:rgba(140,80,255,.12);border:1px solid #4a2a7a;border-radius:12px;padding:12px;text-align:center;margin-bottom:14px"><div style="font-size:11px;color:#a070ff;margin-bottom:2px">💰 추정 집 가치</div><div style="font-size:26px;font-weight:800;color:#ffd700">₩${hv.total.toLocaleString()}</div></div>
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px"><span style="color:#a070ff;font-weight:700">😊 거주 만족도</span><span style="font-weight:800;color:${gaugeCol}">${cs.score}%</span></div>
    <div style="height:12px;background:rgba(255,255,255,.08);border-radius:8px;overflow:hidden;margin-bottom:12px"><div style="height:100%;width:${cs.score}%;background:linear-gradient(90deg,${gaugeCol}aa,${gaugeCol})"></div></div>
    ${factorsHtml}
    <div style="display:flex;gap:6px;margin:12px 0;text-align:center">
      <div style="flex:1;background:rgba(255,255,255,.04);border-radius:10px;padding:8px 4px"><div style="font-size:18px;font-weight:800;color:#d0b0ff">${roomCount}</div><div style="font-size:10px;color:#999">방</div></div>
      <div style="flex:1;background:rgba(255,255,255,.04);border-radius:10px;padding:8px 4px"><div style="font-size:18px;font-weight:800;color:#d0b0ff">${furnCount}</div><div style="font-size:10px;color:#999">가구</div></div>
      <div style="flex:1;background:rgba(255,255,255,.04);border-radius:10px;padding:8px 4px"><div style="font-size:18px;font-weight:800;color:#d0b0ff">${extCount}</div><div style="font-size:10px;color:#999">조경</div></div>
      <div style="flex:1.3;background:rgba(255,255,255,.04);border-radius:10px;padding:8px 4px"><div style="font-size:16px;font-weight:800;color:#5acc88">${done}/${total}</div><div style="font-size:10px;color:#999">미션</div></div>
    </div>
    <div style="background:rgba(160,112,255,.1);border-left:3px solid #a070ff;border-radius:0 10px 10px 0;padding:10px 12px;margin-bottom:16px;font-size:13px;color:#e8e0ff">"${r.message}"</div>
    <div style="display:flex;gap:10px">
      <button id="evalClose" style="flex:1;padding:11px;background:rgba(255,255,255,.06);border:1px solid #5a3a9a;color:#d0b0ff;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer">닫기</button>
      <button id="evalShot" style="flex:1;padding:11px;background:linear-gradient(135deg,#7a4ad0,#a070ff);border:1px solid #a070ff;color:#fff;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer">📷 스크린샷</button>
    </div>
  </div>`;
  document.getElementById('evalClose').onclick=()=>{modal.style.display='none';};
  document.getElementById('evalShot').onclick=()=>{modal.style.display='none';document.getElementById('btnShot').click();};
  modal.style.display='flex';
  status('🏆 평가: '+r.grade+'등급 '+r.title+' ('+r.stars+'⭐)');
  tutAdvance('evalOpened');
}
