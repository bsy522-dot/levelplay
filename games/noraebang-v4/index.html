function spawnFireworks(canvas){
  const cx=Math.random()*canvas.width,cy=Math.random()*canvas.height*.5;
  const colors=['#ffd700','#ff6ab0','#4caf50','#2196f3','#ff9800'];
  for(let i=0;i<30;i++){
    const angle=Math.random()*Math.PI*2,speed=Math.random()*5+2;
    particles.push({x:cx,y:cy,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:1,color:colors[i%colors.length],size:Math.random()*2+1});
  }
}
function updateParticles(ctx){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.life-=0.02;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ===================== GAME LOOP =====================
let lastLineFbTime=0,lastLineFbText='';
function gameLoop(){
  if(gState!=='singing')return;
  if(paused){animId=requestAnimationFrame(gameLoop);return;}

  const now=performance.now();
  const rawElapsed=(now-startT-pauseAccum)/1000;
  const elapsed=rawElapsed*tempoMul;

  // Loop handling
  let songDur=curSong.dur;
  let eff=elapsed;
  if(loopStart>=0&&loopEnd>0){
    const loopLen=loopEnd-loopStart;
    if(eff>=loopEnd)eff=loopStart+((eff-loopStart)%loopLen);
    songDur=Infinity;// never end in loop mode
  }

  if(elapsed>=songDur){endSong();return;}

  // Timer
  const prog=Math.min(1,elapsed/curSong.dur);
  document.getElementById('timerFill').style.width=(prog*100)+'%';

  // User pitch
  const userFreq=detectPitch();

  // Target note (시각·가이드용 = 현재 시간)
  const mel=curSong.melody;
  const noteAt=tt=>{for(const n of mel){if(tt>=n.t&&tt<=n.t+n.d)return n;}return null;};
  const curNote=noteAt(eff);
  const targetFreq=curNote?transpose(curNote.f,keyShift):null;

  // 표시용 옥타브 접기: 어느 옥타브로 불러도 트레이스가 노트 바 옆에 붙게
  let dispFreq=userFreq;
  if(userFreq&&targetFreq){
    dispFreq=userFreq;
    while(dispFreq<targetFreq/1.4142)dispFreq*=2;
    while(dispFreq>targetFreq*1.4142)dispFreq/=2;
  }

  // Guide
  if(targetFreq)playSynth(targetFreq);else muteSynth();

  // v4.1 per-note scoring: 판정 노트 = 지연 보정된 과거 시점의 노트
  const judgeNote=noteAt(Math.max(0,eff-JUDGE_LAT));
  const jId=judgeNote?judgeNote.t:null;
  if(jId!==curNoteId){
    if(curNoteId!==null&&window.KaraokeAudio)applyNoteScore(KaraokeAudio.endNote());
    if(judgeNote&&window.KaraokeAudio)KaraokeAudio.startNote(transpose(judgeNote.f,keyShift),judgeNote.t,judgeNote.d);
    curNoteId=jId;
  }

  // v4: shader audio reactivity each frame — WebGL 컨텍스트 손실 시 게임루프까지 죽지 않게 방어
  if(shaderOn&&window.KaraokeShader&&window.KaraokeAudio){
    try{
      const rmsVal=KaraokeAudio.getRMS();
      const centVal=Math.min(1,KaraokeAudio.getSpectralCentroid()/4000);
      beatPulse*=0.9; if(rmsVal>0.05) beatPulse=1;
      KaraokeShader.setAudio(rmsVal,centVal,beatPulse);
      KaraokeShader.setCombo(combo);
      KaraokeShader.render(performance.now()/1000);
    }catch(e){shaderOn=false;}
  }

  // Display - score is now sum of per-note points; normalize to 0-100 by dividing by max possible.
  const fs=totalN>0?Math.min(100,Math.round(score/Math.max(1,totalN))):0;
  document.getElementById('sDisp').textContent=fs;
  document.getElementById('cDisp').textContent=combo>1?combo+' 콤보!':'';
  const pnH=userFreq?noteHTML(dispFreq):'';const pnEl=document.getElementById('pNote');if(pnEl.__h!==pnH){pnEl.__h=pnH;pnEl.innerHTML=pnH;}

  // Per-line scoring feedback
  let curLI=-1;
  for(let i=curSong.lyrics.length-1;i>=0;i--){if(eff>=curSong.lyrics[i].t){curLI=i;break;}}

  // Pitch meter
  const mH=document.getElementById('pitchMeter').clientHeight;
  if(targetFreq){const tp=Math.max(0,Math.min(1,1-(Math.log2(targetFreq/100)/3.5)));document.querySelector('.mt').style.top=(tp*(mH-20))+'px';}
  if(userFreq){const up=Math.max(0,Math.min(1,1-(Math.log2(dispFreq/100)/3.5)));document.querySelector('.mu').style.top=(up*(mH-6))+'px';document.querySelector('.mu').style.display='block';}
  else{document.querySelector('.mu').style.display='none';}

  // Lyrics with syllable highlight
  if(curLI>=0){
    const lyricObj=curSong.lyrics[curLI];
    // Find notes in this lyric's time range
    const nextT=curLI+1<curSong.lyrics.length?curSong.lyrics[curLI+1].t:curSong.dur;
    const lyricNotes=mel.filter(n=>n.t>=lyricObj.t&&n.t<nextT);

    let html='';
    lyricNotes.forEach((n,i)=>{
      const isSung=eff>=n.t+n.d;
      const isAct=eff>=n.t&&eff<n.t+n.d;
      const cls=isAct?'active':isSung?'sung':'';
      html+=`<span class="syl ${cls}">${n.s||''}</span>`;
    });
    if(!html)html=`<span>${lyricObj.tx}</span>`;
    document.getElementById('curLyric').innerHTML=html;

    const nI=curLI+1;
    document.getElementById('nxtLyric').textContent=nI<curSong.lyrics.length?curSong.lyrics[nI].tx:'';
    const lyricProg=Math.min(1,(eff-lyricObj.t)/(nextT-lyricObj.t));
    document.getElementById('lyricProg').style.width=(lyricProg*100)+'%';

    // Line score feedback when line changes
    if(curLI>0&&!lineScores[curLI-1]){
      // 직전 라인 구간에서 얻은 노트 점수만으로 판정 (누적 평균은 라인 피드백으로 부정확)
      const dN=totalN-lineSnapN;
      const lsc=dN>0?Math.round((score-lineSnapScore)/dN):0;
      lineSnapScore=score;lineSnapN=totalN;
      lineScores[curLI-1]=true;
      let fbText='',fbColor='';
      if(lsc>=90){fbText='최고!';fbColor='#ffd700';spawnFireworks(document.getElementById('particleCanvas'));}
      else if(lsc>=70){fbText='잘했어!';fbColor='#5fd068';}
      else if(lsc>=50){fbText='좋아!';fbColor='#64b5f6';}
      else{fbText='아쉬워';fbColor='#ff7a70';}
      const fb=document.getElementById('lineFb');fb.textContent=fbText;fb.style.color=fbColor;
      lastLineFbTime=now;lastLineFbText=fbText;
    }
  }
  if(now-lastLineFbTime>1500)document.getElementById('lineFb').textContent='';

  // v4: debug panel (opt-in via triple-tap on title)
  if(window.__dbgOn){
    const dbg=window.KaraokeAudio;
    const r=dbg&&dbg.getLastDetection?dbg.getLastDetection():null;
    document.getElementById('dbgFreq').textContent=userFreq?userFreq.toFixed(1):'-';
    document.getElementById('dbgNote').textContent=userFreq?freqToNote(userFreq):'-';
    document.getElementById('dbgCents').textContent=(targetFreq&&userFreq)?(()=>{const c=1200*Math.log2(userFreq/targetFreq);const f=((c%1200)+1800)%1200-600;return f.toFixed(0)+' (raw '+c.toFixed(0)+')';})():'-';
    document.getElementById('dbgClarity').textContent=r&&r.clarity!=null?r.clarity.toFixed(2):'-';
    document.getElementById('dbgRMS').textContent=dbg&&dbg.getRMS?dbg.getRMS().toFixed(3):'-';
    if(!window.__fpsLast)window.__fpsLast={t:performance.now(),c:0,fps:0};
    const fl=window.__fpsLast;fl.c++;
    const dt=performance.now()-fl.t;
    if(dt>=500){fl.fps=(fl.c*1000/dt).toFixed(0);fl.c=0;fl.t=performance.now();}
    document.getElementById('dbgFps').textContent=fl.fps;
  }

  // Draw
  drawPitch(eff,dispFreq,targetFreq);
  drawParticles();

  // Stage lighting
  const pa=document.getElementById('pitchArea');
  if(combo>=10)pa.style.boxShadow='inset 0 0 60px rgba(255,215,0,.15)';
  else if(combo>=5)pa.style.boxShadow='inset 0 0 40px rgba(76,175,80,.1)';
  else pa.style.boxShadow='none';

  // Store pitch (표시용 접힌 값 저장 — 트레일이 노트 바와 같은 옥타브 레인에 그려짐)
  if(userFreq)userPH.push({t:eff,f:dispFreq});
  while(userPH.length>0&&userPH[0].t<eff-10)userPH.shift();
  while(userPH.length>900)userPH.shift(); // 연습 구간반복 시 eff 되감김으로 시간기준 정리가 안 먹는 것 방지

  animId=requestAnimationFrame(gameLoop);
}

// ===================== DRAW PITCH CANVAS =====================
function drawPitch(elapsed,userFreq,targetFreq){
  const c=document.getElementById('pitchCanvas'),ctx=c.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const W=c.width/dpr,H=c.height/dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  const minL=Math.log2(130),maxL=Math.log2(800);
  const freqToY=f=>H-((Math.log2(f)-minL)/(maxL-minL))*H;

  // Grid
  const noteFreqs=[C3,D3,E3,F3,G3,A3,B3,C4,D4,E4,F4,G4,A4,B4,C5,D5,E5];
  ctx.lineWidth=1;
  noteFreqs.forEach((f,i)=>{
    const y=freqToY(f);if(y<0||y>H)return;
    ctx.strokeStyle=f===C4||f===C5?'rgba(255,255,255,.12)':'rgba(255,255,255,.04)';
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
    // 줄 이름은 연습 모드 '음이름 표시'를 켰을 때만 (기본 화면은 줄만)
    if(showNoteNames)drawNoteName(ctx,f,50,y-3,14,'rgba(255,255,255,.45)');
  });

  // Time window
  const wS=elapsed-2,wE=elapsed+5;
  const tX=t=>((t-wS)/(wE-wS))*W;

  // Current time line
  const nowX=tX(elapsed);
  ctx.strokeStyle='rgba(255,106,176,.25)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(nowX,0);ctx.lineTo(nowX,H);ctx.stroke();

  // Target bars
  curSong.melody.forEach(n=>{
    const tf=transpose(n.f,keyShift);
    if(n.t+n.d<wS||n.t>wE)return;
    const x=tX(n.t),x2=tX(n.t+n.d),y=freqToY(tf);
    const past=elapsed>n.t+n.d,cur=elapsed>=n.t&&elapsed<=n.t+n.d;
    const bH=12;
    ctx.fillStyle=cur?'rgba(76,175,80,.5)':past?'rgba(100,100,100,.25)':'rgba(106,58,170,.45)';
    ctx.strokeStyle=cur?'#4caf50':past?'#555':'#8855cc';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(x,y-bH/2,Math.max(3,x2-x),bH,3);ctx.fill();ctx.stroke();
    // Note name
    if(showNoteNames&&!past){
      drawNoteName(ctx,tf,x+2,y-bH/2-3,16,'rgba(255,255,255,.8)');
    }
    // Syllable on bar
    if(n.s&&!past){
      ctx.fillStyle=cur?'#fff':'rgba(255,255,255,.72)';ctx.font=cur?'bold 18px sans-serif':'16px sans-serif';
      ctx.fillText(n.s,x+2,y+bH/2+17);
    }
  });

  // User pitch trail
  if(userPH.length>1){
    ctx.strokeStyle='#ff6ab0';ctx.lineWidth=2.5;ctx.shadowColor='rgba(255,106,176,.5)';ctx.shadowBlur=6;
    ctx.beginPath();let started=false;
    userPH.forEach(p=>{const x=tX(p.t),y=freqToY(p.f);if(!started){ctx.moveTo(x,y);started=true;}else ctx.lineTo(x,y);});
    ctx.stroke();ctx.shadowBlur=0;
  }

  // User dot
  if(userFreq){
    const bx=nowX,by=freqToY(userFreq);
    // Color based on accuracy
    let dotColor='#f44336';
    if(targetFreq){
      // userFreq는 이미 접힌 표시값 — 판정 구간(35/70/120)과 동일 기준
      const ac=Math.abs(1200*Math.log2(userFreq/targetFreq));
      if(ac<35)dotColor='#ffd700';else if(ac<70)dotColor='#4caf50';else if(ac<120)dotColor='#ff9800';
    }
    ctx.beginPath();ctx.arc(bx,by,7,0,Math.PI*2);ctx.fillStyle=dotColor;
    ctx.shadowColor=dotColor;ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;
  }
}

function drawParticles(){
  const c=document.getElementById('particleCanvas'),ctx=c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  updateParticles(ctx);
}

// ===================== END SONG =====================
function endSong(){
  gState='result';killSynth();stopRecording();
  document.body.classList.remove('singing');
  if(animId)cancelAnimationFrame(animId);

  // v4.1: close any open per-note scoring — 마지막 노트도 점수에 포함
  if(curNoteId!==null&&window.KaraokeAudio){applyNoteScore(KaraokeAudio.endNote());curNoteId=null;}

  const fs=totalN>0?Math.min(100,Math.round(score/Math.max(1,totalN))):0;
  const pitchAcc=totalN>0?Math.round(pitchSum/totalN):0;
  const rhythmAcc=totalN>0?Math.round(rhythmSum/totalN):0;
  const noScore=totalN===0;
  const grade=getGrade(fs);const stars=getStars(fs);
  if(!practiceMode&&!noScore&&!curSong.warm)saveHS(curSong.id,fs,grade);

  // v4: confetti on S grade; transition shader to result mode
  if(grade==='S'&&window.KaraokeFX)KaraokeFX.confetti(3500);
  if(shaderOn&&window.KaraokeShader)KaraokeShader.setMode('result');

  document.getElementById('singScreen').style.display='none';
  const r=document.getElementById('resultScreen');r.style.display='flex';
  r.innerHTML=`
    <div class="res-title">${curSong.warm?'목 풀기 끝!':practiceMode?'연습 완료!':'노래 완료!'}</div>
    ${noScore?`<div class="res-score" style="margin:18px 0;font-size:20px;color:rgba(255,255,255,.8)">마이크 없이 불렀어요 · 점수 없음</div>`:curSong.warm?`<div class="res-score" style="margin:18px 0">${totalN}개 중 ${hitN}개 맞았어요</div>`:`<div class="res-grade grade-${grade}">${grade}</div>
    <div class="res-score">${fs}점</div>
    <div class="res-stars">${'★'.repeat(stars)}${'☆'.repeat(5-stars)}</div>
    <details class="res-more"><summary>자세히 보기 ▾</summary>
    <div class="res-bars">
      <div class="res-bar-row"><div class="lbl">음정</div><div class="bar"><div class="bar-fill" style="width:${pitchAcc}%;background:linear-gradient(90deg,#ff6ab0,#a855f7)"></div></div><div class="val">${pitchAcc}%</div></div>
      <div class="res-bar-row"><div class="lbl">리듬</div><div class="bar"><div class="bar-fill" style="width:${rhythmAcc}%;background:linear-gradient(90deg,#4caf50,#2196f3)"></div></div><div class="val">${rhythmAcc}%</div></div>
    </div>
    <div class="res-detail">최대 콤보: ${maxCombo} · 히트율: ${totalN>0?Math.round(hitN/totalN*100):0}%</div></details>`}
    <div class="res-btns">
      <button class="btn-retry" id="rRetry">다시 부르기</button>
      ${recordedBlob?'<button class="btn-play" id="rPlay">내 노래 듣기</button>':''}
      ${noScore||curSong.warm?'':'<button class="btn-share" id="rShare">📷 사진 저장</button>'}
      <button class="btn-back" id="rBack">노래 고르기</button>
    </div>`;
  const rShareBtn=document.getElementById('rShare');
  if(rShareBtn)rShareBtn.onclick=()=>downloadShareCard();
  document.getElementById('rRetry').onclick=()=>pickSong(curSong,practiceMode);
  document.getElementById('rBack').onclick=()=>{
    gState='select';killSynth();
    if(window.KaraokeFX)KaraokeFX.cleanup();
    if(shaderOn&&window.KaraokeShader){KaraokeShader.destroy();shaderOn=false;}
    r.style.display='none';document.getElementById('singScreen').style.display='none';
    document.getElementById('songSelect').style.display='';renderList();
  };
  if(recordedBlob){
    document.getElementById('rPlay').onclick=()=>playRecording();
  }
}

function downloadShareCard(){
  const W=1080, H=1920; // 9:16 portrait, instagram story format
  const c = document.createElement('canvas'); c.width=W; c.height=H;
  const x = c.getContext('2d');

  // Background gradient
  const bg = x.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1a1040'); bg.addColorStop(0.5,'#2a1060'); bg.addColorStop(1,'#0a0818');
  x.fillStyle=bg; x.fillRect(0,0,W,H);

  // Glow circles for vibe
  for(let i=0;i<6;i++){
    const r = 200+Math.random()*300;
    const cx = Math.random()*W, cy = Math.random()*H;
    const g = x.createRadialGradient(cx,cy,0,cx,cy,r);
    const colors = ['rgba(255,106,176,.15)','rgba(168,85,247,.15)','rgba(255,215,0,.10)'];
    g.addColorStop(0, colors[i%3]); g.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=g; x.fillRect(0,0,W,H);
  }

  // Title
  x.fillStyle='#ff6ab0'; x.textAlign='center';
  x.font='bold 64px sans-serif'; x.fillText('🎤 노래방', W/2, 200);
  x.fillStyle='rgba(255,255,255,.6)'; x.font='32px sans-serif';
  x.fillText('나의 노래방 점수', W/2, 260);

  // Song title
  x.fillStyle='#fff'; x.font='bold 56px sans-serif';
  const songTitle = (curSong&&curSong.title)?curSong.title:'노래';
  x.fillText(songTitle, W/2, 380);

  // Grade letter (giant)
  const fs = totalN>0?Math.min(100,Math.round(score/Math.max(1,totalN))):0;
  const grade = getGrade(fs);
  const gColors = {S:'#ffd700', A:'#4caf50', B:'#2196f3', C:'#ff9800', D:'#f44336'};
  x.fillStyle = gColors[grade]||'#fff';
  x.font='900 480px sans-serif';
  x.shadowColor=gColors[grade]||'#fff'; x.shadowBlur=80;
  x.fillText(grade, W/2, 920);
  x.shadowBlur=0;

  // Score
  x.fillStyle='#ffd700'; x.font='900 240px sans-serif';
  x.fillText(fs+'점', W/2, 1180);

  // Stars
  const stars = getStars(fs);
  x.fillStyle='#ffd700'; x.font='100px sans-serif';
  x.fillText('★'.repeat(stars)+'☆'.repeat(5-stars), W/2, 1320);

  // Stats
  const pitchAcc=totalN>0?Math.round(pitchSum/totalN):0;
  const rhythmAcc=totalN>0?Math.round(rhythmSum/totalN):0;
  x.fillStyle='rgba(255,255,255,.85)'; x.font='44px sans-serif';
  x.fillText('음정 '+pitchAcc+'%   |   박자 '+rhythmAcc+'%', W/2, 1460);
  x.fillText('최고 콤보 '+(maxCombo||0), W/2, 1530);

  // Footer
  x.fillStyle='rgba(255,255,255,.4)'; x.font='32px sans-serif';
  const date = new Date().toLocaleDateString('ko-KR');
  x.fillText(date+' · 노래방', W/2, H-100);

  // Download
  c.toBlob(blob=>{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `노래방_${songTitle}_${grade}_${fs}점.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }, 'image/png', 0.95);
}

// ===================== CONTROLS =====================
// ⚙ 설정 칸: 켜짐/꺼짐 글자·키 숫자·음이름 선택을 지금 상태로 맞춤
function syncSettings(){
  const bm=document.getElementById('btnMic');if(bm){bm.textContent=micOn?'켜짐':'꺼짐';bm.classList.toggle('active',micOn);bm.setAttribute('aria-pressed',String(micOn));}
  const bg=document.getElementById('btnGuide');if(bg){bg.textContent=guideOn?'켜짐':'꺼짐';bg.classList.toggle('active',guideOn);bg.setAttribute('aria-pressed',String(guideOn));}
  const kv=document.getElementById('keyVal');if(kv)kv.textContent=(keyShift>0?'+':'')+keyShift;
  document.querySelectorAll('#noteLangSeg button').forEach(b=>{const on=b.dataset.nl===noteLang;b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));});
}
function closeSettings(){const p=document.getElementById('setPanel');if(p)p.hidden=true;const b=document.getElementById('btnSet');if(b)b.setAttribute('aria-expanded','false');}
document.getElementById('btnSet').onclick=e=>{
  e.stopPropagation();const p=document.getElementById('setPanel');
  if(p.hidden){syncSettings();p.hidden=false;document.getElementById('btnSet').setAttribute('aria-expanded','true');}else closeSettings();
};
document.addEventListener('click',e=>{const p=document.getElementById('setPanel');if(p&&!p.hidden&&!p.contains(e.target))closeSettings();});
document.querySelectorAll('#noteLangSeg button').forEach(b=>{b.onclick=()=>{noteLang=b.dataset.nl==='en'?'en':'ko';try{localStorage.setItem('sv4_note_lang',noteLang);}catch(e){}syncSettings();};});
document.getElementById('btnGuide').onclick=()=>{guideOn=!guideOn;document.getElementById('btnGuide').classList.toggle('active',guideOn);if(!guideOn)muteSynth();syncSettings();};
document.getElementById('btnPause').onclick=()=>{
  if(gState!=='singing')return;
  paused=!paused;
  document.getElementById('btnPause').textContent=paused?'▶':'⏸';
  if(paused){pauseT=performance.now();muteSynth();}
  else{pauseAccum+=performance.now()-pauseT;}
};
document.getElementById('btnStop').onclick=()=>{if(gState==='singing')endSong();};
function showKeyFb(){syncSettings();const fb=document.getElementById('lineFb');if(!fb)return;fb.textContent='키 '+(keyShift>0?'+':'')+keyShift;fb.style.color='#c084fc';lastLineFbTime=performance.now();}
document.getElementById('btnKeyUp').onclick=()=>{keyShift=Math.min(keyShift+1,6);showKeyFb();};
document.getElementById('btnKeyDn').onclick=()=>{keyShift=Math.max(keyShift-1,-6);showKeyFb();};
document.getElementById('btnMic').onclick=async()=>{if(micOn)stopMic();else await startMic();};
document.getElementById('btnHS').onclick=()=>{
  closeSettings();
  const m=document.getElementById('hsModal');m.classList.add('show');
  const hs=getHS();
  let html='<h3>최고 기록</h3>';
  SONGS.forEach(s=>{
    const rec=hs[s.id];
    html+=`<div class="hs-row"><span class="hs-name">${s.icon} ${s.title}</span>`;
    if(rec)html+=`<span><span class="hs-sc">${rec.s}점</span><span class="hs-gr grade-${rec.g}">${rec.g}</span></span>`;
    else html+=`<span class="hs-none">기록 없음</span>`;
    html+=`</div>`;
  });
  html+=`<div style="text-align:center;margin-top:14px"><button class="btn-back" onclick="document.getElementById('hsModal').classList.remove('show')">닫기</button></div>`;
  document.getElementById('hsBox').innerHTML=html;
};

// Resize
function resizeCanvases(){
  if(gState==='singing'){
    const dpr0=window.devicePixelRatio||1;
    const c=document.getElementById('pitchCanvas');c.width=c.parentElement.clientWidth*dpr0;c.height=c.parentElement.clientHeight*dpr0;
    const pc=document.getElementById('particleCanvas');pc.width=pc.parentElement.clientWidth*dpr0;pc.height=pc.parentElement.clientHeight*dpr0;
    if(shaderOn&&window.KaraokeShader)KaraokeShader.resize();
  }
}
window.addEventListener('resize',resizeCanvases);

// ===================== INIT =====================
renderList();syncSettings();

// v4: triple-tap on title toggles debug panel (hidden by default)
(function(){
  let taps=[],el=null;
  function setup(){
    el=document.querySelector('#header h1');
    if(!el){setTimeout(setup,100);return;}
    el.addEventListener('click',()=>{
      const now=Date.now();
      taps=taps.filter(t=>now-t<700);
      taps.push(now);
      if(taps.length>=3){
        window.__dbgOn=!window.__dbgOn;
        const p=document.getElementById('dbgPanel');
        if(p)p.style.display=window.__dbgOn?'block':'none';
        taps=[];
        console.log('[v4] debug panel:',window.__dbgOn?'ON':'OFF');
      }
    });
  }
  setup();
})();
</script>
