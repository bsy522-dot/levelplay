<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0a1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>노래방</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#555;border-radius:3px}
html,body{overscroll-behavior:none}
body{background:#0a0818;color:#eee;font-family:-apple-system,'Malgun Gothic','맑은 고딕',sans-serif;overflow:hidden;height:100vh;user-select:none}
#app{height:100vh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}

/* Header — 이름 하나 + 오른쪽 위 ⚙ 하나 (노래 중에만 멈춤·그만 버튼이 옆에 나옴) */
#header{background:linear-gradient(135deg,#1a1040,#2a1060);height:64px;padding:0 10px 0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #6a3aaa;flex-shrink:0;z-index:10}
#header h1{font-size:24px;color:#ff6ab0;text-shadow:0 0 20px rgba(255,106,176,.5)}
.hdr-btns{display:flex;gap:8px;align-items:center}
.hdr-btns button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;width:52px;height:52px;border-radius:50%;font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;transition:background .2s}
.hdr-btns button:hover,#btnSet[aria-expanded=true]{background:rgba(255,106,176,.3);border-color:#ff6ab0}
#singControls{display:none;gap:8px}
body.singing #singControls{display:flex}

/* ⚙ 설정 칸 — 마이크·따라 부를 멜로디·키·음이름·내 기록 */
#setPanel{position:fixed;top:72px;right:10px;width:min(380px,calc(100vw - 20px));max-height:calc(100vh - 84px);overflow-y:auto;background:linear-gradient(135deg,#1a1040,#2a1060);border:2px solid #6a3aaa;border-radius:16px;padding:4px 16px 16px;z-index:60;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#setPanel[hidden]{display:none}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:66px;border-bottom:1px solid rgba(255,255,255,.08);font-size:18px;color:#eee}
.set-row button{min-width:88px;min-height:48px;border-radius:24px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;font-size:18px;font-weight:700;padding:0 14px}
.set-row button.active,.seg button.on{background:linear-gradient(135deg,#d6337f,#8b3fd9);border-color:transparent}
.set-key{display:flex;align-items:center;gap:8px}
.set-key button{min-width:48px;width:48px;padding:0}
.set-key b{min-width:40px;text-align:center;font-size:20px}
.seg{display:flex;gap:6px}
.seg button{min-width:76px;padding:0 10px}
.set-wide{display:block;width:100%;margin-top:14px;min-height:52px;border-radius:26px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;font-size:18px;font-weight:700}

/* Song Select — 큰 그림 카드 4개 + '노래 더 보기' 한 곳 */
#songSelect{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.feat{display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:1fr 1fr auto;gap:16px;height:calc(100vh - 176px);min-height:300px;flex-shrink:0}
.song-card{background:linear-gradient(135deg,rgba(40,20,80,.85),rgba(60,30,100,.65));border:2px solid rgba(255,106,176,.18);border-radius:20px;cursor:pointer;transition:transform .2s,border-color .2s;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;text-align:center;touch-action:manipulation}
.song-card:hover{border-color:#ff6ab0;transform:translateY(-2px)}
.song-card:active{transform:scale(.97)}
.feat .song-card{container-type:size}
.feat .sc-icon{font-size:clamp(56px,13vmin,140px);font-size:min(40cqh,58cqw,180px);line-height:1.15}
.feat .sc-title{font-size:clamp(20px,3.4vmin,34px);font-size:clamp(20px,7cqw,36px);font-weight:800;color:#fff;line-height:1.25}
.sc-stars{color:#ffd700;font-size:clamp(18px,2.4vmin,26px);letter-spacing:2px;min-height:1.2em}
.sc-stars .off{color:rgba(255,215,0,.32)}
.diff-dot{position:absolute;top:12px;right:12px;width:18px;height:18px;border-radius:50%;box-shadow:0 0 0 3px rgba(0,0,0,.25)}
.diff-easy{background:#4caf50}.diff-medium{background:#ff9800}.diff-hard{background:#f44336}
.more-btn{flex-shrink:0;min-height:64px;border-radius:32px;border:2px solid rgba(168,85,247,.55);background:rgba(168,85,247,.16);color:#fff;font-size:20px;font-weight:700}
.more-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;flex-shrink:0}
.more-grid[hidden]{display:none}
.more-grid .song-card{flex-direction:row;justify-content:flex-start;min-height:96px;padding:12px 16px;text-align:left;gap:14px}
.more-grid .sc-icon{font-size:48px;flex-shrink:0;line-height:1}
.more-grid .sc-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.more-grid .sc-title{font-size:20px;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more-grid .sc-stars{font-size:18px}
/* 목 풀기 — 곡 카드 줄 맨 아래 가로 한 칸 (도레미 오르기·내리기·길게, 곡과 같은 채점) */
.warm-card{grid-column:1/-1;min-height:88px;display:flex;align-items:center;justify-content:center;gap:14px;border-radius:20px;border:2px solid rgba(95,208,104,.35);background:linear-gradient(135deg,rgba(20,70,60,.85),rgba(40,30,100,.65));color:#fff;font-size:clamp(24px,3.4vmin,32px);font-weight:800;touch-action:manipulation;transition:transform .2s,border-color .2s}
.warm-card:hover{border-color:#5fd068;transform:translateY(-2px)}
.warm-card:active{transform:scale(.97)}
.warm-card .wi{font-size:clamp(40px,6vmin,56px);line-height:1}
@media (orientation:landscape) and (max-height:520px){.feat{grid-template-columns:repeat(4,1fr);grid-template-rows:1fr auto}}

/* Sing Screen */
#singScreen{flex:1;display:none;flex-direction:column;position:relative}
#pitchArea{flex:1;position:relative;background:linear-gradient(180deg,#0a0818,#15102a);overflow:hidden}
#shaderCanvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
#pitchCanvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1}
#particleCanvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2}

/* Lyrics — 태블릿에선 멀리서도 보이게 크게 */
#lyricsArea{height:clamp(120px,20vh,210px);background:linear-gradient(180deg,rgba(30,15,60,.95),rgba(20,10,40,.98));border-top:2px solid #6a3aaa;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 16px;flex-shrink:0}
#lyricsArea .cur-lyric{font-size:clamp(26px,5.2vmin,52px);font-weight:900;color:#fff;text-align:center;text-shadow:0 0 20px rgba(255,106,176,.6);min-height:1.3em;display:flex;align-items:center;gap:2px;flex-wrap:wrap;justify-content:center}
#lyricsArea .cur-lyric .syl{transition:color .15s,transform .15s;display:inline-block}
#lyricsArea .cur-lyric .syl.sung{color:#ffd700;transform:scale(1.15)}
#lyricsArea .cur-lyric .syl.active{color:#ff6ab0;transform:scale(1.2)}
#lyricsArea .nxt-lyric{font-size:clamp(18px,2.8vmin,28px);color:rgba(255,255,255,.62);text-align:center;margin-top:6px;min-height:1.3em}
.lyric-prog{width:80%;max-width:600px;height:4px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:8px;overflow:hidden}
.lyric-prog-bar{height:100%;background:linear-gradient(90deg,#ff6ab0,#a855f7);border-radius:2px;transition:width .1s linear}

/* Score HUD */
#scoreHUD{position:absolute;top:8px;right:12px;text-align:right;z-index:5}
#scoreHUD .sv{font-size:clamp(32px,5vmin,52px);font-weight:900;color:#ffd700;text-shadow:0 0 12px rgba(255,215,0,.5)}
#scoreHUD .cv{font-size:18px;font-weight:700;color:#8f8}
#scoreHUD .pn{font-size:24px;color:#e6e0ff;margin-top:2px;min-height:28px}
#scoreHUD .pn small{font-size:16px;opacity:.8;margin-left:1px}
#scoreHUD .line-fb{font-size:22px;margin-top:4px;font-weight:800;min-height:28px}

/* Pitch Meter */
#pitchMeter{position:absolute;left:10px;top:8px;bottom:calc(clamp(120px,20vh,210px) + 8px);width:36px;background:rgba(255,255,255,.04);border-radius:6px;z-index:5;overflow:hidden}
#pitchMeter .mt{position:absolute;left:0;width:100%;height:20px;background:rgba(76,175,80,.25);border:2px solid #4caf50;border-radius:3px;transition:top .12s}
#pitchMeter .mu{position:absolute;left:0;width:100%;height:6px;background:#ff6ab0;border-radius:3px;transition:top .06s;box-shadow:0 0 8px rgba(255,106,176,.6)}

/* Timer */
#timerBar{position:absolute;top:0;left:0;right:0;height:3px;z-index:5}
#timerFill{height:100%;background:linear-gradient(90deg,#ff6ab0,#a855f7);transition:width .3s linear}

/* Result */
#resultScreen{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow-y:auto}
.res-title{font-size:26px;font-weight:900;color:#ff6ab0;margin-bottom:4px}
.res-grade{font-size:clamp(72px,14vmin,120px);font-weight:900;margin:4px 0;line-height:1.1}
.grade-S{color:#ffd700;text-shadow:0 0 40px rgba(255,215,0,.6)}.grade-A{color:#4caf50;text-shadow:0 0 30px rgba(76,175,80,.5)}
.grade-B{color:#2196f3}.grade-C{color:#ff9800}.grade-D{color:#f44336}
.res-score{font-size:48px;font-weight:900;color:#ffd700;text-shadow:0 0 20px rgba(255,215,0,.4)}
.res-stars{font-size:36px;margin:8px 0;color:#ffd700}
.res-more{margin:4px auto 0;width:min(320px,90%);color:#ddd}
.res-more summary{cursor:pointer;min-height:48px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#d8d0f0;list-style:none}
.res-more summary::-webkit-details-marker{display:none}
.res-detail{font-size:16px;color:#d0cce0;margin-bottom:6px;line-height:1.8}
.res-bars{width:100%;margin:6px auto}
.res-bar-row{display:flex;align-items:center;margin:6px 0;font-size:16px}
.res-bar-row .lbl{width:48px;text-align:right;margin-right:8px;color:#ddd}
.res-bar-row .bar{flex:1;height:12px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden}
.res-bar-row .bar-fill{height:100%;border-radius:6px;transition:width 1s}
.res-bar-row .val{width:52px;text-align:right;margin-left:6px;color:#fff;font-weight:700}
.res-btns{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;justify-content:center;align-items:center;max-width:560px}
.res-btns button{min-height:56px;padding:0 24px;border:none;border-radius:28px;font-size:18px;font-weight:700;transition:all .2s;white-space:nowrap}
.res-btns .btn-retry{flex-basis:100%;max-width:340px;min-height:88px;font-size:26px;border-radius:44px}
.btn-retry{background:linear-gradient(135deg,#d6337f,#8b3fd9);color:#fff}
.btn-back{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25)!important}
.btn-play{background:rgba(76,175,80,.3);color:#b6ffb6;border:1px solid rgba(76,175,80,.5)!important}
.btn-share{background:linear-gradient(135deg,#8b3fd9,#4f46e5);color:#fff}

/* Practice Modal (카드 길게 누르기) */
#practiceModal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:50;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#practiceModal.show{display:flex}
.pm-box{background:linear-gradient(135deg,#1a1040,#2a1060);border:2px solid #6a3aaa;border-radius:16px;padding:24px;max-width:420px;width:100%}
.pm-box h3{color:#ff6ab0;margin-bottom:12px;font-size:22px}
.pm-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;font-size:18px}
.pm-row label{color:#e6e0ff}
.pm-row input[type=range]{width:150px;height:32px;accent-color:#ff6ab0}
.pm-row select{background:#1a1040;color:#fff;border:1px solid #6a3aaa;border-radius:8px;padding:4px 10px;font-size:18px;min-height:48px}
.pm-row .val{color:#ff8ac4;font-weight:700;width:56px;text-align:right}
.pm-btns{display:flex;gap:10px;margin-top:18px;justify-content:center}
.pm-btns button{min-height:56px;padding:0 26px;border:none;border-radius:28px;font-size:18px;font-weight:700}

/* Mic Prompt — 큰 '마이크 켜기' 하나 */
#micPrompt{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.88);z-index:100;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#micPrompt.show{display:flex}
#micPrompt p{font-size:20px;color:#eee;margin-bottom:22px;text-align:center;line-height:1.5}
#micPrompt #btnAllowMic{min-height:104px;min-width:280px;padding:0 40px;display:flex;align-items:center;justify-content:center;gap:12px;background:linear-gradient(135deg,#d6337f,#8b3fd9);border:none;color:#fff;border-radius:52px;font-size:28px;font-weight:800;box-shadow:0 8px 30px rgba(255,106,176,.4)}
#micPrompt .mi{font-size:44px;line-height:1}
#micPrompt .skip-btn{background:transparent;color:#d4cdef;font-size:18px;margin-top:16px;border:none;text-decoration:underline;min-height:52px;padding:0 20px}

/* High Score Modal */
#hsModal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:70;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#hsModal.show{display:flex}
.hs-box{background:linear-gradient(135deg,#1a1040,#2a1060);border:2px solid #6a3aaa;border-radius:16px;padding:24px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto}
.hs-box h3{color:#ff6ab0;margin-bottom:12px;font-size:22px}
.hs-row{display:flex;justify-content:space-between;align-items:center;min-height:52px;border-bottom:1px solid rgba(255,255,255,.06);font-size:18px}
.hs-row .hs-name{color:#fff}.hs-row .hs-sc{color:#ffd700;font-weight:700}
.hs-row .hs-gr{font-weight:900;margin-left:6px}
.hs-row .hs-none{color:#aaa3c8}
.hs-box .btn-back{min-height:56px;padding:0 32px;border-radius:28px;font-size:18px;font-weight:700}
</style>
<style>
/* =====================================================================
   KaraokeFX - VFX Stylesheet (pure CSS, mobile-responsive)
   Pairs with vfx_effects.js (window.KaraokeFX)
   ===================================================================== */

/* ---------- Layer container ---------- */
.fx-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  overflow: hidden;
}

/* ---------- Confetti canvas ---------- */
.fx-confetti-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* =====================================================================
   Keyframes
   ===================================================================== */
@keyframes float-up-fade {
  0%   { transform: translate(-50%, 0) scale(0.6); opacity: 0; }
  20%  { transform: translate(-50%, -10px) scale(1.15); opacity: 1; }
  60%  { transform: translate(-50%, -32px) scale(1); opacity: 1; }
  100% { transform: translate(-50%, -64px) scale(0.9); opacity: 0; }
}

@keyframes ring-pulse {
  0%   { transform: translate(-50%, -50%) scale(0.4); opacity: 0.9; }
  60%  { opacity: 0.6; }
  100% { transform: translate(-50%, -50%) scale(var(--combo-scale, 2)); opacity: 0; }
}

@keyframes syllable-bounce {
  0%   { transform: translateY(0) scale(1); }
  35%  { transform: translateY(-18%) scale(1.18); }
  70%  { transform: translateY(0) scale(1.04); }
  100% { transform: translateY(0) scale(1); }
}

@keyframes screen-flash {
  0%   { opacity: 0; }
  30%  { opacity: 0.45; }
  100% { opacity: 0; }
}

@keyframes perfect-glow {
  0%   { filter: drop-shadow(0 0 0 #fff8); transform: rotate(0deg) scale(0.6); }
  35%  { filter: drop-shadow(0 0 18px #FFD93D); transform: rotate(45deg) scale(1.2); }
  100% { filter: drop-shadow(0 0 8px #FFD93D); transform: rotate(90deg) scale(1); }
}

@keyframes burst-out {
  0%   { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
  30%  { opacity: 1; }
  100% { transform: translate(calc(-50% + var(--tx, 0px)), calc(-50% + var(--ty, 0px))) scale(0.4); opacity: 0; }
}

@keyframes pop-in {
  0%   { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
  50%  { transform: translate(-50%, -50%) scale(1.18); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

@keyframes fade-icon {
  0%   { opacity: 1; }
  70%  { opacity: 1; }
  100% { opacity: 0; }
}

/* =====================================================================
   Judgment burst container
   ===================================================================== */
.fx-judge {
  position: absolute;
  width: clamp(80px, 14vw, 140px);
  height: clamp(80px, 14vw, 140px);
  pointer-events: none;
  transform: translate(-50%, -50%);
}

.fx-judge svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  animation: pop-in 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both,
             fade-icon 0.85s ease-out both;
}

.fx-judge-text {
  position: absolute;
  left: 50%;
  top: 100%;
  transform: translate(-50%, 0);
  font-weight: 900;
  font-size: clamp(18px, 3.6vw, 32px);
  letter-spacing: 1px;
  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6), 0 0 12px currentColor;
  animation: float-up-fade 0.85s ease-out both;
  white-space: nowrap;
}

/* Variant tints */
.fx-judge-perfect svg { animation: perfect-glow 0.6s ease-out both, fade-icon 0.85s ease-out both; }
.fx-judge-perfect .fx-judge-text { font-size: clamp(22px, 4.4vw, 40px); }
.fx-judge-great   svg { filter: drop-shadow(0 0 8px #6BCB77aa); }
.fx-judge-good    svg { filter: drop-shadow(0 0 6px #4D96FFaa); }
.fx-judge-miss    svg { filter: drop-shadow(0 0 4px #FF6B6Baa); opacity: 0.85; }
.fx-judge-miss    .fx-judge-text { font-size: clamp(16px, 3vw, 26px); opacity: 0.9; }

/* =====================================================================
   Particle ring (judge bursts)
   ===================================================================== */
.fx-particle {
  position: absolute;
  width: clamp(6px, 1vw, 10px);
  height: clamp(6px, 1vw, 10px);
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%, -50%);
  animation: burst-out 0.75s cubic-bezier(0.16, 1, 0.3, 1) both;
  box-shadow: 0 0 8px currentColor;
}

/* =====================================================================
   Screen flash (PERFECT)
   ===================================================================== */
.fx-screen-flash {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle, #FFD93D88 0%, transparent 70%);
  animation: screen-flash 0.18s ease-out both;
  pointer-events: none;
}

/* =====================================================================
   Combo pulse ring
   ===================================================================== */
.fx-combo-ring {
  position: absolute;
  left: 50%;
  top: 50%;
  width: clamp(80px, 12vw, 140px);
  height: clamp(80px, 12vw, 140px);
  border-radius: 50%;
  border: 4px solid #FFD93D;
  pointer-events: none;
  transform: translate(-50%, -50%);
  animation: ring-pulse 0.8s ease-out both;
  box-shadow: 0 0 16px #FFD93D88, inset 0 0 16px #FFD93D44;
}

.fx-combo-lo  { border-color: #4D96FF; box-shadow: 0 0 14px #4D96FF99, inset 0 0 14px #4D96FF44; }
.fx-combo-mid { border-color: #6BCB77; box-shadow: 0 0 18px #6BCB77aa, inset 0 0 18px #6BCB7755; }
.fx-combo-hi  { border-color: #FFD93D; border-width: 6px; box-shadow: 0 0 32px #FFD93D, inset 0 0 24px #FFD93Daa; }

/* =====================================================================
   Lyrics syllable bounce
   ===================================================================== */
.fx-syllable-bounce {
  display: inline-block;
  animation: syllable-bounce 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  transform-origin: 50% 100%;
  color: #FFD93D;
  text-shadow: 0 2px 8px #FFD93D88, 0 0 4px #fff;
}

/* =====================================================================
   Reduced motion fallback
   ===================================================================== */
@media (prefers-reduced-motion: reduce) {
  .fx-judge svg,
  .fx-judge-text,
  .fx-particle,
  .fx-combo-ring,
  .fx-syllable-bounce,
  .fx-screen-flash {
    animation-duration: 0.1s !important;
    animation-iteration-count: 1 !important;

<script>
/* KaraokeAudio v4 — robust pitch engine
 * Replaces the naive autocorrelation in noraebang-v3.html (lines 448-465).
 * Implements McLeod Pitch Method (NSDF) inline + octave correction + median filter
 * + per-note scoring + user-range estimation. Pure vanilla browser. No imports.
 */
(function (global) {
  'use strict';

  // ---------- Internal state ----------
  var ctx = null;          // AudioContext
  var ana = null;          // AnalyserNode
  var BUF = 4096;
  var buf = null;          // Float32Array time-domain
  var freqBuf = null;      // Float32Array freq-domain (dB)

  // 4x 데시메이션(48k→12k): 4096샘플=85ms 창 — 저음 남성(90~150Hz)도 8주기+ 확보, NSDF 연산량 1/16
  var DECIM = 4;
  var dbuf = null;
  // 검출 스로틀(25ms≈40Hz) — rAF마다 전체 NSDF를 돌리면 모바일 CPU 낭비
  var lastRunT = 0;
  // 5-tap median window
  var medianWin = [];

  // Per-note accumulators
  var note = null;         // {target, id, voiced, total, centsSum, framesAbs}

  // Range estimation (first 5 sec)
  var rangeStartT = 0;
  var rangeFreqs = [];
  var rangeDoneAt = 0;     // performance.now() when 5 s done

  // Last spectral metrics
  var lastRMS = 0;
  var lastCentroid = 0;
  var lastFlatness = 0;

  // Last pitch detection result (for debug panel)
  var _lastDetection = null;

  // ---------- Init ----------
  function init(audioCtx, analyserNode, bufSize) {
    ctx = audioCtx;
    ana = analyserNode;
    BUF = bufSize || 4096;
    buf = new Float32Array(BUF);
    dbuf = new Float32Array(Math.floor(BUF / DECIM));
    freqBuf = new Float32Array(ana ? ana.frequencyBinCount : BUF / 2);
    resetSession();
  }

  function resetSession() {
    medianWin = [];
    note = null;
    lastRunT = 0;
    rangeStartT = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    rangeDoneAt = 0;
    rangeFreqs = [];
  }

  // ---------- McLeod Pitch Method (NSDF) ----------
  // NSDF[t] = 2 * sum_{j}(x[j]*x[j+t]) / sum_{j}(x[j]^2 + x[j+t]^2)
  // Range [-1,1]. Peaks => period candidates. Avoids amplitude bias.
  function nsdf(x) {
    var n = x.length;
    var half = n >> 1; // only first half of lags is reliable
    var out = new Float32Array(half);
    // Brute-force time-domain (BUF=2048 -> ~2M ops, fine for per-frame).
    for (var t = 0; t < half; t++) {
      var ac = 0, m = 0;
      for (var j = 0; j < n - t; j++) {
        var a = x[j], b = x[j + t];
        ac += a * b;
        m += a * a + b * b;
      }
      out[t] = m > 0 ? (2 * ac) / m : 0;
    }
    return out;
  }

  // Pick highest peak after first positive zero crossing, threshold-relative.
  function pickPeak(ns, minLag, maxLag) {
    // MPM: globalMax*0.85 임계를 넘는 '첫' key-maximum 선택 (전역최대 아님).
    // 전역최대를 잡으면 2*T0 하모닉이 이겨 음정이 한 옥타브 아래로 검출됨(옥타브 점프 버그).
    var n = Math.min(ns.length, (maxLag | 0) || ns.length);
    var maxima = [];
    var i = Math.max(1, minLag | 0);
    while (i < n - 1 && ns[i] > 0) i++;
    while (i < n - 1) {
      if (ns[i] > 0) {
        var mIdx = i, mVal = ns[i];
        while (i < n - 1 && ns[i] > 0) { if (ns[i] > mVal) { mVal = ns[i]; mIdx = i; } i++; }
        maxima.push(mIdx);
      } else i++;
    }
    if (!maxima.length) return -1;
    var gMax = 0;
    for (var k = 0; k < maxima.length; k++) if (ns[maxima[k]] > gMax) gMax = ns[maxima[k]];
    var thresh = gMax * 0.85;
    for (var k2 = 0; k2 < maxima.length; k2++) if (ns[maxima[k2]] >= thresh) return maxima[k2];
    return maxima[0];
  }

  // Parabolic interpolation around index k of array a — sub-sample peak.
  // x* = k + 0.5*(a[k-1]-a[k+1]) / (a[k-1]-2a[k]+a[k+1])
  function parabolic(a, k) {
    if (k <= 0 || k >= a.length - 1) return { x: k, y: a[k] };
    var l = a[k - 1], c = a[k], r = a[k + 1];
    var denom = (l - 2 * c + r);
    var dx = denom !== 0 ? 0.5 * (l - r) / denom : 0;
    if (!isFinite(dx) || dx > 1 || dx < -1) dx = 0;
    var y = c - 0.25 * (l - r) * dx;
    return { x: k + dx, y: y };
  }

  // ---------- Spectral helpers ----------
  function computeRMS(x) {
    var s = 0;
    for (var i = 0; i < x.length; i++) s += x[i] * x[i];
    return Math.sqrt(s / x.length);
  }

  // Spectral flatness = geo-mean / arith-mean of magnitude bins. ~1 = noise, ~0 = tonal.
  function computeFlatnessAndCentroid() {
    if (!ana || !freqBuf) return { flat: 0, cent: 0 };
    ana.getFloatFrequencyData(freqBuf); // dB
    var n = freqBuf.length;
    var mags = new Float32Array(n);
    var sumMag = 0, logSum = 0, valid = 0;
    var sr = ctx ? ctx.sampleRate : 44100;
    var binHz = sr / 2 / n;
    var weighted = 0;
    for (var i = 1; i < n; i++) { // skip DC
      var db = freqBuf[i];
      if (db < -120) db = -120;
      var lin = Math.pow(10, db / 20);
      mags[i] = lin;
      sumMag += lin;
      weighted += lin * (i * binHz);
      if (lin > 1e-10) { logSum += Math.log(lin); valid++; }
    }
    var flat = 0;
    if (valid > 0 && sumMag > 0) {
      var geo = Math.exp(logSum / valid);
      var arith = sumMag / (n - 1);
      flat = arith > 0 ? geo / arith : 0;
    }
    var cent = sumMag > 0 ? weighted / sumMag : 0;
    return { flat: flat, cent: cent };
  }

  // ---------- 5-tap median ----------
  function medianFilter(f) {
    medianWin.push(f);
    if (medianWin.length > 5) medianWin.shift();
    var sorted = medianWin.slice().sort(function (a, b) { return a - b; });
    return sorted[Math.floor(sorted.length / 2)];
  }

  // ---------- Public: detectPitch ----------
  function detectPitch() {
    if (!ctx || !ana || !buf) { _lastDetection = null; return null; }
    var now = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    if (now - lastRunT < 25) return _lastDetection; // 40Hz면 채점에 충분
    lastRunT = now;

    ana.getFloatTimeDomainData(buf);

    // Spectral diagnostics (always update; cheap-ish)
    var sm = computeFlatnessAndCentroid();
    lastFlatness = sm.flat;
    lastCentroid = sm.cent;

    var rms = computeRMS(buf);
    lastRMS = rms;

    if (note) note.total++; // 무성 프레임도 분모에 포함해야 hit 비율이 의미 있음

    // Voicing gate — AGC 꺼진 모바일 원시 레벨 기준(0.018은 실기기에서 과엄격)
    var voiced = (rms > 0.006) && (sm.flat < 0.6);
    if (!voiced) { _lastDetection = null; return null; }

    // 4x 데시메이션(4탭 평균 — 음성 기본주파수 대역 보존)
    var dn = dbuf.length;
    for (var di = 0; di < dn; di++) {
      var b4 = di * DECIM;
      dbuf[di] = (buf[b4] + buf[b4 + 1] + buf[b4 + 2] + buf[b4 + 3]) * 0.25;
    }
    var sr4 = ctx.sampleRate / DECIM;

    // NSDF
    var ns = nsdf(dbuf);
    var minLag = Math.floor(sr4 / 1050);
    var maxLag = Math.ceil(sr4 / 65);
    var k = pickPeak(ns, minLag, maxLag);
    if (k < 2) { _lastDetection = null; return null; }
    var clarity = ns[k];
    if (clarity < 0.80) { _lastDetection = { freq: 0, clarity: clarity, voiced: false }; return null; }

    // sub-sample peak
    var refined = parabolic(ns, k);
    var lag = refined.x;
    if (lag <= 0) { _lastDetection = null; return null; }
    var freq = sr4 / lag;
    if (freq < 65 || freq > 1050) { _lastDetection = null; return null; }

    // Median filter
    var fm = medianFilter(freq);

    // Range estimation (first 5 s)
    if (rangeDoneAt === 0) {
      if (now - rangeStartT <= 5000) {
        rangeFreqs.push(fm);
      } else {
        rangeDoneAt = now;
      }
    }

    // Per-note accumulation — 옥타브 무관(±600센트 접기), 노트 초입 그레이스 제외
    if (note && note.target && (now - note.tStart) >= note.graceMs) {
      var cents = 1200 * Math.log2(fm / note.target);
      var fold = ((cents % 1200) + 1800) % 1200 - 600;
      note.voiced++;
      note.folds.push(fold);
      note.centsSum += cents;
      note.framesAbs += Math.abs(fold);
    }

    var _out = { freq: fm, clarity: clarity, voiced: true };
    _lastDetection = _out;
    return _out;
  }

  // ---------- Per-note scoring ----------
  function startNote(targetFreq, noteId, durSec) {
    var now = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    note = {
      target: targetFreq,
      id: noteId,
      voiced: 0,
      total: 0,
      centsSum: 0,
      framesAbs: 0,
      folds: [],
      tStart: now,
      // 노트 초입은 음을 찾아가는 구간 — 노트 길이의 25%, 최대 150ms 채점 제외
      graceMs: Math.min(150, (durSec || 0.5) * 250)
    };
  }

  function endNote() {
    if (!note) return { avgCents: 0, medCents: 9999, hitFrames: 0, totalFrames: 0, grade: 'MISS' };
    var folds = note.folds;
    var grade, med = 9999;
    if (folds.length < 2) grade = 'MISS';
    else {
      // 접힌 |센트| 중앙값 — 평균은 +/-가 상쇄돼 엉뚱한 PERFECT가 나옴
      var absSorted = folds.map(function (c) { return Math.abs(c); }).sort(function (a, b) { return a - b; });
      med = absSorted[Math.floor(absSorted.length / 2)];
      // 벤치마크 정렬: Performous=1반음 내 만점, SingStar easy=±2.5반음, UltraStar=±1반음
      if (med < 40) grade = 'PERFECT';
      else if (med < 80) grade = 'GREAT';
      else if (med < 150) grade = 'GOOD';
      else grade = 'MISS';
    }
    var result = {
      avgCents: note.voiced > 0 ? (note.centsSum / note.voiced) : 9999,
      medCents: med,
      hitFrames: note.voiced,
      totalFrames: note.total,
      grade: grade
    };
    note = null;
    return result;
  }

  // ---------- User range estimation ----------
  function estimateUserRange() {
    if (rangeFreqs.length < 5) {
      return { meanFreq: 0, suggestedKeyShift: 0 };
    }
    var s = 0;
    for (var i = 0; i < rangeFreqs.length; i++) s += Math.log(rangeFreqs[i]);
    var meanFreq = Math.exp(s / rangeFreqs.length);
    // Compare to A3 (220 Hz) as comfortable mid-vocal anchor.
    var anchor = 220;
    var semis = 12 * Math.log2(meanFreq / anchor);
    var candidates = [-5, -3, -2, 0, 2, 3, 5];
    var best = 0, bd = 1e9;
    for (var j = 0; j < candidates.length; j++) {
      // shift positive => raise melody, so suggested = -round(deltaSemis) approx
      var d = Math.abs(candidates[j] - (-semis));
      if (d < bd) { bd = d; best = candidates[j]; }
    }
    return { meanFreq: meanFreq, suggestedKeyShift: best };
  }

  // ---------- Misc getters ----------
  function getRMS() { return lastRMS; }
  function getSpectralCentroid() { return lastCentroid; }

  // ---------- Export ----------
  global.KaraokeAudio = {
    init: init,
    detectPitch: detectPitch,
    resetSession: resetSession,
    startNote: startNote,
    endNote: endNote,
    estimateUserRange: estimateUserRange,
    getRMS: getRMS,
    getSpectralCentroid: getSpectralCentroid,
    getLastDetection: function () { return _lastDetection; }
  };

})(typeof window !== 'undefined' ? window : this);
</script>

<script>
/* KaraokeShader v4 — WebGL2 fluid k-pop background
 * Domain-warped fbm, audio-reactive, neon purple/pink/gold palette.
 * API: window.KaraokeShader.{init,resize,setAudio,setCombo,setMode,render,destroy}
 */
(function () {
  'use strict';

  const VERT_SRC = `#version 300 es
  precision highp float;
  // Full-screen triangle pair generated from gl_VertexID — no VBO needed.
  out vec2 vUV;
  void main() {
    vec2 p = vec2((gl_VertexID & 1) * 2 - 1, (gl_VertexID & 2) - 1);
    vUV = p * 0.5 + 0.5;
    gl_Position = vec4(p, 0.0, 1.0);
  }`;

  const FRAG_SRC = `#version 300 es
  precision highp float;

  in vec2 vUV;
  out vec4 fragColor;

  uniform vec2  uResolution;
  uniform float uTime;
  uniform float uRMS;        // 0..1 audio loudness
  uniform float uCentroid;   // 0..1 spectral centroid (brightness)
  uniform float uBeat;       // 0..1 beat envelope
  uniform float uCombo;      // 0..1 normalized combo intensity
  uniform int   uMode;       // 0 idle, 1 singing, 2 perfect, 3 result
  uniform float uPerfectStart; // time at which perfect flash began (negative = none)

  // Theme colors (sRGB-ish):
  const vec3 PURPLE = vec3(0.659, 0.333, 0.969); // #a855f7
  const vec3 PINK   = vec3(1.000, 0.416, 0.690); // #ff6ab0
  const vec3 GOLD   = vec3(1.000, 0.843, 0.000); // #ffd700

  // ---- Hash / noise primitives ----
  // 2D hash → float (cheap, no texture lookup)
  float hash21(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
  }

  // Smooth value noise
  float vnoise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    float a = hash21(i);
    float b = hash21(i + vec2(1.0, 0.0));
    float c = hash21(i + vec2(0.0, 1.0));
    float d = hash21(i + vec2(1.0, 1.0));
    vec2 u = f * f * (3.0 - 2.0 * f); // smoothstep
    return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
  }

  // 3-octave fbm — cheap, mobile-friendly
  float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.5;
    mat2 R = mat2(0.8, -0.6, 0.6, 0.8); // rotate to break grid alignment
    for (int i = 0; i < 3; i++) {
      v += a * vnoise(p);
      p = R * p * 2.03 + 11.7;
      a *= 0.5;
    }
    return v;
  }

  // Domain-warped fbm: feeds noise into noise → fluid curtains.
  float warpedFbm(vec2 p, float t, float warpAmt) {
    vec2 q = vec2(fbm(p + vec2(0.0, t * 0.20)),
                  fbm(p + vec2(5.2, 1.3) + t * 0.17));
    vec2 r = vec2(fbm(p + warpAmt * q + vec2(1.7, 9.2) + t * 0.15),
                  fbm(p + warpAmt * q + vec2(8.3, 2.8) + t * 0.13));
    return fbm(p + warpAmt * r);
  }

  // Tri-color blend across a 0..1 axis (purple→pink→gold).
  vec3 palette(float x) {
    x = clamp(x, 0.0, 1.0);
    vec3 c = mix(PURPLE, PINK, smoothstep(0.0, 0.55, x));
    c = mix(c, GOLD, smoothstep(0.55, 1.0, x));
    return c;
  }

  // Bayer-style hash dither, breaks 8-bit banding.
  float dither(vec2 frag) {
    return (hash21(frag) - 0.5) / 255.0;
  }

  void main() {
    vec2 uv = vUV;
    vec2 p = (uv * 2.0 - 1.0);
    p.x *= uResolution.x / uResolution.y; // aspect-correct

    float t = uTime;

    // Speed and warp scale grow with combo + audio.
    float speed = 0.35 + 0.85 * uCombo + 0.55 * uRMS;
    float warpAmt = 1.4 + 1.6 * uCombo + 0.6 * uRMS;

    // Slow drift so the field never sits still even when silent.
    vec2 base = p * (1.05 + 0.25 * sin(t * 0.07));
    base += 0.15 * vec2(sin(t * 0.11), cos(t * 0.09));

    float n = warpedFbm(base * 1.4, t * speed, warpAmt);

    // Color axis modulated by another low-freq fbm — keeps zones moving.
    float zone = fbm(base * 0.6 + vec2(0.0, t * 0.05));
    float axis = clamp(n * 0.7 + zone * 0.45 + uCentroid * 0.25, 0.0, 1.0);

    vec3 col = palette(axis);

    // Soft vertical curtain falloff — concert spotlight feel.
    float curtain = smoothstep(0.0, 0.85, 0.85 - abs(uv.y - 0.5) * 0.9);
    col *= 0.55 + 0.55 * curtain;

    // RMS pulses brightness; centroid biases warmer.
    float pulse = 1.0 + 0.55 * uRMS + 0.18 * sin(t * 6.2 + uRMS * 8.0);
    col *= pulse;
    col = mix(col, col * vec3(1.05, 0.98, 0.85), uCentroid * 0.4);

    // Combo saturates (push away from gray).
    float lum = dot(col, vec3(0.299, 0.587, 0.114));
    col = mix(vec3(lum), col, 0.85 + 0.6 * uCombo);

    // Beat: brief radial flash from center, white-warm.
    float r = length(p);
    float beatRing = exp(-pow(r * (3.0 - 1.5 * uBeat), 2.0)) * uBeat;
    col += beatRing * vec3(1.2, 1.0, 0.85) * 0.85;

    // Singing mode: soft golden rim glow on edges.
    if (uMode == 1) {
      float rim = smoothstep(0.7, 1.4, r);
      col += rim * GOLD * 0.18 * (0.5 + 0.5 * uRMS);
    }

    // Perfect mode: full-screen golden flash decaying over ~0.3s.
    if (uMode == 2 && uPerfectStart >= 0.0) {
      float dt = max(0.0, uTime - uPerfectStart);
      float k = exp(-dt / 0.10) * smoothstep(0.30, 0.0, dt);
      col = mix(col, GOLD * 1.6, clamp(k, 0.0, 1.0));
    }

    // Result mode: gentle bloom-ish lift, less motion noise visible.
    if (uMode == 3) {
      col = col * 0.85 + GOLD * 0.07;
    }

    // Vignette to focus on lyrics center.
    float vig = smoothstep(1.55, 0.35, r);
    col *= mix(0.65, 1.0, vig);

    // Tone curve + dither.
    col = col / (col + 0.85);            // Reinhard-ish
    col = pow(col, vec3(0.92));          // mild gamma lift
    col += dither(gl_FragCoord.xy);

    fragColor = vec4(col, 1.0);
  }`;

  const state = {
    canvas: null,
    gl: null,
    program: null,
    vao: null,
    uniforms: {},
    dpr: 1,
    width: 0,
    height: 0,
    rms: 0,
    centroid: 0.5,
    beat: 0,
    combo: 0,
    mode: 0,
    perfectStart: -1,
    lastBeatPulse: 0,
    startTime: 0,
    ready: false,
  };

  function compile(gl, type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(sh);
      gl.deleteShader(sh);
      console.warn('[KaraokeShader] shader compile failed:', log);
      return null;
    }
    return sh;
  }

  function link(gl, vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, vs);
    gl.attachShader(p, fs);
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      console.warn('[KaraokeShader] link failed:', gl.getProgramInfoLog(p));
      gl.deleteProgram(p);
      return null;
    }
    return p;
  }

  function init(canvasElement) {
    if (!canvasElement) return false;
    // 재시도(다시 부르기)로 재init될 때 이전 program/vao 해제 — 없으면 GPU 자원 누적 누수
    if (state.gl && state.program) { try { state.gl.deleteProgram(state.program); if (state.vao) state.gl.deleteVertexArray(state.vao); } catch (e) {} }
    const gl = canvasElement.getContext('webgl2', {
      alpha: false,
      antialias: false,
      depth: false,
      stencil: false,
      premultipliedAlpha: false,
      preserveDrawingBuffer: false,
      powerPreference: 'high-performance',
    });
    if (!gl) return false;

    const vs = compile(gl, gl.VERTEX_SHADER, VERT_SRC);
    const fs = compile(gl, gl.FRAGMENT_SHADER, FRAG_SRC);
    if (!vs || !fs) return false;
    const program = link(gl, vs, fs);
    gl.deleteShader(vs);
    gl.deleteShader(fs);
    if (!program) return false;

    // Empty VAO — vertex positions are computed from gl_VertexID.
    const vao = gl.createVertexArray();

    state.canvas = canvasElement;
    state.gl = gl;
    state.program = program;
    state.vao = vao;
    state.uniforms = {
      uResolution: gl.getUniformLocation(program, 'uResolution'),
      uTime: gl.getUniformLocation(program, 'uTime'),
      uRMS: gl.getUniformLocation(program, 'uRMS'),
      uCentroid: gl.getUniformLocation(program, 'uCentroid'),
      uBeat: gl.getUniformLocation(program, 'uBeat'),
      uCombo: gl.getUniformLocation(program, 'uCombo'),
      uMode: gl.getUniformLocation(program, 'uMode'),
      uPerfectStart: gl.getUniformLocation(program, 'uPerfectStart'),
    };
    state.startTime = performance.now() / 1000;
    state.ready = true;

    resize();
    return true;
  }

  function resize() {
    if (!state.canvas || !state.gl) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cssW = state.canvas.clientWidth || window.innerWidth;
    const cssH = state.canvas.clientHeight || window.innerHeight;
    const w = Math.max(1, Math.floor(cssW * dpr));
    const h = Math.max(1, Math.floor(cssH * dpr));
    if (state.width !== w || state.height !== h) {
      state.canvas.width = w;
      state.canvas.height = h;
      state.width = w;
      state.height = h;
    }
    state.dpr = dpr;
    state.gl.viewport(0, 0, w, h);
  }

  function setAudio(rms, centroid, beat) {
    if (typeof rms === 'number') state.rms = Math.min(1, Math.max(0, rms));
    if (typeof centroid === 'number') state.centroid = Math.min(1, Math.max(0, centroid));
    if (typeof beat === 'number') {
      const b = Math.min(1, Math.max(0, beat));
      // Keep peak briefly so a single-frame beat still flashes visibly.
      state.beat = Math.max(state.beat * 0.86, b);
    }
  }

  function setCombo(comboLevel) {
    const c = typeof comboLevel === 'number' ? comboLevel : 0;
    // Map 0..30+ → 0..1 with soft knee so long combos saturate gracefully.
    state.combo = Math.min(1, c / 30);
  }

  function setMode(mode) {
    const map = { idle: 0, singing: 1, perfect: 2, result: 3 };
    const m = typeof mode === 'string' ? (map[mode] ?? 0) : (mode | 0);
    if (m === 2 && state.mode !== 2) {
      state.perfectStart = (performance.now() / 1000) - state.startTime;
    }
    state.mode = m;
  }

  function render(time) {
    if (!state.ready) return;
    const gl = state.gl;
    // Decay beat envelope each frame so flashes don't stick.
    state.beat *= 0.90;
    if (state.beat < 0.002) state.beat = 0;

    const t = (typeof time === 'number')
      ? (time / 1000) - state.startTime
      : (performance.now() / 1000) - state.startTime;

    gl.useProgram(state.program);
    gl.bindVertexArray(state.vao);

    gl.uniform2f(state.uniforms.uResolution, state.width, state.height);
    gl.uniform1f(state.uniforms.uTime, t);
    gl.uniform1f(state.uniforms.uRMS, state.rms);
    gl.uniform1f(state.uniforms.uCentroid, state.centroid);
    gl.uniform1f(state.uniforms.uBeat, state.beat);
    gl.uniform1f(state.uniforms.uCombo, state.combo);
    gl.uniform1i(state.uniforms.uMode, state.mode);
    gl.uniform1f(state.uniforms.uPerfectStart, state.perfectStart);

    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  function destroy() {
    const gl = state.gl;
    if (gl) {
      if (state.program) gl.deleteProgram(state.program);
      if (state.vao) gl.deleteVertexArray(state.vao);
      // loseContext는 같은 canvas 재사용(곡선택→재입장)까지 죽이므로 호출하지 않음 — 자원 해제만
    }
    state.canvas = null;
    state.gl = null;
    state.program = null;
    state.vao = null;
    state.uniforms = {};
    state.ready = false;
    state.beat = 0;
    state.rms = 0;
    state.combo = 0;
    state.mode = 0;
    state.perfectStart = -1;
  }

  if (typeof window !== 'undefined') {
    window.KaraokeShader = { init, resize, setAudio, setCombo, setMode, render, destroy };
  }
})();
</script>

<script>
/**
 * KaraokeFX - VFX module for karaoke app v4
 * Pure vanilla JS + Canvas 2D, no external dependencies.
 * Provides judgment bursts, combo rings, lyrics tick, confetti, stage light.
 */
(function (global) {
  'use strict';

  const SVG_NS = 'http://www.w3.org/2000/svg';

  const PALETTE = {
    PERFECT: '#FFD93D',
    GREAT: '#6BCB77',
    GOOD: '#4D96FF',
    MISS: '#FF6B6B'
  };

  const CONFETTI_COLORS = ['#FF6B6B', '#FFD93D', '#6BCB77', '#4D96FF', '#B084FF', '#FF9F45'];

  let state = {
    root: null,
    layer: null,
    canvas: null,
    ctx: null,
    confettiActive: false,
    confettiRAF: 0,
    confettiParticles: [],
    confettiEnd: 0,
    resizeHandler: null
  };

  function createEl(tag, cls, parent) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (parent) parent.appendChild(el);
    return el;
  }

  function createSVG(viewBox) {
    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', viewBox);
    svg.setAttribute('xmlns', SVG_NS);
    return svg;
  }

  function buildStarSVG(color) {
    const svg = createSVG('0 0 100 100');
    svg.setAttribute('class', 'fx-star-svg');
    const pts = [];
    for (let i = 0; i < 16; i++) {
      const angle = (Math.PI * 2 * i) / 16 - Math.PI / 2;
      const r = i % 2 === 0 ? 48 : 20;
      pts.push((50 + Math.cos(angle) * r).toFixed(1) + ',' + (50 + Math.sin(angle) * r).toFixed(1));
    }
    const poly = document.createElementNS(SVG_NS, 'polygon');
    poly.setAttribute('points', pts.join(' '));
    poly.setAttribute('fill', color);
    poly.setAttribute('stroke', '#fff');
    poly.setAttribute('stroke-width', '2');
    svg.appendChild(poly);
    return svg;
  }

  function buildCheckSVG(color) {
    const svg = createSVG('0 0 100 100');
    svg.setAttribute('class', 'fx-check-svg');
    const path = document.createElementNS(SVG_NS, 'path');
    path.setAttribute('d', 'M 20 50 L 42 72 L 80 28');
    path.setAttribute('stroke', color);
    path.setAttribute('stroke-width', '10');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-linejoin', 'round');
    path.setAttribute('fill', 'none');
    svg.appendChild(path);
    return svg;
  }

  function buildCircleSVG(color) {
    const svg = createSVG('0 0 100 100');
    svg.setAttribute('class', 'fx-circle-svg');
    const c = document.createElementNS(SVG_NS, 'circle');
    c.setAttribute('cx', '50');
    c.setAttribute('cy', '50');
    c.setAttribute('r', '34');
    c.setAttribute('stroke', color);
    c.setAttribute('stroke-width', '8');
    c.setAttribute('fill', 'none');
    svg.appendChild(c);
    return svg;
  }

  function buildXSVG(color) {
    const svg = createSVG('0 0 100 100');
    svg.setAttribute('class', 'fx-x-svg');
    const p = document.createElementNS(SVG_NS, 'path');
    p.setAttribute('d', 'M 28 28 L 72 72 M 72 28 L 28 72');
    p.setAttribute('stroke', color);
    p.setAttribute('stroke-width', '8');
    p.setAttribute('stroke-linecap', 'round');
    p.setAttribute('fill', 'none');
    svg.appendChild(p);
    return svg;
  }

  function spawnParticleRing(x, y, color, count) {
    const frag = document.createDocumentFragment();
    for (let i = 0; i < count; i++) {
      const p = createEl('span', 'fx-particle');
      const angle = (Math.PI * 2 * i) / count;
      const dist = 60 + Math.random() * 30;
      p.style.setProperty('--tx', (Math.cos(angle) * dist).toFixed(1) + 'px');
      p.style.setProperty('--ty', (Math.sin(angle) * dist).toFixed(1) + 'px');
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      p.style.background = color;
      frag.appendChild(p);
    }
    state.layer.appendChild(frag);
    setTimeout(() => {
      state.layer.querySelectorAll('.fx-particle').forEach(n => {
        if (!n._kept) n.remove();
      });
    }, 900);
  }

  function flashScreen() {
    const f = createEl('div', 'fx-screen-flash', state.layer);
    setTimeout(() => f.remove(), 200);
  }

  function judge(grade, x, y) {
    if (!state.layer) return;
    const G = (grade || 'GOOD').toUpperCase();
    const color = PALETTE[G] || PALETTE.GOOD;
    const wrap = createEl('div', 'fx-judge fx-judge-' + G.toLowerCase(), state.layer);
    wrap.style.left = (x || window.innerWidth / 2) + 'px';
    wrap.style.top = (y || window.innerHeight / 2) + 'px';

    let icon = null;
    if (G === 'PERFECT') {
      icon = buildStarSVG(color);
      flashScreen();
      spawnParticleRing(x, y, color, 12);
    } else if (G === 'GREAT') {
      icon = buildCheckSVG(color);
      spawnParticleRing(x, y, color, 6);
    } else if (G === 'GOOD') {
      icon = buildCircleSVG(color);
      spawnParticleRing(x, y, color, 4);
    } else {
      icon = buildXSVG(color);
    }
    wrap.appendChild(icon);

    const txt = createEl('div', 'fx-judge-text', wrap);
    txt.textContent = ({PERFECT:'최고!',GREAT:'잘했어!',GOOD:'좋아!',MISS:'아쉬워'})[G] || G;
    txt.style.color = color;

    setTimeout(() => wrap.remove(), 850);
  }

  function comboRing(level) {
    if (!state.layer) return;
    const lvl = Math.max(1, Math.min(20, level | 0));
    const ring = createEl('div', 'fx-combo-ring', state.layer);
    const intensity = lvl >= 20 ? 'hi' : lvl >= 10 ? 'mid' : 'lo';
    ring.classList.add('fx-combo-' + intensity);
    ring.style.setProperty('--combo-scale', (1 + lvl * 0.06).toFixed(2));
    setTimeout(() => ring.remove(), 800);
  }

  function lyricsTick(syllableEl) {
    if (!syllableEl) return;
    syllableEl.classList.remove('fx-syllable-bounce');
    void syllableEl.offsetWidth;
    syllableEl.classList.add('fx-syllable-bounce');
    setTimeout(() => syllableEl.classList.remove('fx-syllable-bounce'), 500);
  }

  function ensureCanvas() {
    if (state.canvas) return;
    const c = document.createElement('canvas');
    c.className = 'fx-confetti-canvas';
    state.layer.appendChild(c);
    state.canvas = c;
    state.ctx = c.getContext('2d');
    resizeCanvas();
    state.resizeHandler = resizeCanvas;
    window.addEventListener('resize', state.resizeHandler);
  }

  function resizeCanvas() {
    if (!state.canvas) return;
    state.canvas.width = window.innerWidth;
    state.canvas.height = window.innerHeight;
  }

  function spawnConfettiParticles(count) {
    const w = state.canvas.width;
    state.confettiParticles = [];
    for (let i = 0; i < count; i++) {
      state.confettiParticles.push({
        x: Math.random() * w,
        y: -20 - Math.random() * 200,
        w: 6 + Math.random() * 6,
        h: 10 + Math.random() * 8,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.2,
        vy: 2 + Math.random() * 3,
        vx: (Math.random() - 0.5) * 0.6,
        phase: Math.random() * Math.PI * 2,
        color: CONFETTI_COLORS[i % CONFETTI_COLORS.length]
      });
    }
  }

  function drawConfetti() {
    const ctx = state.ctx;
    const h = state.canvas.height;
    ctx.clearRect(0, 0, state.canvas.width, h);
    const t = performance.now() / 600;
    for (let p of state.confettiParticles) {
      p.phase += 0.05;
      p.x += p.vx + Math.sin(p.phase) * 0.6;
      p.y += p.vy;
      p.rot += p.vr;
      if (p.y > h + 20) {
        p.y = -20;
        p.x = Math.random() * state.canvas.width;
      }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
  }

  function confettiLoop() {
    if (!state.confettiActive) return;
    drawConfetti();
    if (performance.now() >= state.confettiEnd) {
      stopConfetti();
      return;
    }
    state.confettiRAF = requestAnimationFrame(confettiLoop);
  }

  function stopConfetti() {
    state.confettiActive = false;
    cancelAnimationFrame(state.confettiRAF);
    if (state.ctx) state.ctx.clearRect(0, 0, state.canvas.width, state.canvas.height);
  }

  function confetti(durationMs) {
    if (!state.layer) return;
    durationMs = durationMs || 3000;
    ensureCanvas();
    spawnConfettiParticles(80);
    state.confettiActive = true;
    state.confettiEnd = performance.now() + durationMs;
    state.confettiRAF = requestAnimationFrame(confettiLoop);
  }

  function stageLight(color, intensity) {
    if (!state.root) return;
    const lvl = Math.max(0, Math.min(1, intensity == null ? 0.6 : intensity));
    const blur = (30 + lvl * 60) | 0;
    const spread = (5 + lvl * 15) | 0;
    state.root.style.boxShadow = `inset 0 0 ${blur}px ${spread}px ${color || '#FFD93D'}`;
    state.root.style.transition = 'box-shadow 0.3s ease-out';
  }

  function init(rootEl) {
    cleanup();
    state.root = rootEl || document.body;
    state.layer = createEl('div', 'fx-layer', state.root);
  }

  function cleanup() {
    stopConfetti();
    if (state.resizeHandler) {
      window.removeEventListener('resize', state.resizeHandler);
      state.resizeHandler = null;
    }
    if (state.layer && state.layer.parentNode) {
      state.layer.parentNode.removeChild(state.layer);
    }
    if (state.root) state.root.style.boxShadow = '';
    state = {
      root: null, layer: null, canvas: null, ctx: null,
      confettiActive: false, confettiRAF: 0,
      confettiParticles: [], confettiEnd: 0, resizeHandler: null
    };
  }

  global.KaraokeFX = {
    init: init,
    judge: judge,
    comboRing: comboRing,
    lyricsTick: lyricsTick,
    confetti: confetti,
    stageLight: stageLight,
    cleanup: cleanup
  };
})(typeof window !== 'undefined' ? window : this);
</script>

// 다장조 음계 오르기(도→높은 도)·내리기(높은 도→도)·길게(솔 4초). 한 음 1초, 사이에 숨 1초.
// 곡과 같은 모양으로 만들어 같은 노래 화면·가이드·음정 엔진·옥타브 접기 채점을 그대로 쓴다. 기록(sv3_hs)은 남기지 않는다.
const WARM_PARTS=[[C4,D4,E4,F4,G4,A4,B4,C5],[C5,B4,A4,G4,F4,E4,D4,C4],[G4,G4,G4,G4]];
function warmSong(){
  const melody=[],lyrics=[];let t=0;
  WARM_PARTS.forEach((part,pi)=>{
    const line=part.map((f,i)=>{const n={t,d:1,f,s:(pi===2&&i>0)?'~':noteParts(f).n};t+=1;return n;});
    lyrics.push({t:line[0].t,tx:line.map(n=>n.s).join(' ')});
    melody.push(...line);
    t+=1;
  });
  return {id:'warm',warm:true,title:'목 풀기',icon:'🎶',melody,lyrics,dur:t-0.5};
}

// ===================== AUDIO ENGINE =====================
let audioCtx=null,analyser=null,micStream=null,micOn=false;
const BUF=4096;let aBuf=new Float32Array(BUF);

function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}

async function startMic(){
  try{
    initAudio();
    // AEC ON: 스피커로 나가는 가이드 멜로디를 마이크 입력에서 제거(끄면 가이드가 자기채점됨). NS/AGC는 음정 왜곡 방지 위해 OFF.
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false,autoGainControl:false}});
    const src=audioCtx.createMediaStreamSource(micStream);
    analyser=audioCtx.createAnalyser();analyser.fftSize=BUF;
    src.connect(analyser);micOn=true;
    if(window.KaraokeAudio)KaraokeAudio.init(audioCtx,analyser,BUF);
    syncSettings();
    return true;
  }catch(e){console.error('Mic:',e);return false;}
}
function stopMic(){if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null;}micOn=false;syncSettings();}

function detectPitch(){
  if(!analyser||!micOn)return null;
  if(!window.KaraokeAudio)return null;
  const r=KaraokeAudio.detectPitch();
  return r?r.freq:null;
}

// Synth for guide melody
let synthOsc=null,synthGain=null,guideOn=true;
function playSynth(f){
  if(!guideOn)return;initAudio();
  if(!synthOsc){synthOsc=audioCtx.createOscillator();synthGain=audioCtx.createGain();synthOsc.type='triangle';synthGain.gain.value=0.06;synthOsc.connect(synthGain);synthGain.connect(audioCtx.destination);synthOsc.start();}
  synthOsc.frequency.setValueAtTime(f,audioCtx.currentTime);synthGain.gain.setValueAtTime(0.06,audioCtx.currentTime);
}
function muteSynth(){if(synthGain)synthGain.gain.setValueAtTime(0,audioCtx.currentTime);}
function killSynth(){if(synthOsc){try{synthOsc.stop();}catch(e){}synthOsc=null;synthGain=null;}}

// Recording
let recorder=null,recordChunks=[],recordedBlob=null;
function startRecording(){
  if(!micStream)return;
  try{
  // iOS 사파리는 webm 미지원(mp4/aac) — 지원 mime 자동 선택, Blob type도 실제 mime로
  let mt='';
  if(window.MediaRecorder&&MediaRecorder.isTypeSupported){
    for(const c of ['audio/webm;codecs=opus','audio/webm','audio/mp4']){if(MediaRecorder.isTypeSupported(c)){mt=c;break;}}
  }
  recorder=mt?new MediaRecorder(micStream,{mimeType:mt}):new MediaRecorder(micStream);recordChunks=[];
  recorder.ondataavailable=e=>{if(e.data.size>0)recordChunks.push(e.data);};
  recorder.onstop=()=>{
    recordedBlob=new Blob(recordChunks,{type:(recorder&&recorder.mimeType)||'audio/webm'});
    // onstop fires async after endSong() already rendered the result screen — inject the play button now.
    if(gState==='result'&&recordedBlob.size>0&&!document.getElementById('rPlay')){
      const btns=document.querySelector('#resultScreen .res-btns');
      if(btns){
        const bp=document.createElement('button');bp.className='btn-play';bp.id='rPlay';bp.textContent='내 노래 듣기';
        bp.onclick=()=>playRecording();
        btns.insertBefore(bp,document.getElementById('rBack'));
      }
    }
  };
  recorder.start();}catch(e){recorder=null;}
}
function stopRecording(){if(recorder&&recorder.state==='recording')recorder.stop();}
function playRecording(){
  if(!recordedBlob)return;
  const url=URL.createObjectURL(recordedBlob);
  const a=new Audio(url);
  a.onended=()=>URL.revokeObjectURL(url);a.onerror=()=>URL.revokeObjectURL(url);
  a.play().catch(()=>URL.revokeObjectURL(url));
}

let userPH=[],lineScores=[],keyShift=0,lineSnapScore=0,lineSnapN=0;

// v4.1: 판정은 마이크 파이프라인 지연+가창 반응만큼 과거 시점 노트와 비교 (localStorage sv4_lat 초단위로 튜닝 가능)
const JUDGE_LAT=Math.min(0.5,Math.max(0,parseFloat(localStorage.getItem('sv4_lat'))||0.18));

// v4.1: 노트 하나의 판정 결과를 점수·콤보·FX에 반영 (게임루프 2곳+endSong 공용)
function applyNoteScore(res){
  if(!micOn)return;
  const grade=res.grade;
  let pts=0;
  if(grade==='PERFECT'){pts=100;hitN++;combo++;pitchSum+=100;rhythmSum+=100;}
  else if(grade==='GREAT'){pts=70;hitN++;combo++;pitchSum+=80;rhythmSum+=85;}
  else if(grade==='GOOD'){pts=40;hitN++;combo++;pitchSum+=55;rhythmSum+=70;}
  else{pts=0;combo=0;rhythmSum+=20;}
  score+=pts;totalN++;
  if(combo>maxCombo)maxCombo=combo;
  const pa=document.getElementById('pitchArea');
  if(window.KaraokeFX&&pa){
    const rect=pa.getBoundingClientRect();
    KaraokeFX.judge(grade,rect.left+rect.width*0.5,rect.top+rect.height*0.55);
  }
  if(window.KaraokeFX){
    if(combo>=20&&!comboMilestones[20]){comboMilestones[20]=true;KaraokeFX.comboRing(combo);}
    else if(combo>=10&&!comboMilestones[10]){comboMilestones[10]=true;KaraokeFX.comboRing(combo);}
    else if(combo>=5&&!comboMilestones[5]){comboMilestones[5]=true;KaraokeFX.comboRing(combo);}
  }
  if(grade==='PERFECT'&&shaderOn&&window.KaraokeShader){
    KaraokeShader.setMode('perfect');
    setTimeout(()=>{if(shaderOn)KaraokeShader.setMode('singing');},350);
  }
}

// Scores
function getHS(){try{return JSON.parse(localStorage.getItem('sv3_hs')||'{}');}catch(e){return {};}}
function saveHS(id,s,g){try{const h=getHS();if(!h[id]||s>h[id].s){h[id]={s,g};localStorage.setItem('sv3_hs',JSON.stringify(h));}}catch(e){/* 프라이빗모드/쿼터초과 — 기록만 포기, 결과화면은 계속 */}}
function getGrade(s){if(s>=95)return'S';if(s>=85)return'A';if(s>=70)return'B';if(s>=50)return'C';return'D';}
function getStars(s){if(s>=95)return 5;if(s>=80)return 4;if(s>=60)return 3;if(s>=40)return 2;if(s>=20)return 1;return 0;}

// 첫 화면 = 큰 그림 카드 4곡, 나머지 곡은 '노래 더 보기' 한 곳에 (곡·기능은 그대로 12곡)
const FEAT_IDS=[1,2,3,4];
const DIFF_ORDER={'diff-easy':0,'diff-medium':1,'diff-hard':2};
let showMoreSongs=false;
function renderList(){
  const c=document.getElementById('songSelect');c.innerHTML='';
  const hs=getHS();
  const feat=document.createElement('div');feat.className='feat';
  const more=document.createElement('div');more.className='more-grid';more.id='moreSongs';more.hidden=!showMoreSongs;
  const makeCard=song=>{
    const d=document.createElement('div');d.className='song-card';
    d.setAttribute('role','button');d.setAttribute('aria-label',song.title+' ('+song.diff+')');
    const rec=hs[song.id];const stars=rec?getStars(rec.s):0;
    const st=rec?'★'.repeat(stars)+'<span class="off">'+'★'.repeat(5-stars)+'</span>':'';
    d.innerHTML=`<span class="diff-dot ${song.dc}" title="${song.diff}"></span>
      <div class="sc-icon">${song.icon}</div>
      <div class="sc-txt"><div class="sc-title">${song.title}</div><div class="sc-stars">${st}</div></div>`;
    // long press for practice — 발동 시 이어지는 click(pickSong)을 삼켜 모달 뒤 재생 시작 방지
    let lt,lpFired=false;
    d.onclick=()=>{if(lpFired){lpFired=false;return;}pickSong(song,false);};
    d.onpointerdown=()=>{lpFired=false;lt=setTimeout(()=>{lpFired=true;openPractice(song);},600);};
    d.onpointerup=()=>clearTimeout(lt);d.onpointerleave=()=>clearTimeout(lt);
    return d;
  };
  FEAT_IDS.forEach(id=>{const s=SONGS.find(x=>x.id===id);if(s)feat.appendChild(makeCard(s));});
  const wc=document.createElement('button');wc.className='warm-card';wc.id='warmCard';wc.setAttribute('aria-label','목 풀기');
  wc.innerHTML='<span class="wi">🎶</span>목 풀기';
  wc.onclick=()=>pickSong(warmSong(),false);
  feat.appendChild(wc);
  SONGS.filter(s=>FEAT_IDS.indexOf(s.id)<0).map((s,i)=>({s,i}))
    .sort((a,b)=>(DIFF_ORDER[a.s.dc]-DIFF_ORDER[b.s.dc])||(a.i-b.i))
    .forEach(o=>more.appendChild(makeCard(o.s)));
  const mb=document.createElement('button');mb.className='more-btn';mb.id='btnMore';
  mb.setAttribute('aria-expanded',String(showMoreSongs));mb.setAttribute('aria-controls','moreSongs');
  mb.textContent=showMoreSongs?'접기 ▲':'노래 더 보기 ▼';
  mb.onclick=()=>{
    showMoreSongs=!showMoreSongs;more.hidden=!showMoreSongs;
    mb.textContent=showMoreSongs?'접기 ▲':'노래 더 보기 ▼';mb.setAttribute('aria-expanded',String(showMoreSongs));
    if(showMoreSongs)mb.scrollIntoView({behavior:'smooth',block:'start'});
  };
  c.appendChild(feat);c.appendChild(mb);c.appendChild(more);
}

window.startPractice=function(id){

// ===================== PICK SONG =====================
async function pickSong(song,isPractice){
  curSong=song;score=0;combo=0;maxCombo=0;totalN=0;hitN=0;pitchSum=0;rhythmSum=0;
  userPH=[];lineScores=[];keyShift=0;lineSnapScore=0;lineSnapN=0;particles=[];recordedBlob=null;
  paused=false;pauseAccum=0;
  curNoteId=null;beatPulse=0;comboMilestones={5:false,10:false,20:false};
  if(window.KaraokeAudio)KaraokeAudio.resetSession();
  if(!isPractice){practiceMode=false;tempoMul=1;showNoteNames=false;guideOn=true;loopStart=-1;loopEnd=-1;}
  if(!micOn){
    document.getElementById('micPrompt').classList.add('show');
    document.getElementById('btnAllowMic').onclick=async()=>{
      const ok=await startMic();document.getElementById('micPrompt').classList.remove('show');beginSing();
      if(!ok){
        const div=document.createElement('div');
        div.style.cssText='position:absolute;top:60px;left:50%;transform:translateX(-50%);background:rgba(198,40,40,.95);color:#fff;padding:12px 20px;border-radius:24px;font-size:17px;z-index:30;text-align:center;max-width:90%;';
        div.textContent='마이크가 안 켜져서 점수 없이 불러요';
        document.getElementById('singScreen').appendChild(div);
        setTimeout(()=>{div.style.transition='opacity .4s';div.style.opacity='0';setTimeout(()=>div.remove(),400);},3500);
      }
    };
    document.getElementById('btnSkipMic').onclick=()=>{
      document.getElementById('micPrompt').classList.remove('show');beginSing();
      const div=document.createElement('div');
      div.style.cssText='position:absolute;top:60px;left:50%;transform:translateX(-50%);background:rgba(21,101,192,.95);color:#fff;padding:12px 20px;border-radius:24px;font-size:17px;z-index:30;text-align:center;max-width:90%;';
      div.textContent='마이크 없이 들어요 (점수 없음)';
      document.getElementById('singScreen').appendChild(div);
      setTimeout(()=>{div.style.transition='opacity .4s';div.style.opacity='0';setTimeout(()=>div.remove(),400);},3500);
    };
    return;
  }
  beginSing();
}

function beginSing(){
  gState='singing';
  document.body.classList.add('singing');closeSettings();
  document.getElementById('songSelect').style.display='none';
  document.getElementById('singScreen').style.display='flex';
  document.getElementById('resultScreen').style.display='none';
  initAudio();if(audioCtx.state==='suspended')audioCtx.resume();
  const dpr0=window.devicePixelRatio||1;
  const c=document.getElementById('pitchCanvas');c.width=c.parentElement.clientWidth*dpr0;c.height=c.parentElement.clientHeight*dpr0;
  const pc=document.getElementById('particleCanvas');pc.width=pc.parentElement.clientWidth*dpr0;pc.height=pc.parentElement.clientHeight*dpr0;
  // v4: shader background
  const sc=document.getElementById('shaderCanvas');
  if(sc&&window.KaraokeShader){
    sc.style.display='block';
    shaderOn=KaraokeShader.init(sc);
    if(!shaderOn){sc.style.display='none';}
    else{KaraokeShader.setMode('singing');}
  }else if(sc){sc.style.display='none';shaderOn=false;}
  // v4: FX layer (judgments / combo rings / confetti host)
  if(window.KaraokeFX)KaraokeFX.init(document.getElementById('pitchArea'));
  startT=performance.now();
  if(micOn)startRecording();
  document.getElementById('btnGuide').classList.toggle('active',guideOn);
  syncSettings();
  // v4: auto key-shift suggestion 5s after song start (one-shot)
  // 마이크 프롬프트 경로(pickSong의 !micOn 조기 return)에서도 발동하도록 beginSing으로 재배치
  window.__keyShiftSuggested=false;
  if(micOn){
    setTimeout(()=>{
      if(window.__keyShiftSuggested||gState!=='singing')return;
      const r=KaraokeAudio.estimateUserRange?KaraokeAudio.estimateUserRange():null;
      if(r&&Math.abs(r.suggestedKeyShift)>=2){
        const div=document.createElement('div');
        div.style.cssText='position:absolute;top:60px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,rgba(139,63,217,.97),rgba(214,51,127,.97));color:#fff;padding:12px 20px;min-height:48px;border-radius:24px;font-size:17px;z-index:30;box-shadow:0 4px 20px rgba(255,106,176,.4);cursor:pointer;animation:fade-in .3s;white-space:nowrap';
        const dir=r.suggestedKeyShift>0?'+':'';
        div.textContent='\u{1F3B5} 키 '+dir+r.suggestedKeyShift+' 추천 · 누르면 바꿔요';
        div.onclick=()=>{
          keyShift=r.suggestedKeyShift;syncSettings();
          div.remove();
          window.__keyShiftSuggested=true;
        };
        document.getElementById('singScreen').appendChild(div);
        setTimeout(()=>{if(div.parentNode){div.style.opacity='0';setTimeout(()=>{if(div.parentNode)div.remove();},300);}},5000);
        window.__keyShiftSuggested=true;
      }
    },5000);
  }
  gameLoop();
}
