<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Violin Real v3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;
  background:#0a0a0a;font-family:Georgia,'Times New Roman',serif;}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100vw;position:relative;overflow:hidden;}
#bgCv{position:absolute;inset:0;z-index:0;width:100%;height:100%;display:block;pointer-events:none;}

/* Header */
#hd{display:flex;align-items:center;justify-content:space-between;
  padding:3px 8px;min-height:24px;z-index:5;position:relative;
  background:linear-gradient(180deg,rgba(140,105,60,.45),rgba(100,70,35,.3));
  border-bottom:1px solid rgba(0,0,0,.3);}
#hd h1{font-size:11px;color:#3d2010;letter-spacing:2px;font-weight:700;
  text-shadow:0 1px 0 rgba(255,255,255,.15);}

/* Mode tabs */
#modeTabs{display:flex;gap:2px;z-index:5;position:relative;
  background:linear-gradient(180deg,rgba(100,70,35,.4),rgba(80,55,25,.35));
  padding:2px 4px;border-bottom:1px solid rgba(0,0,0,.2);}
.mtab{flex:1;text-align:center;font-size:10px;padding:4px 2px;
  color:rgba(201,169,110,.5);cursor:pointer;border-radius:4px;
  transition:all .15s;letter-spacing:1px;font-weight:600;
  border:1px solid transparent;}
.mtab.active{color:#ffd700;background:rgba(255,215,0,.1);
  border-color:rgba(255,215,0,.2);text-shadow:0 0 8px rgba(255,215,0,.3);}
.mtab:active{transform:scale(.96);}

/* Fingerboard zone */
#fb{flex:0 0 auto;position:relative;z-index:3;padding:2px 0 4px 13%;
  display:flex;flex-direction:row;align-items:stretch;}

/* Open string buttons — LEFT column inside fingerboard */
#osCol{display:flex;flex-direction:column;gap:1px;padding:0 2px;
  justify-content:space-around;flex:0 0 auto;width:12%;min-width:38px;
  position:relative;z-index:3;}
.ob{flex:1;max-height:48px;border-radius:10px;border:2px solid;
  background:rgba(10,8,5,.5);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:bold;cursor:pointer;
  transition:transform .08s;margin:1px 0;}
.ob:active,.ob.on{transform:scale(.92);background:rgba(255,255,255,.1);}
.ob[data-i="0"]{border-color:#44ee44;color:#44ee44;}
.ob[data-i="1"]{border-color:#cc55ff;color:#cc55ff;}
.ob[data-i="2"]{border-color:#44ddee;color:#44ddee;}
.ob[data-i="3"]{border-color:#ffdd33;color:#ffdd33;}

/* Note grid — right portion */
#noteArea{flex:1;display:flex;flex-direction:column;position:relative;z-index:2;}
#shdr{display:flex;margin-bottom:1px;padding:0 2px;}
.sh{flex:1;text-align:center;font-size:10px;font-weight:bold;padding:1px 0;
  text-shadow:0 0 8px currentColor,0 1px 3px rgba(0,0,0,.8);}
#ng{display:flex;flex-direction:column;gap:2px;padding:0 2px;}
.nr{display:flex;gap:2px;}
.nb{flex:1;height:28px;border-radius:14px;
  background:rgba(255,250,235,.1);
  border:1px solid rgba(200,190,160,.15);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:rgba(240,230,200,.78);
  text-shadow:0 1px 3px rgba(0,0,0,.8);
  cursor:pointer;transition:transform .06s,background .06s;min-width:0;}
.nb:active,.nb.on{transform:scale(.94);
  background:rgba(255,215,0,.3);border-color:rgba(255,215,0,.45);
  color:#fff;box-shadow:0 0 10px rgba(255,215,0,.25);}
.nb.highlight{animation:hlPulse .6s ease-in-out infinite;
  border-color:rgba(255,100,100,.6);box-shadow:0 0 12px rgba(255,100,100,.3);}
@keyframes hlPulse{0%,100%{background:rgba(255,100,100,.15)}50%{background:rgba(255,100,100,.35)}}

/* Bow zone — COMPLETELY clear for dragging */
#bz{flex:1;position:relative;z-index:2;min-height:180px;overflow:hidden;}
#bowCv{display:block;width:100%;height:100%;position:relative;z-index:1;touch-action:none;}

#nd{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:8;
  font-size:22px;font-weight:bold;color:#ffd700;
  text-shadow:0 0 14px rgba(255,215,0,.6),0 2px 4px rgba(0,0,0,.6);
  pointer-events:none;}
#logo{position:absolute;bottom:3px;right:8px;z-index:6;
  font-size:11px;font-weight:bold;color:rgba(255,255,255,.1);
  letter-spacing:2px;font-style:italic;pointer-events:none;}

/* Rhythm game overlay */
#rhythmCv{position:absolute;inset:0;z-index:4;pointer-events:none;display:none;}

/* Game HUD */
#gameHud{display:none;position:absolute;top:0;left:0;right:0;z-index:10;
  padding:3px 8px;
  background:linear-gradient(180deg,rgba(0,0,0,.6),rgba(0,0,0,0));
  pointer-events:none;}
#gameHud>div{display:flex;justify-content:space-between;align-items:center;}
.hudItem{font-size:11px;color:#ffd700;text-shadow:0 1px 3px rgba(0,0,0,.8);font-weight:700;}
.hudCombo{font-size:16px;color:#ff6644;text-shadow:0 0 10px rgba(255,100,68,.5);}
#judgeTxt{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:28px;font-weight:900;pointer-events:none;z-index:11;
  text-shadow:0 0 20px currentColor;opacity:0;transition:opacity .15s;}

/* Health bar */
#healthBar{position:absolute;top:22px;left:8px;right:8px;height:4px;z-index:10;
  background:rgba(0,0,0,.4);border-radius:2px;display:none;pointer-events:none;}
#healthFill{width:100%;height:100%;background:linear-gradient(90deg,#ff4444,#44ee44);border-radius:2px;transition:width .2s;}

/* Song select / lesson panel */
#panel{display:none;position:absolute;inset:0;z-index:20;
  background:rgba(10,8,6,.92);backdrop-filter:blur(4px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px;}
#panel h2{font-size:14px;color:#ffd700;margin-bottom:8px;text-align:center;letter-spacing:2px;}
.pBtn{display:block;width:100%;padding:10px 12px;margin:4px 0;
  background:rgba(255,250,235,.08);border:1px solid rgba(200,190,160,.15);
  border-radius:8px;color:rgba(240,230,200,.85);font-size:12px;
  font-family:Georgia,serif;cursor:pointer;text-align:left;
  transition:all .15s;}
.pBtn:active{background:rgba(255,215,0,.2);border-color:rgba(255,215,0,.35);}
.pBtn .sub{font-size:9px;color:rgba(201,169,110,.5);margin-top:2px;}
.pBtn.locked{opacity:.4;}
.pBtn .stars{color:#ffd700;font-size:10px;float:right;}
.pClose{position:fixed;top:8px;right:12px;z-index:22;font-size:18px;color:#ffd700;
  cursor:pointer;background:rgba(0,0,0,.5);border-radius:50%;width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,215,0,.3);}

/* Difficulty selector */
.diffRow{display:flex;gap:4px;margin:4px 0;justify-content:center;}
.diffBtn{padding:4px 12px;border-radius:12px;font-size:10px;font-family:Georgia,serif;
  cursor:pointer;border:1px solid rgba(255,215,0,.2);color:rgba(240,230,200,.7);
  background:rgba(255,250,235,.06);transition:all .15s;}
.diffBtn.active{background:rgba(255,215,0,.2);border-color:rgba(255,215,0,.5);color:#ffd700;}
.diffBtn:active{transform:scale(.95);}

/* Category label */
.catLabel{margin-top:10px;font-size:11px;color:rgba(255,215,0,.5);padding:2px 8px;
  border-bottom:1px solid rgba(255,215,0,.1);letter-spacing:1px;}

/* Song performance sheet */
#sheetArea{display:none;position:absolute;top:0;left:0;right:0;
  height:60px;z-index:6;background:rgba(0,0,0,.5);
  border-bottom:1px solid rgba(255,215,0,.15);overflow:hidden;}
#sheetCv{display:block;width:100%;height:100%;}

/* BPM selector */
#bpmSel{display:none;position:absolute;bottom:4px;left:8px;z-index:12;
  background:rgba(0,0,0,.6);border-radius:8px;padding:2px 6px;
  border:1px solid rgba(255,215,0,.2);}
#bpmSel select{background:transparent;color:#ffd700;border:none;
  font-size:10px;font-family:Georgia,serif;outline:none;}
#bpmSel option{background:#1a1008;color:#ffd700;}

/* Practice toggle */
#practiceToggle{display:none;position:absolute;bottom:4px;right:8px;z-index:12;
  background:rgba(0,0,0,.6);border-radius:8px;padding:4px 10px;
  border:1px solid rgba(255,215,0,.2);color:#ffd700;font-size:10px;
  font-family:Georgia,serif;cursor:pointer;}
#practiceToggle.active{background:rgba(255,215,0,.15);border-color:rgba(255,215,0,.4);}

/* Start overlay */
#ov{position:absolute;inset:0;z-index:50;background:rgba(10,8,6,.88);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  backdrop-filter:blur(3px);}
#ov .i{text-align:center;animation:pu 2s ease-in-out infinite;}
@keyframes pu{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.02)}}
.H{display:none!important;}

/* Lesson instruction */
#lessonInfo{display:none;position:absolute;bottom:60px;left:50%;transform:translateX(-50%);
  z-index:12;background:rgba(0,0,0,.7);border:1px solid rgba(255,215,0,.2);
  border-radius:8px;padding:6px 12px;max-width:90%;text-align:center;
  pointer-events:none;}
#lessonInfo .lt{font-size:12px;color:#ffd700;font-weight:700;}
#lessonInfo .ls{font-size:10px;color:rgba(240,230,200,.7);margin-top:2px;}

/* Countdown overlay */
#countdown{display:none;position:absolute;inset:0;z-index:15;
  background:rgba(0,0,0,.5);
  display:none;align-items:center;justify-content:center;pointer-events:none;}
#countdownTxt{font-size:64px;color:#ffd700;font-weight:900;
  text-shadow:0 0 30px rgba(255,215,0,.6);}

/* Game over overlay */
#gameOver{display:none;position:absolute;inset:0;z-index:18;
  background:rgba(10,5,2,.85);backdrop-filter:blur(3px);
  align-items:center;justify-content:center;flex-direction:column;}
#gameOver .goTitle{font-size:28px;color:#ff4444;font-weight:900;
  text-shadow:0 0 20px rgba(255,68,68,.5);margin-bottom:12px;}
#gameOver .goScore{font-size:18px;color:#ffd700;margin-bottom:16px;}
.goBtn{padding:10px 24px;border-radius:8px;font-size:13px;font-family:Georgia,serif;
  cursor:pointer;border:1px solid rgba(255,215,0,.3);color:#ffd700;
  background:rgba(255,250,235,.08);margin:4px;}
.goBtn:active{background:rgba(255,215,0,.2);}
</style>
</head>
<body>
<div id="app">
<canvas id="bgCv"></canvas>

<div id="hd"><h1>🎻 Violin Real v3</h1><span id="modeLabel" style="font-size:9px;color:#5a3d20">자유연주</span></div>

<div id="modeTabs">
  <div class="mtab active" data-mode="free">자유연주</div>
  <div class="mtab" data-mode="rhythm">리듬게임</div>
  <div class="mtab" data-mode="learn">학습모드</div>
  <div class="mtab" data-mode="perform">곡연주</div>
</div>

<div id="fb">
  <div id="osCol"></div>
  <div id="noteArea">
    <div id="shdr"></div>
    <div id="ng"></div>
  </div>
</div>

<div id="bz">
  <canvas id="bowCv"></canvas>
  <canvas id="rhythmCv"></canvas>
  <div id="nd"></div>
  <div id="logo">Violin Real v3</div>

  <div id="gameHud">
    <div>
      <span class="hudItem" id="hudScore">0점</span>
      <span class="hudCombo" id="hudCombo"></span>
      <span class="hudItem" id="hudSong"></span>
    </div>
  </div>
  <div id="healthBar"><div id="healthFill"></div></div>
  <div id="judgeTxt"></div>

  <div id="bpmSel">
    <select id="bpmVal">
      <option value="60">♩=60</option>
      <option value="80" selected>♩=80</option>
      <option value="100">♩=100</option>
      <option value="120">♩=120</option>
    </select>
  </div>

  <div id="practiceToggle">연습모드</div>

  <div id="lessonInfo">
    <div class="lt" id="lessonTitle"></div>
    <div class="ls" id="lessonSub"></div>
  </div>

  <div id="countdown"><div id="countdownTxt"></div></div>
  <div id="gameOver">
    <div class="goTitle">GAME OVER</div>
    <div class="goScore" id="goScoreTxt"></div>
    <div style="display:flex;gap:8px;">
      <div class="goBtn" id="goRetry">다시 도전</div>
      <div class="goBtn" id="goBack">곡 선택</div>
    </div>
  </div>
</div>

<div id="sheetArea"><canvas id="sheetCv"></canvas></div>

<div id="panel"></div>

<div id="ov"><div class="i">
  <div style="font-size:52px;margin-bottom:8px">🎻</div>
  <div style="font-size:16px;color:#c9a96e;letter-spacing:4px">VIOLIN REAL</div>
  <div style="font-size:10px;color:rgba(201,169,110,.5);margin-top:5px;letter-spacing:2px">터치하여 연주 시작</div>
  <div id="loadTxt" style="font-size:9px;color:rgba(201,169,110,.3);margin-top:8px;letter-spacing:1px"></div>
</div></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   AUDIO ENGINE — Real Violin Samples + Pitch Shifting
   ═══════════════════════════════════════════════════════════ */
const AE=(()=>{
  let c=null,m=null,v={};
  const BF=[196,293.66,440,659.25];
  const NN=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  const SAMPLE_URL='violin_samples/';
  const SAMPLE_NOTES=['G3','A3','C4','E4','G4','A4','C5','E5','G5','A5','C6'];
  const SAMPLE_MIDI=[55,57,60,64,67,69,72,76,79,81,84];
  const sampleBuffers={};
  let samplesLoaded=false,loadingStarted=false;

  function noteToMidi(noteName){
    const m=noteName.match(/^([A-G]#?b?)(\d)$/);
    if(!m)return 69;
    const names={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
    return (parseInt(m[2])+1)*12+(names[m[1]]||0);
  }
  function findSample(targetMidi){
    let bestIdx=0,bestDist=999;
    for(let i=0;i<SAMPLE_MIDI.length;i++){
      const d=Math.abs(SAMPLE_MIDI[i]-targetMidi);
      if(d<bestDist){bestDist=d;bestIdx=i;}
    }
    return{noteName:SAMPLE_NOTES[bestIdx],rate:Math.pow(2,(targetMidi-SAMPLE_MIDI[bestIdx])/12)};
  }
  async function loadSamples(){
    if(loadingStarted)return;loadingStarted=true;
    await Promise.all(SAMPLE_NOTES.map(async note=>{
      try{const r=await fetch(SAMPLE_URL+note+'.mp3');const buf=await r.arrayBuffer();
        sampleBuffers[note]=await c.decodeAudioData(buf);}catch(e){}
    }));
    samplesLoaded=true;
  }
  function init(){
    c=new(window.AudioContext||window.webkitAudioContext)();
    m=c.createGain();m.gain.value=.65;
    const d=c.createGain();d.gain.value=.76;const w=c.createGain();w.gain.value=.22;
    const d1=c.createDelay(1);d1.delayTime.value=.028;const d2=c.createDelay(1);d2.delayTime.value=.048;
    const fb=c.createGain();fb.gain.value=.2;
    const rl=c.createBiquadFilter();rl.type='lowpass';rl.frequency.value=2800;
    m.connect(d);d.connect(c.destination);m.connect(d1);d1.connect(rl);rl.connect(d2);
    d2.connect(fb);fb.connect(d1);d2.connect(w);w.connect(c.destination);
    loadSamples().catch(()=>{});
  }
  function res(){if(c&&c.state==='suspended')c.resume();}
  function freq(s,sm){return BF[s]*Math.pow(2,sm/12);}
  function nn(f){const mi=Math.round(12*Math.log2(f/440)+69);return NN[((mi%12)+12)%12]+Math.floor(mi/12-1);}
  function getCtx(){return c;}
  function getMaster(){return m;}

  function play(si,sm,vel){
    if(!c)return;res();stop(si);
    const f0=freq(si,sm);
    const targetMidi=Math.round(12*Math.log2(f0/440)+69);
    const vv=Math.min(.85,Math.max(.08,vel));
    const t=c.currentTime;
    let useSample=false;
    if(samplesLoaded){
      const{noteName,rate}=findSample(targetMidi);
      const buf=sampleBuffers[noteName];
      if(buf){
        try{
          const src=c.createBufferSource();src.buffer=buf;src.playbackRate.value=rate;
          src.loop=true;const dur=buf.duration;
          src.loopStart=Math.min(0.3,dur*0.15);src.loopEnd=Math.max(dur-0.1,dur*0.85);
          const eg=c.createGain();eg.gain.setValueAtTime(0,t);
          eg.gain.linearRampToValueAtTime(vv*.8,t+.06);eg.gain.linearRampToValueAtTime(vv*.6,t+.2);
          src.connect(eg);eg.connect(m);src.start(t);
          v[si]={src,eg,f0,isSample:true};useSample=true;
        }catch(e){useSample=false;}
      }
    }
    if(!useSample){
      const HH=[1,.6,.38,.3,.16,.1,.07,.04];
      const os=[],oG=[];const mx=c.createGain();mx.gain.value=.5;
      for(let h=0;h<HH.length;h++){const hf=f0*(h+1);if(hf>c.sampleRate/2)break;
        const o=c.createOscillator();o.type='sine';o.frequency.value=hf;
        const g=c.createGain();g.gain.value=HH[h];o.connect(g);g.connect(mx);o.start(t);os.push(o);oG.push(g);}
      const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2000+vel*2000;
      const b1=c.createBiquadFilter();b1.type='peaking';b1.frequency.value=400;b1.Q.value=2;b1.gain.value=3;
      const eg=c.createGain();eg.gain.setValueAtTime(0,t);
      eg.gain.linearRampToValueAtTime(vv*.5,t+.07);eg.gain.linearRampToValueAtTime(vv*.35,t+.18);
      mx.connect(b1);b1.connect(lp);lp.connect(eg);eg.connect(m);
      v[si]={os,oG,mx,b1,lp,eg,f0,isSample:false};
    }
    return nn(f0);
  }
  function upd(si,sm,vel){
    const vo=v[si];if(!vo||!c)return;
    const f0=freq(si,sm);const vv=Math.min(.85,Math.max(.08,vel));const t=c.currentTime;
    if(vo.isSample){
      const targetMidi=Math.round(12*Math.log2(f0/440)+69);
      vo.src.playbackRate.linearRampToValueAtTime(findSample(targetMidi).rate,t+.03);
      vo.eg.gain.linearRampToValueAtTime(vv*.6,t+.03);
    }else{
      vo.os.forEach((o,h)=>o.frequency.linearRampToValueAtTime(f0*(h+1),t+.025));
      vo.eg.gain.linearRampToValueAtTime(vv*.35,t+.03);
      vo.lp.frequency.linearRampToValueAtTime(2000+vel*2000,t+.03);
    }
    vo.f0=f0;return nn(f0);
  }
  function stop(si){
    const vo=v[si];if(!vo||!c)return;const t=c.currentTime;
    vo.eg.gain.cancelScheduledValues(t);vo.eg.gain.setValueAtTime(vo.eg.gain.value,t);
    vo.eg.gain.linearRampToValueAtTime(0,t+.12);
    setTimeout(()=>{
      try{if(vo.isSample){vo.src.stop();vo.src.disconnect();vo.eg.disconnect();}
      else{vo.os.forEach(o=>{try{o.stop()}catch(e){}});
        [vo.mx,...vo.oG,vo.b1,vo.lp,vo.eg].forEach(n=>{try{n.disconnect()}catch(e){}});}}catch(e){}
    },180);delete v[si];
  }
  function stopAll(){for(let i=0;i<4;i++)stop(i);}

  function playChord(notes, duration){
    if(!c)return;res();
    const t=c.currentTime;
    const g=c.createGain();g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(.08,t+.05);
    g.gain.setValueAtTime(.08,t+duration-.1);
    g.gain.linearRampToValueAtTime(0,t+duration);
    g.connect(m);
    notes.forEach(f=>{
      const o=c.createOscillator();o.type='sine';o.frequency.value=f;
      const og=c.createGain();og.gain.value=.3;
      o.connect(og);og.connect(g);o.start(t);o.stop(t+duration);
    });
  }

  /* Sound effects */
  function playSfx(type){
    if(!c)return;res();const t=c.currentTime;
    const g=c.createGain();g.gain.setValueAtTime(0,t);g.connect(m);
    if(type==='perfect'){
      g.gain.linearRampToValueAtTime(.12,t+.02);g.gain.linearRampToValueAtTime(0,t+.3);
      [880,1100,1320].forEach((f,i)=>{const o=c.createOscillator();o.type='sine';o.frequency.value=f;
        const og=c.createGain();og.gain.value=.3;o.connect(og);og.connect(g);o.start(t+i*.04);o.stop(t+.3);});
    }else if(type==='miss'){
      g.gain.linearRampToValueAtTime(.06,t+.02);g.gain.linearRampToValueAtTime(0,t+.2);
      const o=c.createOscillator();o.type='sawtooth';o.frequency.value=150;
      o.connect(g);o.start(t);o.stop(t+.2);
    }else if(type==='gameover'){
      g.gain.linearRampToValueAtTime(.1,t+.02);g.gain.linearRampToValueAtTime(0,t+.8);
      [400,350,300,250].forEach((f,i)=>{const o=c.createOscillator();o.type='sine';o.frequency.value=f;

      const b=document.createElement('div');b.className='nb';
      b.textContent=AE.nn(AE.freq(si,sm));b.dataset.s=si;b.dataset.m=sm;
      b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();ensureA();onNotePress(si,sm);b.classList.add('on');});

      b.addEventListener('pointerleave',()=>b.classList.remove('on'));
      row.appendChild(b);
    }grid.appendChild(row);
  }

  const sThk=[3.5,2.8,2,1.4];
  for(let i=0;i<4;i++){
    const sx=strX(i);
    const sg=bg.createLinearGradient(sx-2,0,sx+2,0);
    sg.addColorStop(0,'rgba(160,155,140,.2)');sg.addColorStop(.3,'rgba(210,205,190,.35)');
    sg.addColorStop(.5,'rgba(230,225,210,.4)');sg.addColorStop(.7,'rgba(210,205,190,.35)');
    sg.addColorStop(1,'rgba(160,155,140,.2)');
    bg.strokeStyle=sg;bg.lineWidth=sThk[i];
    bg.beginPath();bg.moveTo(sx,0);bg.lineTo(sx,H);bg.stroke();
    bg.strokeStyle='rgba(255,255,250,.06)';bg.lineWidth=sThk[i]*.3;
    bg.beginPath();bg.moveTo(sx-.5,0);bg.lineTo(sx-.5,H);bg.stroke();
  }
  [.1,.2,.3,.42,.55,.7,.86].forEach(p=>{
    const y=fbTop+(fbBot-fbTop)*p;
    bg.strokeStyle='rgba(60,55,50,.06)';bg.lineWidth=.5;
    bg.beginPath();bg.moveTo(cx-fbW*1.1,y);bg.lineTo(cx+fbW*1.1,y);bg.stroke();
  });
}

function drawFH(ctx,x,y,h,mir){
  ctx.save();if(mir){ctx.translate(x,y);ctx.scale(-1,1);ctx.translate(-x,-y);}
  ctx.fillStyle='rgba(15,8,3,.6)';ctx.strokeStyle='rgba(35,18,6,.5)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(x+1,y-h*.42);
  ctx.bezierCurveTo(x-3,y-h*.25,x-5,y-h*.08,x-4,y+h*.05);
  ctx.bezierCurveTo(x-3,y+h*.15,x-1,y+h*.2,x+1,y+h*.22);
  ctx.bezierCurveTo(x+3,y+h*.24,x+5,y+h*.2,x+4,y+h*.1);
  ctx.bezierCurveTo(x+3,y+h*.02,x+1,y-h*.05,x+2,y-h*.15);
  ctx.bezierCurveTo(x+3,y-h*.28,x+2,y-h*.38,x+1,y-h*.42);
  ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(x-1,y-h*.28,2,0,Math.PI*2);ctx.fillStyle='rgba(15,8,3,.7)';ctx.fill();
  ctx.beginPath();ctx.arc(x+2,y+h*.15,2,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

const bowCv=document.getElementById('bowCv'),bc=bowCv.getContext('2d');
let BW=0,BH=0;

function sFromX(px){let b=-1,bd=999;for(let i=0;i<4;i++){const d=Math.abs(px-strX(i));if(d<bd){bd=d;b=i;}}return bd<36?b:-1;}

bowCv.addEventListener('pointerdown',e=>{
  e.preventDefault();ensureA();
  const r=bowCv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
  bow.dn=true;bow.px=px;bow.py=py;bow.lx=px;bow.lt=performance.now();
  bow.str=sFromX(px);
  if(bow.str>=0){const n=AE.play(bow.str,semi[bow.str],.25);actS=bow.str;vib[bow.str]=.3;if(n)curN=n;mkP(bow.str,py);
    if(currentMode==='rhythm'&&rhythmState&&rhythmState.active)rhythmBow(bow.str);
    if(currentMode==='learn'&&learnState&&learnState.active)learnBow(bow.str);
    if(currentMode==='perform'&&performState&&performState.active)performBow(bow.str);
  }
});
bowCv.addEventListener('pointermove',e=>{
  e.preventDefault();if(!bow.dn)return;
  const r=bowCv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
  const now=performance.now(),dx=px-bow.lx,dt=Math.max(1,now-bow.lt)/1000;
  bow.spd=Math.min(1,Math.abs(dx/dt)/(BW*1.1));
  if(Math.abs(dx)>1)bow.dir=dx>0?1:-1;
  bow.px=px;bow.py=py;
  bow.angle+=((bow.dir>0?-Math.PI*.18:-Math.PI*.28)-bow.angle)*.12;
  const ns=sFromX(px);
  if(ns>=0&&ns!==bow.str){
    if(bow.str>=0){AE.stop(bow.str);vib[bow.str]*=.4;}
    bow.str=ns;const n=AE.play(ns,semi[ns],bow.spd);actS=ns;vib[ns]=bow.spd;if(n)curN=n;mkP(ns,py);
  }else if(ns>=0&&Math.abs(dx)>1){
    const n=AE.upd(ns,semi[ns],bow.spd);vib[ns]=bow.spd;actS=ns;if(n)curN=n;
  }else if(ns<0&&bow.str>=0){AE.stop(bow.str);actS=-1;bow.str=-1;}
  bow.lx=px;bow.lt=now;
});
function bowUp(){if(!bow.dn)return;bow.dn=false;bow.spd=0;if(bow.str>=0)AE.stop(bow.str);bow.str=-1;actS=-1;curN='';}
bowCv.addEventListener('pointerup',e=>{e.preventDefault();bowUp();});
bowCv.addEventListener('pointercancel',e=>{e.preventDefault();bowUp();});
bowCv.addEventListener('pointerleave',e=>{e.preventDefault();bowUp();});

function mkP(si,y){const sx=strX(si);for(let i=0;i<7;i++)parts.push({x:sx,y,vx:(Math.random()-.5)*55,vy:(Math.random()-.5)*35-10,life:1,sz:1.2+Math.random()*2,col:SC[si]});}

/* ═══════════════════════════════════════════════════════════
   RENDER BOW OVERLAY
   ═══════════════════════════════════════════════════════════ */
function renderBow(){
  bc.clearRect(0,0,BW,BH);
  for(let i=0;i<4;i++){
    const sx=strX(i),isA=actS===i,va=vib[i],vp=vibP[i];
    const th=[4.5,3.5,2.6,1.8][i];
    if(isA&&bow.dn){bc.save();bc.globalAlpha=.12;bc.fillStyle=SC[i];bc.fillRect(sx-22,0,44,BH);bc.restore();}
    if(va>.01){
      bc.beginPath();bc.lineWidth=th*(isA?1.5:1);bc.strokeStyle=isA?SC[i]:SD[i];
      bc.moveTo(sx,3);for(let y=4;y<BH-3;y+=2){const t=(y-3)/(BH-6);bc.lineTo(sx+Math.sin(t*Math.PI)*Math.sin(vp+t*24)*va*14,y);}
      bc.stroke();if(isA){bc.save();bc.shadowColor=SC[i];bc.shadowBlur=18;bc.stroke();bc.restore();}
    }
  }
  if(bow.dn||bow.spd>.02){
    const bpx=clamp(bow.px,15,BW-15),bpy=clamp(bow.py,25,BH-25);
    if(bow.str>=0){
      const sx=strX(bow.str);
      bc.save();const gl=bc.createRadialGradient(sx,bpy,0,sx,bpy,30);
      gl.addColorStop(0,SCA[bow.str]+'0.4)');gl.addColorStop(1,SCA[bow.str]+'0)');
      bc.fillStyle=gl;bc.fillRect(sx-40,bpy-40,80,80);bc.restore();
      bc.save();bc.globalAlpha=.4;bc.strokeStyle='rgba(255,255,240,.55)';bc.lineWidth=2.5;bc.lineCap='round';
      bc.beginPath();bc.moveTo(sx-16,bpy);bc.lineTo(sx+16,bpy);bc.stroke();bc.restore();
    }
    bc.save();bc.translate(bpx,bpy);bc.rotate(bow.angle);
    const half=Math.min(BW*.52,175)/2;
    bc.strokeStyle=bow.dn?'rgba(255,255,240,.4)':'rgba(255,255,240,.1)';bc.lineWidth=bow.dn?2.5:1.5;bc.lineCap='round';
    bc.beginPath();bc.moveTo(-half,2);bc.lineTo(half,2);bc.stroke();
    bc.beginPath();bc.moveTo(-half,-2.5);bc.quadraticCurveTo(0,-5.5,half,-2.5);bc.lineTo(half,-.5);bc.quadraticCurveTo(0,-3.5,-half,-.5);bc.closePath();
    const sg=bc.createLinearGradient(-half,0,half,0);
    sg.addColorStop(0,'#3d2010');sg.addColorStop(.08,'#7a5230');sg.addColorStop(.35,bow.dn?'#a87848':'#8b6240');
    sg.addColorStop(.65,bow.dn?'#b8905a':'#8b6240');sg.addColorStop(.92,'#7a5230');sg.addColorStop(1,'#3d2010');
    bc.fillStyle=sg;bc.fill();
    if(bow.dn){bc.save();bc.shadowColor='rgba(180,150,100,.2)';bc.shadowBlur=6;bc.fill();bc.restore();}
    bc.fillStyle='#888';for(let w=0;w<3;w++)bc.fillRect(half-26-w*5,-4,2,5);
    bc.fillStyle='#111';rr(bc,half-3,-6.5,17,13,3);bc.fill();
    bc.strokeStyle='#444';bc.lineWidth=.6;rr(bc,half-3,-6.5,17,13,3);bc.stroke();
    bc.beginPath();bc.arc(half+6,0,2.5,0,Math.PI*2);const pg=bc.createRadialGradient(half+5,-1,0,half+6,0,2.5);
    pg.addColorStop(0,'#f0e4cc');pg.addColorStop(1,'#a08050');bc.fillStyle=pg;bc.fill();
    bc.beginPath();bc.arc(half+13,0,1.8,0,Math.PI*2);bc.fillStyle='#555';bc.fill();
    bc.fillStyle='#ece0c8';rr(bc,-half-7,-3.5,10,7,2);bc.fill();
    bc.fillStyle='#1a1a1a';bc.fillRect(-half-7,-.5,2.5,1.5);
    bc.restore();
  }
  for(const p of parts){bc.globalAlpha=p.life;bc.fillStyle=p.col;bc.beginPath();bc.arc(p.x,p.y,p.sz*p.life,0,Math.PI*2);bc.fill();}
  bc.globalAlpha=1;
}

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

/* Countdown before game starts */
function startRhythmCountdown(songKey){
  const cd=document.getElementById('countdown');
  const cdTxt=document.getElementById('countdownTxt');
  cd.style.display='flex';
  let count=3;
  cdTxt.textContent=count;
  const iv=setInterval(()=>{
    count--;
    if(count>0){cdTxt.textContent=count;}
    else if(count===0){cdTxt.textContent='GO!';}
    else{
      clearInterval(iv);
      cd.style.display='none';
      startRhythmGame(songKey);
    }
  },700);
}

function startRhythmGame(songKey){
  const song=SONGS[songKey];
  const speedMult=DIFF_SPEEDS[selectedDifficulty]||1.0;
  const bpmAdj=Math.round(song.bpm*speedMult);
  const beatMs=60000/bpmAdj;
  const stepMode=selectedDifficulty==='step';
  const scrollTime=(practiceMode||stepMode)?3500:2500;

  const fallingNotes=[];
  let beatPos=0;
  song.notes.forEach(n=>{
    if(n.note!=='R'){
      fallingNotes.push({
        s:n.s,f:n.f,note:n.note,dur:n.dur,
        hitTime:beatPos*beatMs+scrollTime,
        hit:false,judge:null,
        flashTimer:0
      });
    }
    beatPos+=n.dur;
  });

  const maxHealth=100;
  const missDmg=(practiceMode||stepMode)?0:(selectedDifficulty==='hard'?20:selectedDifficulty==='normal'?15:10);

  rhythmState={
    active:true,songKey,song,bpm:bpmAdj,beatMs,scrollTime,
    difficulty:selectedDifficulty,
    practice:practiceMode,
    stepMode,
    notes:fallingNotes,
    startTime:performance.now(),
    pausedAt:0,
    score:0,combo:0,maxCombo:0,
    multiplier:1,
    perfect:0,good:0,ok:0,miss:0,
    health:maxHealth,maxHealth,missDmg,
    noteIdx:0,
    bowActive:{},
    notePressed:{},
    finished:false,
    gameOver:false,
    lastHitNote:null,
    waitPaused:false,
    waitPauseStart:0
  };

  document.getElementById('gameHud').style.display='block';
  document.getElementById('hudSong').textContent=song.name;
  document.getElementById('hudScore').textContent='0점';
  document.getElementById('hudCombo').textContent='';
  document.getElementById('healthBar').style.display=stepMode?'none':'block';
  document.getElementById('healthFill').style.width='100%';
  document.getElementById('practiceToggle').style.display=practiceMode?'block':'none';
  if(practiceMode)document.getElementById('practiceToggle').classList.add('active');

  rhythmCv.style.display='block';
  resizeRhythmCv();
}

function rhythmHit(si,sm){
  if(!rhythmState||!rhythmState.active)return;
  const key=si+'_'+sm;
  rhythmState.notePressed[key]=performance.now();
  checkRhythmHit(si,sm);
}

function rhythmBow(si){
  if(!rhythmState||!rhythmState.active)return;
  rhythmState.bowActive[si]=performance.now();
  /* Also check with current finger for this string */
  checkRhythmHit(si,semi[si]);
}

function checkRhythmHit(si,sm){
  if(!rhythmState||!rhythmState.active)return;
  const st=rhythmState;
  const now=performance.now();
  const elapsed=now-st.startTime;

  /* STEP MODE: match only the front note by string+finger; timing ignored, no penalty */
  if(st.stepMode){
    let idx=-1;
    for(let i=st.noteIdx;i<st.notes.length;i++){
      if(!st.notes[i].hit&&!st.notes[i].judge){idx=i;break;}
    }
    if(idx<0)return;
    const tn=st.notes[idx];
    if(tn.s!==si||tn.f!==sm)return; /* wrong note → ignore */
    const hasBowS=st.bowActive[si]&&(now-st.bowActive[si])<800;
    const hasNoteS=st.notePressed[si+'_'+sm]&&(now-st.notePressed[si+'_'+sm])<800;
    if(!hasBowS&&!hasNoteS)return;
    tn.judge='perfect';tn.hit=true;st.perfect++;st.combo++;
    st.maxCombo=Math.max(st.maxCombo,st.combo);
    st.multiplier=Math.min(4,1+Math.floor(st.combo/10));
    st.score+=100*st.multiplier;
    st.lastHitNote=tn;
    delete st.notePressed[si+'_'+sm];
    showJudge('PERFECT!','#ffd700');
    AE.playSfx('perfect');
    tn.flashTimer=now;
    st.noteIdx=idx+1;
    while(st.noteIdx<st.notes.length&&st.notes[st.noteIdx].hit)st.noteIdx++;
    return;
  }

  /* Find the closest unhit note that matches this string+finger */
  let bestIdx=-1,bestDiff=9999;
  for(let i=0;i<st.notes.length;i++){
    const n=st.notes[i];
    if(n.hit||n.judge)continue;
    if(n.s!==si||n.f!==sm)continue;
    const diff=elapsed-n.hitTime;
    if(diff<-400)break;
    if(diff>400)continue;
    const absDiff=Math.abs(diff);
    if(absDiff<bestDiff){bestDiff=absDiff;bestIdx=i;}
  }
  if(bestIdx<0)return;
  const n=st.notes[bestIdx];

  /* Check if bowing the right string too */
  const hasBow=st.bowActive[si]&&(now-st.bowActive[si])<800;
  const hasNote=st.notePressed[si+'_'+sm]&&(now-st.notePressed[si+'_'+sm])<800;
  if(!hasBow&&!hasNote)return;

  if(bestDiff<=80){
    n.judge='perfect';n.hit=true;st.perfect++;st.combo++;
    st.multiplier=Math.min(4,1+Math.floor(st.combo/10));
    st.score+=100*st.multiplier;
    showJudge('PERFECT!','#ffd700');
    AE.playSfx('perfect');
    n.flashTimer=performance.now();
  }else if(bestDiff<=160){
    n.judge='good';n.hit=true;st.good++;st.combo++;
    st.multiplier=Math.min(4,1+Math.floor(st.combo/10));
    st.score+=60*st.multiplier;
    showJudge('GOOD','#44ddee');
    n.flashTimer=performance.now();
  }else if(bestDiff<=300){
    n.judge='ok';n.hit=true;st.ok++;st.combo++;
    st.multiplier=Math.min(4,1+Math.floor(st.combo/10));
    st.score+=30*st.multiplier;
    showJudge('OK','#44ee44');
    n.flashTimer=performance.now();
  }

  if(n.hit){
    st.maxCombo=Math.max(st.maxCombo,st.combo);
    st.lastHitNote=n;
    delete st.notePressed[si+'_'+sm];
    /* If we were in wait-pause (easy mode), adjust startTime to compensate for pause duration */
    if(st.waitPaused){
      const pauseDur=performance.now()-st.waitPauseStart;
      st.startTime+=pauseDur;
      st.waitPaused=false;
      /* Clear highlights */
      document.querySelectorAll('.nb.highlight,.ob.highlight').forEach(el=>el.classList.remove('highlight'));
    }
    /* Advance noteIdx past hit notes */
    while(st.noteIdx<st.notes.length&&st.notes[st.noteIdx].hit)st.noteIdx++;
  }
}

function updateRhythm(now){
  if(!rhythmState||!rhythmState.active)return;
  const st=rhythmState;

  /* STEP MODE: 노트가 판정선까지 내려와 멈추고 대기 → 맞는 음을 누르면 다음 노트가 내려옴. no miss / no health */
  if(st.stepMode){
    let nextN=null;
    for(let i=st.noteIdx;i<st.notes.length;i++){
      if(!st.notes[i].hit&&!st.notes[i].judge){nextN=st.notes[i];break;}
    }
    if(nextN){
      /* 시간을 노트의 hitTime에서 클램프 → 노트가 판정선에 닿으면 그 자리에서 정지(대기). 누르면 noteIdx가 넘어가 다음 노트가 내려옴 */
      if((now-st.startTime)>nextN.hitTime){ st.startTime=now-nextN.hitTime; }
    }
    document.getElementById('hudScore').textContent=st.score+'점';
    const comboTxt2=st.combo>1?(st.combo+'COMBO'+(st.multiplier>1?' x'+st.multiplier:'')):'';
    document.getElementById('hudCombo').textContent=comboTxt2;
    const lastN=st.notes[st.notes.length-1];
    if(lastN&&lastN.hit&&!st.finished){
      st.finished=true;st.active=false;
      finishRhythm();
    }
    return;
  }

  const elapsed=now-st.startTime;

  /* Check for misses */
  for(let i=st.noteIdx;i<st.notes.length;i++){
    const n=st.notes[i];
    if(n.hit||n.judge)continue;
    const diff=elapsed-n.hitTime;
    if(diff>350){
      if(st.practice||(st.difficulty==='easy'&&!st.waitPaused)){
        /* In easy/practice mode, pause time until correct note is pressed */
        /* Highlight what to press */
        st.waitPaused=true;
        st.waitPauseStart=now;
        highlightNote(n.s,n.f);
        return; /* Freeze progression */
      }
      if(st.waitPaused){
        /* Still waiting for correct note in easy mode */
        highlightNote(n.s,n.f);
        return;
      }
      n.judge='miss';n.hit=true;
      st.miss++;st.combo=0;st.multiplier=1;
      st.health=Math.max(0,st.health-st.missDmg);
      showJudge('MISS','#ff4444');
      AE.playSfx('miss');
      n.flashTimer=now;
      st.noteIdx=i+1;

      if(st.health<=0&&!st.gameOver){
        st.gameOver=true;st.active=false;
        AE.playSfx('gameover');
        showGameOver();
        return;
      }
    }else{
      break;
    }
  }

  /* Update HUD */
  document.getElementById('hudScore').textContent=st.score+'점';
  const comboTxt=st.combo>1?(st.combo+'COMBO'+(st.multiplier>1?' x'+st.multiplier:'')):'';
  document.getElementById('hudCombo').textContent=comboTxt;
  const hpPct=Math.round(st.health/st.maxHealth*100);
  document.getElementById('healthFill').style.width=hpPct+'%';
  if(hpPct<30) document.getElementById('healthFill').style.background='linear-gradient(90deg,#ff2222,#ff6644)';
  else if(hpPct<60) document.getElementById('healthFill').style.background='linear-gradient(90deg,#ff8844,#ffdd33)';
  else document.getElementById('healthFill').style.background='linear-gradient(90deg,#44ee44,#44ddee)';

  /* Check if finished */
  const lastNote=st.notes[st.notes.length-1];
  if(lastNote&&elapsed>lastNote.hitTime+2000&&!st.finished){
    st.finished=true;st.active=false;
    finishRhythm();
  }
}

function renderRhythm(now){
  if(!rhythmState)return;
  rc.clearRect(0,0,RW,RH);
  if(!rhythmState.active&&!rhythmState.finished&&!rhythmState.gameOver)return;

  const st=rhythmState;
  const elapsed=now-st.startTime;

  /* String lane backgrounds */
  for(let i=0;i<4;i++){
    const sx=strX(i);
    rc.save();rc.globalAlpha=.04;rc.fillStyle=SC[i];
    rc.fillRect(sx-18,0,36,RH);rc.restore();
  }

  /* Hit zone — 밝고 명확하게 */
  const hitY=RH-28;
  rc.save();
  /* 판정 영역 배경 — 잘 보이게 */
  rc.fillStyle='rgba(255,215,0,.25)';
  rc.fillRect(0,hitY-22,RW,44);
  /* 판정 라인 — 굵은 실선, 글로우 효과 */
  rc.shadowColor='#ffd700';rc.shadowBlur=12;
  rc.strokeStyle='rgba(255,215,0,.9)';rc.lineWidth=3;
  rc.beginPath();rc.moveTo(0,hitY);rc.lineTo(RW,hitY);rc.stroke();
  rc.shadowBlur=0;
  /* "여기서 터치!" 텍스트 */
  rc.fillStyle='rgba(255,215,0,.6)';rc.font='bold 10px sans-serif';rc.textAlign='right';
  rc.fillText('▶ 여기서 터치!',RW-4,hitY-24);

  /* Hit zone circles per string — 밝게 */
  for(let i=0;i<4;i++){
    const sx=strX(i);
    rc.beginPath();rc.arc(sx,hitY,18,0,Math.PI*2);
    rc.strokeStyle=SC[i];rc.lineWidth=2.5;rc.globalAlpha=.7;rc.stroke();
    rc.globalAlpha=.15;rc.fillStyle=SC[i];rc.fill();
    rc.globalAlpha=1;
  }
  rc.restore();

  /* Draw falling notes */
  st.notes.forEach(n=>{
    const timeToHit=n.hitTime-elapsed;

    /* Hit flash effect */
    if(n.hit&&n.flashTimer){
      const flashAge=now-n.flashTimer;
      if(flashAge<400){
        const col=n.judge==='perfect'?'#ffd700':n.judge==='good'?'#44ddee':n.judge==='ok'?'#44ee44':'#ff4444';
        const alpha=1-flashAge/400;
        const x=strX(n.s);
        rc.save();rc.globalAlpha=alpha*.6;
        rc.beginPath();rc.arc(x,hitY,20+flashAge*.05,0,Math.PI*2);
        rc.fillStyle=col;rc.fill();rc.restore();
      }
      return;
    }
    if(n.hit)return;

    if(timeToHit>st.scrollTime+500||timeToHit<-500)return;

    const progress=1-(timeToHit/st.scrollTime);
    const y=progress*hitY;
    const x=strX(n.s);
    const noteW=32;
    const noteH=Math.max(18,n.dur*22);

    /* Proximity glow */
    const proximity=1-Math.abs(timeToHit)/st.scrollTime;

    rc.save();
    rc.globalAlpha=.7+proximity*.3;
    const col=SC[n.s];

    /* Shadow */
    rc.shadowColor=col;rc.shadowBlur=proximity*15;

    /* Note pill */
    rc.fillStyle=col;
    rr(rc,x-noteW/2,y-noteH/2,noteW,noteH,noteH/2);rc.fill();

    /* Inner highlight */
    rc.globalAlpha=.3;
    rc.fillStyle='#fff';
    rr(rc,x-noteW/2+3,y-noteH/2+2,noteW-6,noteH/2-2,6);rc.fill();

    rc.restore();

    /* Note label */
    rc.fillStyle='#000';rc.font='bold 9px Georgia';rc.textAlign='center';rc.textBaseline='middle';
    rc.fillText(n.note,x,y-2);

    /* Finger indicator */
    if(n.f>0){
      rc.fillStyle='rgba(0,0,0,.6)';rc.font='7px Georgia';
      rc.fillText(n.f+'지',x,y+8);
    }
  });

  /* Multiplier display */
  if(st.multiplier>1){
    rc.save();rc.globalAlpha=.7;
    rc.fillStyle='#ffd700';rc.font='bold 14px Georgia';rc.textAlign='right';rc.textBaseline='top';
    rc.fillText('x'+st.multiplier,RW-8,30);rc.restore();
  }

  /* STEP MODE guidance — pulse ring on the waiting note + which string/finger to play */
  if(st.stepMode){
    let nextN=null;
    for(let i=st.noteIdx;i<st.notes.length;i++){
      if(!st.notes[i].hit&&!st.notes[i].judge){nextN=st.notes[i];break;}
    }
    if(nextN){
      const hy=RH-28, gx=strX(nextN.s);
      const osc=Math.abs(Math.sin(now/180));
      rc.save();
      rc.globalAlpha=.4+.4*osc;
      rc.strokeStyle='#ffd700';rc.lineWidth=3;rc.shadowColor='#ffd700';rc.shadowBlur=12;
      rc.beginPath();rc.arc(gx,hy,18+6*osc,0,Math.PI*2);rc.stroke();
      rc.restore();
      const SNAMES=['G','D','A','E'];
      rc.save();rc.textAlign='center';
      rc.fillStyle='#ffd700';rc.font='bold 14px Georgia';rc.globalAlpha=.95;
      rc.fillText('🎯 '+nextN.note+' 음을 켜세요',RW/2,38);
      rc.font='11px Georgia';rc.globalAlpha=.8;
      rc.fillText(SNAMES[nextN.s]+'선 · '+(nextN.f>0?nextN.f+'번 손가락':'개방현'),RW/2,55);
      rc.restore();
    }
  }
}

function finishRhythm(){
  const st=rhythmState;
  const total=st.notes.length;
  const pct=total>0?Math.round((st.perfect*100+st.good*70+st.ok*40)/(total*100)*100):0;
  const starCount=pct>=90?3:pct>=70?2:pct>=50?1:0;

  /* Save best score & stars */
  const scoreKey='rhythm_'+st.songKey+'_'+st.difficulty;
  const starsKey='rhythm_stars_'+st.songKey+'_'+st.difficulty;
  const prev=loadProgress();
  const updates={};
  if((prev[scoreKey]||0)<st.score) updates[scoreKey]=st.score;
  if((prev[starsKey]||0)<starCount) updates[starsKey]=starCount;
  if(Object.keys(updates).length>0) saveProgress(updates);

  const stars=starCount>=3?'★★★':starCount>=2?'★★☆':starCount>=1?'★☆☆':'☆☆☆';
  const panel=document.getElementById('panel');
  panel.innerHTML=`
    <h2>🎵 결과</h2>
    <div style="text-align:center;padding:20px 0;">
      <div style="font-size:36px;color:#ffd700;margin-bottom:8px">${stars}</div>
      <div style="font-size:24px;color:#ffd700;font-weight:700">${st.score}점</div>
      <div style="font-size:12px;color:rgba(240,230,200,.7);margin-top:8px">
        Perfect: ${st.perfect} / Good: ${st.good} / OK: ${st.ok} / Miss: ${st.miss}
      </div>
      <div style="font-size:12px;color:#ff6644;margin-top:4px">
        최대 콤보: ${st.maxCombo} · 배율: x${st.multiplier}
      </div>
      <div style="font-size:11px;color:rgba(201,169,110,.5);margin-top:8px">
        난이도: ${DIFF_LABELS[st.difficulty]} · 달성률: ${pct}%
      </div>
      <div style="font-size:10px;color:rgba(201,169,110,.3);margin-top:4px">
        체력: ${Math.round(st.health)}/${st.maxHealth}
      </div>
    </div>
    <div class="pBtn" id="retryBtn">다시 도전</div>
    <div class="pBtn" id="backBtn">곡 선택으로</div>
    <div class="pClose" id="panelClose2">✕</div>
  `;
  panel.style.display='block';

  document.getElementById('retryBtn').addEventListener('pointerdown',e=>{
    e.preventDefault();panel.style.display='none';
    startRhythmCountdown(st.songKey);
  });
  document.getElementById('backBtn').addEventListener('pointerdown',e=>{
    e.preventDefault();panel.style.display='none';
    rhythmState=null;
    document.getElementById('rhythmCv').style.display='none';
    document.getElementById('gameHud').style.display='none';
    document.getElementById('healthBar').style.display='none';
    showRhythmSongSelect();
  });
  document.getElementById('panelClose2').addEventListener('pointerdown',e=>{
    e.preventDefault();panel.style.display='none';
    exitMode();currentMode='free';
    document.querySelectorAll('.mtab').forEach(t=>t.classList.remove('active'));
    document.querySelector('[data-mode="free"]').classList.add('active');
    document.getElementById('modeLabel').textContent='자유연주';
  });
}

function startLesson(lv){
  const lesson=LESSONS[lv-1];if(!lesson)return;
  const seq=[];
  lesson.targets.forEach(t=>{for(let i=0;i<t.count;i++) seq.push({s:t.s,f:t.f,done:false});});
  learnState={active:true,lv,lesson,seq,idx:0,bowHit:false,noteHit:false};
  const info=document.getElementById('lessonInfo');
  info.style.display='block';
  document.getElementById('lessonTitle').textContent='Lv.'+lv+' '+lesson.title;
  document.getElementById('lessonSub').textContent=lesson.desc;
  highlightCurrentLearnTarget();
  speak(lesson.desc);
}

function highlightCurrentLearnTarget(){
  if(!learnState||learnState.idx>=learnState.seq.length)return;
  const t=learnState.seq[learnState.idx];
  highlightNote(t.s,t.f);
}

function learnHit(si,sm){
  if(!learnState||!learnState.active)return;
  const t=learnState.seq[learnState.idx];if(!t)return;
  if(si===t.s&&sm===t.f){learnState.noteHit=true;checkLearnComplete();}
}

function learnBow(si){
  if(!learnState||!learnState.active)return;
  const t=learnState.seq[learnState.idx];if(!t)return;
  if(si===t.s){learnState.bowHit=true;checkLearnComplete();}
}

function checkLearnComplete(){
  if(!learnState)return;
  const t=learnState.seq[learnState.idx];
  const needNote=t.f>0;
  const ok=needNote?(learnState.noteHit&&learnState.bowHit):learnState.bowHit;
  if(ok){
    t.done=true;learnState.idx++;learnState.bowHit=false;learnState.noteHit=false;
    if(learnState.idx>=learnState.seq.length){finishLesson();}
    else{
      highlightCurrentLearnTarget();
      const next=learnState.seq[learnState.idx];
      const noteName=next.f===0?SN[next.s]:AE.nn(AE.freq(next.s,next.f));
      speak('다음: '+noteName);
    }
  }
}

function finishLesson(){
  const lv=learnState.lv;
  saveProgress({['lesson_'+lv]:true});
  clearHighlights();
  document.getElementById('lessonInfo').style.display='none';
  speak('레슨 '+lv+' 완료! 축하합니다!');

  const panel=document.getElementById('panel');
  panel.innerHTML=`
    <h2>🎉 레슨 ${lv} 완료!</h2>

    </div>

    <div class="pBtn" id="lessonBackBtn">레슨 목록으로</div>
    <div class="pClose" id="panelClose3">✕</div>
  `;
  panel.style.display='block';
  learnState.active=false;

  if(document.getElementById('nextLessonBtn')){
    document.getElementById('nextLessonBtn').addEventListener('pointerdown',e=>{
      e.preventDefault();panel.style.display='none';startLesson(lv+1);
    });
  }
  document.getElementById('lessonBackBtn').addEventListener('pointerdown',e=>{
    e.preventDefault();panel.style.display='none';learnState=null;showLessonSelect();
  });
  document.getElementById('panelClose3').addEventListener('pointerdown',e=>{
    e.preventDefault();panel.style.display='none';
    exitMode();currentMode='free';
    document.querySelectorAll('.mtab').forEach(t=>t.classList.remove('active'));
    document.querySelector('[data-mode="free"]').classList.add('active');
    document.getElementById('modeLabel').textContent='자유연주';
  });
}

function speak(text){

    window.speechSynthesis.speak(u);
  }catch(e){}
}

function startPerformance(songKey){
  const song=SONGS[songKey];const bpm=song.bpm;const beatMs=60000/bpm;
  const timeline=[];let beatPos=0;
  song.notes.forEach(n=>{
    timeline.push({note:n.note,s:n.s,f:n.f,dur:n.dur,startMs:beatPos*beatMs,endMs:(beatPos+n.dur)*beatMs,hit:false});
    beatPos+=n.dur;
  });
  performState={active:true,songKey,song,bpm,beatMs,timeline,totalMs:beatPos*beatMs,
    startTime:performance.now(),chordIdx:0,lastChordTime:0,accompaniment:true,noteIdx:0,
    score:0,correct:0,partial:0,miss:0,combo:0,maxCombo:0,bowStr:-1,bowTime:0,lastNote:null};
  document.getElementById('sheetArea').style.display='block';
  resizeSheetCv();
  document.getElementById('gameHud').style.display='block';
  document.getElementById('hudSong').textContent=song.name;
  document.getElementById('hudScore').textContent='0점';
  document.getElementById('hudCombo').textContent='';
  scheduleChords();
}

function resizeSheetCv(){
  const area=document.getElementById('sheetArea');const r=area.getBoundingClientRect();
  sheetCv.width=r.width*dpr;sheetCv.height=r.height*dpr;
  sheetCv.style.width=r.width+'px';sheetCv.style.height=r.height+'px';
  sctx.setTransform(dpr,0,0,dpr,0,0);
}

function scheduleChords(){
  if(!performState||!performState.active||!performState.accompaniment)return;
  const st=performState;const chords=CHORDS[st.songKey];
  if(!chords||chords.length===0)return;
  const elapsed=performance.now()-st.startTime;
  const chordDur=st.beatMs*4/1000;const chordMs=st.beatMs*4;
  if(elapsed-st.lastChordTime>=chordMs-50){
    const chord=chords[st.chordIdx%chords.length];
    AE.playChord(chord,chordDur);st.chordIdx++;st.lastChordTime=elapsed;
  }
}

function performHit(si,sm){
  if(!performState||!performState.active)return;
  const st=performState;
  const n=st.timeline[st.noteIdx];
  if(!n||n.note==='R'||n.hit)return;
  const elapsed=performance.now()-st.startTime;
  if(elapsed<n.startMs-200||elapsed>n.endMs+200)return;
  st.lastNote={s:si,f:sm};
  checkPerformNote(si,sm);
}
function performBow(si){
  if(!performState||!performState.active)return;
  const st=performState;
  st.bowTime=performance.now();st.bowStr=si;
  checkPerformNote(si,semi[si]);
}
function checkPerformNote(si,sm){
  if(!performState||!performState.active)return;
  const st=performState;const now=performance.now();
  const n=st.timeline[st.noteIdx];
  if(!n||n.note==='R'||n.hit)return;
  const elapsed=now-st.startTime;
  if(elapsed<n.startMs-200||elapsed>n.endMs+200)return;
  const hasBow=st.bowStr===n.s&&st.bowTime&&(now-st.bowTime)<1000;
  const hasNote=st.lastNote&&st.lastNote.s===si&&st.lastNote.f===sm;
  if(!hasBow&&!hasNote)return;
  if(si===n.s&&sm===n.f){
    n.hit=true;st.correct++;st.combo++;st.maxCombo=Math.max(st.maxCombo,st.combo);
    const mid=(n.startMs+n.endMs)/2;const diff=Math.abs(elapsed-mid);
    if(diff<n.dur*st.beatMs*0.25){st.score+=100;showJudge('PERFECT!','#ffd700');AE.playSfx('perfect');}
    else{st.score+=60;showJudge('GOOD','#44ddee');}
    document.getElementById('hudScore').textContent=st.score+'점';
    document.getElementById('hudCombo').textContent=st.combo>1?st.combo+'COMBO':'';
  }else if(si===n.s){
    st.score+=20;n.hit=true;st.partial++;st.combo=0;
    showJudge('OK','#44ee44');
    document.getElementById('hudScore').textContent=st.score+'점';
    document.getElementById('hudCombo').textContent='';
  }else{
    st.combo=0;st.miss++;
    showJudge('MISS','#ff4444');AE.playSfx('miss');
    document.getElementById('hudCombo').textContent='';
    highlightNote(n.s,n.f);
  }
}

function updatePerform(now){
  if(!performState||!performState.active)return;
  const st=performState;const elapsed=now-st.startTime;
  let curNote=null;
  for(let i=0;i<st.timeline.length;i++){
    const n=st.timeline[i];
    if(elapsed>=n.startMs&&elapsed<n.endMs){
      curNote=n;
      if(st.noteIdx!==i){
        for(let j=st.noteIdx;j<i;j++){
          const prev=st.timeline[j];
          if(!prev.hit&&prev.note!=='R'){prev.hit=true;st.miss++;st.combo=0;
            document.getElementById('hudCombo').textContent='';}
        }
        st.noteIdx=i;
        if(n.note!=='R'&&n.s>=0)highlightNote(n.s,n.f);else clearHighlights();
      }
      break;
    }
  }
  if(!curNote&&elapsed>st.totalMs+1000){
    for(let j=st.noteIdx;j<st.timeline.length;j++){
      const prev=st.timeline[j];
      if(!prev.hit&&prev.note!=='R'){prev.hit=true;st.miss++;}
    }
    st.active=false;clearHighlights();
    document.getElementById('sheetArea').style.display='none';
    finishPerform();return;
  }
  scheduleChords();
}

function finishPerform(){
  const st=performState;
  const total=st.timeline.filter(n=>n.note!=='R').length;
  const pct=total>0?Math.round((st.correct*100+st.partial*50)/(total*100)*100):0;
  const starCount=pct>=90?3:pct>=70?2:pct>=50?1:0;
  const stars=starCount>=3?'★★★':starCount>=2?'★★☆':starCount>=1?'★☆☆':'☆☆☆';

  const scoreKey='perform_'+st.songKey;
  const starsKey='perform_stars_'+st.songKey;
  const prev=loadProgress();const updates={};
  if((prev[scoreKey]||0)<st.score)updates[scoreKey]=st.score;
  if((prev[starsKey]||0)<starCount)updates[starsKey]=starCount;
  if(Object.keys(updates).length>0)saveProgress(updates);

  const panel=document.getElementById('panel');
  panel.innerHTML=`
    <h2>🎶 연주 결과</h2>
    <div style="text-align:center;padding:20px 0;">
      <div style="font-size:36px;color:#ffd700;margin-bottom:8px">${stars}</div>
      <div style="font-size:24px;color:#ffd700;font-weight:700">${st.score}점</div>
      <div style="font-size:12px;color:rgba(240,230,200,.7);margin-top:8px">
        정확: ${st.correct} / 부분: ${st.partial} / 미스: ${st.miss}
      </div>
      <div style="font-size:12px;color:#ff6644;margin-top:4px">
        최대 콤보: ${st.maxCombo} · 달성률: ${pct}%
      </div>
    </div>
    <div class="pBtn" id="perfRetryBtn">다시 연주</div>
    <div class="pBtn" id="perfBackBtn">곡 선택으로</div>
    <div class="pClose" id="perfCloseBtn">✕</div>
  `;
  panel.style.display='block';
  document.getElementById('gameHud').style.display='none';

  document.getElementById('perfRetryBtn').addEventListener('pointerdown',e=>{
    e.preventDefault();panel.style.display='none';startPerformance(st.songKey);
  });
  document.getElementById('perfBackBtn').addEventListener('pointerdown',e=>{
    e.preventDefault();panel.style.display='none';performState=null;showPerformSongSelect();
  });
  document.getElementById('perfCloseBtn').addEventListener('pointerdown',e=>{
    e.preventDefault();panel.style.display='none';performState=null;
    currentMode='free';
    document.querySelectorAll('.mtab').forEach(t=>t.classList.remove('active'));
    document.querySelector('[data-mode="free"]').classList.add('active');
    document.getElementById('modeLabel').textContent='자유연주';
  });
}

function renderSheet(now){
  if(!performState||!document.getElementById('sheetArea').offsetParent)return;
  const area=document.getElementById('sheetArea').getBoundingClientRect();
  const W=area.width,H=area.height;
  sctx.clearRect(0,0,W,H);
  if(!performState.active)return;
  const st=performState;const elapsed=now-st.startTime;
  sctx.fillStyle='rgba(20,15,10,.3)';sctx.fillRect(0,0,W,H);
  const staffY=H/2;
  sctx.strokeStyle='rgba(255,215,0,.15)';sctx.lineWidth=0.5;
  for(let l=-2;l<=2;l++){const y=staffY+l*6;sctx.beginPath();sctx.moveTo(0,y);sctx.lineTo(W,y);sctx.stroke();}
  const pixPerMs=W/(st.beatMs*8);const centerX=60;
  st.timeline.forEach(n=>{
    if(n.note==='R')return;
    const x=centerX+(n.startMs-elapsed)*pixPerMs;
    if(x<-30||x>W+30)return;
    const noteH=n.dur*pixPerMs*st.beatMs;
    const col=n.s>=0?SC[n.s]:'#ffd700';
    const isCurrent=elapsed>=n.startMs&&elapsed<n.endMs;
    sctx.save();sctx.globalAlpha=isCurrent?1:.6;sctx.fillStyle=col;
    if(isCurrent){sctx.shadowColor=col;sctx.shadowBlur=8;}
    const noteY=staffY-12+n.s*6;
    rr(sctx,x,noteY,Math.max(noteH,8),8,4);sctx.fill();
    sctx.fillStyle='#fff';sctx.font='bold 7px Georgia';sctx.textAlign='center';sctx.textBaseline='middle';
    sctx.fillText(n.note,x+Math.max(noteH,8)/2,noteY+4);sctx.restore();
  });
  sctx.strokeStyle='rgba(255,215,0,.6)';sctx.lineWidth=1.5;
  sctx.beginPath();sctx.moveTo(centerX,0);sctx.lineTo(centerX,H);sctx.stroke();
}

/* ═══════════════════════════════════════════════════════════
   RESIZE
   ═══════════════════════════════════════════════════════════ */
function resize(){
  dpr=devicePixelRatio||1;
  const appR=document.getElementById('app').getBoundingClientRect();
  totalW=appR.width;totalH=appR.height;
  osW=document.getElementById('osCol').getBoundingClientRect().width;
  bgCv.width=totalW*dpr;bgCv.height=totalH*dpr;bgCv.style.width=totalW+'px';bgCv.style.height=totalH+'px';
  bg.setTransform(dpr,0,0,dpr,0,0);
  const hdH=document.getElementById('hd').getBoundingClientRect().height;
  const mtH=document.getElementById('modeTabs').getBoundingClientRect().height;
  const fbH=document.getElementById('fb').getBoundingClientRect().height;
  fbTop=hdH+mtH;fbBot=hdH+mtH+fbH;
  drawBG();
  const bR=bowCv.parentElement.getBoundingClientRect();
  BW=bR.width;BH=bR.height;
  bowCv.width=BW*dpr;bowCv.height=BH*dpr;bowCv.style.width=BW+'px';bowCv.style.height=BH+'px';
  bc.setTransform(dpr,0,0,dpr,0,0);
  if(rhythmState)resizeRhythmCv();
  if(performState&&document.getElementById('sheetArea').offsetParent)resizeSheetCv();
}

/* ═══════════════════════════════════════════════════════════
   MAIN LOOP
   ═══════════════════════════════════════════════════════════ */
let lt=performance.now();
function frame(ts){
  const dt=Math.min(.05,(ts-lt)/1000);lt=ts;
  for(let i=0;i<4;i++){
    if(actS===i&&bow.dn){vib[i]+=(bow.spd-vib[i])*dt*12;vibP[i]+=dt*48;}
    else{vib[i]*=Math.max(0,1-dt*6);if(vib[i]<.004)vib[i]=0;vibP[i]+=dt*48*vib[i];}
  }
  if(!bow.dn)bow.spd*=Math.max(0,1-dt*10);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=55*dt;p.life-=dt*2.8;if(p.life<=0)parts.splice(i,1);}
  renderBow();
  document.getElementById('nd').textContent=bow.dn&&curN?curN:'';

  if(currentMode==='rhythm'){updateRhythm(ts);renderRhythm(ts);}
  if(currentMode==='perform'){updatePerform(ts);renderSheet(ts);}

  const lt2=document.getElementById('loadTxt');
  if(lt2&&!audioOn)lt2.textContent='';
  else if(lt2&&audioOn&&!AE.loaded)lt2.textContent='🎵 Loading violin samples...';
  requestAnimationFrame(frame);
}

/* ═══════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════ */
function ensureA(){if(!audioOn){AE.init();audioOn=true;document.getElementById('ov').classList.add('H');}AE.res();}
document.getElementById('ov').addEventListener('pointerdown',e=>{e.preventDefault();ensureA();});
buildFB();buildOS();
requestAnimationFrame(()=>{resize();requestAnimationFrame(frame);});
window.addEventListener('resize',resize);

/* Practice toggle button */
document.getElementById('practiceToggle').addEventListener('pointerdown',e=>{
  e.preventDefault();
  practiceMode=!practiceMode;
  e.target.classList.toggle('active',practiceMode);
});
</script>
