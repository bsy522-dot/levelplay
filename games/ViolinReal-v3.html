<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>바이올린</title>
<style>
:root{--bar:56px;
  --nbH:clamp(48px,calc((100dvh - 64px)*0.07),96px);
  --nbF:clamp(18px,calc(var(--nbH)*0.46),34px);}
/* 폰 가로 등 낮은 화면: 윗줄·지판을 줄여 활 영역(리듬 판정선)이 화면 안에 들어오게 */
@media (max-height:560px){:root{--bar:48px;--nbH:clamp(24px,calc((100dvh - 48px - 44px - 120px)/8),48px);--nbF:16px;}}
*{margin:0;padding:0;box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;background:#0a0a0a;
  font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100vw;position:relative;overflow:hidden;}
#bgCv{position:absolute;inset:0;z-index:0;width:100%;height:100%;display:block;pointer-events:none;}

/* 윗줄 한 줄: 모드 탭(자주 쓰는 2개 + 더 보기) + ⚙ 설정 */
#hd{display:flex;align-items:stretch;gap:6px;height:var(--bar);flex:0 0 auto;padding:4px 6px 3px;
  z-index:25;position:relative;background:#1b120a;border-bottom:1px solid rgba(255,215,0,.2);}
#modeTabs{display:flex;gap:6px;flex:1;min-width:0;}
.mtab,#moreBtn{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:700;color:#eadcbc;cursor:pointer;border-radius:12px;padding:0 6px;
  border:2px solid transparent;background:rgba(255,255,255,.06);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mtab.active,#moreBtn.active{color:#ffd700;background:rgba(255,215,0,.14);border-color:rgba(255,215,0,.6);}
.mtab:active,#moreBtn:active{transform:scale(.96);}
#moreWrap{position:relative;flex:1;min-width:0;display:flex;}
#moreMenu{position:absolute;top:calc(100% + 8px);right:0;min-width:max(100%,170px);z-index:40;display:none;
  flex-direction:column;gap:6px;padding:6px;background:#241709;border:1px solid rgba(255,215,0,.4);
  border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.55);}
#moreMenu.open{display:flex;}
#moreMenu .mtab{flex:none;min-height:56px;padding:0 18px;}
#gear{flex:0 0 48px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#eadcbc;
  cursor:pointer;border-radius:12px;background:rgba(255,255,255,.06);border:2px solid transparent;}
#gear.open{color:#ffd700;border-color:rgba(255,215,0,.6);background:rgba(255,215,0,.14);}

/* ⚙ 설정 칸 (펼침) */
#setPanel{display:none;position:absolute;top:calc(var(--bar) + 6px);right:6px;z-index:45;
  width:min(440px,calc(100% - 12px));max-height:calc(100% - var(--bar) - 12px);overflow-y:auto;
  background:#1f150b;border:1px solid rgba(255,215,0,.4);border-radius:16px;padding:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.6);touch-action:pan-y;}
#setPanel.open{display:block;}
.sRow{margin-bottom:14px;}
.sLbl{font-size:16px;font-weight:700;color:#eadcbc;margin-bottom:6px;}
.sSeg{display:flex;gap:6px;}
.sbtn{flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:4px 8px;border-radius:12px;font-size:16px;font-weight:700;color:#eadcbc;cursor:pointer;
  background:rgba(255,255,255,.06);border:2px solid rgba(255,215,0,.2);}
.sbtn.on{color:#1b120a;background:#ffd700;border-color:#ffd700;}
#howtoBox{font-size:16px;line-height:1.6;color:#f0e6c8;}
#howtoBox div{margin-bottom:4px;}

/* 지판: 맨 윗줄 = 개방현 4칸, 아래 7줄 = 누르는 음 (현마다 한 칸, 줄과 세로선이 맞음) */
#fb{flex:0 0 auto;position:relative;z-index:3;padding:6px 4px;}
#noteArea{display:flex;flex-direction:column;position:relative;z-index:2;}
#shdr{display:flex;gap:4px;margin-bottom:4px;}
#ng{display:flex;flex-direction:column;gap:4px;}
.nr{display:flex;gap:4px;}
.ob,.nb{flex:1;min-width:0;height:var(--nbH);border-radius:14px;display:flex;align-items:center;
  justify-content:center;font-size:var(--nbF);font-weight:800;cursor:pointer;line-height:1;}
.ob{border:3px solid;background:rgba(10,8,5,.62);transition:transform .08s;}
.ob:active,.ob.on{transform:scale(.94);background:rgba(255,255,255,.14);}
.ob[data-i="0"]{border-color:#44ee44;color:#44ee44;}
.ob[data-i="1"]{border-color:#cc55ff;color:#d67cff;}
.ob[data-i="2"]{border-color:#44ddee;color:#44ddee;}
.ob[data-i="3"]{border-color:#ffdd33;color:#ffdd33;}
.nb{background:rgba(255,250,235,.13);border:1px solid rgba(200,190,160,.28);color:#f7efdc;
  text-shadow:0 1px 3px rgba(0,0,0,.8);transition:transform .06s,background .06s;}
.nl{white-space:nowrap;}
.oc{font-size:.7em;font-weight:700;margin-left:1px;}
.o3{color:#a6f5a6;}.o4{color:#ffe08a;}.o5{color:#94deff;}.o6{color:#ffb3de;}
.ob .oc{color:inherit;}
/* 반음(♯) 버튼: 기본은 흐리게(글자 없음) — ⚙ 에서 또렷하게. 안내(반짝임)·누름 중에는 보임 */
.nb.sharp:not(.on):not(.sel):not(.highlight){background:rgba(255,250,235,.045);border-color:rgba(200,190,160,.12);}
body.showSharp .nb.sharp:not(.on):not(.sel):not(.highlight){background:rgba(255,250,235,.13);border-color:rgba(200,190,160,.28);}
.nb.sharp .nl{visibility:hidden;}
body.showSharp .nb.sharp .nl,.nb.sharp.on .nl,.nb.sharp.sel .nl,.nb.sharp.highlight .nl{visibility:visible;}
.nb:active,.nb.on{transform:scale(.94);
  background:rgba(255,215,0,.3);border-color:rgba(255,215,0,.45);
  color:#fff;box-shadow:0 0 10px rgba(255,215,0,.25);}
.nb.sel{background:rgba(255,215,0,.22);border-color:rgba(255,215,0,.5);color:#ffe9a0;}
.nb.highlight,.ob.highlight{animation:hlPulse .55s ease-in-out infinite;
  border-color:#ff6b6b;color:#fff;position:relative;z-index:4;}
@keyframes hlPulse{
  0%,100%{transform:scale(1);background:rgba(255,90,90,.18);
    box-shadow:0 0 8px rgba(255,90,90,.5),0 0 3px rgba(255,215,0,.4);}
  50%{transform:scale(1.06);background:rgba(255,90,90,.42);
    box-shadow:0 0 20px rgba(255,90,90,.95),0 0 9px rgba(255,215,0,.65);}}

/* 활 영역(몸통) */
#bz{flex:1;position:relative;z-index:2;min-height:160px;overflow:hidden;}
@media (max-height:560px){#bz{min-height:110px;}}
#bowCv{display:block;width:100%;height:100%;position:relative;z-index:1;touch-action:none;}
#nd{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:8;
  font-size:34px;font-weight:800;color:#ffd700;
  text-shadow:0 0 14px rgba(255,215,0,.6),0 2px 4px rgba(0,0,0,.6);pointer-events:none;}

/* 리듬 게임 */
#rhythmCv{position:absolute;inset:0;z-index:4;pointer-events:none;display:none;}
#gameHud{display:none;position:absolute;top:0;left:0;right:0;z-index:10;padding:4px 10px;
  background:linear-gradient(180deg,rgba(0,0,0,.65),rgba(0,0,0,0));pointer-events:none;}
#gameHud>div{display:flex;justify-content:space-between;align-items:center;}
.hudItem{font-size:16px;color:#ffd700;text-shadow:0 1px 3px rgba(0,0,0,.8);font-weight:700;}
.hudCombo{font-size:18px;color:#ff7a5c;text-shadow:0 0 10px rgba(255,100,68,.5);font-weight:800;}
#judgeTxt{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);white-space:nowrap;
  font-size:34px;font-weight:900;pointer-events:none;z-index:11;
  text-shadow:0 0 4px #000,0 2px 2px #000,0 0 20px currentColor;opacity:0;transition:opacity .15s;}
#healthBar{position:absolute;top:28px;left:10px;right:10px;height:6px;z-index:10;
  background:rgba(0,0,0,.4);border-radius:3px;display:none;pointer-events:none;}
#healthFill{width:100%;height:100%;background:linear-gradient(90deg,#ff4444,#44ee44);border-radius:3px;transition:width .2s;}

/* 곡·레슨 고르기 칸 (윗줄 아래를 덮음 — 윗줄 탭은 그대로 누를 수 있음) */
#panel{display:none;position:absolute;top:var(--bar);left:0;right:0;bottom:0;z-index:20;
  background:rgba(10,8,6,.95);backdrop-filter:blur(4px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 28px;touch-action:pan-y;}
#panel h2{font-size:22px;color:#ffd700;margin:6px 60px 10px;text-align:center;letter-spacing:1px;}
.pHint{font-size:16px;color:#eadcbc;text-align:center;margin:0 0 10px;}
.pList{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:10px;}
.pBtn{display:block;width:100%;min-height:64px;padding:12px 14px;margin:8px 0;
  background:rgba(255,250,235,.08);border:1px solid rgba(200,190,160,.28);
  border-radius:14px;color:#f7efdc;font-size:18px;font-weight:700;
  font-family:inherit;cursor:pointer;text-align:left;transition:background .15s;}
.pList .pBtn{margin:0;}
.pBtn:active{background:rgba(255,215,0,.2);border-color:rgba(255,215,0,.35);}
.pTop{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 8px;}
.pBtn .sub{font-size:16px;font-weight:400;color:#cdb282;margin-top:4px;}
.pBtn.locked{opacity:.45;}
.pBtn .stars{color:#ffd700;font-size:16px;white-space:nowrap;}
.lvN{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;
  border-radius:17px;margin-right:8px;background:rgba(255,215,0,.16);color:#ffd700;font-size:16px;}
.pClose{position:absolute;top:10px;right:10px;z-index:22;width:48px;height:48px;font-size:22px;color:#ffd700;
  cursor:pointer;background:rgba(0,0,0,.5);border-radius:50%;
  display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,215,0,.4);}
body:not(.showInfo) .info{display:none;}
.diffRow{display:flex;gap:8px;margin:6px 0 12px;justify-content:center;}
.diffBtn{flex:1 1 0;max-width:170px;min-width:0;min-height:52px;padding:0 6px;display:flex;align-items:center;justify-content:center;
  border-radius:14px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;
  border:2px solid rgba(255,215,0,.25);color:#eadcbc;background:rgba(255,250,235,.06);transition:all .15s;}
.diffBtn.active{background:rgba(255,215,0,.2);border-color:#ffd700;color:#ffd700;}
.diffBtn:active{transform:scale(.95);}
.catLabel{grid-column:1/-1;margin-top:6px;font-size:17px;font-weight:800;color:#e9c63a;padding:2px 4px;
  border-bottom:1px solid rgba(255,215,0,.2);}

/* 곡 연주 악보 줄 (활 영역 위쪽) */
#sheetArea{display:none;position:absolute;top:30px;left:0;right:0;height:76px;z-index:6;
  background:rgba(0,0,0,.55);border-top:1px solid rgba(255,215,0,.15);
  border-bottom:1px solid rgba(255,215,0,.15);overflow:hidden;}
#sheetCv{display:block;width:100%;height:100%;}

/* BPM selector (쓰지 않는 칸 — 그대로 숨김) */
#bpmSel{display:none;position:absolute;bottom:4px;left:8px;z-index:12;
  background:rgba(0,0,0,.6);border-radius:8px;padding:2px 6px;border:1px solid rgba(255,215,0,.2);}
#bpmSel select{background:transparent;color:#ffd700;border:none;font-size:16px;outline:none;}
#bpmSel option{background:#1a1008;color:#ffd700;}

#practiceToggle{display:none;position:absolute;bottom:6px;right:8px;z-index:12;
  background:rgba(0,0,0,.6);border-radius:12px;padding:0 14px;min-height:48px;line-height:44px;
  border:1px solid rgba(255,215,0,.3);color:#ffd700;font-size:16px;font-weight:700;cursor:pointer;}
#practiceToggle.active{background:rgba(255,215,0,.15);border-color:rgba(255,215,0,.5);}

/* 첫 화면: 큰 그림 카드 2장(누르면 바로 시작) */
#ov{position:fixed;inset:0;z-index:99990;background:rgba(10,10,30,.96);
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
  backdrop-filter:blur(3px);}
#ov .i{text-align:center;max-width:94%;}
.ovIcon{font-size:clamp(44px,7vh,72px);line-height:1.1;}
.ovTitle{font-size:clamp(30px,4.6vh,44px);color:#FFD700;font-weight:900;letter-spacing:2px;}
.ovLine{font-size:18px;color:#fff;font-weight:700;margin:6px 0 18px;}
#modeCards{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:0 auto 10px;}
.mcard{width:clamp(150px,38vw,300px);min-height:clamp(170px,28vh,320px);padding:14px 10px;border-radius:20px;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:rgba(255,255,255,.06);border:3px solid rgba(255,215,0,.22);
  transition:transform .12s,border-color .12s,background .12s,box-shadow .12s;}
.mcard.sel{border-color:#ffd700;background:rgba(255,215,0,.14);box-shadow:0 0 22px rgba(255,215,0,.35);}
.mcard:active{transform:scale(.96);}
.mcIcon{font-size:clamp(44px,8vh,84px);line-height:1;}
.mcTitle{font-size:clamp(20px,3.2vh,30px);color:#fff;font-weight:800;}
.mcBadge{font-size:16px;color:#0d2a14;font-weight:800;
  background:linear-gradient(135deg,#7CFF9E,#3CCB6E);border-radius:12px;padding:4px 10px;}
.mcBadge.alt{color:#2a1a00;background:linear-gradient(135deg,#FFD98A,#E0A94A);}
#loadTxt{font-size:16px;color:#c9a96e;margin-top:8px;min-height:1em;}

/* 처음 한 번 안내 한 줄 */
#freeHint{display:none;position:absolute;top:8px;left:50%;transform:translateX(-50%);
  z-index:12;background:rgba(0,0,0,.75);border:1px solid rgba(255,215,0,.4);
  border-radius:12px;padding:8px 14px;font-size:16px;line-height:1.5;color:#ffd700;
  max-width:94%;width:max-content;text-align:center;pointer-events:none;}
.H{display:none!important;}

#lessonInfo{display:none;position:absolute;bottom:70px;left:50%;transform:translateX(-50%);
  z-index:12;background:rgba(0,0,0,.75);border:1px solid rgba(255,215,0,.3);
  border-radius:12px;padding:8px 14px;max-width:92%;text-align:center;pointer-events:none;}
#lessonInfo .lt{font-size:18px;color:#ffd700;font-weight:800;}
#lessonInfo .ls{font-size:16px;color:#eadcbc;margin-top:2px;}

#countdown{display:none;position:absolute;inset:0;z-index:15;
  background:rgba(0,0,0,.5);align-items:center;justify-content:center;pointer-events:none;}
#countdownTxt{font-size:64px;color:#ffd700;font-weight:900;text-shadow:0 0 30px rgba(255,215,0,.6);}

#gameOver{display:none;position:absolute;inset:0;z-index:18;
  background:rgba(10,5,2,.85);backdrop-filter:blur(3px);
  align-items:center;justify-content:center;flex-direction:column;}
#gameOver .goTitle{font-size:28px;color:#ff5555;font-weight:900;
  text-shadow:0 0 20px rgba(255,68,68,.5);margin-bottom:12px;}
#gameOver .goScore{font-size:18px;color:#ffd700;margin-bottom:16px;}
.goBtn{min-height:48px;display:flex;align-items:center;padding:0 24px;border-radius:12px;font-size:16px;
  font-weight:700;font-family:inherit;cursor:pointer;border:1px solid rgba(255,215,0,.35);color:#ffd700;
  background:rgba(255,250,235,.08);margin:4px;}
.goBtn:active{background:rgba(255,215,0,.2);}
</style>
</head>
<body>
<div id="app">
<canvas id="bgCv"></canvas>

<div id="hd">
  <div id="modeTabs">
    <div class="mtab active" data-mode="free" role="button">자유 연주</div>
    <div class="mtab" data-mode="rhythm" role="button">리듬 게임</div>
    <div id="moreWrap">
      <div id="moreBtn" role="button" aria-haspopup="true">더 보기 ▾</div>
      <div id="moreMenu">
        <div class="mtab" data-mode="learn" role="button">배우기</div>
        <div class="mtab" data-mode="perform" role="button">곡 연주</div>
      </div>
    </div>
  </div>
  <div id="gear" role="button" aria-label="설정">⚙</div>
  <span id="modeLabel" hidden>자유 연주</span>
</div>

<div id="setPanel" role="dialog" aria-label="설정">
  <div class="sRow"><div class="sLbl">연주 방식</div><div class="sSeg">
    <div class="sbtn" data-set="im" data-v="nobow" role="button">👆 터치</div>
    <div class="sbtn" data-set="im" data-v="bow" role="button">🎻 활 긋기</div></div></div>
  <div class="sRow"><div class="sLbl">음이름</div><div class="sSeg">
    <div class="sbtn" data-set="names" data-v="doremi" role="button">도레미</div>
    <div class="sbtn" data-set="names" data-v="abc" role="button">C D E (영어)</div></div></div>
  <div class="sRow"><div class="sLbl">반음(♯) 버튼</div><div class="sSeg">
    <div class="sbtn" data-set="sharps" data-v="0" role="button">흐리게</div>
    <div class="sbtn" data-set="sharps" data-v="1" role="button">또렷하게</div></div></div>
  <div class="sRow"><div class="sLbl">리듬 게임 빠르기</div><div class="sSeg">
    <div class="sbtn" data-set="spd" data-v="1" role="button">⚡ 보통</div>
    <div class="sbtn" data-set="spd" data-v="0.75" role="button">🐢 느리게</div></div></div>
  <div class="sRow"><div class="sLbl">리듬 게임 연습 모드 (틀려도 멈추고 기다려요)</div><div class="sSeg">
    <div class="sbtn" data-set="prac" data-v="0" role="button">끄기</div>
    <div class="sbtn" data-set="prac" data-v="1" role="button">켜기</div></div></div>
  <div class="sRow"><div class="sLbl">곡 정보 (빠르기·음 개수·설명)</div><div class="sSeg">
    <div class="sbtn" data-set="info" data-v="0" role="button">숨기기</div>
    <div class="sbtn" data-set="info" data-v="1" role="button">보기</div></div></div>
  <div class="sRow"><div class="sLbl">도움말</div><div id="howtoBox"></div></div>
</div>

<div id="fb">
  <div id="noteArea">
    <div id="shdr"></div>
    <div id="ng"></div>
  </div>
</div>

<div id="bz">
  <canvas id="bowCv"></canvas>
  <canvas id="rhythmCv"></canvas>
  <div id="nd"></div>
  <div id="freeHint">💡 음 버튼을 누르면 바로 소리가 나요!</div>

  <div id="gameHud">
    <div>
      <span class="hudItem" id="hudScore">0점</span>
      <span class="hudCombo" id="hudCombo"></span>
      <span class="hudItem" id="hudSong"></span>
    </div>
  </div>
  <div id="healthBar"><div id="healthFill"></div></div>
  <div id="judgeTxt"></div>
  <div id="sheetArea"><canvas id="sheetCv"></canvas></div>

  <div id="bpmSel">
    <select id="bpmVal">
      <option value="60">♩=60</option>
      <option value="80" selected>♩=80</option>
      <option value="100">♩=100</option>
      <option value="120">♩=120</option>
    </select>
  </div>

  <div id="practiceToggle" role="button">연습 모드</div>

  <div id="lessonInfo">
    <div class="lt" id="lessonTitle"></div>
    <div class="ls" id="lessonSub"></div>
  </div>

  <div id="countdown"><div id="countdownTxt"></div></div>
  <div id="gameOver">
    <div class="goTitle">끝!</div>
    <div class="goScore" id="goScoreTxt"></div>
    <div style="display:flex;gap:8px;">
      <div class="goBtn" id="goRetry" role="button">다시 도전</div>
      <div class="goBtn" id="goBack" role="button">곡 선택</div>
    </div>
  </div>
</div>

<div id="panel"></div>

<div id="ov"><div class="i">
  <div class="ovIcon">🎻</div>
  <div class="ovTitle">바이올린</div>
  <div class="ovLine">연주 방식을 골라요</div>
  <div id="modeCards">
    <div class="mcard" data-im="nobow" role="button">
      <div class="mcIcon">👆</div>

/* ═══════════════════════════════════════════════════════════

const AE=(()=>{
  let c=null,m=null,v={};
  const BF=[196,293.66,440,659.25];
  const NN=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  const SAMPLE_URL='violin_samples/';
  const SAMPLE_NOTES=['G3','A3','C4','E4','G4','A4','C5','E5','G5','A5','C6'];
  const SAMPLE_MIDI=[55,57,60,64,67,69,72,76,79,81,84];
  const sampleBuffers={};
  let samplesLoaded=false,loadingStarted=false;

  function noteToMidi(noteName){
    const m=noteName.match(/^([A-G]#?b?)(\d)$/);
    if(!m)return 69;
    const names={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
    return (parseInt(m[2])+1)*12+(names[m[1]]||0);
  }
  function findSample(targetMidi){
    let bestIdx=0,bestDist=999;
    for(let i=0;i<SAMPLE_MIDI.length;i++){
      const d=Math.abs(SAMPLE_MIDI[i]-targetMidi);
      if(d<bestDist){bestDist=d;bestIdx=i;}
    }
    return{noteName:SAMPLE_NOTES[bestIdx],rate:Math.pow(2,(targetMidi-SAMPLE_MIDI[bestIdx])/12)};
  }
  async function loadSamples(){
    if(loadingStarted)return;loadingStarted=true;
    await Promise.all(SAMPLE_NOTES.map(async note=>{
      try{const r=await fetch(SAMPLE_URL+note+'.mp3');const buf=await r.arrayBuffer();
        sampleBuffers[note]=await c.decodeAudioData(buf);}catch(e){}
    }));
    samplesLoaded=true;
  }
  function init(){
    c=new(window.AudioContext||window.webkitAudioContext)();
    m=c.createGain();m.gain.value=.65;
    const d=c.createGain();d.gain.value=.76;const w=c.createGain();w.gain.value=.22;
    const d1=c.createDelay(1);d1.delayTime.value=.028;const d2=c.createDelay(1);d2.delayTime.value=.048;
    const fb=c.createGain();fb.gain.value=.2;
    const rl=c.createBiquadFilter();rl.type='lowpass';rl.frequency.value=2800;
    m.connect(d);d.connect(c.destination);m.connect(d1);d1.connect(rl);rl.connect(d2);

  function freq(s,sm){return BF[s]*Math.pow(2,sm/12);}
  function nn(f){const mi=Math.round(12*Math.log2(f/440)+69);return NN[((mi%12)+12)%12]+Math.floor(mi/12-1);}
  function getCtx(){return c;}
  function getMaster(){return m;}

  function play(si,sm,vel){
    if(!c)return;res();stop(si);
    const f0=freq(si,sm);
    const targetMidi=Math.round(12*Math.log2(f0/440)+69);

      const{noteName,rate}=findSample(targetMidi);

    g.gain.linearRampToValueAtTime(0,t+duration);

      o.connect(og);og.connect(g);o.start(t);o.stop(t+duration);
    });
  }

  function playSfx(type){

    }

})();

/* 음이름 표시: 기본 한글 도레미(옥타브는 작은 숫자·색), ⚙ 에서 영어(C4) 선택.
   화면 표시만 바꾸고 내부 음 이름('G#3' 등)·판정·저장 형식은 그대로. */
const KO={C:'도',D:'레',E:'미',F:'파',G:'솔',A:'라',B:'시'};
const UI_DEF={names:'doremi',sharps:0,info:0};
let uiPrefs=(function(){try{return Object.assign({},UI_DEF,JSON.parse(localStorage.getItem('violin_ui_prefs')||'{}'));}catch(e){return Object.assign({},UI_DEF);}})();
function saveUiPrefs(){try{localStorage.setItem('violin_ui_prefs',JSON.stringify(uiPrefs));}catch(e){}}
function splitNote(n){const m=/^([A-G])(#?)(\d)$/.exec(n||'');return m?{l:m[1],s:m[2],o:m[3]}:null;}
function noteShort(n){ /* 캔버스·음성용: 옥타브 숫자 없이 */
  if(uiPrefs.names==='abc')return n;const p=splitNote(n);return p?KO[p.l]+(p.s?'♯':''):n;}
function noteSpeak(n){const p=splitNote(n);if(uiPrefs.names==='abc'||!p)return n;return KO[p.l]+(p.s?' 샵':'');}
function noteHTML(n){
  const p=splitNote(n);if(!p)return n;
  if(uiPrefs.names==='abc')return '<span class="nl">'+n+'</span>';
  return '<span class="nl">'+KO[p.l]+(p.s?'♯':'')+'<span class="oc o'+p.o+'">'+p.o+'</span></span>';}
function relabelNotes(){

function buildFB(){
  const grid=document.getElementById('ng');
  /* (옛 머리줄 G3·D4·A4·E5 글자 4개는 개방현 버튼 줄과 겹쳐 없앰 — buildOS 가 그 자리에 개방현 버튼을 놓는다) */
  for(let sm=1;sm<=SEMI;sm++){
    const row=document.createElement('div');row.className='nr';
    for(let si=0;si<4;si++){
      const b=document.createElement('div');b.className='nb';
      const nm=AE.nn(AE.freq(si,sm));b.dataset.n=nm;if(nm.indexOf('#')>=0)b.classList.add('sharp');
      b.innerHTML=noteHTML(nm);b.dataset.s=si;b.dataset.m=sm;
      let held=0;
      b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();ensureA();held++;
        if(inputMode==='nobow')noBowDown(si,sm);else fingerDown(si,sm);
        b.classList.add('on');});
      const rel=e=>{if(held>0){held--;if(inputMode==='nobow')noBowUp(si);else fingerUp(si,sm,e&&e.pointerType);}if(held<=0)b.classList.remove('on');};
      b.addEventListener('pointerup',rel);
      b.addEventListener('pointercancel',rel);
      b.addEventListener('pointerleave',rel);
      row.appendChild(b);
    }grid.appendChild(row);
  }
}
function buildOS(){
  const c=document.getElementById('shdr'); /* 개방현 버튼 = 지판 맨 윗줄(각 현 칸 위) */
  for(let i=0;i<4;i++){
    const b=document.createElement('div');b.className='ob';b.dataset.i=i;b.dataset.n=SN[i];b.innerHTML=noteHTML(SN[i]);
    b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();ensureA();
      if(inputMode==='nobow')noBowDown(i,0);else openString(i);
      b.classList.add('on');});
    const obRel=()=>{if(inputMode==='nobow')noBowUp(i);b.classList.remove('on');};
    b.addEventListener('pointerup',obRel);
    b.addEventListener('pointercancel',obRel);
    b.addEventListener('pointerleave',obRel);
    c.appendChild(b);
  }
}

/* ── LEFT HAND (fingerboard) — updates fingering state ONLY.
   No sound, no judgment from buttons: sound & judgment happen at a bow
   stroke (or a pitch change under an active bow = slur). Multi-touch hold
   is tracked; releasing falls back to the highest finger still held. With
   nothing held, touch reverts to the open string (real violin) while mouse
   keeps the last fingering latched (desktop single-pointer can't hold+bow).
   The open-string button = lifting all fingers on that string. */
const heldF=[{},{},{},{}]; /* per string: {semitone:pressCount} of physically held touches */
function fingerDown(si,sm){heldF[si][sm]=(heldF[si][sm]||0)+1;pickNote(si,sm);}
function fingerUp(si,sm,ptype){
  const h=heldF[si];
  if(h[sm]){h[sm]--;if(h[sm]<=0)delete h[sm];}
  const ks=Object.keys(h);
  if(ks.length){const hi=Math.max.apply(null,ks.map(Number));if(semi[si]!==hi)pickNote(si,hi);}
  else if(ptype!=='mouse'){if(semi[si]!==0)pickNote(si,0);} /* touch: lifting every finger returns the string to open, like a real violin */
  /* mouse keeps the latch: a single pointer can't hold a finger while bowing; the open-string button clears it */
}
function openString(si){heldF[si]={};pickNote(si,0);}
function updFingerUI(si){
  document.querySelectorAll('.nb[data-s="'+si+'"]').forEach(b=>b.classList.toggle('sel',+b.dataset.m===semi[si]));
}
function resetFingers(){for(let i=0;i<4;i++){heldF[i]={};semi[i]=0;updFingerUI(i);}}

function pickNote(si,sm){
  const changed=semi[si]!==sm;
  semi[si]=sm;curN=sm===0?SN[si]:AE.nn(AE.freq(si,sm));
  if(bow.dn&&bow.str===si){AE.upd(si,sm,bow.spd);if(changed)bowStroke(si);} /* slur: pitch change under the bow sounds → judge it */
  updFingerUI(si);
}

/* ── NO-BOW (touch) input: tapping a note button plays it instantly and
   articulates it for judgment — the exact code path a bow stroke uses.
   Sets fingering first (so mode judgments read semi[si]), plays a sustained
   voice, then dispatches bowStroke(si). Releasing stops the voice. Bow-mode
   input is untouched: these run only when inputMode==='nobow'. */
function noBowDown(si,sm){
  pickNote(si,sm);                 /* set semi[si] + label (no sound: bow.dn is false) */
  const n=AE.play(si,sm,.55);if(n)curN=n;
  actS=si;vib[si]=.55;mkP(si,BH*.5);
  freeHintDone=true;
  bowStroke(si);                   /* reuse rhythm/learn/perform judgment */
}
function noBowUp(si){
  AE.stop(si);
  if(actS===si)actS=-1;
  if(!bow.dn)curN='';
}

  bg.bezierCurveTo(cx-bw*.5,bodyTop+bodyH*.4,cx-bw*.7,bodyTop+bodyH*.32,cx-bw*.8,bodyTop+bodyH*.2);
  bg.bezierCurveTo(cx-bw*.85,bodyTop+bodyH*.08,cx-bw*.55,bodyTop,cx,bodyTop);

    sg.addColorStop(.5,'rgba(230,225,210,.4)');sg.addColorStop(.7,'rgba(210,205,190,.35)');

    bg.strokeStyle=sg;bg.lineWidth=sThk[i];
    bg.beginPath();bg.moveTo(sx,0);bg.lineTo(sx,H);bg.stroke();
    bg.strokeStyle='rgba(255,255,250,.06)';bg.lineWidth=sThk[i]*.3;
    bg.beginPath();bg.moveTo(sx-.5,0);bg.lineTo(sx-.5,H);bg.stroke();
  }
  [.1,.2,.3,.42,.55,.7,.86].forEach(p=>{
    const y=fbTop+(fbBot-fbTop)*p;
    bg.strokeStyle='rgba(60,55,50,.06)';bg.lineWidth=.5;
    bg.beginPath();bg.moveTo(cx-fbW*1.1,y);bg.lineTo(cx+fbW*1.1,y);bg.stroke();
  });
}

function drawFH(ctx,x,y,h,mir){
  ctx.save();if(mir){ctx.translate(x,y);ctx.scale(-1,1);ctx.translate(-x,-y);}
  ctx.fillStyle='rgba(15,8,3,.6)';ctx.strokeStyle='rgba(35,18,6,.5)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(x+1,y-h*.42);
  ctx.bezierCurveTo(x-3,y-h*.25,x-5,y-h*.08,x-4,y+h*.05);
  ctx.bezierCurveTo(x-3,y+h*.15,x-1,y+h*.2,x+1,y+h*.22);
  ctx.bezierCurveTo(x+3,y+h*.24,x+5,y+h*.2,x+4,y+h*.1);
  ctx.bezierCurveTo(x+3,y+h*.02,x+1,y-h*.05,x+2,y-h*.15);
  ctx.bezierCurveTo(x+3,y-h*.28,x+2,y-h*.38,x+1,y-h*.42);
  ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(x-1,y-h*.28,2,0,Math.PI*2);ctx.fillStyle='rgba(15,8,3,.7)';ctx.fill();
  ctx.beginPath();ctx.arc(x+2,y+h*.15,2,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════
   BOW CANVAS
   ═══════════════════════════════════════════════════════════ */
const bowCv=document.getElementById('bowCv'),bc=bowCv.getContext('2d');
let BW=0,BH=0;

function sFromX(px){let b=-1,bd=999;for(let i=0;i<4;i++){const d=Math.abs(px-strX(i));if(d<bd){bd=d;b=i;}}return bd<36?b:-1;}

/* ── BOW STROKE = the moment a note is articulated. Sound and judgment are
   coupled here. Fires on: bow touch-down, string crossing while dragging,
   bow direction reversal (re-stroke for repeated notes), and pitch change
   under the bow (slur, dispatched from pickNote). */
function bowStroke(si){
  bow.lastStrokeT=performance.now();
  if(currentMode==='rhythm'&&rhythmState&&rhythmState.active)rhythmBow(si);
  else if(currentMode==='learn'&&learnState&&learnState.active)learnBow(si);
  else if(currentMode==='perform'&&performState&&performState.active)performBow(si);
}
bowCv.addEventListener('pointerdown',e=>{
  e.preventDefault();ensureA();
  const r=bowCv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
  bow.dn=true;bow.px=px;bow.py=py;bow.lx=px;bow.lt=performance.now();bow.sdir=0;
  bow.str=sFromX(px);
  if(bow.str>=0){const n=AE.play(bow.str,semi[bow.str],.25);actS=bow.str;vib[bow.str]=.3;if(n)curN=n;mkP(bow.str,py);
    freeHintDone=true;
    bowStroke(bow.str);
  }
});
bowCv.addEventListener('pointermove',e=>{
  e.preventDefault();if(!bow.dn)return;
  const r=bowCv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
  const now=performance.now(),dx=px-bow.lx,dt=Math.max(1,now-bow.lt)/1000;
  bow.spd=Math.min(1,Math.abs(dx/dt)/(BW*1.1));
  if(Math.abs(dx)>1){
    const ndir=dx>0?1:-1;
    bow.dir=ndir;
    if(bow.sdir===0)bow.sdir=ndir;
    else if(ndir!==bow.sdir){
      bow.sdir=ndir;
      /* direction reversal = new bow stroke (up-bow ↔ down-bow): plays repeated notes without lifting */
      if(bow.str>=0&&now-bow.lastStrokeT>120){mkP(bow.str,py);bowStroke(bow.str);}
    }
  }
  bow.px=px;bow.py=py;
  bow.angle+=((bow.dir>0?-Math.PI*.18:-Math.PI*.28)-bow.angle)*.12;
  const ns=sFromX(px);
  if(ns>=0&&ns!==bow.str){
    if(bow.str>=0){AE.stop(bow.str);vib[bow.str]*=.4;}
    bow.str=ns;const n=AE.play(ns,semi[ns],bow.spd);actS=ns;vib[ns]=bow.spd;if(n)curN=n;mkP(ns,py);
    bowStroke(ns); /* crossing onto a string sounds it → judge it */
  }else if(ns>=0&&Math.abs(dx)>1){
    const n=AE.upd(ns,semi[ns],bow.spd);vib[ns]=bow.spd;actS=ns;if(n)curN=n;
  }else if(ns<0&&bow.str>=0){AE.stop(bow.str);actS=-1;bow.str=-1;}
  bow.lx=px;bow.lt=now;
});
function bowUp(){if(!bow.dn)return;bow.dn=false;bow.spd=0;if(bow.str>=0)AE.stop(bow.str);bow.str=-1;actS=-1;curN='';}
bowCv.addEventListener('pointerup',e=>{e.preventDefault();bowUp();});
bowCv.addEventListener('pointercancel',e=>{e.preventDefault();bowUp();});
bowCv.addEventListener('pointerleave',e=>{e.preventDefault();bowUp();});

function mkP(si,y){const sx=strX(si);for(let i=0;i<7;i++)parts.push({x:sx,y,vx:(Math.random()-.5)*55,vy:(Math.random()-.5)*35-10,life:1,sz:1.2+Math.random()*2,col:SC[si]});}

/* ═══════════════════════════════════════════════════════════
   RENDER BOW OVERLAY
   ═══════════════════════════════════════════════════════════ */
function renderBow(){
  bc.clearRect(0,0,BW,BH);
  for(let i=0;i<4;i++){
    const sx=strX(i),isA=actS===i,va=vib[i],vp=vibP[i];
    const th=[4.5,3.5,2.6,1.8][i];
    if(isA&&bow.dn){bc.save();bc.globalAlpha=.12;bc.fillStyle=SC[i];bc.fillRect(sx-22,0,44,BH);bc.restore();}
    if(va>.01){
      bc.beginPath();bc.lineWidth=th*(isA?1.5:1);bc.strokeStyle=isA?SC[i]:SD[i];
      bc.moveTo(sx,3);for(let y=4;y<BH-3;y+=2){const t=(y-3)/(BH-6);bc.lineTo(sx+Math.sin(t*Math.PI)*Math.sin(vp+t*24)*va*14,y);}
      bc.stroke();if(isA){bc.save();bc.shadowColor=SC[i];bc.shadowBlur=18;bc.stroke();bc.restore();}
    }
  }
  if(bow.dn||bow.spd>.02){
    const bpx=clamp(bow.px,15,BW-15),bpy=clamp(bow.py,25,BH-25);
    if(bow.str>=0){
      const sx=strX(bow.str);
      bc.save();const gl=bc.createRadialGradient(sx,bpy,0,sx,bpy,30);
      gl.addColorStop(0,SCA[bow.str]+'0.4)');gl.addColorStop(1,SCA[bow.str]+'0)');
      bc.fillStyle=gl;bc.fillRect(sx-40,bpy-40,80,80);bc.restore();
      bc.save();bc.globalAlpha=.4;bc.strokeStyle='rgba(255,255,240,.55)';bc.lineWidth=2.5;bc.lineCap='round';
      bc.beginPath();bc.moveTo(sx-16,bpy);bc.lineTo(sx+16,bpy);bc.stroke();bc.restore();
    }
    bc.save();bc.translate(bpx,bpy);bc.rotate(bow.angle);
    const half=Math.min(BW*.52,175)/2;
    bc.strokeStyle=bow.dn?'rgba(255,255,240,.4)':'rgba(255,255,240,.1)';bc.lineWidth=bow.dn?2.5:1.5;bc.lineCap='round';
    bc.beginPath();bc.moveTo(-half,2);bc.lineTo(half,2);bc.stroke();
    bc.beginPath();bc.moveTo(-half,-2.5);bc.quadraticCurveTo(0,-5.5,half,-2.5);bc.lineTo(half,-.5);bc.quadraticCurveTo(0,-3.5,-half,-.5);bc.closePath();
    const sg=bc.createLinearGradient(-half,0,half,0);
    sg.addColorStop(0,'#3d2010');sg.addColorStop(.08,'#7a5230');sg.addColorStop(.35,bow.dn?'#a87848':'#8b6240');
    sg.addColorStop(.65,bow.dn?'#b8905a':'#8b6240');sg.addColorStop(.92,'#7a5230');sg.addColorStop(1,'#3d2010');
    bc.fillStyle=sg;bc.fill();
    if(bow.dn){bc.save();bc.shadowColor='rgba(180,150,100,.2)';bc.shadowBlur=6;bc.fill();bc.restore();}
    bc.fillStyle='#888';for(let w=0;w<3;w++)bc.fillRect(half-26-w*5,-4,2,5);
    bc.fillStyle='#111';rr(bc,half-3,-6.5,17,13,3);bc.fill();
    bc.strokeStyle='#444';bc.lineWidth=.6;rr(bc,half-3,-6.5,17,13,3);bc.stroke();
    bc.beginPath();bc.arc(half+6,0,2.5,0,Math.PI*2);const pg=bc.createRadialGradient(half+5,-1,0,half+6,0,2.5);
    pg.addColorStop(0,'#f0e4cc');pg.addColorStop(1,'#a08050');bc.fillStyle=pg;bc.fill();
    bc.beginPath();bc.arc(half+13,0,1.8,0,Math.PI*2);bc.fillStyle='#555';bc.fill();
    bc.fillStyle='#ece0c8';rr(bc,-half-7,-3.5,10,7,2);bc.fill();
    bc.fillStyle='#1a1a1a';bc.fillRect(-half-7,-.5,2.5,1.5);
    bc.restore();
  }
  for(const p of parts){bc.globalAlpha=p.life;bc.fillStyle=p.col;bc.beginPath();bc.arc(p.x,p.y,p.sz*p.life,0,Math.PI*2);bc.fill();}
  bc.globalAlpha=1;
}

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

/* Guided-mode target highlight (rhythm 🐢한음씩 / 쉬움): re-applies only when the
   target note changes, so the pulse animation isn't restarted on every frame. */

/* Called on every bow stroke: the sounding note = stroked string + fingering held on it */
function rhythmBow(si){
  if(!rhythmState||!rhythmState.active)return;
  rhythmState.bowActive[si]=performance.now();
  checkRhythmHit(si,semi[si]);
}

function checkRhythmHit(si,sm){
  if(!rhythmState||!rhythmState.active)return;
  const st=rhythmState;
  const now=performance.now();
  const elapsed=now-st.startTime;

  /* STEP MODE: match only the front note by string+finger; timing ignored, no penalty */
  if(st.stepMode){
    let idx=-1;
    for(let i=st.noteIdx;i<st.notes.length;i++){
      if(!st.notes[i].hit&&!st.notes[i].judge){idx=i;break;}
    }
    if(idx<0)return;
    const tn=st.notes[idx];
    if(tn.s!==si||tn.f!==sm){showJudge('다시!','#ff4444');return;} /* wrong note sounded → retry hint, no penalty */
    tn.judge='perfect';tn.hit=true;st.perfect++;st.combo++;
    st.maxCombo=Math.max(st.maxCombo,st.combo);
    st.multiplier=Math.min(4,1+Math.floor(st.combo/10));
    st.score+=100*st.multiplier;
    st.lastHitNote=tn;
    showJudge('최고!','#ffd700');
    AE.playSfx('perfect');
    tn.flashTimer=now;
    st.noteIdx=idx+1;
    while(st.noteIdx<st.notes.length&&st.notes[st.noteIdx].hit)st.noteIdx++;
    return;
  }

  /* WAIT-PAUSE (easy/practice): an overdue note froze the song — playing the
     correct note (right string + right fingering, bowed) resumes it. Timing is
     already lost, so it grades OK. */
  if(st.waitPaused){
    let wn=null;
    for(let i=st.noteIdx;i<st.notes.length;i++){const w=st.notes[i];if(!w.hit&&!w.judge){wn=w;break;}}
    if(!wn||wn.s!==si||wn.f!==sm)return;
    wn.judge='ok';wn.hit=true;st.ok++;st.combo++;
    st.multiplier=Math.min(4,1+Math.floor(st.combo/10));
    st.score+=30*st.multiplier;
    st.maxCombo=Math.max(st.maxCombo,st.combo);
    st.lastHitNote=wn;
    wn.flashTimer=now;
    showJudge('괜찮아','#44ee44');
    st.startTime+=now-st.waitPauseStart;
    st.waitPaused=false;
    clearGuideHighlight(st);
    while(st.noteIdx<st.notes.length&&st.notes[st.noteIdx].hit)st.noteIdx++;
    return;
  }

  /* Find the closest unhit note that matches this string+finger */
  let bestIdx=-1,bestDiff=9999;
  for(let i=0;i<st.notes.length;i++){
    const n=st.notes[i];
    if(n.hit||n.judge)continue;
    if(n.s!==si||n.f!==sm)continue;
    const diff=elapsed-n.hitTime;
    if(diff<-400)break;
    if(diff>400)continue;
    const absDiff=Math.abs(diff);
    if(absDiff<bestDiff){bestDiff=absDiff;bestIdx=i;}
  }
  if(bestIdx<0)return;
  const n=st.notes[bestIdx];

  if(bestDiff<=80){
    n.judge='perfect';n.hit=true;st.perfect++;st.combo++;
    st.multiplier=Math.min(4,1+Math.floor(st.combo/10));
    st.score+=100*st.multiplier;
    showJudge('최고!','#ffd700');
    AE.playSfx('perfect');
    n.flashTimer=performance.now();
  }else if(bestDiff<=160){
    n.judge='good';n.hit=true;st.good++;st.combo++;
    st.multiplier=Math.min(4,1+Math.floor(st.combo/10));
    st.score+=60*st.multiplier;
    showJudge('좋아','#44ddee');
    n.flashTimer=performance.now();
  }else if(bestDiff<=300){
    n.judge='ok';n.hit=true;st.ok++;st.combo++;
    st.multiplier=Math.min(4,1+Math.floor(st.combo/10));
    st.score+=30*st.multiplier;
    showJudge('괜찮아','#44ee44');
    n.flashTimer=performance.now();
  }

  if(n.hit){
    st.maxCombo=Math.max(st.maxCombo,st.combo);
    st.lastHitNote=n;
    /* Advance noteIdx past hit notes */
    while(st.noteIdx<st.notes.length&&st.notes[st.noteIdx].hit)st.noteIdx++;
  }
}

function updateRhythm(now){
  if(!rhythmState||!rhythmState.active)return;
  const st=rhythmState;

  /* Guided modes (🐢한음씩 / 쉬움): blink the fingering button for the note to play next */
  if(st.stepMode||st.difficulty==='easy'){
    let gn=null;
    for(let i=st.noteIdx;i<st.notes.length;i++){
      const c=st.notes[i];
      if(c.hit||c.judge||c.note==='R'||c.s<0)continue;
      gn=c;break;
    }
    if(gn)setGuideHighlight(st,gn.s,gn.f);else clearGuideHighlight(st);
  }

  /* STEP MODE: 노트가 판정선까지 내려와 멈추고 대기 → 맞는 음을 누르면 다음 노트가 내려옴. no miss / no health */
  if(st.stepMode){
    let nextN=null;
    for(let i=st.noteIdx;i<st.notes.length;i++){
      if(!st.notes[i].hit&&!st.notes[i].judge){nextN=st.notes[i];break;}
    }
    if(nextN){
      /* 시간을 노트의 hitTime에서 클램프 → 노트가 판정선에 닿으면 그 자리에서 정지(대기). 누르면 noteIdx가 넘어가 다음 노트가 내려옴 */
      if((now-st.startTime)>nextN.hitTime){ st.startTime=now-nextN.hitTime; }
    }
    document.getElementById('hudScore').textContent=st.score+'점';
    const comboTxt2=st.combo>1?(st.combo+' 연속'+(st.multiplier>1?' x'+st.multiplier:'')):'';
    document.getElementById('hudCombo').textContent=comboTxt2;
    const lastN=st.notes[st.notes.length-1];
    if(lastN&&lastN.hit&&!st.finished){
      st.finished=true;st.active=false;
      finishRhythm();
    }
    return;
  }

  const elapsed=now-st.startTime;

  /* Check for misses */
  for(let i=st.noteIdx;i<st.notes.length;i++){
    const n=st.notes[i];
    if(n.hit||n.judge)continue;
    const diff=elapsed-n.hitTime;
    if(diff>350){
      if(st.practice||(st.difficulty==='easy'&&!st.waitPaused)){
        /* In easy/practice mode, pause time until correct note is pressed */
        /* Highlight what to press */
        st.waitPaused=true;
        st.waitPauseStart=now;
        setGuideHighlight(st,n.s,n.f);
        return; /* Freeze progression */
      }
      if(st.waitPaused){
        /* Still waiting for correct note in easy mode */
        setGuideHighlight(st,n.s,n.f);
        return;
      }
      n.judge='miss';n.hit=true;
      st.miss++;st.combo=0;st.multiplier=1;
      st.health=Math.max(0,st.health-st.missDmg);
      showJudge('놓침','#ff4444');
      AE.playSfx('miss');
      n.flashTimer=now;
      st.noteIdx=i+1;

      if(st.health<=0&&!st.gameOver){
        st.gameOver=true;st.active=false;
        AE.playSfx('gameover');
        showGameOver();
        return;
      }
    }else{
      break;
    }
  }

  /* Update HUD */
  document.getElementById('hudScore').textContent=st.score+'점';
  const comboTxt=st.combo>1?(st.combo+' 연속'+(st.multiplier>1?' x'+st.multiplier:'')):'';
  document.getElementById('hudCombo').textContent=comboTxt;
  const hpPct=Math.round(st.health/st.maxHealth*100);
  document.getElementById('healthFill').style.width=hpPct+'%';
  if(hpPct<30) document.getElementById('healthFill').style.background='linear-gradient(90deg,#ff2222,#ff6644)';
  else if(hpPct<60) document.getElementById('healthFill').style.background='linear-gradient(90deg,#ff8844,#ffdd33)';
  else document.getElementById('healthFill').style.background='linear-gradient(90deg,#44ee44,#44ddee)';

  /* Check if finished */
  const lastNote=st.notes[st.notes.length-1];
  if(lastNote&&elapsed>lastNote.hitTime+2000&&!st.finished){
    st.finished=true;st.active=false;
    finishRhythm();
  }
}

function renderRhythm(now){
  if(!rhythmState)return;
  rc.clearRect(0,0,RW,RH);
  if(!rhythmState.active&&!rhythmState.finished&&!rhythmState.gameOver)return;

  const st=rhythmState;
  const elapsed=now-st.startTime;

  /* String lane backgrounds */
  for(let i=0;i<4;i++){
    const sx=strX(i);
    rc.save();rc.globalAlpha=.04;rc.fillStyle=SC[i];
    rc.fillRect(sx-18,0,36,RH);rc.restore();
  }

  /* Hit zone — 밝고 명확하게 */
  const hitY=RH-28;
  rc.save();
  /* 판정 영역 배경 — 잘 보이게 */
  rc.fillStyle='rgba(255,215,0,.25)';
  rc.fillRect(0,hitY-22,RW,44);
  /* 판정 라인 — 굵은 실선, 글로우 효과 */
  rc.shadowColor='#ffd700';rc.shadowBlur=12;
  rc.strokeStyle='rgba(255,215,0,.9)';rc.lineWidth=3;
  rc.beginPath();rc.moveTo(0,hitY);rc.lineTo(RW,hitY);rc.stroke();
  rc.shadowBlur=0;
  /* "여기서 터치!" 텍스트 */
  rc.fillStyle='#ffd700';rc.font='bold 16px sans-serif';rc.textAlign='right';
  outlineText(rc,inputMode==='bow'?'▶ 여기서 활 긋기!':'▶ 여기서 누르기!',RW-6,hitY-26);

  /* Hit zone circles per string — 밝게 */
  for(let i=0;i<4;i++){
    const sx=strX(i);
    rc.beginPath();rc.arc(sx,hitY,18,0,Math.PI*2);
    rc.strokeStyle=SC[i];rc.lineWidth=2.5;rc.globalAlpha=.7;rc.stroke();
    rc.globalAlpha=.15;rc.fillStyle=SC[i];rc.fill();
    rc.globalAlpha=1;
  }
  rc.restore();

  /* Draw falling notes */
  st.notes.forEach(n=>{
    const timeToHit=n.hitTime-elapsed;

    /* Hit flash effect */
    if(n.hit&&n.flashTimer){
      const flashAge=now-n.flashTimer;
      if(flashAge<400){
        const col=n.judge==='perfect'?'#ffd700':n.judge==='good'?'#44ddee':n.judge==='ok'?'#44ee44':'#ff4444';
        const alpha=1-flashAge/400;
        const x=strX(n.s);
        rc.save();rc.globalAlpha=alpha*.6;
        rc.beginPath();rc.arc(x,hitY,20+flashAge*.05,0,Math.PI*2);
        rc.fillStyle=col;rc.fill();rc.restore();
      }
      return;
    }
    if(n.hit)return;

    if(timeToHit>st.scrollTime+500||timeToHit<-500)return;

    const progress=1-(timeToHit/st.scrollTime);
    const y=progress*hitY;
    const x=strX(n.s);
    const noteW=42;
    const noteH=Math.max(24,n.dur*24);

    /* Proximity glow */
    const proximity=1-Math.abs(timeToHit)/st.scrollTime;

    rc.save();
    rc.globalAlpha=.7+proximity*.3;
    const col=SC[n.s];

    /* Shadow */
    rc.shadowColor=col;rc.shadowBlur=proximity*15;

    /* Note pill */
    rc.fillStyle=col;
    rr(rc,x-noteW/2,y-noteH/2,noteW,noteH,noteH/2);rc.fill();

    /* Inner highlight */
    rc.globalAlpha=.3;
    rc.fillStyle='#fff';
    rr(rc,x-noteW/2+3,y-noteH/2+2,noteW-6,noteH/2-2,6);rc.fill();

    rc.restore();

    /* Note label */
    rc.fillStyle='#000';rc.font='bold 15px sans-serif';rc.textAlign='center';rc.textBaseline='middle';
    rc.fillText(noteShort(n.note),x,y);

    /* Finger indicator — 영어 음이름(전문가 표기)일 때만 */
    if(n.f>0&&uiPrefs.names==='abc'){
      rc.fillStyle='rgba(0,0,0,.7)';rc.font='bold 11px sans-serif';
      rc.fillText(n.f+'지',x,y+noteH/2-6);
    }
  });

  /* Multiplier display */
  if(st.multiplier>1){
    rc.save();rc.globalAlpha=.7;
    rc.fillStyle='#ffd700';rc.font='bold 18px sans-serif';rc.textAlign='right';rc.textBaseline='top';
    rc.fillText('x'+st.multiplier,RW-8,30);rc.restore();
  }

  /* STEP MODE guidance — pulse ring on the waiting note + which string/finger to play */
  if(st.stepMode){
    let nextN=null;
    for(let i=st.noteIdx;i<st.notes.length;i++){
      if(!st.notes[i].hit&&!st.notes[i].judge){nextN=st.notes[i];break;}
    }
    if(nextN){
      const hy=RH-28, gx=strX(nextN.s);
      const osc=Math.abs(Math.sin(now/180));
      rc.save();
      rc.globalAlpha=.4+.4*osc;
      rc.strokeStyle='#ffd700';rc.lineWidth=3;rc.shadowColor='#ffd700';rc.shadowBlur=12;
      rc.beginPath();rc.arc(gx,hy,18+6*osc,0,Math.PI*2);rc.stroke();
      rc.restore();
      const SNAMES=['G','D','A','E'];
      rc.save();rc.textAlign='center';
      rc.fillStyle='#ffd700';rc.font='bold 20px sans-serif';rc.globalAlpha=.95;
      outlineText(rc,'🎯 '+noteShort(nextN.note)+' 음을 켜세요',RW/2,44);
      if(inputMode==='bow'){ /* 활 모드에서만 필요한 안내(터치 모드는 반짝이는 버튼만 누르면 됨) */
        rc.font='bold 16px sans-serif';rc.globalAlpha=.95;
        outlineText(rc,SNAMES[nextN.s]+'현 · '+(nextN.f>0?(uiPrefs.names==='abc'?nextN.f+'번 운지':'반짝이는 음')+' 누르고 활 긋기':'개방현 — 활만 긋기'),RW/2,66);
      }
      rc.restore();
    }
  }

  /* EASY/PRACTICE wait-pause guidance */
  if(st.waitPaused){
    rc.save();rc.textAlign='center';rc.fillStyle='#ffd700';rc.font='bold 18px sans-serif';rc.globalAlpha=.95;
    outlineText(rc,inputMode==='bow'?'🎯 맞는 음을 활로 켜면 계속돼요':'🎯 반짝이는 음을 누르면 계속돼요',RW/2,44);
    rc.restore();
  }
}

/* 나무 무늬 위 글자가 잘 읽히도록 검은 테두리를 먼저 긋고 채운다 */
function outlineText(ctx,t,x,y){
  ctx.save();ctx.lineJoin='round';ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.8)';ctx.strokeText(t,x,y);ctx.restore();
  ctx.fillText(t,x,y);
}

function showJudge(text,color){
  const el=document.getElementById('judgeTxt');
  el.textContent=text;el.style.color=color;el.style.opacity='1';
  clearTimeout(el._tid);
  el._tid=setTimeout(()=>{el.style.opacity='0';},350);
}

function finishRhythm(){
  const st=rhythmState;
  clearGuideHighlight(st);
  const total=st.notes.length;
  const pct=total>0?Math.round((st.perfect*100+st.good*70+st.ok*40)/(total*100)*100):0;
  const starCount=pct>=90?3:pct>=70?2:pct>=50?1:0;

  /* Save best score & stars */
  const scoreKey='rhythm_'+st.songKey+'_'+st.difficulty;
  const starsKey='rhythm_stars_'+st.songKey+'_'+st.difficulty;
  const prev=loadProgress();
  const updates={};
  if((prev[scoreKey]||0)<st.score) updates[scoreKey]=st.score;
  if((prev[starsKey]||0)<starCount) updates[starsKey]=starCount;
  if(Object.keys(updates).length>0) saveProgress(updates);

  const stars=starCount>=3?'★★★':starCount>=2?'★★☆':starCount>=1?'★☆☆':'☆☆☆';
  const panel=document.getElementById('panel');
  panel.innerHTML=`
    <h2>🎵 결과</h2>
    <div style="text-align:center;padding:16px 0;">
      <div style="font-size:48px;color:#ffd700;margin-bottom:8px">${stars}</div>
      <div style="font-size:30px;color:#ffd700;font-weight:800">${st.score}점</div>
      <div style="font-size:16px;color:#eadcbc;margin-top:10px">
        최고 ${st.perfect} · 좋아 ${st.good} · 괜찮아 ${st.ok} · 놓침 ${st.miss}
      </div>
      <div class="info" style="font-size:16px;color:#cdb282;margin-top:6px;line-height:1.6">
        최대 연속 ${st.maxCombo} · 배율 x${st.multiplier}<br>
        난이도 ${DIFF_LABELS[st.difficulty]} · 달성률 ${pct}% · 체력 ${Math.round(st.health)}/${st.maxHealth}
      </div>
    </div>
    <div class="pBtn" id="retryBtn" role="button">다시 도전</div>
    <div class="pBtn" id="backBtn" role="button">곡 선택으로</div>
    <div class="pClose" id="panelClose2" role="button" aria-label="닫기">✕</div>
  `;
  panel.style.display='block';

  document.getElementById('retryBtn').addEventListener('pointerdown',e=>{
    e.preventDefault();panel.style.display='none';
    startRhythmCountdown(st.songKey);
  });
  document.getElementById('backBtn').addEventListener('pointerdown',e=>{
    e.preventDefault();panel.style.display='none';
    rhythmState=null;
    document.getElementById('rhythmCv').style.display='none';
    document.getElementById('gameHud').style.display='none';
    document.getElementById('healthBar').style.display='none';
    showRhythmSongSelect();
  });
  document.getElementById('panelClose2').addEventListener('pointerdown',e=>{
    e.preventDefault();panel.style.display='none';
    exitMode();currentMode='free';
    document.querySelectorAll('.mtab').forEach(t=>t.classList.remove('active'));
    document.querySelector('[data-mode="free"]').classList.add('active');
    document.getElementById('modeLabel').textContent='자유연주';
  });
}

function startLesson(lv){
  const lesson=LESSONS[lv-1];if(!lesson)return;
  const seq=[];
  lesson.targets.forEach(t=>{for(let i=0;i<t.count;i++) seq.push({s:t.s,f:t.f,done:false});});
  learnState={active:true,lv,lesson,seq,idx:0};
  resetFingers(); /* lesson starts from all-open strings */
  const info=document.getElementById('lessonInfo');
  info.style.display='block';
  document.getElementById('lessonTitle').textContent=lv+'. '+lesson.title;
  document.getElementById('lessonSub').textContent=lesson.desc;
  highlightCurrentLearnTarget();
  speak(lesson.desc);
}

function highlightCurrentLearnTarget(){
  if(!learnState||learnState.idx>=learnState.seq.length)return;
  const t=learnState.seq[learnState.idx];
  highlightNote(t.s,t.f);
}

/* Judged at the moment of a bow stroke: the stroked string AND the fingering
   held on it at that moment must both match the target. Open-string targets
   (f=0) pass with a bow stroke alone — no button needed. */
function learnBow(si){
  if(!learnState||!learnState.active)return;
  const t=learnState.seq[learnState.idx];if(!t)return;
  if(si===t.s&&semi[si]===t.f){
    t.done=true;learnState.idx++;
    showJudge('좋아!','#ffd700');
    if(learnState.idx>=learnState.seq.length){finishLesson();}
    else{
      highlightCurrentLearnTarget();
      const next=learnState.seq[learnState.idx];
      const noteName=next.f===0?SN[next.s]:AE.nn(AE.freq(next.s,next.f));
      speak('다음: '+noteSpeak(noteName));
    }
  }else{
    showJudge('다시!','#ff4444'); /* the wrong note just sounded */
  }
}

function finishLesson(){
  const lv=learnState.lv;
  saveProgress({['lesson_'+lv]:true});
  clearHighlights();
  document.getElementById('lessonInfo').style.display='none';
  speak('레슨 '+lv+' 완료! 축하합니다!');

function speak(text){

    const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=1.1;u.volume=0.7;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

  html+='<div class="pHint">반주에 맞춰 연주해요</div><div class="pList">';

  Object.keys(SONGS).forEach(key=>{
    const song=SONGS[key];
    const best=progress['perform_'+key]||0;
    const starCount=progress['perform_stars_'+key]||0;
    const starStr=starCount>=3?'★★★':starCount>=2?'★★☆':starCount>=1?'★☆☆':'';
    html+=`<div class="pBtn" data-song="${key}" role="button">
      <div class="pTop"><span>${song.name}</span>${best>0?'<span class="stars">'+starStr+' '+best+'점</span>':''}</div>
      <div class="sub info">${song.category} · 빠르기 ${song.bpm} · 음 ${song.notes.filter(n=>n.note!=='R').length}개</div>
    </div>`;
  });
  html+='</div><div class="pClose" id="panelClose" role="button" aria-label="닫기">✕</div>';
  panel.innerHTML=html;
  panel.style.display='block';

  panel.querySelectorAll('.pBtn').forEach(btn=>{
    btn.addEventListener('pointerdown',e=>{
      e.preventDefault();panel.style.display='none';
      startPerformance(btn.dataset.song);
    });
  });
  document.getElementById('panelClose').addEventListener('pointerdown',e=>{
    e.preventDefault();panel.style.display='none';
    currentMode='free';
    document.querySelectorAll('.mtab').forEach(t=>t.classList.remove('active'));
    document.querySelector('[data-mode="free"]').classList.add('active');
    document.getElementById('modeLabel').textContent='자유연주';
  });
}

function startPerformance(songKey){
  const song=SONGS[songKey];const bpm=song.bpm;const beatMs=60000/bpm;
  const timeline=[];let beatPos=0;
  song.notes.forEach(n=>{
    timeline.push({note:n.note,s:n.s,f:n.f,dur:n.dur,startMs:beatPos*beatMs,endMs:(beatPos+n.dur)*beatMs,hit:false});
    beatPos+=n.dur;
  });
  performState={active:true,songKey,song,bpm,beatMs,timeline,totalMs:beatPos*beatMs,
    startTime:performance.now(),chordIdx:0,lastChordTime:0,accompaniment:true,noteIdx:0,
    score:0,correct:0,partial:0,miss:0,combo:0,maxCombo:0,bowStr:-1,bowTime:0};
  resetFingers(); /* song starts from all-open strings */
  document.getElementById('sheetArea').style.display='block';
  resizeSheetCv();
  document.getElementById('gameHud').style.display='block';
  document.getElementById('hudSong').textContent=song.name;
  document.getElementById('hudScore').textContent='0점';
  document.getElementById('hudCombo').textContent='';
  scheduleChords();
}

function resizeSheetCv(){
  const area=document.getElementById('sheetArea');const r=area.getBoundingClientRect();
  sheetCv.width=r.width*dpr;sheetCv.height=r.height*dpr;
  sheetCv.style.width=r.width+'px';sheetCv.style.height=r.height+'px';
  sctx.setTransform(dpr,0,0,dpr,0,0);
}

function scheduleChords(){
  if(!performState||!performState.active||!performState.accompaniment)return;
  const st=performState;const chords=CHORDS[st.songKey];
  if(!chords||chords.length===0)return;
  const elapsed=performance.now()-st.startTime;
  const chordDur=st.beatMs*4/1000;const chordMs=st.beatMs*4;
  if(elapsed-st.lastChordTime>=chordMs-50){
    const chord=chords[st.chordIdx%chords.length];
    AE.playChord(chord,chordDur);st.chordIdx++;st.lastChordTime=elapsed;
  }
}

/* Judged at the moment of a bow stroke: sounding note = stroked string +
   fingering held on it. Wrong string sounds the wrong note → MISS. */
function performBow(si){
  if(!performState||!performState.active)return;
  const st=performState;
  st.bowTime=performance.now();st.bowStr=si;
  checkPerformNote(si,semi[si]);
}
function checkPerformNote(si,sm){
  if(!performState||!performState.active)return;
  const st=performState;const now=performance.now();
  const n=st.timeline[st.noteIdx];
  if(!n||n.note==='R'||n.hit)return;
  const elapsed=now-st.startTime;
  if(elapsed<n.startMs-200||elapsed>n.endMs+200)return;
  if(si===n.s&&sm===n.f){
    n.hit=true;st.correct++;st.combo++;st.maxCombo=Math.max(st.maxCombo,st.combo);
    const mid=(n.startMs+n.endMs)/2;const diff=Math.abs(elapsed-mid);
    if(diff<n.dur*st.beatMs*0.25){st.score+=100;showJudge('최고!','#ffd700');AE.playSfx('perfect');}
    else{st.score+=60;showJudge('좋아','#44ddee');}
    document.getElementById('hudScore').textContent=st.score+'점';
    document.getElementById('hudCombo').textContent=st.combo>1?st.combo+' 연속':'';
  }else if(si===n.s){
    st.score+=20;n.hit=true;st.partial++;st.combo=0;
    showJudge('괜찮아','#44ee44');
    document.getElementById('hudScore').textContent=st.score+'점';
    document.getElementById('hudCombo').textContent='';
  }else{
    st.combo=0;st.miss++;
    showJudge('놓침','#ff4444');AE.playSfx('miss');
    document.getElementById('hudCombo').textContent='';
    highlightNote(n.s,n.f);
  }
}

function updatePerform(now){
  if(!performState||!performState.active)return;
  const st=performState;const elapsed=now-st.startTime;
  let curNote=null;
  for(let i=0;i<st.timeline.length;i++){
    const n=st.timeline[i];
    if(elapsed>=n.startMs&&elapsed<n.endMs){
      curNote=n;
      if(st.noteIdx!==i){
        for(let j=st.noteIdx;j<i;j++){
          const prev=st.timeline[j];
          if(!prev.hit&&prev.note!=='R'){prev.hit=true;st.miss++;st.combo=0;
            document.getElementById('hudCombo').textContent='';}
        }
        st.noteIdx=i;
        if(n.note!=='R'&&n.s>=0)highlightNote(n.s,n.f);else clearHighlights();
      }
      break;
    }
  }
  if(!curNote&&elapsed>st.totalMs+1000){
    for(let j=st.noteIdx;j<st.timeline.length;j++){
      const prev=st.timeline[j];
      if(!prev.hit&&prev.note!=='R'){prev.hit=true;st.miss++;}
    }
    st.active=false;clearHighlights();
    document.getElementById('sheetArea').style.display='none';
    finishPerform();return;
  }
  scheduleChords();
}

function finishPerform(){
  const st=performState;
  const total=st.timeline.filter(n=>n.note!=='R').length;
  const pct=total>0?Math.round((st.correct*100+st.partial*50)/(total*100)*100):0;
  const starCount=pct>=90?3:pct>=70?2:pct>=50?1:0;
  const stars=starCount>=3?'★★★':starCount>=2?'★★☆':starCount>=1?'★☆☆':'☆☆☆';

  const scoreKey='perform_'+st.songKey;
  const starsKey='perform_stars_'+st.songKey;
  const prev=loadProgress();const updates={};
  if((prev[scoreKey]||0)<st.score)updates[scoreKey]=st.score;
  if((prev[starsKey]||0)<starCount)updates[starsKey]=starCount;
  if(Object.keys(updates).length>0)saveProgress(updates);

  const panel=document.getElementById('panel');
  panel.innerHTML=`
    <h2>🎶 연주 결과</h2>
    <div style="text-align:center;padding:16px 0;">
      <div style="font-size:48px;color:#ffd700;margin-bottom:8px">${stars}</div>
      <div style="font-size:30px;color:#ffd700;font-weight:800">${st.score}점</div>
      <div style="font-size:16px;color:#eadcbc;margin-top:10px">
        정확 ${st.correct} · 부분 ${st.partial} · 놓침 ${st.miss}
      </div>
      <div class="info" style="font-size:16px;color:#cdb282;margin-top:6px">
        최대 연속 ${st.maxCombo} · 달성률 ${pct}%
      </div>
    </div>
    <div class="pBtn" id="perfRetryBtn" role="button">다시 연주</div>
    <div class="pBtn" id="perfBackBtn" role="button">곡 선택으로</div>
    <div class="pClose" id="perfCloseBtn" role="button" aria-label="닫기">✕</div>
  `;
  panel.style.display='block';
  document.getElementById('gameHud').style.display='none';

  document.getElementById('perfRetryBtn').addEventListener('pointerdown',e=>{
    e.preventDefault();panel.style.display='none';startPerformance(st.songKey);
  });
  document.getElementById('perfBackBtn').addEventListener('pointerdown',e=>{
    e.preventDefault();panel.style.display='none';performState=null;showPerformSongSelect();
  });
  document.getElementById('perfCloseBtn').addEventListener('pointerdown',e=>{
    e.preventDefault();panel.style.display='none';performState=null;
    currentMode='free';
    document.querySelectorAll('.mtab').forEach(t=>t.classList.remove('active'));
    document.querySelector('[data-mode="free"]').classList.add('active');
    document.getElementById('modeLabel').textContent='자유연주';
  });
}

function renderSheet(now){
  if(!performState||!document.getElementById('sheetArea').offsetParent)return;
  const area=document.getElementById('sheetArea').getBoundingClientRect();
  const W=area.width,H=area.height;
  sctx.clearRect(0,0,W,H);
  if(!performState.active)return;
  const st=performState;const elapsed=now-st.startTime;
  sctx.fillStyle='rgba(20,15,10,.3)';sctx.fillRect(0,0,W,H);
  const staffY=H/2;const LS=Math.max(6,Math.floor(H/8)); /* 줄 간격: 칸 높이에 맞춤 */
  sctx.strokeStyle='rgba(255,215,0,.15)';sctx.lineWidth=0.5;
  for(let l=-2;l<=2;l++){const y=staffY+l*LS;sctx.beginPath();sctx.moveTo(0,y);sctx.lineTo(W,y);sctx.stroke();}
  const pixPerMs=W/(st.beatMs*8);const centerX=60;
  st.timeline.forEach(n=>{
    if(n.note==='R')return;
    const x=centerX+(n.startMs-elapsed)*pixPerMs;
    if(x<-30||x>W+30)return;
    const noteH=n.dur*pixPerMs*st.beatMs;
    const col=n.s>=0?SC[n.s]:'#ffd700';
    const isCurrent=elapsed>=n.startMs&&elapsed<n.endMs;
    sctx.save();sctx.globalAlpha=isCurrent?1:.6;sctx.fillStyle=col;
    if(isCurrent){sctx.shadowColor=col;sctx.shadowBlur=8;}
    const PH=Math.max(8,LS*1.6),noteY=staffY-LS*2+n.s*LS*1.1-PH/2+LS*.4;
    rr(sctx,x,noteY,Math.max(noteH,PH*1.6),PH,PH/2);sctx.fill();
    sctx.fillStyle='#000';sctx.font='bold '+Math.round(PH*.8)+'px sans-serif';sctx.textAlign='center';sctx.textBaseline='middle';
    sctx.fillText(noteShort(n.note),x+Math.max(noteH,PH*1.6)/2,noteY+PH/2);sctx.restore();
  });
  sctx.strokeStyle='rgba(255,215,0,.6)';sctx.lineWidth=1.5;
  sctx.beginPath();sctx.moveTo(centerX,0);sctx.lineTo(centerX,H);sctx.stroke();
}

/* ═══════════════════════════════════════════════════════════
   RESIZE
   ═══════════════════════════════════════════════════════════ */
function resize(){
  dpr=devicePixelRatio||1;
  const appR=document.getElementById('app').getBoundingClientRect();
  totalW=appR.width;totalH=appR.height;
  osW=0; /* 개방현 버튼이 지판 맨 윗줄로 옮겨가 왼쪽 칸이 없음 → 현 세로선 = 음 버튼 칸 가운데 */
  bgCv.width=totalW*dpr;bgCv.height=totalH*dpr;bgCv.style.width=totalW+'px';bgCv.style.height=totalH+'px';
  bg.setTransform(dpr,0,0,dpr,0,0);
  const fbR=document.getElementById('fb').getBoundingClientRect();
  fbTop=fbR.top-appR.top;fbBot=fbR.bottom-appR.top;
  drawBG();
  const bR=bowCv.parentElement.getBoundingClientRect();
  BW=bR.width;BH=bR.height;
  bowCv.width=BW*dpr;bowCv.height=BH*dpr;bowCv.style.width=BW+'px';bowCv.style.height=BH+'px';
  bc.setTransform(dpr,0,0,dpr,0,0);
  if(rhythmState)resizeRhythmCv();
  if(performState&&document.getElementById('sheetArea').offsetParent)resizeSheetCv();
}

/* ═══════════════════════════════════════════════════════════
   MAIN LOOP
   ═══════════════════════════════════════════════════════════ */
let lt=performance.now();
function frame(ts){
  const dt=Math.min(.05,(ts-lt)/1000);lt=ts;
  for(let i=0;i<4;i++){
    if(actS===i&&bow.dn){vib[i]+=(bow.spd-vib[i])*dt*12;vibP[i]+=dt*48;}
    else{vib[i]*=Math.max(0,1-dt*6);if(vib[i]<.004)vib[i]=0;vibP[i]+=dt*48*vib[i];}
  }
  if(!bow.dn)bow.spd*=Math.max(0,1-dt*10);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=55*dt;p.life-=dt*2.8;if(p.life<=0)parts.splice(i,1);}
  renderBow();
  const ndV=((bow.dn||(inputMode==='nobow'&&actS>=0))&&curN)?curN:'';
  if(ndV!==ndShown){ndShown=ndV;document.getElementById('nd').innerHTML=ndV?noteHTML(ndV):'';}
  syncMore();
  document.getElementById('freeHint').style.display=(audioOn&&currentMode==='free'&&!freeHintDone)?'block':'none';

  if(currentMode==='rhythm'){updateRhythm(ts);renderRhythm(ts);}
  if(currentMode==='perform'){updatePerform(ts);renderSheet(ts);}

  const lt2=document.getElementById('loadTxt');
  if(lt2&&!audioOn)lt2.textContent='';
  else if(lt2&&audioOn&&!AE.loaded)lt2.textContent='소리 준비 중…';
  requestAnimationFrame(frame);
}
let ndShown='';

/* ═══════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════ */
function ensureA(){if(!audioOn){AE.init();audioOn=true;document.getElementById('ov').classList.add('H');}AE.res();}
document.getElementById('ov').addEventListener('pointerdown',e=>{e.preventDefault();ensureA();});
buildFB();buildOS();

/* ═══════════════════════════════════════════════════════════
   INPUT-MODE UI (touch-play vs. bow) — cards, toggle, hints
   ═══════════════════════════════════════════════════════════ */
function renderHowto(){
  const box=document.getElementById('howtoBox');if(!box)return;
  if(inputMode==='nobow'){
    box.innerHTML='<div>👆 <b>음 버튼</b>을 <b>누르면 바로 소리가 나요!</b></div>'
      +'<div>맨 윗줄 네 칸은 손가락을 떼고 켜는 <b>개방현</b>(솔·레·라·미)이에요.</div>'
      +'<div>🎵 음을 이어 눌러 멜로디를 연주해 보세요.</div>';
  }else{
    box.innerHTML='<div>🎵 <b>음 버튼</b>을 눌러 연주할 음을 골라요 <span style="color:#ff9d9d">— 아직 소리는 안 나요!</span></div>'
      +'<div>🎻 아래 <b>갈색 바이올린 몸통</b>을 손가락으로 <b>좌↔우로 문지르면</b> 그때 소리가 나요! (활 긋기)</div>'
      +'<div>👐 음 버튼을 <b>누른 채</b> 몸통을 문지르면 그 음이 연주돼요. 손을 모두 떼면 개방현으로 돌아가요.</div>';
  }
}
function updInputToggleUI(){ /* ⚙ 설정 칸의 연주 방식 버튼 표시 맞추기 (옛 윗줄 '👆 터치/🎻 활' 토글을 옮김) */
  document.querySelectorAll('.sbtn[data-set="im"]').forEach(b=>b.classList.toggle('on',b.dataset.v===inputMode));
}
function updFreeHint(){
  const h=document.getElementById('freeHint');if(!h)return;
  h.innerHTML=inputMode==='nobow'
    ?'💡 음 버튼을 <b>탭</b>하면 바로 소리가 나요!'
    :'💡 음 버튼을 고른 뒤, 아래 몸통을 좌↔우로 <b>문지르면</b> 소리가 나요!';
}
function setInputMode(m){
  inputMode=(m==='bow')?'bow':'nobow';
  try{localStorage.setItem('violin_input_mode',inputMode);}catch(e){}
  document.querySelectorAll('.mcard').forEach(c=>c.classList.toggle('sel',c.dataset.im===inputMode));
  renderHowto();updInputToggleUI();updFreeHint();
}
/* 첫 화면 카드: 누르면 그 방식으로 바로 시작 (따로 '시작' 버튼 없음 — 카드 밖을 눌러도 지난번 방식으로 시작) */
document.querySelectorAll('.mcard').forEach(c=>{
  c.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();setInputMode(c.dataset.im);ensureA();});
});
setInputMode(inputMode); /* sync all input-mode UI to stored/default value */

/* ── ⚙ 설정 칸 · '더 보기' 메뉴 ── */
function syncSettingsUI(){
  const v={im:inputMode,names:uiPrefs.names,sharps:String(uiPrefs.sharps?1:0),
    spd:String(rhythmSpeed<0.99?0.75:1),prac:practiceMode?'1':'0',info:String(uiPrefs.info?1:0)};
  document.querySelectorAll('.sbtn').forEach(b=>b.classList.toggle('on',v[b.dataset.set]===b.dataset.v));
  document.body.classList.toggle('showSharp',!!uiPrefs.sharps);
  document.body.classList.toggle('showInfo',!!uiPrefs.info);
}
document.querySelectorAll('.sbtn').forEach(b=>{
  b.addEventListener('pointerdown',e=>{
    e.preventDefault();e.stopPropagation();
    const k=b.dataset.set,val=b.dataset.v;
    if(k==='im')setInputMode(val);
    else if(k==='names'){uiPrefs.names=val==='abc'?'abc':'doremi';saveUiPrefs();relabelNotes();ndShown='';}
    else if(k==='sharps'){uiPrefs.sharps=val==='1'?1:0;saveUiPrefs();}
    else if(k==='info'){uiPrefs.info=val==='1'?1:0;saveUiPrefs();}
    else if(k==='spd'){rhythmSpeed=parseFloat(val)||1;}
    else if(k==='prac'){practiceMode=val==='1';}
    syncSettingsUI();
  });
});
function closeMenus(){
  document.getElementById('moreMenu').classList.remove('open');
  document.getElementById('setPanel').classList.remove('open');
  document.getElementById('gear').classList.remove('open');
}
document.getElementById('gear').addEventListener('pointerdown',e=>{
  e.preventDefault();e.stopPropagation();
  const p=document.getElementById('setPanel'),open=!p.classList.contains('open');
  closeMenus();if(open){syncSettingsUI();p.classList.add('open');e.currentTarget.classList.add('open');}
});
document.getElementById('moreBtn').addEventListener('pointerdown',e=>{
  e.preventDefault();e.stopPropagation();
  const m=document.getElementById('moreMenu'),open=!m.classList.contains('open');
  closeMenus();if(open)m.classList.add('open');
});
/* 칸 밖을 누르면 접기 (capture: 음 버튼이 stopPropagation 해도 먼저 받음) */
document.addEventListener('pointerdown',e=>{
  const t=e.target;
  if(t.closest&&(t.closest('#setPanel')||t.closest('#gear')||t.closest('#moreWrap')))return;
  closeMenus();
},true);
/* '더 보기' 안의 모드(배우기·곡 연주)가 켜져 있으면 그 이름을 버튼에 보여 준다 */
let moreKey=null;
function syncMore(){
  const a=document.querySelector('#moreMenu .mtab.active');const k=a?a.dataset.mode:'';
  if(k===moreKey)return;moreKey=k;
  const b=document.getElementById('moreBtn');b.classList.toggle('active',!!a);
  b.textContent=(a?a.textContent:'더 보기')+' ▾';
}
syncSettingsUI();

requestAnimationFrame(()=>{resize();requestAnimationFrame(frame);});
window.addEventListener('resize',resize);

/* Practice toggle button */
document.getElementById('practiceToggle').addEventListener('pointerdown',e=>{
  e.preventDefault();
  practiceMode=!practiceMode;
  e.target.classList.toggle('active',practiceMode);
});
</script>
