<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>우주 탐험가 - Space Explorer 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#e0e8ff;font-family:'Segoe UI',sans-serif;overflow:hidden;touch-action:none;user-select:none}
canvas{display:block}
#c{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
#ui>*{pointer-events:auto}
.panel{background:rgba(10,15,40,0.92);border:1px solid rgba(100,140,255,0.3);border-radius:12px;padding:16px;backdrop-filter:blur(6px)}
#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;padding:8px 16px;font-size:14px}
#hud .fuel-bar{width:120px;height:14px;background:#1a1a3a;border-radius:7px;overflow:hidden;border:1px solid #334}
#hud .fuel-fill{height:100%;background:linear-gradient(90deg,#f80,#ff0);border-radius:7px;transition:width 0.3s}
#hud .badge-count{color:#ffd700}
.btn{background:linear-gradient(135deg,#1a3a6a,#0d2040);border:1px solid rgba(100,160,255,0.4);color:#8cf;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px;transition:all 0.2s}
.btn:hover,.btn:active{background:linear-gradient(135deg,#2a5a9a,#1a3a6a);color:#fff;border-color:#6af}
.btn-gold{background:linear-gradient(135deg,#5a4a10,#3a3000);border-color:rgba(255,215,0,0.5);color:#ffd700}
#planet-info{position:absolute;bottom:0;left:0;right:0;max-height:60vh;overflow-y:auto;display:none;padding:20px;border-radius:16px 16px 0 0}
#planet-info h2{color:#ffd700;margin-bottom:8px;font-size:20px}
#planet-info .facts{color:#b0c8ff;line-height:1.7;margin:10px 0}
#quiz-panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(90vw,420px);display:none;padding:24px}
#quiz-panel h3{color:#ffd700;margin-bottom:12px}
#quiz-panel .q-option{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 14px;background:rgba(30,50,100,0.6);border:1px solid #335;border-radius:8px;color:#aac;cursor:pointer;font-size:14px}
#quiz-panel .q-option:hover{background:rgba(50,80,150,0.6);color:#fff}
#quiz-panel .q-option.correct{background:rgba(0,150,50,0.4);border-color:#0a0;color:#0f0}
#quiz-panel .q-option.wrong{background:rgba(150,0,0,0.4);border-color:#a00;color:#f66}
#builder{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(95vw,500px);display:none;padding:20px}
#builder h3{color:#ffd700;margin-bottom:12px}
.part-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.part-item{text-align:center;padding:10px;background:rgba(20,30,60,0.8);border:1px solid #335;border-radius:8px;cursor:pointer;font-size:12px}
.part-item.selected{border-color:#ffd700;background:rgba(60,60,20,0.6)}
.part-item .icon{font-size:28px;display:block;margin-bottom:4px}
#rocket-preview{text-align:center;margin:12px 0;min-height:80px}
#album{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(95vw,520px);max-height:80vh;overflow-y:auto;display:none;padding:20px}
#album h3{color:#ffd700;margin-bottom:12px}
.album-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.album-item{text-align:center;padding:12px 6px;background:rgba(20,30,60,0.7);border-radius:10px;border:1px solid #223}
.album-item.collected{border-color:#ffd700;background:rgba(40,40,10,0.5)}
.album-item .planet-icon{font-size:32px;display:block;margin-bottom:4px}
.album-item .sample-count{font-size:11px;color:#889}
#upgrade-panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(95vw,460px);display:none;padding:20px}
.upgrade-item{display:flex;justify-content:space-between;align-items:center;padding:10px;margin:6px 0;background:rgba(20,30,60,0.7);border-radius:8px;border:1px solid #334}
.upgrade-item .cost{color:#ffd700;font-size:13px}
#nav-btns{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#menu-bar{position:absolute;top:50px;right:8px;display:flex;flex-direction:column;gap:6px}
.close-btn{position:absolute;top:10px;right:14px;background:none;border:none;color:#f66;font-size:22px;cursor:pointer}
#toast{position:absolute;top:80px;left:50%;transform:translateX(-50%);background:rgba(0,80,0,0.85);color:#0f0;padding:10px 20px;border-radius:8px;font-size:14px;display:none;z-index:99;border:1px solid #0a0}
#title-overlay{position:absolute;top:38px;left:50%;transform:translateX(-50%);text-align:center;color:#ffd700;font-weight:bold;font-size:18px;text-shadow:0 0 8px #000;pointer-events:none}
#title-overlay .sub{color:#6688aa;font-size:12px;font-weight:normal;margin-top:4px}
/* ============= VFX: Panel transitions (fade + scale) ============= */
#planet-info,#quiz-panel,#builder,#album,#upgrade-panel{opacity:0;transition:opacity 0.3s ease-out,transform 0.3s ease-out}
#planet-info{transform:translateY(20px) scale(0.92);transform-origin:center bottom}
#quiz-panel,#builder,#album,#upgrade-panel{transform:translate(-50%,-50%) scale(0.92);transform-origin:center center}
#planet-info.vfx-show{opacity:1;transform:translateY(0) scale(1)}
#quiz-panel.vfx-show,#builder.vfx-show,#album.vfx-show,#upgrade-panel.vfx-show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#planet-info.vfx-hide,#quiz-panel.vfx-hide,#builder.vfx-hide,#album.vfx-hide,#upgrade-panel.vfx-hide{transition:opacity 0.2s ease-in,transform 0.2s ease-in}
/* ============= VFX: Button click feedback ============= */
.btn:active{transform:scale(0.95);transition:transform 0.1s ease-out}
.btn{transition:all 0.2s,transform 0.1s ease-out}
.q-option:active{transform:scale(0.97);transition:transform 0.1s ease-out}
/* ============= VFX: HUD count-up spring ============= */
@keyframes vfx-countup{0%{transform:scale(1)}30%{transform:scale(1.4);color:#fff200}60%{transform:scale(0.92)}100%{transform:scale(1)}}
#hud-samples.vfx-bump,#hud-badges.vfx-bump{display:inline-block;animation:vfx-countup 0.4s cubic-bezier(0.34,1.56,0.64,1) 1}
/* ============= VFX: HUD low-fuel pulse ============= */
@keyframes vfx-fuel-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,40,40,0)}50%{box-shadow:0 0 12px 4px rgba(255,40,40,0.85)}}
#fuel-bar.vfx-low{animation:vfx-fuel-pulse 0.8s ease-in-out infinite;background:linear-gradient(90deg,#f33,#ff6)!important}
/* ============= VFX: Badge gold flash ============= */
@keyframes vfx-gold-flash{0%{opacity:0}30%{opacity:0.85}100%{opacity:0}}
#vfx-flash{position:absolute;inset:0;pointer-events:none;z-index:50;background:radial-gradient(ellipse at center,rgba(255,215,0,0.85) 0%,rgba(255,180,0,0.4) 40%,rgba(255,140,0,0) 75%);opacity:0;display:none}
#vfx-flash.active{display:block;animation:vfx-gold-flash 0.5s ease-out forwards}
</style>

  if(this.upgrades.rocket>=1)eff=0.8;
  if(this.upgrades.rocket>=2)eff=0.5;
  return Math.ceil(base*eff);

  if(p.id === 'sun'){
    // VFX: 태양 코로나 셰이더 (procedural noise(uv*5+time*0.1) + fresnel rim)
    mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uColor1: { value: new THREE.Color(0xffee88) },  // 중심 색
        uColor2: { value: new THREE.Color(0xff6600) },  // 가장자리 불꽃 색
        uTex: { value: TEX.sun }
      },
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vViewDir;
        void main(){
          vUv = uv;
          vNormal = normalize(normalMatrix * normal);
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          vViewDir = normalize(-mv.xyz);
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform vec3 uColor1;
        uniform vec3 uColor2;
        uniform sampler2D uTex;
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vViewDir;
        // 끓는 표면 noise: noise(uv*5 + time*0.1)
        float noise(vec2 p){
          return sin(p.x * 5.0 + uTime * 0.1) * sin(p.y * 5.0 - uTime * 0.1)
               + 0.5 * sin(p.x * 11.0 - uTime * 0.15) * sin(p.y * 13.0 + uTime * 0.12)
               + 0.25 * sin(p.x * 23.0 + uTime * 0.2) * sin(p.y * 19.0 - uTime * 0.18);
        }
        void main(){
          vec2 uv = vUv;
          float boil = noise(uv * 5.0);
          float intensity = 0.5 + 0.5 * (boil + 1.0) * 0.5;
          vec3 base = texture2D(uTex, uv).rgb;
          // 중심 노랑 → 가장자리 주황 (intensity 기반)
          vec3 hot = mix(uColor2, uColor1, intensity);
          vec3 col = mix(base * 0.6, hot, 0.75) * (0.85 + 0.4 * intensity);
          // fresnel: 가장자리에서 불꽃 강조
          float rim = pow(1.0 - max(dot(vNormal, vViewDir), 0.0), 1.6);
          col = mix(col, uColor2, rim * 0.7);
          col += uColor1 * rim * 0.4;
          gl_FragColor = vec4(col, 1.0);

      `

const starsMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    attribute float aPhase;
    attribute float aBright;
    varying float vBright;
    uniform float uTime;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = (1.5 + aBright * 1.8) * (300.0 / -mv.z);
      vBright = aBright * (0.5 + 0.5 * sin(uTime * 2.0 + aPhase));
    }
  `,
  fragmentShader: `
    varying float vBright;
    void main(){
      vec2 d = gl_PointCoord - vec2(0.5);
      float r = length(d);
      if(r > 0.5) discard;
      float alpha = (1.0 - r * 2.0) * vBright;
      gl_FragColor = vec4(1.0, 1.0, 0.95, alpha);
    }
  `,
  transparent: true,
  depthWrite: false,

  dustVel[i*3]   = (Math.random() - 0.5) * 0.5;

  dustVel[i*3+2] = (Math.random() - 0.5) * 0.5;
}
dustGeom.setAttribute('position', new THREE.Float32BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({
  color: 0xffffff,
  size: 0.5,
  transparent: true,
  opacity: 0.4,
  depthWrite: false,
  sizeAttenuation: true
});
const dustField = new THREE.Points(dustGeom, dustMat);
dustField.frustumCulled = false;
scene.add(dustField);

function updateDust(dt){
  const camPos = camera.position;
  const arr = dustGeom.attributes.position.array;
  for(let i = 0; i < DUST_COUNT; i++){
    arr[i*3]   += dustVel[i*3]   * dt;
    arr[i*3+1] += dustVel[i*3+1] * dt;
    arr[i*3+2] += dustVel[i*3+2] * dt;
    // wrap-around: 카메라 기준 ±DUST_BOX
    let dx = arr[i*3]   - camPos.x;
    let dy = arr[i*3+1] - camPos.y;
    let dz = arr[i*3+2] - camPos.z;
    if(dx >  DUST_BOX) arr[i*3]   -= 2 * DUST_BOX;
    if(dx < -DUST_BOX) arr[i*3]   += 2 * DUST_BOX;
    if(dy >  DUST_BOX) arr[i*3+1] -= 2 * DUST_BOX;
    if(dy < -DUST_BOX) arr[i*3+1] += 2 * DUST_BOX;
    if(dz >  DUST_BOX) arr[i*3+2] -= 2 * DUST_BOX;
    if(dz < -DUST_BOX) arr[i*3+2] += 2 * DUST_BOX;
  }
  dustGeom.attributes.position.needsUpdate = true;
}

const thrustLife = new Float32Array(THRUST_COUNT); // 0..1 (1=신생, 0=소멸, 수명 1초)
for(let i = 0; i < THRUST_COUNT; i++){

}
thrustGeom.setAttribute('position', new THREE.Float32BufferAttribute(thrustPos, 3));
thrustGeom.setAttribute('color', new THREE.Float32BufferAttribute(thrustColor, 3));
const thrustMat = new THREE.PointsMaterial({
  size: 2.0,
  transparent: true,
  opacity: 0.9,
  vertexColors: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  sizeAttenuation: true
});
const thrustField = new THREE.Points(thrustGeom, thrustMat);
thrustField.frustumCulled = false;
thrustField.visible = false;
scene.add(thrustField);

const _thrustForward = new THREE.Vector3();
const _thrustRight = new THREE.Vector3();
const _thrustUp = new THREE.Vector3();
const _thrustOrigin = new THREE.Vector3();
function updateThrust(dt){
  if(G.state !== 'travel'){
    if(thrustField.visible) thrustField.visible = false;
    return;
  }
  thrustField.visible = true;
  // 분사 원점 결정: travel 모드에서 spaceship.glb가 보이면 그 뒤, 아니면 카메라 후방
  let useShip = (spaceshipModel && spaceshipModel.visible);
  if(useShip){
    spaceshipModel.getWorldPosition(_thrustOrigin);
    // spaceship의 forward = -Z (lookAt 적용 후 기준)
    _thrustForward.set(0, 0, -1).applyQuaternion(spaceshipModel.quaternion);
  } else {
    _thrustOrigin.copy(camera.position);
    camera.getWorldDirection(_thrustForward);
  }
  _thrustUp.set(0,1,0);
  _thrustRight.crossVectors(_thrustForward, _thrustUp).normalize();
  _thrustUp.crossVectors(_thrustRight, _thrustForward).normalize();
  const arr = thrustGeom.attributes.position.array;
  const carr = thrustGeom.attributes.color.array;
  for(let i = 0; i < THRUST_COUNT; i++){
    thrustLife[i] -= dt; // 수명 1초
    if(thrustLife[i] <= 0){
      // respawn: 분사 원점 후방
      thrustLife[i] = 1.0;
      const back = useShip ? (1.5 + Math.random() * 1.5) : (4 + Math.random() * 2);
      const sp = useShip ? 1.0 : 2.2;
      const spread = (Math.random() - 0.5) * sp;
      const spread2 = (Math.random() - 0.5) * sp;
      arr[i*3]   = _thrustOrigin.x - _thrustForward.x * back + _thrustRight.x * spread + _thrustUp.x * spread2;
      arr[i*3+1] = _thrustOrigin.y - _thrustForward.y * back + _thrustRight.y * spread + _thrustUp.y * spread2;
      arr[i*3+2] = _thrustOrigin.z - _thrustForward.z * back + _thrustRight.z * spread + _thrustUp.z * spread2;
    } else {
      // drift further behind
      const driftSpd = useShip ? 8 : 6;
      arr[i*3]   -= _thrustForward.x * dt * driftSpd;
      arr[i*3+1] -= _thrustForward.y * dt * driftSpd;
      arr[i*3+2] -= _thrustForward.z * dt * driftSpd;
    }
    // 색상 페이드: life 1.0=노랑(1,1,0.3), 0.5=주황(1,0.5,0.1), 0.0=빨강(1,0.1,0)
    const L = thrustLife[i];
    if(L > 0.5){
      const k = (L - 0.5) * 2.0; // 0..1
      carr[i*3]   = 1.0;
      carr[i*3+1] = 0.5 + 0.5 * k;
      carr[i*3+2] = 0.1 + 0.2 * k;
    } else {
      const k = L * 2.0; // 0..1
      carr[i*3]   = 1.0;
      carr[i*3+1] = 0.1 + 0.4 * k;
      carr[i*3+2] = 0.05 * k;
    }
  }
  thrustGeom.attributes.position.needsUpdate = true;
  thrustGeom.attributes.color.needsUpdate = true;
  thrustMat.opacity = 0.9;
}

// ============= VFX: 샘플 채집 폭죽 (24개, 0.8초, 노랑→투명) =============
const BURST_COUNT = 24;
const BURST_DURATION = 0.8;
const burstGeom = new THREE.BufferGeometry();
const burstPos = new Float32Array(BURST_COUNT * 3);
const burstVel = new Float32Array(BURST_COUNT * 3);
burstGeom.setAttribute('position', new THREE.Float32BufferAttribute(burstPos, 3));
const burstMat = new THREE.PointsMaterial({
  color: 0xffd700,
  size: 1.8,
  transparent: true,
  opacity: 0,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  sizeAttenuation: true
});
const burstField = new THREE.Points(burstGeom, burstMat);
burstField.frustumCulled = false;
burstField.visible = false;
scene.add(burstField);
let burstTimer = 0;

function spawnBurst(worldPos){
  for(let i = 0; i < BURST_COUNT; i++){
    burstPos[i*3]   = worldPos.x;
    burstPos[i*3+1] = worldPos.y;
    burstPos[i*3+2] = worldPos.z;
    // 구면 균등 방향 (방사형 폭발)
    const u = Math.random() * 2 - 1;
    const a = Math.random() * Math.PI * 2;
    const r = Math.sqrt(1 - u*u);
    const speed = 5 + Math.random() * 3;
    burstVel[i*3]   = r * Math.cos(a) * speed;
    burstVel[i*3+1] = u * speed;
    burstVel[i*3+2] = r * Math.sin(a) * speed;
  }
  burstGeom.attributes.position.needsUpdate = true;
  burstMat.opacity = 1.0;
  burstField.visible = true;
  burstTimer = BURST_DURATION;
}

function updateBurst(dt){
  if(!burstField.visible) return;
  burstTimer -= dt;
  if(burstTimer <= 0){
    burstField.visible = false;
    burstMat.opacity = 0;
    return;
  }
  const arr = burstGeom.attributes.position.array;
  for(let i = 0; i < BURST_COUNT; i++){
    arr[i*3]   += burstVel[i*3]   * dt;
    arr[i*3+1] += burstVel[i*3+1] * dt;
    arr[i*3+2] += burstVel[i*3+2] * dt;
    // gentle slow-down
    burstVel[i*3]   *= 0.94;
    burstVel[i*3+1] *= 0.94;
    burstVel[i*3+2] *= 0.94;
  }
  burstGeom.attributes.position.needsUpdate = true;
  burstMat.opacity = Math.max(burstTimer / BURST_DURATION, 0);
}

// ============= 카메라 상태 머신 =============
const cameraState = {
  pos: new THREE.Vector3(0, 180, 380),
  target: new THREE.Vector3(0, 0, 0),
  travelStartPos: new THREE.Vector3(),
  travelEndPos: new THREE.Vector3(),
  travelStartTarget: new THREE.Vector3(),
  travelEndTarget: new THREE.Vector3(),
  travelT: 0,
  travelDur: 1.5,
  travelCb: null,
  // VFX: 카메라 진동
  shakeTime: 0,
  shakeDur: 0,
  shakeAmp: 0
};
function triggerShake(duration, amplitude){
  cameraState.shakeDur = duration;
  cameraState.shakeTime = duration;
  cameraState.shakeAmp = amplitude;
}
const _currentLookAt = new THREE.Vector3(0, 0, 0);
// 매 프레임 alloc 회피 — 모듈 스코프 재사용 객체 (QA-2 권고)
const _tmpPos = new THREE.Vector3();
const _tmpDir = new THREE.Vector3();
const _tmpOff = new THREE.Vector3();
const _tmpOff2 = new THREE.Vector3();
const _tmpUp = new THREE.Vector3(0, 1.5, 3);
const _tmpSph = new THREE.Spherical();
const _tmpSph2 = new THREE.Spherical();

function easeInOutCubic(t){ return t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }

function getPlanetWorldPos(p, out){
  out = out || _tmpPos;
  const mesh = planetMeshes[p.id];
  if(!mesh) return out.set(0,0,0);
  mesh.getWorldPosition(out);
  return out;
}

function startTravel(planet, cb){
  G.state = 'travel';
  cameraState.travelStartPos.copy(camera.position);
  cameraState.travelStartTarget.copy(_currentLookAt);
  const planetPos = getPlanetWorldPos(planet, _tmpPos);
  const r3D = planetMeshes[planet.id].userData.radius3D;
  if(planetPos.length() > 0.1){ _tmpDir.copy(planetPos).normalize(); }
  else { _tmpDir.set(1,0,0); }
  cameraState.travelEndPos.copy(planetPos)
    .addScaledVector(_tmpDir, r3D * 5)
    .add(_tmpUp.set(0, r3D * 1.5, r3D * 3));
  cameraState.travelEndTarget.copy(planetPos);
  cameraState.travelT = 0;
  cameraState.travelCb = cb;
  sfx('travel_start');
}

// playTravel 시그니처 보존 (외부 호환용)
function playTravel(planet, cb){ startTravel(planet, cb); }

function updateCamera(dt){
  if(G.state === 'map'){
    cameraState.pos.set(0, 180, 380);
    cameraState.target.set(0, 0, 0);
  } else if(G.state === 'travel'){
    cameraState.travelT += dt / cameraState.travelDur;
    const t = Math.min(cameraState.travelT, 1);
    const eased = easeInOutCubic(t);
    // 이동 중 목적지 행성 위치 갱신 (행성이 공전 중이므로)
    if(G.currentPlanet){
      const planetPos = getPlanetWorldPos(G.currentPlanet, _tmpPos);
      const r3D = planetMeshes[G.currentPlanet.id].userData.radius3D;
      if(planetPos.length() > 0.1){ _tmpDir.copy(planetPos).normalize(); }
      else { _tmpDir.set(1,0,0); }
      cameraState.travelEndPos.copy(planetPos)
        .addScaledVector(_tmpDir, r3D * 5)
        .add(_tmpUp.set(0, r3D * 1.5, r3D * 3));
      cameraState.travelEndTarget.copy(planetPos);
    }
    cameraState.pos.lerpVectors(cameraState.travelStartPos, cameraState.travelEndPos, eased);
    cameraState.target.lerpVectors(cameraState.travelStartTarget, cameraState.travelEndTarget, eased);
    if(t >= 1){
      // 도착
      const cb = cameraState.travelCb;
      cameraState.travelCb = null;
      sfx('travel_arrive');
      // VFX: 도착 카메라 진동
      triggerShake(0.3, 0.5);
      if(cb) cb();
    }
  } else if(G.state === 'explore' && G.currentPlanet){
    const p = G.currentPlanet;
    const planetPos = getPlanetWorldPos(p, _tmpPos);
    const r3D = planetMeshes[p.id].userData.radius3D;
    // Spherical 좌표: phi=π/2 - 0.25 (위에서 약간 비스듬), theta=camX 기반
    _tmpSph.set(r3D * 3.0, Math.PI/2 - 0.25, G.camX * 0.005);
    _tmpOff.setFromSpherical(_tmpSph);
    cameraState.pos.copy(planetPos).add(_tmpOff);
    cameraState.target.copy(planetPos);

    // 우주비행사/우주선 위치 갱신 (행성 표면 근처)
    if(spaceshipModel){
      _tmpSph2.set(r3D * 1.6, Math.PI/2 - 0.1, G.camX * 0.005 + 0.3);
      _tmpOff2.setFromSpherical(_tmpSph2);
      spaceshipModel.position.copy(planetPos).add(_tmpOff2);
      spaceshipModel.lookAt(planetPos);
      spaceshipModel.visible = true;
      if(astronautSprite) astronautSprite.visible = false;
    } else if(astronautSprite){
      _tmpSph2.set(r3D * 1.4, Math.PI/2 - 0.1, G.camX * 0.005 + 0.2);
      _tmpOff2.setFromSpherical(_tmpSph2);
      astronautSprite.position.copy(planetPos).add(_tmpOff2);
      astronautSprite.visible = true;
    }
  }

  // 부드러운 보간
  if(G.state === 'travel'){
    camera.position.copy(cameraState.pos);
    _currentLookAt.copy(cameraState.target);
  } else {
    camera.position.lerp(cameraState.pos, 0.1);
    _currentLookAt.lerp(cameraState.target, 0.1);
  }
  // VFX: 카메라 진동 적용
  if(cameraState.shakeTime > 0){
    cameraState.shakeTime = Math.max(0, cameraState.shakeTime - dt);
    const k = cameraState.shakeTime / cameraState.shakeDur;
    const amp = cameraState.shakeAmp * k;
    camera.position.x += (Math.random() - 0.5) * 2 * amp;
    camera.position.y += (Math.random() - 0.5) * 2 * amp;
    camera.position.z += (Math.random() - 0.5) * 2 * amp;
  }
  camera.lookAt(_currentLookAt);
}

function updateWorld(dt){
  // 행성 공전
  PLANETS.forEach(p => {
    if(p.id === 'sun') return;
    const pivot = planetPivots[p.id];
    if(pivot) pivot.rotation.y += p.speed * dt * SPEED_GAIN * 60;
    const mesh = planetMeshes[p.id];
    if(mesh) mesh.rotation.y += dt * 0.3;
  });
  // 태양 자전
  if(planetMeshes.sun) planetMeshes.sun.rotation.y += dt * 0.05;
}

const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2();

function onPointerDown(e){
  ensureAudio();
  if(G.state !== 'map') return;
  const rect = renderer.domElement.getBoundingClientRect();
  const cx = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
  const cy = (e.clientY !== undefined) ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
  mouseNDC.x = ((cx - rect.left) / rect.width) * 2 - 1;
  mouseNDC.y = -((cy - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouseNDC, camera);
  const hits = raycaster.intersectObjects(pickableMeshes, false);
  if(hits.length > 0){
    const p = hits[0].object.userData.planetData;
    if(p){
      sfx('ui_click');
      showPlanetInfo(p);
    }
  }
}
canvas.addEventListener('pointerdown', onPointerDown);

// VFX: 행성 호버 펄스 (PC, pointermove raycast → emissive 펄스)
let hoverPlanetId = null;
function onPointerMove(e){
  if(IS_MOBILE) return;
  if(G.state !== 'map') return;
  const rect = renderer.domElement.getBoundingClientRect();
  mouseNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouseNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouseNDC, camera);
  const hits = raycaster.intersectObjects(pickableMeshes, false);
  const newId = (hits.length > 0 && hits[0].object.userData.planetData) ? hits[0].object.userData.planetData.id : null;
  if(newId !== hoverPlanetId){
    // 기존 호버 해제 (emissive 0으로 복원)
    if(hoverPlanetId){
      const oldMesh = planetMeshes[hoverPlanetId];
      if(oldMesh && oldMesh.material && oldMesh.material.emissive){
        oldMesh.material.emissive.setHex(0x000000);
        oldMesh.material.emissiveIntensity = 0;
      }
    }
    hoverPlanetId = newId;
    canvas.style.cursor = newId ? 'pointer' : 'default';
  }
}
canvas.addEventListener('pointermove', onPointerMove);

G.collectSample=function(){
 const p=this.currentPlanet;if(!p)return;
 if(!this.collected[p.id])this.collected[p.id]=[];
 const max=this.getCollectMax();
 const uncollected=p.samples.map((_,i)=>i).filter(i=>!this.collected[p.id].includes(i));
 if(uncollected.length===0){this.toast('이 행성의 모든 샘플을 채집했습니다!');return;}
 // 기존 호환: camX 기준 가까운 샘플 채집
 let best=-1,bestDist=Infinity;
 uncollected.forEach(i=>{
  const sx=200+i*300-this.camX;
  const d=Math.abs(sx-W/2);
  if(d<bestDist&&d<150){bestDist=d;best=i;}
 });
 if(best===-1){this.toast('💎에 더 가까이 이동하세요!');return;}
 this.collected[p.id].push(best);
 this.samples++;
 sfx('sample_collect');

  if(spaceshipModel && spaceshipModel.visible){
   spaceshipModel.getWorldPosition(burstPos);

   burstPos.copy(astronautSprite.position);
  } else {
   getPlanetWorldPos(p, burstPos);
  }
  spawnBurst(burstPos);
 }catch(e){}
 this.toast(`💎 "${p.samples[best]}" 채집 완료!`);
 this.updateHUD();this.save();
};

  b.style.pointerEvents='none';
  const bi=parseInt(b.dataset.idx);
  if(bi===q.a)b.classList.add('correct');
  if(bi===idx&&idx!==q.a)b.classList.add('wrong');
 });
 if(idx===q.a){
  qs.correct++;
  sfx('quiz_correct');
 } else {
  sfx('quiz_wrong');
 }
 setTimeout(()=>{
  qs.qIdx++;
  if(qs.qIdx<qs.planet.quizzes.length){
   showQuizQuestion();
  }else{
   const passed=qs.correct===qs.planet.quizzes.length;
   if(passed){
    G.quizDone[qs.planet.id]=true;G.badges++;
    G.toast(`🏅 ${qs.planet.name} 퀴즈 올클리어! 배지 획득!`);
    sfx('badge');
    // VFX: 골드 플래시
    try{
     const f=$('vfx-flash');
     f.classList.remove('active');
     void f.offsetWidth;
     f.classList.add('active');
     setTimeout(()=>f.classList.remove('active'),550);
    }catch(e){}
   }else{
    G.toast(`${qs.correct}/${qs.planet.quizzes.length} 정답. 다시 도전하세요!`);
   }
   closePanels();
   if(G.state==='explore')showExploreUI();
   G.updateHUD();G.save();
  }
 },1200);
};

// ============= BUILDER =============
G.showBuilder=function(){
 closePanels();
 sfx('ui_click');
 const el=$('builder');
 const currentParts=this.rocketParts;
 el.innerHTML=`<button class="close-btn" onclick="closePanels()">✕</button>
  <h3>🔧 로켓 조립소</h3>
  <p style="color:#889;font-size:13px;margin-bottom:8px">부품을 선택하여 로켓을 만드세요. 💎 샘플로 구매합니다.</p>
  <div class="part-grid">
   ${PARTS.map(p=>{
    const owned=currentParts.includes(p.id);
    const canBuy=this.samples>=p.cost;
    return `<div class="part-item ${owned?'selected':''}" onclick="G.togglePart('${p.id}')">
     <span class="icon">${p.icon}</span>
     <b>${p.name}</b><br>
     <span style="color:#889;font-size:11px">${p.desc}</span><br>
     ${p.cost>0?`<span style="color:${owned?'#0a0':canBuy?'#ffd700':'#a55'};font-size:12px">${owned?'장착됨':'💎'+p.cost}</span>`:'<span style="color:#0a0;font-size:12px">기본</span>'}
    </div>`;
   }).join('')}
  </div>
  <div id="rocket-preview">${this.getRocketPreview()}</div>
  <div style="display:flex;gap:8px;justify-content:center;margin-top:8px">
   <button class="btn" onclick="closePanels()">완료</button>
  </div>`;
 _showPanel('builder');
};

G.togglePart=function(pid){
 const part=PARTS.find(x=>x.id===pid);
 if(this.rocketParts.includes(pid)){
  if(part.cost===0){this.toast('기본 부품은 제거할 수 없습니다.');return;}
  this.rocketParts=this.rocketParts.filter(x=>x!==pid);
  this.toast(`${part.name} 제거됨`);
 }else{
  if(part.cost>0&&this.samples<part.cost){this.toast(`💎 ${part.cost}개 필요합니다.`);return;}
  if(part.cost>0)this.samples-=part.cost;
  this.rocketParts.push(pid);
  sfx('ui_click');
  this.toast(`${part.name} 장착!`);
 }
 this.recalcFuel();
 this.fuel=Math.min(this.fuel,this.maxFuel);
 this.updateHUD();this.save();
 this.showBuilder();
};

G.getRocketPreview=function(){
 let preview='';
 if(this.rocketParts.includes('antenna'))preview+='📡';
 if(this.rocketParts.includes('solar'))preview+='⚡';
 preview+='🛸';
 const fuelCount=this.rocketParts.filter(x=>x.startsWith('fuel')).length;
 for(let i=0;i<fuelCount;i++)preview+='🛢️';
 const engineCount=this.rocketParts.filter(x=>x.startsWith('engine')).length;
 for(let i=0;i<engineCount;i++)preview+='🔥';
 return `<div style="font-size:28px;letter-spacing:4px">${preview}</div>
  <div style="color:#889;font-size:12px;margin-top:6px">최대 연료: ${this.maxFuel} | 부품: ${this.rocketParts.length}개</div>`;
};

// ============= ALBUM =============
G.showAlbum=function(){
 closePanels();
 sfx('ui_click');
 const el=$('album');
 let totalSamples=0,collectedSamples=0;
 PLANETS.forEach(p=>{totalSamples+=p.samples.length;collectedSamples+=(G.collected[p.id]||[]).length;});
 el.innerHTML=`<button class="close-btn" onclick="closePanels()">✕</button>
  <h3>📖 수집 앨범</h3>
  <p style="color:#889;font-size:13px;margin-bottom:10px">채집 진행: ${collectedSamples}/${totalSamples} | 배지: ${G.badges}/${PLANETS.length}</p>
  <div class="album-grid">
   ${PLANETS.map(p=>{
    const col=G.collected[p.id]||[];
    const badge=G.quizDone[p.id];
    return `<div class="album-item ${col.length>0?'collected':''}">
     <span class="planet-icon">${p.icon}</span>
     <b style="font-size:12px">${p.name}</b>
     ${badge?'<br>🏅':''}
     <div class="sample-count">💎 ${col.length}/${p.samples.length}</div>
     ${col.map(i=>`<div style="font-size:10px;color:#aab">• ${p.samples[i]}</div>`).join('')}
    </div>`;
   }).join('')}
  </div>
  <button class="btn" onclick="closePanels()" style="margin-top:12px;width:100%">닫기</button>`;
 _showPanel('album');
};

// ============= UPGRADES =============
G.showUpgrades=function(){
 closePanels();
 sfx('ui_click');
 const el=$('upgrade-panel');
 el.innerHTML=`<button class="close-btn" onclick="closePanels()">✕</button>
  <h3>⬆ 우주비행사 강화</h3>
  <p style="color:#889;font-size:13px;margin-bottom:10px">💎 샘플로 업그레이드합니다. 현재: 💎${G.samples}</p>
  ${UPGRADES.map(u=>{
   const owned=G.upgrades[u.type]>=u.level;
   const canBuy=!owned&&G.samples>=u.cost&&G.upgrades[u.type]>=u.level-1;
   return `<div class="upgrade-item">
    <div>
     <b>${u.name}</b><br>
     <span style="color:#889;font-size:12px">${u.desc}</span>
    </div>
    <div>
     ${owned?'<span style="color:#0a0">보유</span>':`<button class="btn ${canBuy?'btn-gold':''}" onclick="G.buyUpgrade('${u.id}')" ${canBuy?'':'disabled style="opacity:0.4"'}>💎${u.cost}</button>`}
    </div>
   </div>`;
  }).join('')}
  <button class="btn" onclick="closePanels()" style="margin-top:12px;width:100%">닫기</button>`;
 _showPanel('upgrade-panel');
};

G.buyUpgrade=function(uid){
 const u=UPGRADES.find(x=>x.id===uid);
 if(!u||G.upgrades[u.type]>=u.level)return;
 if(G.samples<u.cost){G.toast('샘플이 부족합니다.');return;}
 if(G.upgrades[u.type]<u.level-1){G.toast('이전 단계를 먼저 구매하세요.');return;}
 G.samples-=u.cost;
 G.upgrades[u.type]=u.level;
 sfx('upgrade');
 G.toast(`⬆ ${u.name} 업그레이드 완료!`);
 G.updateHUD();G.save();
 G.showUpgrades();
};

// ============= INPUT (모바일/키보드 호환) =============
// 키보드
document.addEventListener('keydown', e => {
 if(G.state === 'explore'){
  if(e.key === 'ArrowLeft') G.moveExplorer(-1);
  if(e.key === 'ArrowRight') G.moveExplorer(1);
  if(e.key === ' ') G.collectSample();
 }
});

// 터치 스와이프 (explore 모드)
let touchSX = 0;
canvas.addEventListener('touchstart', e => {
  ensureAudio();
  if(e.touches && e.touches[0]) touchSX = e.touches[0].clientX;
}, { passive: true });
canvas.addEventListener('touchend', e => {
  if(G.state !== 'explore') return;
  if(!e.changedTouches || !e.changedTouches[0]) return;
  const dx = e.changedTouches[0].clientX - touchSX;
  if(Math.abs(dx) > 30) G.moveExplorer(dx > 0 ? -1 : 1);
}, { passive: true });

// resize
function resize(){
 W = window.innerWidth; H = window.innerHeight;
 renderer.setSize(W, H, false);
 camera.aspect = W / H;
 camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ============= GAME LOOP =============
let lastT = performance.now();
let isHidden = false;
document.addEventListener('visibilitychange', ()=>{
  isHidden = (document.visibilityState === 'hidden');
  if(!isHidden){
    lastT = performance.now();
    if(typeof AudioEngine !== 'undefined' && AudioEngine.resume) AudioEngine.resume();
  }
});

function gameLoop(now){
 if(isHidden){ requestAnimationFrame(gameLoop); return; }
 const dt = Math.min((now - lastT) / 1000, 0.1);
 lastT = now;
 const tSec = now / 1000;

 updateWorld(dt);
 updateCamera(dt);

 // VFX: 파티클 시스템 갱신
 updateDust(dt);
 updateThrust(dt);
 updateBurst(dt);

 // VFX: 셰이더 uniform 갱신 (별 트윙클, 태양 코로나, 코로나 셸)
 starsMat.uniforms.uTime.value = tSec;
 if(sunGroup.userData.sunMat) sunGroup.userData.sunMat.uniforms.uTime.value = tSec;
 if(sunGroup.userData.coronaMat) sunGroup.userData.coronaMat.uniforms.uTime.value = tSec;

 // VFX: 행성 호버 펄스 (PC, emissive 0.3 * sin(time*4))
 if(hoverPlanetId){
   const hm = planetMeshes[hoverPlanetId];
   if(hm && hm.material && hm.material.emissive){
     const pulse = 0.3 * (0.5 + 0.5 * Math.sin(tSec * 4));
     hm.material.emissive.setHex(0xffffff);
     hm.material.emissiveIntensity = pulse;
   }
 }

 renderer.render(scene, camera);
 requestAnimationFrame(gameLoop);
}

// ============= INIT =============
G.load();
G.recalcFuel();
if(G.fuel <= 0) G.fuel = G.maxFuel;
G.updateHUD();
requestAnimationFrame(gameLoop);

</script>
