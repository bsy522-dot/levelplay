/* ===== Design tokens — Juicy Mobile (밝고 통통한 캐주얼 게임) ===== */
:root{

  --hud-bg:rgba(28,46,22,.82);--hud-chip:rgba(255,255,255,.18);--hud-chip-bd:rgba(255,255,255,.34);
  --radius:14px;--radius-sm:10px;--radius-lg:20px;

  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);

  --navh:calc(112px + var(--safe-b)); /* 2행 하단바 높이(플로팅 버튼 기준점) */
  --toph:calc(37px + var(--safe-t)); /* 상단바 높이(배너·토스트 기준점) */
}

/* 하단 네비: 기본 2행×5열. font-size 기준 em 열폭이라 글자확대 시 열 수가 스스로 줄고(5→3→2)

#cbtn{position:fixed;right:calc(10px + var(--safe-r));bottom:calc(var(--navh) + 12px);width:48px;height:48px;border-radius:50%;background:var(--primary);color:#fff;border:3px solid var(--lime);font-size:22px;cursor:pointer;z-index:120;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;pointer-events:auto}

function resize(){W=innerWidth;H=innerHeight;C.width=W;C.height=H;MC.width=Math.min(W-40,360);MC.height=Math.min(H-120,400)}
// 16x16 농장 중심(7.5,7.5)을 상단바·하단바를 뺀 가시영역 중앙에 오게 카메라 보정.
// isoX center = (0)*16 + W/2 + camX → camX=0이 이미 가로 중앙. isoY center = 200 + camY.
// 상단바/하단바의 '실제' 높이를 재서 CSS 변수(--toph/--navh)에 반영.
// 접근성 글자확대(1.5배)로 바가 커져도 줌컨트롤·컨설턴트 버튼·토스트가 바를 덮지 않게 한다.
let BAR_T=37,BAR_N=112;
function syncBars(){
  const tb=document.getElementById('topbar'),bb=document.getElementById('bottombar');
  if(!tb||!bb)return false;
  const th=Math.round(tb.getBoundingClientRect().height);
  const nh=Math.round(bb.getBoundingClientRect().height);
  if(!th||!nh)return false;
  const changed=(th!==BAR_T||nh!==BAR_N);
  BAR_T=th;BAR_N=nh;
  const rs=document.documentElement.style;
  rs.setProperty('--toph',th+'px');
  rs.setProperty('--navh',nh+'px');
  // 글자확대로 바가 커져 캔버스가 너무 좁아지면 줌 컨트롤을 접는다(핀치 줌은 계속 됨)
  try{document.body.classList.toggle('tiny-band',(innerHeight-th-nh)<240)}catch(_){}
  return changed;
}
function centerCamera(){
  syncBars();
  const z=G.zoom||1;
  const bandMid=BAR_T+(H-BAR_T-BAR_N)/2;   // 상·하단바를 뺀 가시영역의 세로 중앙(화면좌표)
  // 화면좌표 = (프리줌좌표 - H/2)*z + H/2  →  프리줌좌표 = (화면 - H/2)/z + H/2
  const wantPre=(bandMid-H/2)/z+H/2;
  G.camX=0;
  G.camY=Math.round(wantPre-200);          // 농장 중심 isoY(=200)를 bandMid로
}
resize();
addEventListener('resize',()=>{resize();syncBars();/* 사용자가 직접 팬/줌 안 했으면 재중심 */ if(!G._userMoved)centerCamera();});
// 바 크기 변화(글자확대·칩 줄바꿈·안전영역)를 즉시 추적
addEventListener('load',()=>{
  try{
    syncBars();
    if(!G._userMoved)centerCamera();
    if(window.ResizeObserver){
      const ro=new ResizeObserver(()=>{if(syncBars()&&!G._userMoved)centerCamera();});
      ro.observe(document.getElementById('topbar'));
      ro.observe(document.getElementById('bottombar'));
    }
  }catch(_){}
});

// Sprite cache + preloader (graceful fallback if PNG missing)
const SPRITES={};
function preloadSprites(){
  const collect=[];
  for(const k in ANIMALS)if(ANIMALS[k].sprite)collect.push(ANIMALS[k].sprite);
  for(const k in CROPS)if(CROPS[k].sprite)collect.push(CROPS[k].sprite);
  for(const k in BUILDINGS)if(BUILDINGS[k].sprite)collect.push(BUILDINGS[k].sprite);
  collect.forEach(path=>{
    const img=new Image();
    SPRITES[path]={img,ok:false};
    img.onload=()=>{
      // 흰 배경 스프라이트 → 가장자리 연결 흰 픽셀만 투명 처리 (내부 흰색은 보존)
      // 그림 파일은 이미 투명 배경으로 고쳤지만, 기기 캐시에 남은 옛 그림(흰 네모)이 한 번 더 보일 수 있어 남겨 둔다
      try{SPRITES[path].img=stripWhiteBg(img);}catch(e){}
      SPRITES[path].ok=true;
    };
    img.onerror=()=>{SPRITES[path].ok=false};
    img.src=path;
  });
}
// 가장자리에서 연결된 근백색 배경을 flood-fill로 투명화한 캔버스 반환
function stripWhiteBg(img){
  const w=img.naturalWidth,h=img.naturalHeight;
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const cx=cv.getContext('2d');cx.drawImage(img,0,0);
  const id=cx.getImageData(0,0,w,h),d=id.data;
  const isBg=i=>d[i]>=235&&d[i+1]>=235&&d[i+2]>=235&&d[i+3]>0;
  const seen=new Uint8Array(w*h),stack=[];
  for(let x=0;x<w;x++){stack.push(x,x+(h-1)*w);}
  for(let y=0;y<h;y++){stack.push(y*w,y*w+w-1);}
  while(stack.length){
    const p=stack.pop();
    if(seen[p])continue;seen[p]=1;
    if(!isBg(p*4))continue;
    d[p*4+3]=0;
    const x=p%w,y=(p/w)|0;
    if(x>0)stack.push(p-1);if(x<w-1)stack.push(p+1);
    if(y>0)stack.push(p-w);if(y<h-1)stack.push(p+w);
  }
  cx.putImageData(id,0,0);
  return cv;
}
function getSprite(path){
  if(!path)return null;
  const e=SPRITES[path];
  if(!e||!e.ok||!e.img)return null;
  // stripWhiteBg 결과(canvas)거나, 정상 로드된 Image거나
  if(e.img instanceof HTMLCanvasElement)return e.img;
  if(e.img.complete&&e.img.naturalWidth>0)return e.img;
  return null;
}

// Audio - Procedural BGM + SFX system (no external files)
const AU={
ctx:null,masterGain:null,bgmGain:null,sfxGain:null,
bgmVol:0.35,sfxVol:0.6,muted:false,bgmMuted:false,
bgmTimer:null,currentSeasonBgm:-1,
init(){
  if(this.ctx)return;
  try{
    this.ctx=new(window.AudioContext||window.webkitAudioContext)();
    this.masterGain=this.ctx.createGain();this.masterGain.gain.value=1;
    this.bgmGain=this.ctx.createGain();this.bgmGain.gain.value=this.bgmVol;
    this.sfxGain=this.ctx.createGain();this.sfxGain.gain.value=this.sfxVol;
    this.bgmGain.connect(this.masterGain);
    this.sfxGain.connect(this.masterGain);
    this.masterGain.connect(this.ctx.destination);
    try{
      const s=JSON.parse(localStorage.getItem('animalFarmAudio')||'{}');
      if(typeof s.bgmVol==='number'){this.bgmVol=s.bgmVol;this.bgmGain.gain.value=s.bgmVol}
      if(typeof s.sfxVol==='number'){this.sfxVol=s.sfxVol;this.sfxGain.gain.value=s.sfxVol}
      if(typeof s.muted==='boolean'){this.muted=s.muted;this.masterGain.gain.value=s.muted?0:1}
      if(typeof s.bgmMuted==='boolean'){this.bgmMuted=s.bgmMuted;if(s.bgmMuted)this.bgmGain.gain.value=0}
    }catch(_){}
  }catch(e){}
},
saveSettings(){try{localStorage.setItem('animalFarmAudio',JSON.stringify({bgmVol:this.bgmVol,sfxVol:this.sfxVol,muted:this.muted,bgmMuted:this.bgmMuted}))}catch(_){}},
resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()},
setBgmVol(v){this.bgmVol=v;if(this.bgmGain&&!this.bgmMuted)this.bgmGain.gain.value=v;this.saveSettings()},
setSfxVol(v){this.sfxVol=v;if(this.sfxGain)this.sfxGain.gain.value=v;this.saveSettings()},
toggleMute(){this.muted=!this.muted;if(this.masterGain)this.masterGain.gain.value=this.muted?0:1;this.saveSettings();return this.muted},
toggleBgmMute(){this.bgmMuted=!this.bgmMuted;if(this.bgmGain)this.bgmGain.gain.value=this.bgmMuted?0:this.bgmVol;this.saveSettings();return this.bgmMuted},
envNote(freq,startT,dur,type='sine',peak=0.3,attack=0.01,decay=0.05,sustain=0.6,release=0.1,target=null){
  if(!this.ctx)return;
  try{
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(0,startT);
    g.gain.linearRampToValueAtTime(peak,startT+attack);
    g.gain.linearRampToValueAtTime(peak*sustain,startT+attack+decay);
    g.gain.setValueAtTime(peak*sustain,Math.max(startT+attack+decay,startT+dur-release));
    g.gain.exponentialRampToValueAtTime(0.0001,startT+dur+0.001);
    o.connect(g);g.connect(target||this.sfxGain||this.ctx.destination);
    o.start(startT);o.stop(startT+dur+0.05);
  }catch(e){}
},
play(freq,dur=.1,type='sine',vol=.15){
  if(!this.ctx)return;
  try{
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.value=freq;g.gain.value=vol;
    o.connect(g);g.connect(this.sfxGain||this.ctx.destination);
    o.start();g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+dur);
    o.stop(this.ctx.currentTime+dur+0.05);
  }catch(e){}
},
noise(dur=0.08,vol=0.3,filterFreq=2000){
  if(!this.ctx)return;
  try{
    const len=Math.floor(this.ctx.sampleRate*dur);
    const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
    const src=this.ctx.createBufferSource();src.buffer=buf;
    const filter=this.ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=filterFreq;
    const g=this.ctx.createGain();g.gain.value=vol;
    src.connect(filter);filter.connect(g);g.connect(this.sfxGain||this.ctx.destination);
    src.start();
  }catch(e){}
},
coin(){this.play(880,.08);setTimeout(()=>this.play(1320,.1),80)},
place(){this.play(440,.1,'triangle')},

click(){this.play(880,.03,'square',.08)},
modal(){this.play(660,.06,'triangle',.1);setTimeout(()=>this.play(880,.05,'triangle',.08),60)},
saveSfx(){this.play(550,.06,'sine',.12);setTimeout(()=>this.play(770,.08,'sine',.12),70);setTimeout(()=>this.play(990,.1,'sine',.1),140)},
build(){this.noise(0.06,0.25,1500);setTimeout(()=>this.noise(0.06,0.22,1300),140);setTimeout(()=>this.noise(0.08,0.2,1100),280)},
animalCry(type){

  const detune=G.season===3?-30:G.season===1?20:0;

  if(type==='chicken'){

    this.envNote(120+detune*0.3,t,0.4,'sawtooth',0.18,0.05,0.1,0.7,0.15);
    this.envNote(110+detune*0.3,t+0.45,0.5,'sawtooth',0.16,0.05,0.1,0.7,0.2);
    this.envNote(100+detune*0.3,t+1.0,0.6,'sawtooth',0.14,0.05,0.15,0.7,0.25);
  }else if(type==='pig'){
    this.envNote(180+detune,t,0.12,'sawtooth',0.22,0.01,0.04,0.6,0.05);
    this.envNote(160+detune,t+0.14,0.15,'sawtooth',0.2,0.01,0.04,0.6,0.06);
  }else if(type==='sheep'){
    this.envNote(440+detune,t,0.18,'triangle',0.18,0.02,0.05,0.6,0.08);
    this.envNote(420+detune,t+0.2,0.22,'triangle',0.16,0.02,0.05,0.6,0.1);
  }else if(type==='duck'){
    this.envNote(550+detune,t,0.08,'square',0.2,0.005,0.03,0.5,0.04);
    this.envNote(500+detune,t+0.09,0.08,'square',0.2,0.005,0.03,0.5,0.04);
  }else{this.envNote(600,t,0.1,'sine',0.15,0.01,0.04,0.6,0.05)}
},
SCALES:{
  spring:[523.25,587.33,659.25,698.46,783.99,880,987.77,1046.50],
  summer:[659.25,739.99,830.61,880,987.77,1108.73,1244.51,1318.51],
  fall:[440,493.88,523.25,587.33,659.25,698.46,783.99,880],
  winter:[349.23,392,440,466.16,523.25,587.33,659.25,698.46]
},
SEASON_TEMPO:{spring:120,summer:140,fall:90,winter:70},
buildMelody(season){
  const scale=this.SCALES[season];
  const seedBase={spring:7,summer:13,fall:23,winter:31}[season]||5;
  let seed=seedBase;
  const rng=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  const notes=[];
  for(let bar=0;bar<16;bar++){
    for(let beat=0;beat<4;beat++){
      const r=rng();
      if(r<0.2){notes.push({rest:true,dur:0.5});continue}
      const dur=r<0.7?0.5:0.25;
      let idx;
      if(beat===0)idx=[0,2,4][Math.floor(rng()*3)];
      else if(beat===2)idx=[2,4,5,7][Math.floor(rng()*4)];
      else idx=Math.floor(rng()*8);
      notes.push({freq:scale[idx],dur});
    }
  }
  return notes;
},
buildBass(season){
  const scale=this.SCALES[season];
  const root=scale[0]/2,fifth=scale[4]/2;
  const pattern=[];
  for(let bar=0;bar<16;bar++){
    pattern.push({freq:root,dur:1});pattern.push({freq:fifth,dur:1});
    pattern.push({freq:root,dur:1});pattern.push({freq:fifth,dur:1});
  }
  return pattern;
},
playBgm(seasonIdx){
  if(!this.ctx||this.bgmMuted||this.muted)return;
  const seasons=['spring','summer','fall','winter'];
  const season=seasons[seasonIdx];
  if(this.currentSeasonBgm===seasonIdx&&this.bgmTimer)return;
  this.stopBgm(true);
  this.currentSeasonBgm=seasonIdx;
  const tempo=this.SEASON_TEMPO[season];
  const beatSec=60/tempo;
  const melody=this.buildMelody(season);
  const bass=this.buildBass(season);
  let totalDur=0;melody.forEach(n=>totalDur+=n.dur*beatSec);
  const startBgmLoop=()=>{
    if(!this.ctx||this.bgmMuted||this.muted)return;
    const startT=this.ctx.currentTime+0.05;
    if(this.bgmGain){
      this.bgmGain.gain.cancelScheduledValues(this.ctx.currentTime);
      this.bgmGain.gain.setValueAtTime(this.bgmGain.gain.value,this.ctx.currentTime);
      this.bgmGain.gain.linearRampToValueAtTime(this.bgmMuted?0:this.bgmVol,this.ctx.currentTime+1.5);
    }
    let t=startT;
    melody.forEach(n=>{
      if(!n.rest){
        const peak=season==='winter'?0.18:season==='fall'?0.2:0.22;
        const type=season==='spring'?'triangle':season==='summer'?'square':'sine';
        this.envNote(n.freq,t,n.dur*beatSec*0.95,type,peak,0.02,0.05,0.5,0.08,this.bgmGain);
      }
      t+=n.dur*beatSec;
    });
    let bt=startT;
    bass.forEach(n=>{
      this.envNote(n.freq,bt,n.dur*beatSec*0.9,'sine',0.12,0.02,0.05,0.7,0.1,this.bgmGain);
      bt+=n.dur*beatSec;
    });
  };
  startBgmLoop();
  this.bgmTimer=setInterval(()=>{if(!this.bgmMuted&&!this.muted)startBgmLoop()},Math.floor(totalDur*1000));
},
stopBgm(quiet){
  if(this.bgmTimer){clearInterval(this.bgmTimer);this.bgmTimer=null}
  this.currentSeasonBgm=-1;
  if(this.bgmGain&&this.ctx&&!quiet){
    try{
      this.bgmGain.gain.cancelScheduledValues(this.ctx.currentTime);
      this.bgmGain.gain.setValueAtTime(this.bgmGain.gain.value,this.ctx.currentTime);
      this.bgmGain.gain.linearRampToValueAtTime(0,this.ctx.currentTime+0.6);
    }catch(_){}
  }
},
ambient(){
  if(!this.ctx)return;
  setInterval(()=>{if(G.hour>=6&&G.hour<=18&&Math.random()<.3)this.play(1800+Math.random()*800,.05,'sine',.03)},3000);
}
};

// ISO projection
// isoX/isoY return PRE-ZOOM canvas coords (zoom is applied via ctx.scale in render()).
// Mapping: screen = (preZoom - W/2) * zoom + W/2  (zoom centered on viewport center)
const TILE=32,HALFTILE=16;
function isoX(gx,gy){return(gx-gy)*HALFTILE+W/2+G.camX}
function isoY(gx,gy){return(gx+gy)*(HALFTILE/2)+80+G.camY}
function screenToPreZoom(sx,sy){
  const z=G.zoom||1;
  return [(sx-W/2)/z+W/2,(sy-H/2)/z+H/2];
}
function screenToGrid(sx,sy){
  const [px,py]=screenToPreZoom(sx,sy);
  const rx=px-W/2-G.camX,ry=py-80-G.camY;
  const gx=(rx/HALFTILE+ry/(HALFTILE/2))/2;
  const gy=(ry/(HALFTILE/2)-rx/HALFTILE)/2;
  return[Math.floor(gx),Math.floor(gy)];
}

// ── 원경 배경(스카이박스) ────────────────────────────────────────────────
// 예전엔 하늘색 2단 그라데이션뿐이라 세로로 긴 폰에서 화면 아래위가 텅 비어 보였다.
// 에셋 추가 없이 캔버스로 하늘·해·구름·먼 언덕·나무숲·들판을 그려 화면을 채운다.
const SCENERY={
  cv:null,key:'',
  // 좌표 기반 결정적 난수 — 새로고침해도 같은 풍경이 나온다
  _r(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)},
  PAL:[ // 봄 / 여름 / 가을 / 겨울
    {sky:['#a8e0ff','#dff2c4'],far:'#a9d69b',mid:'#8cc47e',tree:'#5aa05e',field:['#cdeeb0','#b6e39a'],sun:'#fff3b0'},
    {sky:['#ffe08a','#c8ec93'],far:'#9acd7f',mid:'#7ab866',tree:'#43904c',field:['#bfe98a','#a9dd76'],sun:'#fff0a0'},
    {sky:['#ffd9a0','#f0d79a'],far:'#dcb079',mid:'#c8934f',tree:'#a9682e',field:['#e8c98a','#dcb974'],sun:'#ffe0a8'},
    {sky:['#dcefff','#e8f4f2'],far:'#e9f3f8',mid:'#d2e2ea',tree:'#8ba3ad',field:['#e6f1ea','#d8e9de'],sun:'#ffffff'}
  ],
  get(w,h,season){
    const k=w+'x'+h+'|'+season;
    if(this.cv&&this.key===k)return this.cv;
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    const x=cv.getContext('2d');
    const P=this.PAL[season]||this.PAL[0];
    const hy=Math.round(h*0.33);              // 지평선
    // 1) 하늘
    const g=x.createLinearGradient(0,0,0,hy+30);
    g.addColorStop(0,P.sky[0]);g.addColorStop(1,P.sky[1]);
    x.fillStyle=g;x.fillRect(0,0,w,hy+30);
    // 2) 해(겨울은 옅게)
    x.globalAlpha=season===3?0.35:0.55;
    x.fillStyle=P.sun;
    x.beginPath();x.arc(w*0.78,hy*0.33,Math.min(w,h)*0.075,0,Math.PI*2);x.fill();
    x.globalAlpha=1;
    // 3) 구름 5덩이
    x.fillStyle='rgba(255,255,255,'+(season===3?0.75:0.62)+')';
    for(let i=0;i<5;i++){
      const cx=this._r(i+1)*w, cy=hy*(0.12+this._r(i+9)*0.5), s=Math.min(w,h)*(0.028+this._r(i+21)*0.026);
      x.beginPath();
      x.arc(cx,cy,s,0,Math.PI*2);
      x.arc(cx+s*0.9,cy+s*0.18,s*0.78,0,Math.PI*2);
      x.arc(cx-s*0.9,cy+s*0.22,s*0.66,0,Math.PI*2);
      x.arc(cx+s*0.1,cy-s*0.5,s*0.6,0,Math.PI*2);
      x.fill();
    }
    // 4) 먼 언덕 두 겹
    const ridge=(base,amp,color,seed)=>{
      x.fillStyle=color;x.beginPath();x.moveTo(0,h);x.lineTo(0,base);
      for(let px=0;px<=w;px+=8){
        const t=px/w;
        const y=base-Math.sin(t*Math.PI*2.1+seed)*amp-Math.sin(t*Math.PI*5.3+seed*2)*amp*0.35;
        x.lineTo(px,y);
      }
      x.lineTo(w,h);x.closePath();x.fill();
      return base;
    };
    ridge(hy,Math.max(8,h*0.020),P.far,1.2);
    const midBase=hy+Math.round(h*0.035);
    ridge(midBase,Math.max(6,h*0.014),P.mid,3.7);
    // 5) 나무숲 — 가까운 능선 위에 작은 삼각형
    x.fillStyle=P.tree;
    for(let i=0;i<Math.round(w/13);i++){
      const px=this._r(i+41)*w;
      const t=px/w;
      const base=midBase-Math.sin(t*Math.PI*2.1+3.7)*Math.max(6,h*0.014)-Math.sin(t*Math.PI*5.3+7.4)*Math.max(6,h*0.014)*0.35;
      const th=Math.max(6,h*0.013)*(0.7+this._r(i+77)*0.7), tw=th*0.62;
      x.beginPath();x.moveTo(px,base-th);x.lineTo(px+tw,base+1);x.lineTo(px-tw,base+1);x.closePath();x.fill();
    }
    // 6) 들판 — 능선 아래를 화면 끝까지
    const fg=x.createLinearGradient(0,midBase,0,h);
    fg.addColorStop(0,P.field[0]);fg.addColorStop(1,P.field[1]);
    x.fillStyle=fg;x.fillRect(0,midBase,w,h-midBase);
    // 7) 앞쪽 풀포기 — 화면 아래가 밋밋해 보이지 않게
    x.strokeStyle='rgba(60,110,50,'+(season===3?0.10:0.20)+')';x.lineWidth=1.4;
    for(let i=0;i<Math.round(w/9);i++){
      const px=this._r(i+131)*w, py=h-this._r(i+167)*(h*0.20), gh=4+this._r(i+199)*6;
      x.beginPath();x.moveTo(px,py);x.quadraticCurveTo(px+2,py-gh*0.6,px+3.5,py-gh);x.stroke();
      x.beginPath();x.moveTo(px,py);x.quadraticCurveTo(px-2,py-gh*0.6,px-3.5,py-gh*0.85);x.stroke();
    }
    this.cv=cv;this.key=k;
    return cv;
  }
};

// Rendering
function drawTile(gx,gy,color,border){
const x=isoX(gx,gy),y=isoY(gx,gy);
X.beginPath();
X.moveTo(x,y);X.lineTo(x+HALFTILE,y+HALFTILE/2);
X.lineTo(x,y+HALFTILE);X.lineTo(x-HALFTILE,y+HALFTILE/2);
X.closePath();
X.fillStyle=color;X.fill();
if(border){X.strokeStyle=border;X.lineWidth=1;X.stroke()}
// Add depth - side faces for 3D isometric effect
X.beginPath();
X.moveTo(x,y+HALFTILE);X.lineTo(x+HALFTILE,y+HALFTILE/2);
X.lineTo(x+HALFTILE,y+HALFTILE/2+3);X.lineTo(x,y+HALFTILE+3);X.closePath();
X.fillStyle=shadeIso(color,-30);X.fill();
X.beginPath();
X.moveTo(x,y+HALFTILE);X.lineTo(x-HALFTILE,y+HALFTILE/2);
X.lineTo(x-HALFTILE,y+HALFTILE/2+3);X.lineTo(x,y+HALFTILE+3);X.closePath();
X.fillStyle=shadeIso(color,-50);X.fill();
}
function shadeIso(c,amt){
try{
  const m=c.match(/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
  if(!m)return c;
  const r=Math.max(0,Math.min(255,parseInt(m[1],16)+amt));
  const g=Math.max(0,Math.min(255,parseInt(m[2],16)+amt));
  const b=Math.max(0,Math.min(255,parseInt(m[3],16)+amt));
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}catch(e){return c}
}

function getTileColor(gx,gy){
const cell=G.grid[gy]?.[gx];
if(!cell)return G.season===3?'#a8c9a0':'#5a8a3c';
if(cell.type==='crop'){
const stages=['#8B4513','#7cb342','#4caf50','#ff9800'];
return stages[Math.min(cell.stage,3)];
}
if(cell.type==='building')return '#c9a96e';
if(cell.type==='animal')return '#d4c89a';
if(cell.type==='water')return '#4fc3f7';
return '#5a8a3c';
}

function drawGrid(){
for(let gy=0;gy<16;gy++)for(let gx=0;gx<16;gx++){
const col=getTileColor(gx,gy);
const bdr=(gx+gy)%2===0?'rgba(255,255,255,.08)':'rgba(0,0,0,.08)';
drawTile(gx,gy,col,bdr);
}
}

function drawPixelAnimal(x,y,type,bounce){
  const s=3;// pixel scale
  X.save();X.translate(x,y+HALFTILE/2+bounce-8);
  // Sprite path: prefer PNG if loaded, else fall through to pixel art / emoji
  const ad=ANIMALS[type];
  const aimg=ad?getSprite(ad.sprite):null;
  if(aimg){
    const sw=32,sh=32;
    X.drawImage(aimg,-sw/2,-sh/2-2,sw,sh);
    X.restore();
    return;
  }
  if(type==='chicken'){
    X.fillStyle='#fff';X.fillRect(-3*s,-2*s,6*s,4*s);// body
    X.fillStyle='#FFD700';X.fillRect(-1*s,-3*s,3*s,1*s);// head
    X.fillStyle='#FF6347';X.fillRect(0,-4*s,1*s,1*s);// comb
    X.fillStyle='#FF8C00';X.fillRect(2*s,-3*s,1*s,1*s);// beak
    X.fillStyle='#333';X.fillRect(1*s,-3*s,1,1);// eye
    X.fillStyle='#FF8C00';X.fillRect(-2*s,2*s,1*s,2*s);X.fillRect(1*s,2*s,1*s,2*s);// legs
  }else if(type==='cow'){
    X.fillStyle='#f5f5f5';X.fillRect(-4*s,-3*s,8*s,5*s);// body
    X.fillStyle='#333';X.fillRect(-3*s,-2*s,2*s,2*s);X.fillRect(1*s,-1*s,2*s,2*s);// spots
    X.fillStyle='#f5f5f5';X.fillRect(3*s,-4*s,3*s,3*s);// head
    X.fillStyle='#FFB6C1';X.fillRect(5*s,-2*s,1*s,1*s);// nose
    X.fillStyle='#333';X.fillRect(4*s,-4*s,1,1);// eye
    X.fillStyle='#888';X.fillRect(-3*s,2*s,1*s,2*s);X.fillRect(2*s,2*s,1*s,2*s);// legs
  }else if(type==='pig'){
    X.fillStyle='#FFB6C1';X.fillRect(-3*s,-2*s,6*s,4*s);// body
    X.fillStyle='#FF69B4';X.fillRect(2*s,-3*s,2*s,2*s);// head
    X.fillStyle='#FF1493';X.fillRect(3*s,-3*s,1*s,1*s);// nose
    X.fillStyle='#333';X.fillRect(3*s,-3*s+1,1,1);// eye
    X.fillStyle='#FF69B4';X.fillRect(-3*s,2*s,1*s,1*s);X.fillRect(1*s,2*s,1*s,1*s);// legs
  }else if(type==='sheep'){
    X.fillStyle='#f0f0f0';X.fillRect(-3*s,-2*s,6*s,4*s);// wool body
    X.fillStyle='#ddd';for(let i=0;i<4;i++){X.beginPath();X.arc((-2+i*1.5)*s,-2*s,s*1.2,0,Math.PI*2);X.fill();}// fluffy top
    X.fillStyle='#333';X.fillRect(2*s,-3*s,2*s,2*s);// face
    X.fillStyle='#333';X.fillRect(-2*s,2*s,1*s,2*s);X.fillRect(1*s,2*s,1*s,2*s);// legs
  }else{
    // Fallback: use emoji
    X.font='18px serif';X.textAlign='center';X.textBaseline='middle';
    X.fillText(ad?ad.icon:'🐾',0,0);
  }
  X.restore();
}

function drawCropVisual(x,y,key,stage){
  const s=3;
  X.save();X.translate(x,y+HALFTILE/2-4);
  if(stage===0){
    // Seed - small dirt mound
    X.fillStyle='#8B4513';X.beginPath();X.ellipse(0,2,4*s,2*s,0,0,Math.PI*2);X.fill();
    X.fillStyle='#5D4037';X.fillRect(-1,0,2,2);
  }else if(stage===1){
    // Sprout
    X.fillStyle='#8B4513';X.beginPath();X.ellipse(0,2,3*s,1.5*s,0,0,Math.PI*2);X.fill();
    X.fillStyle='#4CAF50';X.fillRect(-1,-3*s,2,3*s);
    X.fillStyle='#66BB6A';X.fillRect(-3*s,-3*s,2*s,1*s);X.fillRect(1*s,-2*s,2*s,1*s);
  }else if(stage===2){
    // Growing
    X.fillStyle='#8B4513';X.beginPath();X.ellipse(0,3,4*s,2*s,0,0,Math.PI*2);X.fill();
    X.fillStyle='#388E3C';X.fillRect(-1,-5*s,2,5*s);
    X.fillStyle='#4CAF50';
    X.fillRect(-4*s,-4*s,3*s,1*s);X.fillRect(2*s,-3*s,3*s,1*s);
    X.fillRect(-3*s,-2*s,2*s,1*s);X.fillRect(1*s,-5*s,2*s,1*s);
  }else{
    // Harvestable - show actual crop with glow
    X.fillStyle='rgba(255,215,0,0.2)';X.beginPath();X.arc(0,-2*s,6*s,0,Math.PI*2);X.fill();
    X.fillStyle='#388E3C';X.fillRect(-1,-5*s,2,5*s);
    const cd=CROPS[key];
    const cimg=cd?getSprite(cd.sprite):null;
    if(cimg){
      const sw=24,sh=24;
      X.drawImage(cimg,-sw/2,-5*s-sh/2,sw,sh);
    }else{
      X.font='16px serif';X.textAlign='center';X.textBaseline='middle';
      X.fillText(cd?cd.icon:'🌾',0,-5*s);
    }
    // Sparkle
    const sp=Math.sin(G.tick*0.1)*3;
    X.fillStyle='#FFD700';X.fillRect(-5*s+sp,-4*s,2,2);X.fillRect(4*s-sp,-3*s,2,2);
  }
  X.restore();
}

function drawEntities(){
for(let gy=0;gy<16;gy++)for(let gx=0;gx<16;gx++){
const cell=G.grid[gy]?.[gx];
if(!cell)continue;
const x=isoX(gx,gy),y=isoY(gx,gy);
if(cell.type==='animal'){
const anim=G.animals.find(a=>a.gx===gx&&a.gy===gy);
const ageRatio=anim?(anim.age/(ANIMALS[cell.key].lifespan||100)):0;
const bounce=Math.sin(G.tick*.05+gx*3+gy*2)*(ageRatio>=0.66?1:2);// 노령은 천천히
drawPixelAnimal(x,y,cell.key,bounce);
const count=cell.productCount||0;
if(anim&&anim.retired){
  X.fillStyle='rgba(120,120,120,0.4)';X.beginPath();X.arc(x,y+HALFTILE/2,16,0,Math.PI*2);X.fill();
  X.fillStyle='#bbb';X.font='bold 10px sans-serif';X.textAlign='center';
  X.fillText('휴식',x,y+HALFTILE/2-2);
}else{
  if(ageRatio>=0.66){X.fillStyle='rgba(150,100,50,0.15)';X.beginPath();X.arc(x,y+HALFTILE/2,16,0,Math.PI*2);X.fill();}
  if(cell.hasProduct||count>0){
    X.fillStyle='rgba(255,215,0,0.2)';X.beginPath();X.arc(x,y+HALFTILE/2,14,0,Math.PI*2);X.fill();
    if(count>0){
      X.fillStyle='#FFD700';X.font='bold 11px sans-serif';X.textAlign='center';X.textBaseline='middle';
      X.fillText(count>99?'99+':('×'+count),x+11,y-4+Math.sin(G.tick*0.1)*2);
      X.textBaseline='alphabetic';
    }else{
      X.fillStyle='#FFD700';X.font='bold 12px sans-serif';X.textAlign='center';
      X.fillText('!',x+12,y-2+Math.sin(G.tick*0.1)*2);
    }
  }
}
}else if(cell.type==='crop'){
drawCropVisual(x,y,cell.key,Math.min(cell.stage,3));
if(cell.stage>=3){X.font='10px sans-serif';X.fillStyle='#4CAF50';X.textAlign='center';X.fillText('수확!',x,y+HALFTILE+6)}
}else if(cell.type==='building'){
const bd=BUILDINGS[cell.key];
const bimg=bd?getSprite(bd.sprite):null;
if(bimg){
  const sw=36,sh=36;
  X.drawImage(bimg,x-sw/2,y+HALFTILE/2-sh+4,sw,sh);
}else{
  X.font='22px serif';X.textAlign='center';X.fillText(bd.icon,x,y+HALFTILE/2-2);
}
// Building shadow
X.fillStyle='rgba(0,0,0,0.1)';X.beginPath();X.ellipse(x,y+HALFTILE/2+4,12,5,0,0,Math.PI*2);X.fill();
}
}
}

function drawWeather(){
if(G.weather===1){// rain - more drops, visible splash
for(let i=0;i<60;i++){
const rx=(i*37+G.tick*2)%W;
const ry=(G.tick*4+i*23)%H;
// Rain drop
X.strokeStyle='rgba(100,160,255,.6)';X.lineWidth=1.5;
X.beginPath();X.moveTo(rx,ry);X.lineTo(rx-3,ry+12);X.stroke();
// Splash at bottom
if(ry>H-30){
  X.strokeStyle='rgba(100,160,255,.3)';X.lineWidth=1;
  X.beginPath();X.arc(rx-3,H-15,3,Math.PI,0);X.stroke();
}
}
// Rain overlay tint
X.fillStyle='rgba(50,80,120,.08)';X.fillRect(0,0,W,H);
}else if(G.weather===3){// snow - larger, floating flakes
for(let i=0;i<40;i++){
const drift=Math.sin(G.tick*.015+i*1.3)*30;
const sx=((i*53+drift)%W+W)%W;
const sy=(G.tick*1.2+i*28)%H;
const size=1.5+Math.sin(i)*1;
// Snowflake (small star shape)
X.fillStyle='rgba(255,255,255,.8)';
X.beginPath();X.arc(sx,sy,size,0,Math.PI*2);X.fill();
// Cross sparkle for bigger flakes
if(size>2){
  X.fillRect(sx-size*1.5,sy-0.5,size*3,1);
  X.fillRect(sx-0.5,sy-size*1.5,1,size*3);
}
}
// Snow accumulation hint
X.fillStyle='rgba(255,255,255,.1)';X.fillRect(0,H-20,W,20);
}else if(G.weather===2){// cloudy - cloud shadows
X.fillStyle='rgba(0,0,0,.05)';
for(let i=0;i<3;i++){
  const cx=((G.tick*0.5+i*200)%W+100)%(W+200)-100;
  X.beginPath();X.ellipse(cx,60+i*30,80,25,0,0,Math.PI*2);X.fill();
}
}
// Day/night overlay
if(G.hour>=20||G.hour<5){
X.fillStyle='rgba(10,10,40,.35)';X.fillRect(0,0,W,H);
// Stars at night
for(let i=0;i<15;i++){
  const starX=(i*137)%W,starY=(i*89)%Math.min(H*0.4,200);
  X.fillStyle=`rgba(255,255,255,${0.3+Math.sin(G.tick*0.05+i)*0.3})`;
  X.fillRect(starX,starY,2,2);
}
}else if(G.hour>=18){
X.fillStyle=`rgba(40,20,60,${(G.hour-18)*0.1})`;X.fillRect(0,0,W,H);
}
}

function render(){
X.clearRect(0,0,W,H);
// 원경 배경(하늘·구름·언덕·나무·들판). 화면 위아래에 남던 '빈 하늘색'을 채운다.
// 계절·화면크기별로 오프스크린에 1번만 그려두고 매 프레임 복사만 한다(연산 비용 사실상 0).
X.drawImage(SCENERY.get(W,H,G.season),0,0);

// Apply zoom around viewport center: screen = (worldCanvas - cx)*zoom + cx
const z=G.zoom||1;
X.save();
X.translate(W/2,H/2);
X.scale(z,z);
X.translate(-W/2,-H/2);
drawGrid();
drawEntities();
X.restore();

// Weather is drawn in screen space (rain/snow particle uses W/H directly)
drawWeather();
}

// 동물 1마리가 모아둘 수 있는 생산물 최대 개수 (방치형 보관 한도)
const STACK_MAX=24;

// ── 공유 가격 모델 (day 기반 결정적 변동시세) ──
// 같은 게임일에는 수확/수집/시장 단가가 모두 동일, 매일 0.8~1.2배로 변동.
function getPriceMult(day){
  let seed=((day||0)*9301+49297)%233280;
  if(seed<0)seed+=233280;
  return 0.8+(seed/233280)*0.4;
}
function getPriceForProduct(baseVal,day){
  return Math.round(baseVal*getPriceMult(day)*G.marketBonus);
}

// ── 시간 표시 헬퍼 (게임시간[시간] → 사람이 읽는 한국어) ──
function formatTimeRemaining(gameHours){
  if(gameHours<=0)return '곧';
  if(gameHours<24)return '약 '+Math.ceil(gameHours)+'시간 후';
  const days=Math.floor(gameHours/24);
  const hrs=Math.ceil(gameHours%24);
  if(hrs===0)return '약 '+days+'일 후';
  return '약 '+days+'일 '+hrs+'시간 후';
}
function getEstimatedCropTime(cr){
  const cd=CROPS[cr.key];
  if(!cd)return 0;
  const stagesLeft=Math.max(0,3-cr.stage);
  if(stagesLeft<=0)return 0;
  const rainBonus=G.weather===1?1.5:1;
  const snowPenalty=G.weather===3&&!G.hasGreenhouse?.3:1;
  const speedBonus=G.speedCount>0?Math.min(1+G.speedCount*0.05,1.2):1;
  const rate=Math.max(0.1,rainBonus*snowPenalty*speedBonus);
  const perStage=cd.growTime/rate;
  const remainThisStage=Math.max(0,(cd.growTime-(cr.growTimer||0))/rate);
  return remainThisStage+(stagesLeft-1)*perStage;
}
function getEstimatedProductTime(a){
  const ad=ANIMALS[a.type];
  if(!ad||ad.prodTime<=0||a.retired)return 0;
  const weatherBonus=G.weather===0?1.2:G.weather===1?1.1:1;
  const speedBonus=G.speedCount>0?Math.min(1+G.speedCount*0.05,1.2):1;
  const ageRatio=a.age/(ad.lifespan||100);
  const prodBonus=ageRatio<0.33?1:ageRatio<0.66?1.2:0.7;
  const stressPenalty=G.animalStressed?0.5:1;
  const totalBonus=weatherBonus*speedBonus*prodBonus*stressPenalty;
  return Math.max(0,(ad.prodTime-(a.prodTimer||0))/totalBonus);
}

// Game Logic
function gameTick(){
G.tick++;
// 친구 농장 방문 중에는 내 농장 경제/진행 시뮬레이션을 멈춘다(상태 오염 방지). 화면은 계속 그린다.
const _visiting=(typeof MP!=='undefined'&&MP.visiting);
// 환영/튜토리얼 노출 중에도 게임 시계·성장 일시정지 (QA: 모달 읽는 동안 시간 경과 방지)
if(!_visiting&&!G.clockPaused&&G.tick%((60/G.speed)|0)===0){
G.hour++;
if(G.hour>=24){
G.hour=0;G.day++;
dailyUpdate();
}
if(G.hour%6===0)updateWeather();
updateAnimals();
updateCrops();
checkAchievements();
checkMissions();
checkBankruptcy();
updateGoldenFarmProgress();
}
updateUI();
render();
requestAnimationFrame(gameTick);
}

function dailyUpdate(){
// 사료 소비: 돈이 아니라 feedStock(사료 재고)에서 차감 (이중차감 방지)
let feedNeeded=0;
G.animals.forEach(a=>{const ad=ANIMALS[a.type];feedNeeded+=ad.feedCost});
if(G.feedStock>=feedNeeded){
G.feedStock-=feedNeeded;
G.animalStressed=false;
if(feedNeeded>0&&G.feedStock<=G.feedCapacity*0.25)showToast('💡 사료가 곧 떨어져요. 사료를 보충하세요!');
}else{
G.feedStock=0;
G.animalStressed=true; // 다음 보충 전까지 생산 50% 페널티 (updateAnimals에서 적용)
if(G.animals.length>0)showToast('⚠️ 사료가 부족해요! 동물들이 약해졌어요 😢');
}

// 역할 동물 일일 피드백 (강아지=보호, 고양이=해충퇴치)
if(G.guardCount>0&&Math.random()<Math.min(0.15*G.guardCount,0.6))showToast('🐕 강아지가 농장을 지켜줬어요!');
if(G.pestCount>0&&Math.random()<Math.min(0.20*G.pestCount,0.7))showToast('🐱 고양이가 해충을 잡아줬어요!');

// 사료 위기 구제 체크 (동물은 있는데 사료도 돈도 없을 때)
checkBankruptcy();

// 회생 안전망: 돈도 없고(가장 싼 씨앗 값 미만) 동물·작물도 없으면 수입원이 영원히 0 → 소프트락 방지
if(G.money<Math.min(...Object.values(CROPS).map(c=>c.cost))&&G.animals.length===0&&G.crops.length===0){
G.money+=50;
showToast('🎁 마을에서 응원 지원금 50원을 보냈어요!');
}

// Season change every 7 days
if(G.day%7===0){
G.season=(G.season+1)%4;
if(G.season===0)G.year++;
showToast(SEASON_KR[G.season]+' 시즌이 시작됐어요!');
if(AU.ctx&&!AU.bgmMuted&&!AU.muted)AU.playBgm(G.season);
}
}

function updateWeather(){
const r=Math.random();
if(G.season===3)G.weather=r<.3?3:r<.6?2:0;
else if(G.season===1)G.weather=r<.4?0:r<.7?1:2;
else G.weather=r<.5?0:r<.8?2:1;
}

function updateAnimals(){
// 말(speed) 보유 시 생산속도 보너스(마리당 +5%, 최대 +20%), 사료부족 시 50% 페널티
const speedBonus=G.speedCount>0?Math.min(1+G.speedCount*0.05,1.2):1;
const stressPenalty=G.animalStressed?0.5:1;
G.animals.forEach(a=>{
const ad=ANIMALS[a.type];
const ageRatio=a.age/(ad.lifespan||100);
// 수명 만료 → 은퇴(생산 정지). 나이는 계속 들어감(추모/교체 안내용)
if(ageRatio>=1)a.retired=true;
if(ad.prodTime>0&&!a.retired){
a.prodTimer=(a.prodTimer||0)+1;
const weatherBonus=G.weather===0?1.2:G.weather===1?1.1:1;
// 노화 단계: 어림(기본) → 전성기(+20%) → 노령(-30%)
const prodBonus=ageRatio<0.33?1:ageRatio<0.66?1.2:0.7;
const totalBonus=weatherBonus*speedBonus*prodBonus*stressPenalty;
if(a.prodTimer>=ad.prodTime/totalBonus){
a.prodTimer=0;
if((a.productCount||0)<STACK_MAX){ // 보관 한도까지만 누적 (경제 폭주 방지)
a.productCount=(a.productCount||0)+1;
const cell=G.grid[a.gy]?.[a.gx];
if(cell){cell.hasProduct=true;cell.productCount=(cell.productCount||0)+1;}
}
}
}
a.age=(a.age||0)+1;
});
}

function updateCrops(){
const speedBonus=G.speedCount>0?Math.min(1+G.speedCount*0.05,1.2):1;
G.crops.forEach((cr,i)=>{
if(cr.stage>=3)return;
const cd=CROPS[cr.key];
const seasonMatch=SEASONS[G.season]===cd.season||G.hasGreenhouse;
if(!seasonMatch&&G.season!==(SEASONS.indexOf(cd.season)))return;
const rainBonus=G.weather===1?1.5:1;
const snowPenalty=G.weather===3&&!G.hasGreenhouse?.3:1;
cr.growTimer=(cr.growTimer||0)+(rainBonus*snowPenalty*speedBonus);
if(cr.growTimer>=cd.growTime){
cr.growTimer=0;cr.stage=Math.min(cr.stage+1,3);
const cell=G.grid[cr.gy]?.[cr.gx];
if(cell)cell.stage=cr.stage;
}
});
}

function checkAchievements(){
ACHIEVEMENTS.forEach(a=>{
if(!G.achieveUnlocked.includes(a.id)&&a.check(G)){
G.achieveUnlocked.push(a.id);
showAchieve(a);
}
});
}

// ── 진행 시스템 함수군 ──
function calculateLevel(){
  const minFame=LEVEL_THRESHOLDS[G.level-1]?LEVEL_THRESHOLDS[G.level-1].fameReq:0;
  const nextLv=G.level<LEVEL_THRESHOLDS.length?LEVEL_THRESHOLDS[G.level]:{fameReq:Infinity};
  return{canLevelUp:G.fame>=nextLv.fameReq,nextThreshold:nextLv.fameReq,progress:G.fame-minFame,needed:Math.max(0,nextLv.fameReq-G.fame)};
}
function tryLevelUp(){
  let safety=0;
  while(G.level<LEVEL_THRESHOLDS.length&&G.fame>=LEVEL_THRESHOLDS[G.level].fameReq&&safety++<10){
    G.level++;
    showAchieve({icon:'⬆️',name:'농장 레벨 업!',desc:'레벨 '+G.level+' 달성! 새 동물·작물·건물이 해금됐어요!'});
  }
}
function isItemUnlocked(type,key){
  const cat=type==='animal'?'animals':type==='crop'?'crops':'buildings';
  for(let i=0;i<G.level&&i<LEVEL_THRESHOLDS.length;i++){
    if(LEVEL_THRESHOLDS[i].unlockedItems[cat].indexOf(key)>=0)return true;
  }
  return false;
}
function unlockLevelOf(type,key){
  const cat=type==='animal'?'animals':type==='crop'?'crops':'buildings';
  for(let i=0;i<LEVEL_THRESHOLDS.length;i++){
    if(LEVEL_THRESHOLDS[i].unlockedItems[cat].indexOf(key)>=0)return LEVEL_THRESHOLDS[i].level;
  }
  return 1;
}
function refreshDailyMissions(){
  if(G.missionLastRefresh===G.day&&G.dailyMissions&&G.dailyMissions.length>0)return;
  G.missionLastRefresh=G.day;
  G.missionProgress={};
  G.dailyMissions=[];
  const pool=MISSION_TEMPLATES.slice();
  for(let i=0;i<3&&pool.length>0;i++){
    const idx=Math.floor(Math.random()*pool.length);
    const t=pool.splice(idx,1)[0];
    G.dailyMissions.push({id:t.id,title:t.title,desc:t.desc,reward:t.reward,completed:false});
  }
}
function checkMissions(){
  refreshDailyMissions();
  G.dailyMissions.forEach(m=>{
    if(m.completed)return;
    const tmpl=MISSION_TEMPLATES.find(t=>t.id===m.id);
    if(tmpl&&tmpl.check()){
      m.completed=true;
      G.fame+=m.reward;
      showToast('✅ 미션 완료: '+m.title+' +'+m.reward+'명성');
      try{AU.coin()}catch(_){}
      tryLevelUp();
    }
  });
}
function checkBankruptcy(){
  if(G.money>=0)return;
  if(G.lastBankruptcyDay===G.day)return;
  G.lastBankruptcyDay=G.day;
  G.bankruptcyCount++;
  G.money+=SOFT_FAILURE_EVENTS[0].amount;
  showToast(SOFT_FAILURE_EVENTS[0].desc);
  showAchieve({icon:'💙',name:'정부 지원금!',desc:'위기에서 벗어났어요. 다시 화이팅!'});
  try{AU.coin()}catch(_){}
}
function updateGoldenFarmProgress(){
  let prog=0;
  GOLDEN_FARM_TARGETS.forEach(t=>{if(t.met())prog+=t.progress});
  G.goldenFarmProgress=Math.min(prog,100);
}

const lv=calculateLevel();
if(G.level<LEVEL_THRESHOLDS.length)html+=`<div style="font-size:11px;color:#d4760a;margin-bottom:8px">⬆️ 다음 레벨까지 명성 <b>${lv.needed}</b></div>`;

if(!isItemUnlocked(type,key)){showToast('레벨 '+unlockLevelOf(type,key)+'에 해금돼요!');return;}

G.buyFeed=function(){
const feedPrice=50,feedAdd=10;
if(G.money<feedPrice){showToast('돈이 부족해요!');AU.error();return}
if(G.feedStock>=G.feedCapacity){showToast('사료 저장소가 가득 찼어요!');return}
G.money-=feedPrice;
G.feedStock=Math.min(G.feedStock+feedAdd,G.feedCapacity);
try{AU.coin()}catch(_){}
closeModal();
showToast('사료 보충! +'+feedAdd);
};

G.startPlace=function(type,key){
const items=type==='animal'?ANIMALS:type==='crop'?CROPS:BUILDINGS;
const item=items[key];
if(G.money<item.cost){showToast('돈이 부족해요!');AU.error();return}
G.placing={type,key};
G.tool='place';
showToast('원하는 위치를 터치하세요!');
};

function placeItem(gx,gy){
if(gx<0||gx>15||gy<0||gy>15)return;
if(G.grid[gy][gx]){showToast('이미 무언가 있어요!');AU.error();return}
const p=G.placing;if(!p)return;
const items=p.type==='animal'?ANIMALS:p.type==='crop'?CROPS:BUILDINGS;
const item=items[p.key];
if(G.money<item.cost){showToast('돈이 부족해요!');AU.error();return}

if(p.type==='crop'){
const cd=CROPS[p.key];
if(SEASONS[G.season]!==cd.season&&!G.hasGreenhouse){
showToast('이 계절에는 심을 수 없어요!');AU.error();return;
}
}

G.money-=item.cost;
if(p.type==='building')AU.build();else AU.place();

if(p.type==='animal'){
const a={type:p.key,gx,gy,age:0,prodTimer:0,productCount:0,retired:false};
const ad=ANIMALS[p.key];
if(ad.guard)G.guardCount++;
if(ad.pest)G.pestCount++;
if(ad.speed)G.speedCount++;
G.animals.push(a);
G.grid[gy][gx]={type:'animal',key:p.key,hasProduct:false,productCount:0};
setTimeout(()=>AU.animalCry(p.key),200);
}else if(p.type==='crop'){
const cr={key:p.key,gx,gy,stage:0,growTimer:0};
G.crops.push(cr);
G.grid[gy][gx]={type:'crop',key:p.key,stage:0};
G.cropTypesPlanted.add(p.key);
G.cropTypes=G.cropTypesPlanted.size;
}else if(p.type==='building'){
G.buildings.push({key:p.key,gx,gy});
G.grid[gy][gx]={type:p.type==='building'&&p.key==='pond'?'water':'building',key:p.key};
if(p.key==='greenhouse')G.hasGreenhouse=true;
if(p.key==='market_b')G.marketBonus=1.2;
if(p.key==='silo'){G.storageBonus+=50;G.feedCapacity+=50;}
}

G.placing=null;G.tool='select';
document.querySelectorAll('.bb').forEach(b=>b.classList.remove('sel'));
document.querySelector('[data-tool="select"]').classList.add('sel');
showToast(item.name+' 배치 완료!');
}

function handleSelect(gx,gy){
if(gx<0||gx>15||gy<0||gy>15)return;
const cell=G.grid[gy]?.[gx];
if(!cell)return;

if(cell.type==='animal'){
const ad=ANIMALS[cell.key];
AU.animalCry(cell.key);
const anim=G.animals.find(a=>a.gx===gx&&a.gy===gy);
const count=cell.productCount||0;
let html=`<h2>${ad.icon} ${ad.name}</h2>`;
const _npcLine=(window.NPC&&NPC.ready)?NPC.say(cell.key,{season:G.season}):null;
if(_npcLine){html+=`<div class="fact-box" style="background:#fff8dc">💬 "${_npcLine}"</div>`;}

if(anim){
const ageRatio=anim.age/(ad.lifespan||100);
let stage=ageRatio>=1?'은퇴 (교체 필요)':ageRatio>=0.66?'노령':ageRatio>=0.33?'전성기':'어림기';

else if(ageRatio>=0.66)html+=`<p style="color:#ff6b00;font-weight:bold">⚠️ 곧 은퇴할 나이예요. 교체를 준비해보세요!</p>`;
}

html+=`<div class="fact-box" style="background:#e8f5e9;border-left-color:#4caf50">⏱️ 다음 ${ad.product}까지 ${formatTimeRemaining(getEstimatedProductTime(anim))}</div>`;

}

G.collectProduct=function(gx,gy){
const cell=G.grid[gy]?.[gx];
if(!cell)return;
const anim=G.animals.find(a=>a.gx===gx&&a.gy===gy);
if(anim&&anim.retired){showToast('은퇴한 동물이에요. 새 친구를 맞이해보세요!');return;}
const count=cell.productCount||0;
if(count<=0&&!cell.hasProduct)return;
const ad=ANIMALS[cell.key];
const n=Math.max(count,1);
const unit=getPriceForProduct(ad.prodVal,G.day); // 노령 감소는 생산속도에 이미 반영(이중 적용 방지)
const total=unit*n;
G.money+=total;
cell.productCount=0;cell.hasProduct=false;
if(anim)anim.productCount=0; // ★ 동물 객체 카운터도 동기화(안 하면 STACK_MAX 도달 후 영구 생산 정지)
G.totalSales+=n;
G.fame+=Math.ceil(total/10);
G.missionProgress.sold_count=(G.missionProgress.sold_count||0)+n;
G.missionProgress.harvest_count=(G.missionProgress.harvest_count||0)+n;
AU.coin();
showToast(count>0?ad.product+' ×'+n+' 수확! +'+total+'원':ad.product+' 수확! +'+total+'원');
tryLevelUp();
};

G.harvestCrop=function(gx,gy){
const cell=G.grid[gy]?.[gx];
if(!cell||cell.stage<3)return;
const cd=CROPS[cell.key];
const val=getPriceForProduct(cd.sellPrice,G.day);
G.money+=val;
G.totalHarvest++;G.totalSales++;
G.fame+=Math.ceil(val/8);
if(!G.missionProgress.harvest_types)G.missionProgress.harvest_types={};
G.missionProgress.harvest_types[cell.key]=true;
G.missionProgress.harvest_count=(G.missionProgress.harvest_count||0)+1;
G.grid[gy][gx]=null;
G.crops=G.crops.filter(c=>!(c.gx===gx&&c.gy===gy));
AU.harvest();
showToast(cd.name+' 수확! +'+val+'원');

};

G.removeEntity=function(gx,gy){
const cell=G.grid[gy]?.[gx];
if(cell&&cell.type==='animal'){
  const ad=ANIMALS[cell.key];

  if(ad&&ad.pest)G.pestCount=Math.max(0,G.pestCount-1);

}

G.crops=G.crops.filter(c=>!(c.gx===gx&&c.gy===gy));
G.buildings=G.buildings.filter(b=>!(b.gx===gx&&b.gy===gy));
recomputeBuildingBonuses(); // 건물 제거 시 보너스 재계산 (영구 보너스 잔존 방지)

// 보유 건물 목록으로부터 건물 파생 보너스를 매번 다시 계산한다.
// (제거/중복 보유 모두 정확. market_b·greenhouse·silo가 제거되면 보너스도 사라진다.)
function recomputeBuildingBonuses(){
  let siloCount=0,hasMarket=false,hasGreen=false;
  G.buildings.forEach(b=>{
    if(b.key==='silo')siloCount++;
    else if(b.key==='market_b')hasMarket=true;
    else if(b.key==='greenhouse')hasGreen=true;
  });
  G.marketBonus=hasMarket?1.2:1;
  G.hasGreenhouse=hasGreen;
  G.storageBonus=siloCount*50;
  G.feedCapacity=200+G.storageBonus;
  if(G.feedStock>G.feedCapacity)G.feedStock=G.feedCapacity;
}

// =========================================================
// ZOOM module — wheel + pinch + double-tap, with cursor-anchored zoom
// =========================================================
const ZOOM={
  step:0.1,
  apply(newZoom,anchorX,anchorY){
    const z0=G.zoom||1;
    const z1=Math.max(G.minZoom,Math.min(G.maxZoom,newZoom));
    if(z1===z0)return;
    // Anchor: keep the world point under (anchorX,anchorY) fixed on screen.
    // pre-zoom coord at anchor: pre = (anchor - W/2)/z + W/2
    // we want pre' such that (pre' - W/2)*z1 + W/2 = anchor, i.e. pre' = (anchor - W/2)/z1 + W/2
    // Adjust camX/camY so pre'==pre (since pre depends on camX via isoX)
    if(typeof anchorX!=='number')anchorX=W/2;
    if(typeof anchorY!=='number')anchorY=H/2;
    const preX0=(anchorX-W/2)/z0+W/2;
    const preY0=(anchorY-H/2)/z0+H/2;
    const preX1=(anchorX-W/2)/z1+W/2;
    const preY1=(anchorY-H/2)/z1+H/2;
    G.camX+=(preX1-preX0);
    G.camY+=(preY1-preY0);
    G.zoom=z1;
    this.updateLabel();
  },
  zoomIn(){this.apply((G.zoom||1)+this.step,W/2,H/2)},
  zoomOut(){this.apply((G.zoom||1)-this.step,W/2,H/2)},
  reset(){this.apply(1.0,W/2,H/2);showToast('줌 100%')},
  updateLabel(){
    const el=document.getElementById('zlabel');
    if(el)el.textContent=Math.round((G.zoom||1)*100)+'%';
  }
};

// Input handling
let touchId=null;
let _firstTouch=true;
let _lastTap=0,_lastTapX=0,_lastTapY=0;
let _activePointers=new Map();
let _pinchStartDist=0,_pinchStartZoom=1,_pinchStartCx=0,_pinchStartCy=0;
let _pinchActive=false;
let _suppressClickUntil=0;

function _pinchDist(){
  const pts=[..._activePointers.values()];
  if(pts.length<2)return 0;
  const dx=pts[0].x-pts[1].x,dy=pts[0].y-pts[1].y;
  return Math.sqrt(dx*dx+dy*dy);
}
function _pinchMid(){
  const pts=[..._activePointers.values()];
  if(pts.length<2)return [W/2,H/2];
  return [(pts[0].x+pts[1].x)/2,(pts[0].y+pts[1].y)/2];
}

function onDown(sx,sy){
AU.init();AU.resume();
if(_firstTouch){_firstTouch=false;if(!AU.bgmMuted&&!AU.muted)setTimeout(()=>AU.playBgm(G.season),300)}
// Double-tap detection (ignore if it's a multi-touch starting)
const now=Date.now();
if(_activePointers.size===1){
  const dx=sx-_lastTapX,dy=sy-_lastTapY;
  if(now-_lastTap<320&&Math.abs(dx)<24&&Math.abs(dy)<24){
    // double-tap → reset zoom
    ZOOM.reset();
    _lastTap=0;
    G.dragStart=null;G.isDrag=false;
    _suppressClickUntil=now+320;
    return;
  }
  _lastTap=now;_lastTapX=sx;_lastTapY=sy;
}
G.dragStart={x:sx,y:sy,cx:G.camX,cy:G.camY};
G.isDrag=false;
}
function onMove(sx,sy){
if(_pinchActive)return;
if(!G.dragStart)return;
const dx=sx-G.dragStart.x,dy=sy-G.dragStart.y;
if(Math.abs(dx)>5||Math.abs(dy)>5){G.isDrag=true;G._userMoved=true;}
if(G.isDrag){G.camX=G.dragStart.cx+dx;G.camY=G.dragStart.cy+dy}
}
function onUp(sx,sy){
if(_pinchActive){G.dragStart=null;return}
if(Date.now()<_suppressClickUntil){G.dragStart=null;return}
if(!G.isDrag&&G.dragStart){
const[gx,gy]=screenToGrid(sx,sy);
if(G.tool==='place'&&G.placing){placeItem(gx,gy)}
else if(G.tool==='select'){handleSelect(gx,gy)}
}
G.dragStart=null;
}

C.addEventListener('pointerdown',e=>{
  e.preventDefault();
  _activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(_activePointers.size===2){
    // start pinch
    _pinchActive=true;
    _pinchStartDist=_pinchDist();
    _pinchStartZoom=G.zoom||1;
    G.dragStart=null;G.isDrag=false;
  }else if(_activePointers.size===1){
    onDown(e.clientX,e.clientY);
  }
});
C.addEventListener('pointermove',e=>{
  e.preventDefault();
  if(_activePointers.has(e.pointerId))_activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(_pinchActive&&_activePointers.size>=2){
    const d=_pinchDist();
    if(_pinchStartDist>10&&d>10){
      const factor=d/_pinchStartDist;
      const [mx,my]=_pinchMid();
      ZOOM.apply(_pinchStartZoom*factor,mx,my);
    }
  }else{
    onMove(e.clientX,e.clientY);
  }
});
function _endPointer(e){
  e.preventDefault();
  _activePointers.delete(e.pointerId);
  if(_activePointers.size<2&&_pinchActive){
    _pinchActive=false;
    _suppressClickUntil=Date.now()+250;
    G.dragStart=null;
  }
  if(_activePointers.size===0){
    onUp(e.clientX,e.clientY);
  }
}
C.addEventListener('pointerup',_endPointer);
C.addEventListener('pointercancel',_endPointer);
C.addEventListener('pointerleave',e=>{
  if(_activePointers.has(e.pointerId))_endPointer(e);
});

// Mouse wheel zoom (desktop)
C.addEventListener('wheel',e=>{
  e.preventDefault();
  const dir=e.deltaY<0?1:-1;
  const newZ=(G.zoom||1)+dir*ZOOM.step;
  ZOOM.apply(newZ,e.clientX,e.clientY);
},{passive:false});

G.loadGame=function(){
const d=localStorage.getItem('animalFarmSave');
if(!d)return false;
try{
const sv=JSON.parse(d);
Object.assign(G,sv);
G.cropTypesPlanted=new Set(sv.cropTypesPlanted||[]);
// ── 하위호환 기본값 가드 (구버전 세이브에 신규 필드 없음) ──
if(!G.inventory||typeof G.inventory!=='object')G.inventory={};
if(typeof G.guardCount!=='number')G.guardCount=0;
if(typeof G.pestCount!=='number')G.pestCount=0;
if(typeof G.speedCount!=='number')G.speedCount=0;
if(typeof G.feedStock!=='number')G.feedStock=100;
if(typeof G.feedCapacity!=='number')G.feedCapacity=200+(G.storageBonus||0);
G.animalStressed=false;
if(typeof G.level!=='number')G.level=1;
if(typeof G.fame!=='number')G.fame=0;
if(!Array.isArray(G.dailyMissions))G.dailyMissions=[];
if(typeof G.missionProgress!=='object'||!G.missionProgress)G.missionProgress={};
if(typeof G.missionLastRefresh!=='number')G.missionLastRefresh=0;
if(typeof G.bankruptcyCount!=='number')G.bankruptcyCount=0;
if(typeof G.lastBankruptcyDay!=='number')G.lastBankruptcyDay=0;
if(typeof G.goldenFarmProgress!=='number')G.goldenFarmProgress=0;
if(!Array.isArray(G.speedLevels))G.speedLevels=[0.5,1,2,4];
if(typeof G.speedIndex!=='number')G.speedIndex=1;
if(typeof G.speed!=='number')G.speed=G.speedLevels[G.speedIndex]||1;
// 동물/그리드 신규 필드 가드
if(Array.isArray(G.animals))G.animals.forEach(a=>{
if(typeof a.age!=='number')a.age=0;
if(typeof a.retired!=='boolean')a.retired=false;
if(typeof a.productCount!=='number')a.productCount=0;
});
if(Array.isArray(G.grid))G.grid.forEach(row=>{if(Array.isArray(row))row.forEach(c=>{if(c&&c.type==='animal'&&typeof c.productCount!=='number')c.productCount=0;});});
recomputeBuildingBonuses(); // 보유 건물로부터 marketBonus/storageBonus/feedCapacity/hasGreenhouse 재동기화(구버전 세이브·과거 desync 정정)
G.tick=0;G.tool='select';G.placing=null;G.miniActive=false;
if(typeof G.zoom!=='number'||G.zoom<G.minZoom||G.zoom>G.maxZoom)G.zoom=1.0;
if(ZOOM&&ZOOM.updateLabel)ZOOM.updateLabel();
const _sl=document.getElementById('speedLabel');if(_sl)_sl.textContent=(G.speed===0.5?'0.5':G.speed)+'배';
// ── 오프라인 누적 (보관 한도까지만, 시계 되감기 가드, 8시간 캡) ──
G.lastSaveTime=G.lastSaveTime||Date.now();
const elapsedSec=Math.min(Math.max(0,(Date.now()-G.lastSaveTime)/1000),28800);
G.offlineEarnings={};
if(elapsedSec>0&&Array.isArray(G.animals)){
G.animals.forEach(a=>{
const ad=ANIMALS[a.type];
if(ad&&ad.prodTime>0&&!a.retired){
const periodSec=Math.max(0.5,ad.prodTime/1.1);// 1게임시간≈1실초(1x), 평균 날씨보너스 1.1 근사
const ticks=Math.floor(elapsedSec/periodSec);
const cur=a.productCount||0;
const add=Math.max(0,Math.min(ticks,STACK_MAX-cur));
if(add>0){
a.productCount=cur+add;
const cell=G.grid[a.gy]?.[a.gx];
if(cell){cell.hasProduct=true;cell.productCount=(cell.productCount||0)+add;}
G.offlineEarnings[a.type]=(G.offlineEarnings[a.type]||0)+add;
}
}
});
}
return true;
}catch(e){return false}
};

// PeerJS Multiplayer: 친구 농장 방문 (server-less, WebRTC)
// =========================================================
// =========================================================
// SAFE — 방명록(UGC) 안전장치: 금칙어 치환 · 신고 · 차단
// manifest.json categories 에 "kids" 가 있으므로 Google Play(Designed for Families)와
// App Store 심사 기준상 ①필터링 ②신고 ③차단 이 필수다. 전부 기기 안(localStorage)에서만 처리한다.
// =========================================================
const SAFE={
  MAXLEN:40,
  LS_BLOCK:'animalFarmBlocked',
  LS_REPORT:'animalFarmReports',
  LS_GUEST:'animalFarmGuestbook',
  // 명백한 욕설·비속어·혐오표현 — 정규화 문자열에서 부분일치로 잡는다.
  // (농장 게임 특성상 '새끼' 같은 낱말이 선의로 쓰일 수 있으나, 어린이 대상 앱에서는
  //  과차단이 미차단보다 안전하다고 판단해 포함한다. 삭제가 아니라 * 치환이므로 글은 전달된다.)
  HARD:['시발','씨발','씨팔','시팔','씨바','시바','쉬발','씨불','싀발','시벌','씹','좆','존나','존만','졸라',
    '개새','새끼','새꺄','병신','븅신','빙신','지랄','지럴','니미','느금','애미뒤','애비뒤','엠창','썅','쌍놈','쌍년',
    '미친놈','미친년','미친새','또라이','호로','후레','창녀','걸레년','강간','성추행','변태새',
    '섹스','야동','딸딸이','후장','젖탱','불알','꼬추','자위행위',
    '뒈져','뒤져라','죽어버려','꺼져라','닥쳐','등신','머저리','찐따','왕따','급식충','틀딱','맘충','한남충','김치녀',
    '장애인새','정신병자','짱깨','쪽바리','쪽발이','흑형','메갈','일베',
    'ㅅㅂ','ㅆㅂ','ㅂㅅ','ㅄ','ㅈㄹ','ㄲㅈ','ㄷㅊ','ㅁㅊ','ㅗ',
    'fuck','fck','shit','bitch','asshole','bastard','cunt','dick','pussy','slut','whore',
    'nigger','nigga','retard','faggot','stfu','wtf'],
  // 선의로 자주 쓰여 오탐 위험이 큰 낱말 — 뒤에 오는 글자를 보고 판정한다.
  //   예) "보지 마세요"·"자지 않아요" 는 정상 문장이므로 거르지 않는다.
  SOFT:[
    {w:'보지',ok_next:['마','말','못','않','는','도','자','요','게','시','만','를','야','라','니','고','메','ㅁ']},
    {w:'자지',ok_next:['마','말','않','못','는','도','요','만','를','야','러','라','니','고','메']}
  ],
  /* 공백·문장부호·반복문자를 걷어낸 비교용 문자열과, 원문 인덱스 대응표를 만든다.
     "시 발!!" "시발발" "ㅅ.ㅂ" 같은 흔한 우회를 잡되, 원문의 어느 글자를 가릴지 정확히 알 수 있다. */
  _norm(s){
    const out=[],map=[];let last='';
    for(let i=0;i<s.length;i++){
      const ch=s[i].toLowerCase();
      if(/[\s\u0000-\u001f\u007f\u00ad\u200b-\u200f\ufeff~!@#$%^&*()_+\-=\[\]{}|:;"'<>,.?\/·ㆍ、。！？…]/.test(ch))continue;
      if(ch===last)continue;               // 반복 축약: 시발발발 → 시발
      out.push(ch);map.push(i);last=ch;
    }
    return {n:out.join(''),map};
  },
  /** 40자 제한 + 제어문자 제거 + 금칙어 * 치환. {text, filtered} 반환 */
  clean(raw){
    let s=String(raw==null?'':raw);
    s=s.replace(/[\u0000-\u001f\u007f\u00ad\u200b-\u200f\u2028\u2029\ufeff]/g,' ').replace(/\s+/g,' ').trim();
    s=s.slice(0,this.MAXLEN);             // ★ 수신 측에서도 길이 강제
    if(!s)return{text:'',filtered:0};
    const{n,map}=this._norm(s);
    const chars=s.split('');
    let hits=0;
    const mask=(a,b)=>{
      const st=map[a],en=map[b-1];
      if(st==null||en==null)return;
      for(let i=st;i<=en;i++)chars[i]='*';
      hits++;
    };
    for(let k=0;k<this.HARD.length;k++){
      const w=this.HARD[k];let i=0;
      while((i=n.indexOf(w,i))>=0){mask(i,i+w.length);i+=w.length}
    }
    for(let k=0;k<this.SOFT.length;k++){
      const so=this.SOFT[k];let i=0;
      while((i=n.indexOf(so.w,i))>=0){
        const nx=n.slice(i+so.w.length,i+so.w.length+1);
        if(so.ok_next.indexOf(nx)<0)mask(i,i+so.w.length);
        i+=so.w.length;
      }
    }
    return{text:chars.join(''),filtered:hits};
  },
  _load(k,def){try{const v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v:def}catch(_){return def}},
  _save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}},
  // ── 차단 ──
  blockedList(){return this._load(this.LS_BLOCK,[])},
  isBlocked(code){return !!code&&this.blockedList().indexOf(code)>=0},
  block(code){
    if(!code)return false;
    const l=this.blockedList();
    if(l.indexOf(code)<0){l.push(code);if(l.length>200)l.shift();this._save(this.LS_BLOCK,l)}
    const g=this.guestbook();                 // 그 사람이 남긴 글은 모두 숨김
    g.forEach(e=>{if(e.from===code)e.hidden=1});
    this._save(this.LS_GUEST,g);
    return true;
  },
  unblock(code){
    const l=this.blockedList().filter(x=>x!==code);
    this._save(this.LS_BLOCK,l);
    return true;
  },
  // ── 신고 ──
  reports(){return this._load(this.LS_REPORT,[])},
  report(id){
    const g=this.guestbook();
    const e=g.filter(x=>x.id===id)[0];
    if(!e)return null;
    e.hidden=1;e.reported=1;
    this._save(this.LS_GUEST,g);
    const r=this.reports();
    r.unshift({id:e.id,from:e.from,text:e.text,at:e.at,reportedAt:Date.now()});
    if(r.length>100)r.length=100;
    this._save(this.LS_REPORT,r);
    return e;
  },
  // ── 받은 방명록 보관함 ──
  guestbook(){return this._load(this.LS_GUEST,[])},
  addGuest(e){
    const g=this.guestbook();
    g.unshift(e);
    if(g.length>50)g.length=50;
    this._save(this.LS_GUEST,g);
  }
};

const MP={
  peer:null,        // main peer (random PeerJS-assigned id)
  dirPeer:null,     // directory peer with id "farmdir-<myCode>" so friends can resolve us
  myCode:null,      // 6-char short code (FARM-XXXXXX)
  myPeerId:null,    // full peer.id (hidden from UI)
  conn:null,        // active connection
  visiting:false,   // currently viewing friend's farm
  hostBackup:null,  // snapshot of own G to restore after visit
  ready:false,
  shortFromId(id){
    let h=0;for(let i=0;i<id.length;i++)h=((h<<5)-h+id.charCodeAt(i))|0;
    const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s='';let v=Math.abs(h)+1;
    for(let i=0;i<6;i++){s+=a[v%a.length];v=Math.floor(v/a.length)+(i+1)*7;}
    return 'FARM-'+s;
  },
  init(){
    if(window.__PEERJS_FAIL||typeof Peer==='undefined'){this.ready=false;return}
    try{
      this.peer=new Peer(undefined,{debug:0});
      this.peer.on('open',id=>{
        this.myPeerId=id;
        this.myCode=this.shortFromId(id);
        this.ready=true;
        this.registerDirectory();
      });
      this.peer.on('connection',c=>this.onIncomingConn(c));
      this.peer.on('error',e=>{
        console.warn('[MP] peer error',e.type);
        if(e.type==='peer-unavailable'){showToast('친구를 찾을 수 없어요');closeModal();}
      });
    }catch(e){console.warn('[MP] init failed',e);this.ready=false;}
  },
  // Directory peer: visitors connect to "farmdir-<code>" to learn our real peer.id
  registerDirectory(){
    if(this.dirPeer||!this.myCode)return;
    try{
      this.dirPeer=new Peer('farmdir-'+this.myCode,{debug:0});
      this.dirPeer.on('connection',c=>{
        c.on('open',()=>{
          try{c.send({type:'whoami',peerId:this.myPeerId})}catch(e){}
          setTimeout(()=>{try{c.close()}catch(e){}},2000);
        });
      });
      this.dirPeer.on('error',e=>{/* collisions are non-fatal */});
    }catch(e){console.warn('[MP] dir failed',e)}
  },
  // Snapshot of host data sent to a visitor
  serializeFarm(){
    return {
      grid:G.grid,
      animals:G.animals,
      crops:G.crops,
      buildings:G.buildings,
      money:G.money,
      season:G.season,
      day:G.day,
      year:G.year,
      hasGreenhouse:G.hasGreenhouse
    };
  },
  applyVisitSnapshot(d){
    if(!this.hostBackup){
      this.hostBackup={
        grid:G.grid,animals:G.animals,crops:G.crops,buildings:G.buildings,
        money:G.money,season:G.season,day:G.day,year:G.year,hour:G.hour,
        hasGreenhouse:G.hasGreenhouse,marketBonus:G.marketBonus,storageBonus:G.storageBonus,
        feedStock:G.feedStock,feedCapacity:G.feedCapacity,
        guardCount:G.guardCount,pestCount:G.pestCount,speedCount:G.speedCount,
        level:G.level,fame:G.fame,goldenFarmProgress:G.goldenFarmProgress,
        dailyMissions:G.dailyMissions,missionProgress:G.missionProgress,missionLastRefresh:G.missionLastRefresh,
        cropTypesPlanted:new Set([...G.cropTypesPlanted])
      };
    }
    G.grid=d.grid||G.grid;
    G.animals=d.animals||[];
    G.crops=d.crops||[];
    G.buildings=d.buildings||[];
    G.money=d.money||0;
    G.season=d.season||0;
    G.day=d.day||1;
    G.year=d.year||1;
    G.hasGreenhouse=!!d.hasGreenhouse;
    this.visiting=true;
    document.getElementById('visitBanner').classList.add('show');
    closeModal();
    showToast('🚪 친구 농장에 입장!');
  },
  leaveVisit(){
    if(!this.visiting||!this.hostBackup)return;
    const cropSet=this.hostBackup.cropTypesPlanted;
    Object.assign(G,this.hostBackup);
    G.cropTypesPlanted=new Set([...(cropSet||[])]);
    this.visiting=false;
    this.hostBackup=null;
    document.getElementById('visitBanner').classList.remove('show');
    if(this.conn){try{this.conn.close()}catch(e){};this.conn=null;}
    showToast('내 농장으로 돌아왔어요');
  },
  openPanel(){
    if(window.__PEERJS_FAIL||typeof Peer==='undefined'){
      showToast('오프라인: 멀티플레이 사용 불가');return;
    }
    if(this.visiting){
      let html='<h2>🚪 친구 농장 방문 중</h2>';
      html+='<p style="font-size:13px;color:#555">친구 농장을 보고 있어요. 편집은 호스트만 가능해요.</p>';
      html+='<button class="mp-btn gift" onclick="MP.sendGift(\'coin\')">💰 100코인 선물</button>';
      html+='<button class="mp-btn gift" onclick="MP.sendGift(\'crops\')">🌾 작물 5개 선물</button>';
      html+='<input class="mp-input" id="mpMsgInput" placeholder="방명록 메시지 (1줄)" maxlength="40">';
      html+='<button class="mp-btn" onclick="MP.sendMsgFromInput()">✏️ 방명록 남기기</button>';
      html+='<button class="mp-btn danger" onclick="MP.leaveVisit();closeModal()">🏠 내 농장으로</button>';
      openModal(html);return;
    }
    if(!this.ready){
      if(!this.peer)this.init();
      openModal('<h2>👥 친구 농장</h2><p class="mp-status">연결 준비 중... 잠시만요</p>');
      const t=setInterval(()=>{
        if(this.ready){clearInterval(t);this.openPanel()}
        else if(window.__PEERJS_FAIL){clearInterval(t);closeModal();showToast('오프라인: 멀티플레이 사용 불가')}
      },300);
      setTimeout(()=>clearInterval(t),10000);
      return;
    }
    let html='<h2>👥 친구 농장 방문</h2>';
    html+='<p style="font-size:12px;color:#555">서버 없이 P2P로 연결돼요. 친구와 코드를 카톡 등으로 공유하세요.</p>';
    html+='<div style="font-size:13px;font-weight:bold;margin-top:8px">📤 내 농장 코드 (친구에게 보내기)</div>';
    html+='<div class="mp-code" id="mpMyCode">'+this.myCode+'</div>';
    html+='<button class="mp-btn" onclick="MP.copyMyCode()">📋 복사</button>';
    html+='<div style="font-size:13px;font-weight:bold;margin-top:14px">📥 친구 코드 입력 (방문하기)</div>';
    html+='<input class="mp-input" id="mpFriendCode" placeholder="FARM-XXXXXX" maxlength="11">';
    html+='<button class="mp-btn" onclick="MP.connectToFriend()">🚪 방문하기</button>';
    html+='<p class="mp-status">📡 친구가 내 코드로 방문하면 자동으로 연결돼요</p>';
    // ── UGC 안전장치: 받은 방명록 + 신고/차단 ──
    const nBlocked=SAFE.blockedList().length;
    html+='<div class="gb-sec"><h3>💌 받은 방명록</h3><div id="gbList"></div>';
    html+='<div class="gb-note">나쁜 말은 자동으로 <b>*</b> 처리돼요. 불쾌한 글은 <b>🚩신고</b>로 숨기고, '
        + '괴롭히는 사람은 <b>🚫차단</b>하면 그 사람 글은 다시 오지 않아요.</div></div>';
    html+='<div class="gb-sec"><h3>🚫 차단 목록'+(nBlocked?' ('+nBlocked+')':'')+'</h3><div id="gbBlocked"></div></div>';
    openModal(html);
    this.renderGuestbook();
    this.renderBlocked();
  },
  copyMyCode(){
    if(!this.myCode)return;
    try{
      navigator.clipboard.writeText(this.myCode).then(()=>showToast('코드 복사 완료!'));
    }catch(e){
      const inp=document.createElement('input');inp.value=this.myCode;document.body.appendChild(inp);
      inp.select();document.execCommand('copy');document.body.removeChild(inp);showToast('코드 복사!');
    }
  },
  connectToFriend(){
    const inp=document.getElementById('mpFriendCode');
    if(!inp)return;
    const code=inp.value.trim().toUpperCase();
    if(!/^FARM-[A-Z0-9]{6}$/.test(code)){showToast('코드 형식이 올바르지 않아요 (FARM-XXXXXX)');return}
    if(code===this.myCode){showToast('내 코드와 같아요');return}
    showToast('연결 중...');
    const dirConn=this.peer.connect('farmdir-'+code,{reliable:true});
    let resolved=false;
    const timer=setTimeout(()=>{
      if(!resolved){showToast('친구를 찾을 수 없어요');try{dirConn.close()}catch(e){}}
    },8000);
    dirConn.on('data',d=>{
      if(d&&d.type==='whoami'&&d.peerId&&!resolved){
        resolved=true;clearTimeout(timer);
        try{dirConn.close()}catch(e){};
        const c=this.peer.connect(d.peerId,{reliable:true});
        this.conn=c;
        c.on('open',()=>{c.send({type:'request_farm'})});
        c.on('data',msg=>{
          if(msg&&msg.type==='farm_snapshot'){this.applyVisitSnapshot(msg.data)}
          else if(msg&&msg.type==='gift_ack'){showToast('호스트가 선물을 받았어요!')}
        });
        c.on('close',()=>{
          if(this.visiting){showToast('호스트 연결 종료');this.leaveVisit()}
        });
        c.on('error',()=>{showToast('연결 오류')});
      }
    });
    dirConn.on('error',()=>{
      if(!resolved){clearTimeout(timer);showToast('친구를 찾을 수 없어요')}
    });
  },
  onIncomingConn(c){
    this.conn=c;
    c.on('data',msg=>{
      if(!msg||typeof msg!=='object')return;
      if(this.visiting)return;
      if(msg.type==='request_farm'){
        try{c.send({type:'farm_snapshot',data:this.serializeFarm()})}catch(e){}
      }else if(msg.type==='gift'){
        if(msg.gift==='coin'){G.money+=100;showToast('🎁 친구가 100코인을 선물했어요!');}
        else if(msg.gift==='crops'){G.money+=150;showToast('🎁 친구가 작물 5개를 선물했어요! (+150원)');}
        try{c.send({type:'gift_ack'})}catch(e){}
        AU.coin();
      }else if(msg.type==='guestbook'){
        // ★ 수신 측 방어: 보낸 쪽 코드를 믿지 않는다. 차단 확인 → 40자 강제 → 금칙어 치환.
        const from=(c&&c.peer)?this.shortFromId(c.peer):'FARM-??????';
        if(SAFE.isBlocked(from))return;                       // 차단한 사람 글은 표시조차 안 함
        const res=SAFE.clean(msg.text);
        if(!res.text)return;
        SAFE.addGuest({id:'g'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),
                       from:from,text:res.text,at:Date.now(),filtered:res.filtered});
        showToast('💌 방명록: '+res.text+(res.filtered?' (일부 가림)':''));
      }
    });
    c.on('close',()=>{this.conn=null});
    c.on('error',()=>{this.conn=null});
  },
  sendGift(kind){
    if(!this.visiting||!this.conn){showToast('연결되어 있지 않아요');return}
    if(kind==='coin'){
      if(!this.hostBackup||this.hostBackup.money<100){showToast('내 코인이 100원 미만이에요');return}
      this.hostBackup.money-=100;
      try{this.conn.send({type:'gift',gift:'coin'})}catch(e){}
      showToast('💰 100코인 선물 완료');
    }else if(kind==='crops'){
      try{this.conn.send({type:'gift',gift:'crops'})}catch(e){}
      showToast('🌾 작물 5개 선물 완료');
    }
  },
  sendMsgFromInput(){
    const el=document.getElementById('mpMsgInput');
    if(!el)return;
    const res=SAFE.clean(el.value);
    if(!res.text){showToast('메시지를 입력하세요');return}
    if(res.filtered){
      // 보내기 전에 한 번 막고 가려진 내용을 보여준다 — 다시 누르면 그대로 전송된다.
      el.value=res.text;
      showToast('🙊 고운 말을 써주세요. 일부 표현을 가렸어요');
      return;
    }
    if(!this.visiting||!this.conn){showToast('연결되어 있지 않아요');return}
    try{this.conn.send({type:'guestbook',text:res.text})}catch(e){}
    showToast('✏️ 방명록을 남겼어요');
    el.value='';
  },
  // ── 받은 방명록 목록 (신고/차단 버튼 포함) ──
  // 사용자 입력은 전부 textContent 로만 넣는다 — innerHTML 경유 금지(스크립트 삽입 차단).
  renderGuestbook(){
    const box=document.getElementById('gbList');
    if(!box)return;
    box.textContent='';
    const items=SAFE.guestbook().filter(e=>!e.hidden);
    if(!items.length){
      const p=document.createElement('p');
      p.className='mp-status';
      p.textContent='아직 받은 방명록이 없어요.';
      box.appendChild(p);
      return;
    }
    items.slice(0,20).forEach(e=>{
      const row=document.createElement('div');row.className='gb-row';
      const meta=document.createElement('div');meta.className='gb-meta';
      let when='';
      try{when=new Date(e.at).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch(_){}
      meta.textContent=e.from+(when?'  ·  '+when:'')+(e.filtered?'  · 🙊 일부 가림':'');
      const txt=document.createElement('div');txt.className='gb-text';
      txt.textContent=e.text;
      const btns=document.createElement('div');btns.className='gb-btns';
      const rb=document.createElement('button');rb.className='gb-btn';rb.type='button';rb.textContent='🚩 신고';
      rb.onclick=()=>{SAFE.report(e.id);showToast('🚩 신고했어요. 이 글은 숨겼습니다');MP.renderGuestbook()};
      const kb=document.createElement('button');kb.className='gb-btn danger';kb.type='button';kb.textContent='🚫 차단';
      kb.onclick=()=>{SAFE.block(e.from);showToast('🚫 차단했어요. 이제 이 사람 글은 받지 않아요');MP.renderGuestbook();MP.renderBlocked()};
      btns.appendChild(rb);btns.appendChild(kb);
      row.appendChild(meta);row.appendChild(txt);row.appendChild(btns);
      box.appendChild(row);
    });
  },
  renderBlocked(){
    const box=document.getElementById('gbBlocked');
    if(!box)return;
    box.textContent='';
    const list=SAFE.blockedList();
    if(!list.length){
      const p=document.createElement('p');
      p.className='mp-status';
      p.textContent='차단한 사람이 없어요.';
      box.appendChild(p);
      return;
    }
    list.forEach(code=>{
      const row=document.createElement('div');row.className='gb-blocked';
      const s=document.createElement('span');s.textContent='🚫 '+code;
      const b=document.createElement('button');b.type='button';b.textContent='차단 해제';
      b.onclick=()=>{SAFE.unblock(code);showToast('차단을 해제했어요');MP.renderBlocked()};
      row.appendChild(s);row.appendChild(b);
      box.appendChild(row);
    });
  }
};

const TUT={
  step:0,
  active:false,
  steps:[
    {title:'환영합니다! 🌱',body:'안녕하세요! 농장 경영을 시작해볼까요?\n\n💰 1000골드로 시작합니다!\n드래그=이동, 휠/핀치=줌, 더블클릭=원복',target:null,pos:'center'},
    {title:'🐄 동물 키우기',body:'아래 "🐄동물" 버튼을 눌러 동물을 사세요.\n튜토리얼을 위해 닭 한 마리를 무료로 드릴게요!',target:'[data-tool="animal"]',pos:'bottom',action:'gift_chicken'},
    {title:'🌱 작물 심기',body:'"🌱작물"로 씨앗을 심어보세요.\n튜토리얼 선물: 감자 1개를 무료로 심어드릴게요!',target:'[data-tool="crop"]',pos:'bottom',action:'gift_potato'},
    {title:'🏪 시장에서 판매',body:'동물이 만든 생산물(달걀·우유)과 다 자란 작물을 클릭해서 판매하세요. "🏪시장" 버튼은 시세를 보여줘요.',target:'[data-tool="market"]',pos:'bottom'},
    {title:'✨ 더 많은 기능',body:'🌻 농장 도우미(우측 하단)에게 돈·사료·작물을 물어보세요. 👥 친구초대, 🔊 음악 설정도 있어요!\n도움말은 언제든 ❓ 버튼으로 다시 볼 수 있어요.',target:null,pos:'center'}
  ],
  start(force){
    if(!force){
      try{if(localStorage.getItem('animalFarmTutorialDone')==='1')return}catch(_){}
    }
    this.active=true;this.step=0;
    document.getElementById('tutOv').classList.add('show');
    G.clockPaused=true; // 튜토리얼 진행 중 게임 시간 정지
    this.render();
  },
  next(){
    // execute pending action for current step
    const cur=this.steps[this.step];
    if(cur&&cur.action){this.runAction(cur.action)}
    this.step++;
    if(this.step>=this.steps.length){this.finish();return}
    this.render();
  },
  skip(){this.finish()},
  finish(){
    this.active=false;
    document.getElementById('tutOv').classList.remove('show');
    G.clockPaused=false; // 튜토리얼 종료 → 게임 시간 재개
    document.querySelectorAll('.tutPulse').forEach(el=>el.classList.remove('tutPulse'));
    try{localStorage.setItem('animalFarmTutorialDone','1')}catch(_){}
  },
  runAction(act){
    if(act==='gift_chicken'){
      // place a free chicken on a nearby empty tile
      const spot=this._findEmpty(8,9)||this._findEmpty(9,8)||this._findAnyEmpty();
      if(spot){
        const[gx,gy]=spot;
        G.animals.push({type:'chicken',gx,gy,age:0,prodTimer:0,productCount:0,retired:false});
        G.grid[gy][gx]={type:'animal',key:'chicken',hasProduct:false,productCount:0};
        showToast('🐔 무료 닭 한 마리 받았어요!');
        try{AU.coin()}catch(_){}
      }
    }else if(act==='gift_potato'){
      const spot=this._findEmpty(6,8)||this._findEmpty(7,9)||this._findAnyEmpty();
      if(spot){
        const[gx,gy]=spot;
        G.crops.push({key:'potato',gx,gy,stage:0,growTimer:0});
        G.grid[gy][gx]={type:'crop',key:'potato',stage:0};
        G.cropTypesPlanted.add('potato');
        G.cropTypes=G.cropTypesPlanted.size;
        showToast('🥔 무료 감자 1개 심었어요!');
        try{AU.place()}catch(_){}
      }
    }
  },
  _findEmpty(gx,gy){
    if(gx<0||gx>15||gy<0||gy>15)return null;
    if(!G.grid[gy][gx])return [gx,gy];
    return null;
  },
  _findAnyEmpty(){
    for(let gy=0;gy<16;gy++)for(let gx=0;gx<16;gx++){
      if(!G.grid[gy][gx])return [gx,gy];
    }
    return null;
  },
  render(){
    const s=this.steps[this.step];
    if(!s)return;
    document.getElementById('tutStep').textContent=(this.step+1)+' / '+this.steps.length;
    document.getElementById('tutTitle').textContent=s.title;
    document.getElementById('tutBody').textContent=s.body;
    const nextBtn=document.getElementById('tutNext');
    nextBtn.textContent=this.step===this.steps.length-1?'시작하기 🚀':'다음 ▶';
    // Spotlight effect (clip-path circle around target)
    document.querySelectorAll('.tutPulse').forEach(el=>el.classList.remove('tutPulse'));
    const mask=document.getElementById('tutMask');
    const bubble=document.getElementById('tutBubble');
    bubble.classList.remove('top','bottom');
    if(s.target){
      const tgt=document.querySelector(s.target);
      if(tgt){
        tgt.classList.add('tutPulse');
        const r=tgt.getBoundingClientRect();
        const cx=r.left+r.width/2,cy=r.top+r.height/2;
        const radius=Math.max(r.width,r.height)/2+18;
        // Use clip-path to cut a hole in the dark mask around the target
        try{
          mask.style.clipPath=`path(evenodd, "M0 0H${innerWidth}V${innerHeight}H0Z M${cx} ${cy} m-${radius} 0 a${radius} ${radius} 0 1 0 ${radius*2} 0 a${radius} ${radius} 0 1 0 -${radius*2} 0")`;
        }catch(_){mask.style.clipPath=''}
        // Position bubble away from target
        if(cy>innerHeight/2){bubble.classList.add('top')}else{bubble.classList.add('bottom')}
        return;
      }
    }
    mask.style.clipPath='';
  }
};

  offlineAnswer(q){
    const s=this.buildState();
    const t=String(q||'').toLowerCase();
    for(let i=0;i<this.TOPICS.length;i++){
      const tp=this.TOPICS[i];
      for(let j=0;j<tp.k.length;j++){
        if(t.indexOf(tp.k[j])>=0){
          try{return tp.f.call(this,s)}catch(_){break}
        }
      }
    }
    const tips=this.generateRuleAdvice(s);
    return '그 질문은 아직 잘 모르겠어요. 대신 지금 농장 상태를 알려드릴게요.\n'
         + (tips.length?tips.join('\n'):'농장이 잘 돌아가고 있어요!')
         + '\n\n💬 돈 · 사료 · 동물 · 작물 · 건물 · 시장 · 레벨 · 미션 · 친구 중에서 물어봐 주세요.';

  greet(){
    this.appendMsg('s','농장 도우미를 준비하는 중...');
    this.ping().then(ok=>{
      this.setOnline(ok);
      this.useLocal=ok;
      const msg=ok?'안녕하세요! 🌱 농장에 대해 궁금한 게 있으면 물어보세요. \"📊 농장 분석\" 버튼으로 현재 상태도 분석해드려요!':'🌻 안녕하세요! 저는 농장 규칙과 지금 농장 상태를 읽어 답하는 도우미예요.\n돈·사료·동물·작물·건물·시장·레벨·미션 중에 물어보시면 실제 수치로 알려드릴게요.';
      this.appendMsg('a',msg);
      this.persist();
    });
  },
  setOnline(ok){
    this.online=ok;
    const canUse=ok&&(location.protocol==='http:'||location.hostname==='localhost'||location.hostname==='127.0.0.1');
    const cs=document.getElementById('cstatus');if(cs)cs.classList.toggle('on',canUse);
    const cb=document.getElementById('cbtn');if(cb)cb.classList.toggle('live',canUse);
  },
  async ping(){
    // HTTPS 배포에서는 mixed-content 차단을 피하려 ping을 건너뜀 (콘솔 오류 방지)
    if(location.protocol==='https:'&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1')return false;
    try{
      const r=await fetch('http://127.0.0.1:11434/api/tags',{method:'GET'});
      return r.ok;
    }catch(e){return false}
  },
  appendMsg(role,text){
    this.history.push({role,text,t:Date.now()});
    const log=document.getElementById('clog');
    const d=document.createElement('div');
    d.className='cmsg '+role;
    d.textContent=text;
    log.appendChild(d);
    log.scrollTop=log.scrollHeight;
    return d;
  },
  appendStream(role){
    const log=document.getElementById('clog');
    const d=document.createElement('div');
    d.className='cmsg '+role;
    d.textContent='';
    log.appendChild(d);
    log.scrollTop=log.scrollHeight;
