  },
  buildState(){
    const animalCount={};
    let totalFeedCost=0,productsReady=0;
    G.animals.forEach(a=>{
      animalCount[a.type]=(animalCount[a.type]||0)+1;
      const ad=ANIMALS[a.type];
      if(ad)totalFeedCost+=ad.feedCost||0;
      const cell=G.grid[a.gy]?.[a.gx];
      if(cell)productsReady+=(cell.productCount||0);
    });
    const cropCount={};
    let cropsHarvestable=0,wrongSeasonCount=0;
    const curSeason=SEASONS[G.season];
    G.crops.forEach(c=>{
      cropCount[c.key]=(cropCount[c.key]||0)+1; // 작물은 .key 사용
      if(c.stage>=3)cropsHarvestable++;
      const cd=CROPS[c.key];
      if(cd&&cd.season!==curSeason&&!G.hasGreenhouse)wrongSeasonCount++;
    });
    const hasBuilding={};
    G.buildings.forEach(b=>{hasBuilding[b.key]=true}); // 건물도 .key 사용
    const feedDaysLeft=totalFeedCost>0?Math.floor(G.feedStock/totalFeedCost):999;
    return {
      money:G.money,day:G.day,seasonKr:SEASON_KR[G.season],curSeason:curSeason,weather:G.weather,
      animalsCount:G.animals.length,animalTypes:Object.keys(animalCount).length,
      guardCount:G.guardCount,pestCount:G.pestCount,speedCount:G.speedCount,
      feedStock:G.feedStock,feedCapacity:G.feedCapacity,feedDaysLeft:feedDaysLeft,
      cropsCount:G.crops.length,cropsHarvestable:cropsHarvestable,wrongSeasonCount:wrongSeasonCount,
      productsReady:productsReady,hasBuilding:hasBuilding,
      level:G.level,fame:G.fame,totalSales:G.totalSales,progressLevel:this.estimateLevel()
    };
  },
  estimateLevel(){
    const score=G.money/1000+G.animals.length*8+G.crops.length*4+G.buildings.length*15+G.fame/2;
    if(score<60)return 'early';
    if(score<250)return 'mid';
    return 'late';
  },
  generateRuleAdvice(s){
    const tips=[];
    if(s.money<200)tips.push(this.getAdviceFromArray(this.ruleAdvice.poorMoney));
    if(s.feedDaysLeft<3&&s.animalsCount>0)tips.push(this.getAdviceFromArray(this.ruleAdvice.poorFeed));
    else if(s.feedDaysLeft>15&&s.animalsCount>0)tips.push(this.getAdviceFromArray(this.ruleAdvice.feedOk));
    if(s.animalsCount===0)tips.push(this.getAdviceFromArray(this.ruleAdvice.noAnimals));
    else if(s.animalsCount<4)tips.push(this.getAdviceFromArray(this.ruleAdvice.fewAnimals));
    if(s.animalTypes>=5)tips.push(this.getAdviceFromArray(this.ruleAdvice.animalDiverse));
    if(s.productsReady>=5)tips.push(this.getAdviceFromArray(this.ruleAdvice.productsReady));
    if(s.guardCount>0||s.speedCount>0||s.pestCount>0)tips.push(this.getAdviceFromArray(this.ruleAdvice.hasRoleAnimals));
    if(s.cropsCount===0)tips.push(this.getAdviceFromArray(this.ruleAdvice.noCrops));
    else if(s.cropsHarvestable>0)tips.push(this.getAdviceFromArray(this.ruleAdvice.cropsReady));
    if(s.cropsCount>0&&s.wrongSeasonCount>s.cropsCount/2)tips.push(this.getAdviceFromArray(this.ruleAdvice.wrongSeason));
    else if(s.cropsCount>0&&s.wrongSeasonCount===0)tips.push(this.getAdviceFromArray(this.ruleAdvice.goodCropSeason));
    if(!s.hasBuilding.greenhouse&&s.curSeason==='winter')tips.push(this.getAdviceFromArray(this.ruleAdvice.needGreenhouse));
    if(!s.hasBuilding.market_b&&s.totalSales>15&&s.level>=4)tips.push(this.getAdviceFromArray(this.ruleAdvice.needMarket));
    if(!s.hasBuilding.silo&&s.feedDaysLeft<6&&s.level>=2)tips.push(this.getAdviceFromArray(this.ruleAdvice.needSilo));
    if(s.weather===1)tips.push(this.getAdviceFromArray(this.ruleAdvice.marketTiming));
    if(s.progressLevel==='early')tips.push(this.getAdviceFromArray(this.ruleAdvice.earlyGame));
    else if(s.progressLevel==='mid')tips.push(this.getAdviceFromArray(this.ruleAdvice.midGame));
    else tips.push(this.getAdviceFromArray(this.ruleAdvice.lateGame));
    // 중복 제거 + 상위 3개
    const seen=new Set();const out=[];
    for(const t of tips){if(t&&!seen.has(t)){seen.add(t);out.push(t);if(out.length>=3)break;}}
    return out;
  },
  analyze(){
    const st=this.buildState();
    this.appendMsg('u','📊 현재 농장 상태를 분석해주세요!');
    const advices=this.generateRuleAdvice(st);
    let msg=advices.join('\n');
    if(!msg)msg='🌾 농장이 아주 잘 돌아가고 있어요! 계속 이대로 키워보세요.';
    this.appendMsg('a',msg);
    this.persist();
    // 로컬 Ollama가 있으면 심층 분석도 추가
    if(this.useLocal&&this.online){
      const txt='[농장 심층 분석]\n현재 상태:\n'+JSON.stringify(st,null,2)+'\n\n이 농장의 강점과 개선점을 깊이 있게 분석해주세요.';
      this.askLLM(txt);
    }
  },
  send(){
    if(this.pending)return;
    const inp=document.getElementById('cin');
    const v=(inp.value||'').trim();
    if(!v)return;
    inp.value='';
    this.appendMsg('u',v);
    this.persist();
    this.askLLM(v);
  },
  async askLLM(userText){
    if(this.pending)return;
    if(!this.useLocal){this.appendMsg('a',this.offlineAnswer(userText));this.persist();return;}
    this.pending=true;
    document.getElementById('csend').disabled=true;
    const stEl=this.appendStream('a');
    stEl.textContent='...';
    let gotAny=false;
    try{
      const prompt=this.sysPrompt+'\n\n사용자: '+userText+'\n\n컨설턴트:';
      const res=await fetch(this.url,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:this.model,prompt:prompt,stream:true})
      });
      if(!res.ok)throw new Error('http '+res.status);
      this.setOnline(true);
      stEl.textContent='';
      const reader=res.body.getReader();
      const dec=new TextDecoder();
      let buf='';
      while(true){
        const{value,done}=await reader.read();
        if(done)break;
        buf+=dec.decode(value,{stream:true});
        const lines=buf.split('\n');
        buf=lines.pop()||'';
        for(const ln of lines){
          if(!ln.trim())continue;
          try{
            const j=JSON.parse(ln);
            if(j.response){
              stEl.textContent+=j.response;
              gotAny=true;
              document.getElementById('clog').scrollTop=document.getElementById('clog').scrollHeight;
            }
          }catch(_){/* ignore parse blip */}
        }
      }
      if(!gotAny)throw new Error('empty stream');
      // commit final text into history
      this.history[this.history.length-1].text=stEl.textContent;
    }catch(e){
      this.setOnline(false);
      this.useLocal=false;
      stEl.textContent=this.offlineAnswer(userText);
      this.history[this.history.length-1].text=stEl.textContent;
    }finally{
      this.pending=false;
      document.getElementById('csend').disabled=false;
      this.persist();
    }
  },
  clear(){
    this.history=[];
    document.getElementById('clog').innerHTML='';
    localStorage.removeItem('animalFarmChat');
    this.greet();
  },
  persist(){
    try{
      // keep last 40 messages to bound storage
      const trimmed=this.history.slice(-40);
      localStorage.setItem('animalFarmChat',JSON.stringify(trimmed));
    }catch(_){}
  },
  restore(){
    try{
      const d=localStorage.getItem('animalFarmChat');
      if(!d)return;
      const arr=JSON.parse(d);
      if(!Array.isArray(arr))return;
      const log=document.getElementById('clog');
      arr.forEach(m=>{
        const el=document.createElement('div');
        el.className='cmsg '+(m.role||'a');
        el.textContent=m.text||'';
        log.appendChild(el);
      });
      this.history=arr;
      log.scrollTop=log.scrollHeight;
    }catch(_){}
  }
};
// Hook up Enter key + restore + initial ping
(function(){
  const inp=document.getElementById('cin');
  if(inp)inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();CONS.send()}});
  CONS.restore();
  CONS.ping().then(ok=>{CONS.setOnline(ok);CONS.useLocal=ok;});
})();
</script>
<script>
/* PWA: Service Worker registration + install prompt handler */
(function(){
  // Register service worker — skip on file:// (won't work without HTTP)
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function(){
      // sw.js 는 levelplay 루트에만 존재 (games/sw.js 는 404) → 루트 SW 를 games/ 스코프로 등록
      navigator.serviceWorker.register('../sw.js', { scope: './' })
        .then(function(reg){
          console.log('[PWA] SW registered, scope:', reg.scope);
        })
        .catch(function(err){
          console.warn('[PWA] SW registration failed:', err);
        });
    });
  }

  // Install prompt — capture event so we can trigger later
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    // Expose a global helper the game can call from a button
    window.PWA_install = function(){
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(choice){
        console.log('[PWA] install choice:', choice.outcome);
        deferredPrompt = null;
      });
    };
    // Optional: surface a tiny toast if the game's showToast() is defined
    try {
      if (typeof showToast === 'function') {
        showToast('📲 홈 화면에 설치 가능');
      }
    } catch(_){}
  });

  window.addEventListener('appinstalled', function(){
    console.log('[PWA] installed');
    deferredPrompt = null;
  });
})();
</script>
