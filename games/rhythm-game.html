<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>리듬 게임</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;font-family:'Segoe UI',sans-serif;color:#fff}
.wrap{max-width:480px;margin:0 auto;height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.hud{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(0,0,0,0.5);font-size:15px;font-weight:700;z-index:10;flex-wrap:wrap;gap:4px}
.hud .sc{color:#FFD700}.hud .combo{color:#FF6B9D}.hud .song{color:#7FDBFF}
.stage{flex:1;position:relative;overflow:hidden;background:linear-gradient(180deg,#0f0f23 0%,#1a1a2e 40%,#16213e 100%)}
.lane-bg{position:absolute;top:0;bottom:0;width:25%;border-right:1px solid rgba(255,255,255,0.06)}
.lane-bg:first-child{border-left:1px solid rgba(255,255,255,0.06)}
.hit-zone{position:absolute;bottom:60px;left:0;right:0;height:4px;background:rgba(255,255,255,0.15);z-index:5}
.hit-zone-glow{position:absolute;bottom:48px;left:0;right:0;height:28px;background:linear-gradient(0deg,rgba(255,107,157,0.12),transparent);z-index:4}
.key-row{display:flex;height:60px;background:rgba(0,0,0,0.6);z-index:10}
.key-btn{flex:1;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#555;border:1px solid rgba(255,255,255,0.08);transition:background 0.08s,color 0.08s;user-select:none;-webkit-user-select:none}
.key-btn.active{background:rgba(255,107,157,0.3);color:#FF6B9D}
.key-btn.k0{border-bottom:3px solid #E53935}.key-btn.k1{border-bottom:3px solid #2196F3}
.key-btn.k2{border-bottom:3px solid #4CAF50}.key-btn.k3{border-bottom:3px solid #FFD700}
.note{position:absolute;width:calc(25% - 8px);height:26px;border-radius:5px;z-index:3;animation:none;pointer-events:none;box-shadow:0 3px 10px rgba(0,0,0,0.35);border-bottom:5px solid rgba(255,255,255,0.92)}
.note.l0{left:calc(0% + 4px);background:linear-gradient(135deg,#E53935,#EF5350)}
.note.l1{left:calc(25% + 4px);background:linear-gradient(135deg,#2196F3,#42A5F5)}
.note.l2{left:calc(50% + 4px);background:linear-gradient(135deg,#4CAF50,#66BB6A)}
.note.l3{left:calc(75% + 4px);background:linear-gradient(135deg,#FFD700,#FFEB3B)}
.note.hit-anim{transform:scale(1.3);opacity:0;transition:all 0.2s}
.note.miss-anim{opacity:0.2;transition:opacity 0.3s}
.judge{position:absolute;bottom:92px;left:50%;transform:translateX(-50%);font-size:42px;font-weight:900;z-index:20;pointer-events:none;animation:judgePop 0.46s ease-out forwards;text-shadow:0 3px 10px rgba(0,0,0,0.6),0 0 22px currentColor;letter-spacing:1px;font-style:italic}
@keyframes judgePop{0%{opacity:0;transform:translateX(-50%) scale(0.45)}18%{opacity:1;transform:translateX(-50%) scale(1.28)}42%{transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-34px) scale(1)}}
.judge.perfect{color:#FFD700}.judge.great{color:#4CAF50}.judge.good{color:#29B6F6}.judge.bad{color:#FF9800}.judge.miss{color:#E53935}
.judge .cb{display:block;font-size:16px;font-style:normal;letter-spacing:0;color:#FF6B9D;text-shadow:0 1px 4px rgba(0,0,0,0.6);margin-top:2px}
.countdown{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);font-size:88px;font-weight:900;color:#FFD700;z-index:25;pointer-events:none;text-shadow:0 4px 20px rgba(0,0,0,0.6)}

.menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(15,15,35,0.97);z-index:30;gap:12px;padding:16px}
.menu h1{font-size:32px;color:#FFD700;margin-bottom:4px}
.menu p{font-size:15px;color:#aaa;text-align:center;max-width:320px}
.song-btn{width:300px;padding:14px 16px;font-size:18px;font-weight:700;border:none;border-radius:16px;cursor:pointer;color:#fff;transition:transform 0.15s;text-align:left}
.song-btn:active{transform:scale(0.95)}
.song-btn.s1{background:linear-gradient(135deg,#4CAF50,#81C784)}
.song-btn.s2{background:linear-gradient(135deg,#2196F3,#64B5F6)}
.song-btn.s3{background:linear-gradient(135deg,#E53935,#EF5350)}
.song-btn .best-info{font-size:12px;display:block;margin-top:2px;opacity:0.8}
.song-btn.lock{opacity:0.5}
.result{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(15,15,35,0.97);z-index:30;gap:8px;padding:16px;display:none}
.result h2{font-size:32px;color:#FFD700}.result p{font-size:20px}.result .big{font-size:72px}
.stars{font-size:36px;margin:4px 0}
.best-record{font-size:14px;color:#888}
.retry{padding:14px 40px;font-size:22px;font-weight:700;border:none;border-radius:16px;background:linear-gradient(135deg,#FF6B9D,#FF9A9E);color:#fff;cursor:pointer;margin-top:8px}
.next-btn{padding:14px 40px;font-size:22px;font-weight:700;border:none;border-radius:16px;background:linear-gradient(135deg,#4CAF50,#81C784);color:#fff;cursor:pointer;margin-top:4px}
.menu-link{padding:10px 30px;font-size:18px;font-weight:700;border:2px solid #555;border-radius:14px;background:transparent;color:#aaa;cursor:pointer;margin-top:4px}
.progress-bar{position:absolute;top:0;left:0;height:3px;background:linear-gradient(90deg,#FF6B9D,#FFD700);z-index:6;transition:width 0.3s}

.howto{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(15,15,35,0.97);z-index:40;gap:14px;padding:20px;text-align:center}
.howto h2{font-size:26px;color:#7FDBFF}
.howto .steps{display:flex;flex-direction:column;gap:10px;font-size:17px;line-height:1.5;color:#ddd;max-width:330px;text-align:left}
.howto .steps b{color:#FFD700}
.howto .go{padding:16px 60px;font-size:24px;font-weight:900;border:none;border-radius:18px;background:linear-gradient(135deg,#FFD700,#FFA726);color:#1a1a2e;cursor:pointer;margin-top:6px}

/* HUD 실시간 컨트롤 (노트속도·가로모드) */
.hud-ctrl{display:flex;align-items:center;gap:4px}
.hud .mini{width:30px;height:30px;padding:0;font-size:15px;font-weight:900;border:1px solid rgba(255,255,255,0.25);border-radius:8px;background:rgba(255,255,255,0.08);color:#fff;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center}
.hud .mini:active{background:rgba(255,107,157,0.4)}
#spdLabel{min-width:58px;text-align:center;font-size:13px;color:#7FDBFF}

/* 메뉴 옵션 (재생 속도) */
.opt-row{display:flex;align-items:center;gap:10px;margin:2px 0}
.opt-lbl{font-size:14px;color:#ccc;min-width:96px;text-align:right}
.opt-btns{display:flex;gap:6px}
.opt-b{padding:7px 12px;font-size:15px;font-weight:700;border:1px solid rgba(255,255,255,0.2);border-radius:10px;background:rgba(255,255,255,0.06);color:#ccc;cursor:pointer}
.opt-b.on{background:linear-gradient(135deg,#FF6B9D,#FF9A9E);color:#fff;border-color:transparent}

/* 가로모드: 스테이지가 짧고 넓어져 노트 낙하가 짧고 시원 */
@media (orientation:landscape){
  .wrap{max-width:100%}
  .key-row{height:52px}
  .key-btn{font-size:20px}
  .menu h1{font-size:26px;margin-bottom:0}
  .menu{gap:8px;padding:10px}
  .song-btn{padding:10px 16px;font-size:16px}
}
</style>
</head><body>
<div class="wrap" id="app">
  <div class="menu" id="menuScreen">
    <h1>🎵 리듬 게임</h1>
    <p>음악이 흐르면, 노트가 줄에 닿는 순간 그 줄을 탭!<br>키보드: D, F, J, K / 모바일: 터치</p>
    <div class="opt-row">
      <span class="opt-lbl">🎵 재생 속도</span>
      <div class="opt-btns" id="playSpeedBtns"></div>
    </div>
    <div id="songBtns"></div>
  </div>
  <div class="howto" id="howtoScreen">
    <h2>🎮 이렇게 해요</h2>
    <div class="steps">
      <div>1️⃣ <b>3·2·1 카운트</b> 후 음악이 시작돼요.</div>
      <div>2️⃣ 노트가 <b>아래 흰 줄에 닿는 순간</b>, 그 줄(레인)을 탭하세요.</div>
      <div>3️⃣ 노트의 <b>높낮이가 곧 멜로디</b>예요 — 음악을 들으며 박자에 몸을 맡겨요!</div>
      <div>💡 정확할수록 PERFECT! 콤보가 쌓이면 점수가 커져요.</div>
    </div>
    <button class="go" id="howtoGo">▶ 시작!</button>
  </div>
  <div class="hud" id="hud" style="display:none">
    <span class="sc" id="scoreDisp">⭐ 0</span>
    <span class="combo" id="comboDisp">🔥 0 콤보</span>
    <span class="song" id="songDisp"></span>
    <span class="hud-ctrl">
      <button class="mini" id="spdDown" title="노트 느리게">−</button>
      <span id="spdLabel">노트 1.5</span>
      <button class="mini" id="spdUp" title="노트 빠르게">+</button>
      <button class="mini" id="lscapeBtn" title="가로/세로 전환">⛶</button>
    </span>
  </div>
  <div class="stage" id="stage" style="display:none">
    <div class="lane-bg" style="left:0"></div>
    <div class="lane-bg" style="left:25%"></div>
    <div class="lane-bg" style="left:50%"></div>
    <div class="lane-bg" style="left:75%"></div>
    <div class="hit-zone"></div>
    <div class="hit-zone-glow"></div>
    <div class="progress-bar" id="progBar"></div>
  </div>
  <div class="key-row" id="keyRow" style="display:none">
    <div class="key-btn k0" data-lane="0">D</div>
    <div class="key-btn k1" data-lane="1">F</div>
    <div class="key-btn k2" data-lane="2">J</div>
    <div class="key-btn k3" data-lane="3">K</div>
  </div>
  <div class="result" id="resultScreen"></div>
</div>
<script>
'use strict';

// ══════════════════════════════════════════════════════════════
// 리듬게임 코어 v2 — 음악 주도(music-driven) 재설계
//  · 멜로디+비트가 Web Audio 클록에 "예약"되어 정시에 흐른다 (플레이어와 무관)
//  · 노트 차트 = 멜로디 그 자체: 각 음이 울리는 순간 노트가 판정선에 닿는다
//  · 레인 = 음높이 (낮은음 왼쪽 → 높은음 오른쪽): 노트 모양이 곧 멜로디 윤곽
//  · 시작 전 4비트 카운트인(3·2·1·GO)으로 템포를 먼저 몸에 익힌다
//  · 판정 클록 = AudioContext.currentTime (음악과 판정이 같은 시계를 쓴다)
// ══════════════════════════════════════════════════════════════

let ACTX=null;
function ensureAudio(){ if(!ACTX){try{ACTX=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(ACTX&&ACTX.state==='suspended')ACTX.resume(); }
function tone(f,d,type,g){ if(!ACTX)return; const o=ACTX.createOscillator(),v=ACTX.createGain(); o.type=type||'sine'; o.frequency.value=f; v.gain.setValueAtTime(g||0.12,ACTX.currentTime); v.gain.exponentialRampToValueAtTime(0.0001,ACTX.currentTime+(d||0.1)); o.connect(v); v.connect(ACTX.destination); o.start(); o.stop(ACTX.currentTime+(d||0.1)+0.02); }
document.addEventListener('pointerdown',ensureAudio);
document.addEventListener('keydown',ensureAudio);

// ── 곡 데이터: [주파수(Hz), 박자수] — 실제 악보 리듬 그대로 ──
// 학교종 (4/4, 24음): 솔솔라라 솔솔미– / 솔솔미미 레––– / 솔솔라라 솔솔미– / 솔미레미 도–––
const MEL_SCHOOL=[
[784,1],[784,1],[880,1],[880,1],[784,1],[784,1],[659,2],
[784,1],[784,1],[659,1],[659,1],[587,4],
[784,1],[784,1],[880,1],[880,1],[784,1],[784,1],[659,2],
[784,1],[659,1],[587,1],[659,1],[523,4]];
// 아리랑 (세마치 3박, 36음): 아리랑 아리랑 아라리요 / 아리랑 고개로 넘어간다 / …
const MEL_ARIRANG=[
[440,1.5],[523,.75],[587,.75],       // 아리랑
[659,1.5],[587,.75],[523,.75],       // 아리랑
[440,1],[523,.5],[440,.75],[392,.75],// 아라리요
[659,1.5],[587,.75],[523,.75],       // 아리랑
[440,1.5],[523,.75],[523,.75],       // 고개로
[587,1],[523,1],[440,1],             // 넘어간다
[440,1],[523,.5],[587,.75],[659,.75],// 나를 버리고
[587,1.5],[523,.75],[440,.75],       // 가시는 님은
[523,1.5],[523,1.5],                 // 십리도
[587,1],[659,.5],[587,.75],[523,.75],// 못 가서
[440,1.5],[523,.75],[440,.75],       // 발병
[440,3]];                            // 난다
// 캐논 (주제 8음 × 3단 변주: 2박 → 1박×2 → 반박×4)
const MEL_CANON=(function(){
  const theme=[740,659,587,554,494,440,494,554];
  const m=[];
  for(const f of theme)m.push([f,2]);                       // 1변주: 온화하게
  for(const f of theme){m.push([f,1]);m.push([f,1]);}       // 2변주: 두 번씩
  for(const f of theme){m.push([f,.5]);m.push([f,.5]);m.push([f*1.122,.5]);m.push([f,.5]);} // 3변주: 꾸밈음(장2도 위) 섞어 잘게
  return m;
})();

const SONGS=[
  {name:'학교종',emoji:'🔔',bpm:126,diff:'쉬움',mel:MEL_SCHOOL},
  {name:'아리랑',emoji:'🏔️',bpm:108,diff:'보통',mel:MEL_ARIRANG},
  {name:'캐논',emoji:'🎻',bpm:126,diff:'어려움',mel:MEL_CANON},
];
const KEYS=['d','f','j','k'];
const JUDGE_PERFECT=60,JUDGE_GREAT=110,JUDGE_GOOD=160,JUDGE_BAD=240;
const BASE_TRAVEL=1400;      // 기준 낙하 시간(ms) — 실제 낙하 = BASE_TRAVEL / 노트속도
const COUNT_BEATS=4;         // 카운트인 비트 수
// 노트속도(하이스피드): 비트매니아식 스크롤 배속 — 높을수록 노트가 빨리·시원하게 떨어짐(판정시각은 음악에 고정)
let scrollSpeed=Math.max(1.0,Math.min(3.0,parseFloat(localStorage.getItem('rhythm_scroll'))||1.5));
let curTravel=BASE_TRAVEL/scrollSpeed;
// 재생속도: 곡 템포 배속 — 음악과 노트가 함께 스케일되어 항상 싱크
let playSpeed=parseFloat(localStorage.getItem('rhythm_play'))||1.0;

// 음높이 → 레인: 곡에 나오는 음들을 낮은음부터 4등분 (멜로디 윤곽이 노트로 보임)
function buildChart(song){
  const freqs=[...new Set(song.mel.map(n=>n[0]))].sort((a,b)=>a-b);
  const laneOf=f=>Math.min(3,Math.floor(freqs.indexOf(f)/freqs.length*4));
  const beatMs=60000/song.bpm/playSpeed;
  let t=0;const chart=[];
  for(const[f,b]of song.mel){chart.push({time:Math.round(t),freq:f,lane:laneOf(f),el:null,judged:false});t+=b*beatMs;}
  return{chart,beatMs,lengthMs:Math.round(t)};
}

let songIdx=0,gameActive=false,score=0,combo=0,maxCombo=0;
let perfects=0,greats=0,goods=0,bads=0,misses=0;
let notes=[],animId=null,stageH=0,beatMs=600,songLen=0;
let zeroPerf=0;              // 폴백 클록(performance.now 기준 0점)
let zeroAudio=0;             // 오디오 클록 0점 (ACTX.currentTime 단위)
let songGain=null;           // 예약된 곡 전체가 통과하는 게인 (중단 시 여기만 끊음)

function elapsedMs(){
  if(ACTX&&zeroAudio)return(ACTX.currentTime-zeroAudio)*1000;
  return performance.now()-zeroPerf;
}

function sendXP(amount){try{window.parent.postMessage({type:'xp',amount:amount,source:'rhythm-game'},'*');}catch(e){}}
function getBest(s){try{return JSON.parse(localStorage.getItem('rhythm_best_'+s))||{stars:0,score:0};}catch(e){return{stars:0,score:0};}}
function saveBest(s,stars,sc){const p=getBest(s);if(stars>p.stars||sc>p.score)localStorage.setItem('rhythm_best_'+s,JSON.stringify({stars:Math.max(stars,p.stars),score:Math.max(sc,p.score)}));}
function getStars(sc,total){const r=sc/(total*200);return r>=0.9?3:r>=0.7?2:r>=0.4?1:0;}
function starStr(n){return n>=3?'★★★':n>=2?'★★☆':n>=1?'★☆☆':'☆☆☆';}
function isUnlocked(s){if(s===0)return true;return getBest(s-1).stars>=1;}

function buildMenu(){
  const c=document.getElementById('songBtns');
  c.innerHTML=SONGS.map((s,i)=>{
    const b=getBest(i);const ul=isUnlocked(i);
    const bst=b.stars>0?`<span class="best-info">${starStr(b.stars)} 최고: ${b.score}점</span>`:'';
    return `<button class="song-btn s${i+1} ${ul?'':'lock'}" onclick="${ul?`selectSong(${i})`:''}">${s.emoji} ${s.name} (${s.diff})${bst}</button>`;
  }).join('');
}

function stopSongAudio(){
  if(songGain){try{songGain.gain.setValueAtTime(0,ACTX.currentTime);songGain.disconnect();}catch(e){}songGain=null;}
}

function showMenu(){
  buildMenu();
  buildSpeedOpts();
  document.getElementById('menuScreen').style.display='flex';
  document.getElementById('howtoScreen').style.display='none';
  document.getElementById('resultScreen').style.display='none';
  document.getElementById('hud').style.display='none';
  document.getElementById('stage').style.display='none';
  document.getElementById('keyRow').style.display='none';
  gameActive=false;zeroAudio=0;
  stopSongAudio();
  if(animId)cancelAnimationFrame(animId);
  document.getElementById('stage').querySelectorAll('.note,.judge,.countdown').forEach(e=>e.remove());
}

// 곡 선택 → 조작법 안내 → 시작
function selectSong(s){
  ensureAudio();
  songIdx=s;
  document.getElementById('menuScreen').style.display='none';
  document.getElementById('howtoScreen').style.display='flex';
}
document.getElementById('howtoGo').addEventListener('click',()=>{
  document.getElementById('howtoScreen').style.display='none';
  startGame(songIdx);
});

// 예약 유틸: 오디오 클록 t초에 주파수 f를 d초간 (songGain 경유)
function schedTone(f,t,d,type,g){
  const o=ACTX.createOscillator(),v=ACTX.createGain();
  o.type=type||'triangle';o.frequency.value=f;
  v.gain.setValueAtTime(0.0001,t);
  v.gain.exponentialRampToValueAtTime(g||0.14,t+0.015);
  v.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(v);v.connect(songGain);
  o.start(t);o.stop(t+d+0.05);
}

function startGame(s){
  ensureAudio();
  songIdx=s;
  const song=SONGS[s];
  const built=buildChart(song);
  notes=built.chart;beatMs=built.beatMs;songLen=built.lengthMs;
  score=0;combo=0;maxCombo=0;perfects=0;greats=0;goods=0;bads=0;misses=0;

  document.getElementById('resultScreen').style.display='none';
  document.getElementById('hud').style.display='flex';
  document.getElementById('stage').style.display='block';
  document.getElementById('keyRow').style.display='flex';
  document.getElementById('songDisp').textContent=song.emoji+' '+song.name;
  document.getElementById('stage').querySelectorAll('.note,.judge,.countdown').forEach(e=>e.remove());
  updateHUD();

  stageH=document.getElementById('stage').offsetHeight;
  curTravel=BASE_TRAVEL/scrollSpeed;
  const leadMs=COUNT_BEATS*beatMs>=curTravel+200?COUNT_BEATS*beatMs:curTravel+200;

  stopSongAudio();
  if(ACTX){
    // ── 음악 전체를 오디오 클록에 예약: 이 시계가 게임의 유일한 시계 ──
    songGain=ACTX.createGain();songGain.gain.value=1;songGain.connect(ACTX.destination);
    const t0=ACTX.currentTime+0.1;          // 예약 기준점
    zeroAudio=t0+leadMs/1000;               // 첫 박(첫 노트 히트 순간) = 0점
    // 카운트인 틱 (마지막 4비트)
    for(let i=COUNT_BEATS;i>=1;i--){
      schedTone(i===1?1318:880,zeroAudio-i*beatMs/1000,0.08,'square',0.10);
    }
    // 멜로디 예약 (각 음의 길이만큼, 8분음표보다 짧은 음은 스타카토)
    for(let i=0;i<notes.length;i++){
      const n=notes[i];
      const durMs=(i<notes.length-1?notes[i+1].time-n.time:beatMs*2);
      schedTone(n.freq,zeroAudio+n.time/1000,Math.max(0.12,Math.min(durMs/1000*0.85,1.2)),'triangle',0.16);
    }
    // 비트(쿵) — 곡 전체, 매 박마다 낮은 킥으로 박자 제공
    for(let t=0;t<=songLen;t+=beatMs){
      schedTone(65,zeroAudio+t/1000,0.10,'sine',0.20);
    }
  }else{
    zeroPerf=performance.now()+leadMs;
  }

  // 카운트다운 숫자 표시 (3·2·1·GO)
  const labels=['3','2','1','GO!'];
  for(let i=0;i<4;i++){
    setTimeout(()=>{
      if(!gameActive)return;
      document.getElementById('stage').querySelectorAll('.countdown').forEach(e=>e.remove());
      const el=document.createElement('div');
      el.className='countdown';el.textContent=labels[i];
      document.getElementById('stage').appendChild(el);
      setTimeout(()=>el.remove(),Math.min(beatMs*0.8,700));
    },Math.round(leadMs-(4-i)*beatMs));
  }

  gameActive=true;
  if(animId)cancelAnimationFrame(animId);
  animId=requestAnimationFrame(gameLoop);
}

function updateHUD(){
  document.getElementById('scoreDisp').textContent='⭐ '+score;
  document.getElementById('comboDisp').textContent='🔥 '+combo+' 콤보';
}

function gameLoop(){
  if(!gameActive)return;
  const elapsed=elapsedMs();

  // Progress bar
  const prog=Math.max(0,Math.min(100,elapsed/songLen*100));
  document.getElementById('progBar').style.width=prog+'%';

  const hitY=stageH-72;
  for(const n of notes){
    if(n.judged){continue;}
    // 노트 생성: 히트 시각 curTravel(ms) 전 — 노트속도가 높을수록 늦게 나와 빨리 떨어짐
    if(!n.el&&elapsed>=n.time-curTravel){
      const el=document.createElement('div');
      el.className='note l'+n.lane;
      document.getElementById('stage').appendChild(el);
      n.el=el;
    }
    if(!n.el)continue;
    // 노트 이동: 판정선(hitY)에 정확히 n.time에 도달
    const progress=(elapsed-n.time+curTravel)/curTravel;
    n.el.style.top=(progress*hitY)+'px';
    // 자동 MISS (BAD 창까지 놓치면 미스)
    if(elapsed-n.time>JUDGE_BAD+50){
      n.judged=true;
      n.el.classList.add('miss-anim');
      const el=n.el;setTimeout(()=>{if(el&&el.parentNode)el.remove();},300);
      misses++;combo=0;
      showJudge('miss');
      updateHUD();
    }
  }

  if(elapsed>songLen+1500){endGame();return;}
  animId=requestAnimationFrame(gameLoop);
}

function hitLane(lane){
  if(!gameActive)return;
  const elapsed=elapsedMs();
  if(elapsed<-400)return; // 카운트인 중 오탭 무시

  let best=null,bestDiff=Infinity;
  for(const n of notes){
    if(n.judged||n.lane!==lane)continue;
    const diff=Math.abs(elapsed-n.time);
    if(diff<bestDiff&&diff<=JUDGE_BAD){bestDiff=diff;best=n;}
  }
  if(!best)return;

  best.judged=true;
  let judge,pts;
  // 히트 효과음 = 짧은 타악 틱 (멜로디는 배경에서 계속 흐른다)
  if(bestDiff<=JUDGE_PERFECT){judge='perfect';pts=200;perfects++;tone(1760,.04,'square',0.07);}
  else if(bestDiff<=JUDGE_GREAT){judge='great';pts=150;greats++;tone(1320,.04,'square',0.06);}
  else if(bestDiff<=JUDGE_GOOD){judge='good';pts=100;goods++;tone(990,.04,'square',0.05);}
  else{judge='bad';pts=20;bads++;combo=0;tone(392,.06,'sawtooth',0.05);
    if(best.el){best.el.classList.add('miss-anim');const el=best.el;setTimeout(()=>{if(el&&el.parentNode)el.remove();},300);}
    score+=pts;showJudge('bad');updateHUD();
    return;
  }

  combo++;
  if(combo>maxCombo)maxCombo=combo;
  const comboBonus=Math.min(combo*5,100);
  score+=pts+comboBonus;

  if(best.el){best.el.classList.add('hit-anim');const el=best.el;setTimeout(()=>{if(el&&el.parentNode)el.remove();},200);}
  showJudge(judge);
  updateHUD();
}

function showJudge(type){
  const labels={perfect:'PERFECT',great:'GREAT',good:'GOOD',bad:'BAD',miss:'MISS'};
  const el=document.createElement('div');
  el.className='judge '+type;
  const showCombo=combo>=2&&type!=='miss'&&type!=='bad';
  el.innerHTML=labels[type]+(showCombo?`<span class="cb">${combo} COMBO</span>`:'');
  document.getElementById('stage').appendChild(el);
  setTimeout(()=>el.remove(),500);
}

function endGame(){
  gameActive=false;zeroAudio=0;
  stopSongAudio();
  if(animId)cancelAnimationFrame(animId);

  const total=notes.length;
  const stars=getStars(score,total);
  saveBest(songIdx,stars,score);

  tone(784,.15,'triangle',0.12);
  setTimeout(()=>tone(1047,.3,'triangle',0.12),160);

  const xp=stars>=3?40:stars>=2?25:stars>=1?15:5;
  sendXP(xp);

  const prev=getBest(songIdx);
  const r=document.getElementById('resultScreen');
  r.style.display='flex';
  r.innerHTML=`
    <div class="big">${SONGS[songIdx].emoji}</div>
    <h2>${SONGS[songIdx].name} 완료!</h2>
    <div class="stars">${starStr(stars)}</div>
    <p>⭐ 점수: ${score}</p>
    <p>🔥 최대 콤보: ${maxCombo}</p>
    <p style="font-size:15px;color:#aaa">
      <span style="color:#FFD700">Perfect ${perfects}</span> ·
      <span style="color:#4CAF50">Great ${greats}</span> ·
      <span style="color:#29B6F6">Good ${goods}</span> ·
      <span style="color:#FF9800">Bad ${bads}</span> ·
      <span style="color:#E53935">Miss ${misses}</span>
    </p>
    <p style="font-size:16px;color:#7FDBFF">+${xp} XP 획득!</p>
    <div class="best-record">최고 기록: ${prev.score}점 ${starStr(prev.stars)}</div>
    <button class="retry" onclick="startGame(${songIdx})">🔄 다시 하기</button>
    ${songIdx<SONGS.length-1&&isUnlocked(songIdx+1)?`<button class="next-btn" onclick="startGame(${songIdx+1})">▶ 다음 곡</button>`:''}
    <button class="menu-link" onclick="showMenu()">🏠 곡 선택</button>
  `;
}

// Keyboard input
document.addEventListener('keydown',e=>{
  if(e.repeat)return;
  const idx=KEYS.indexOf(e.key.toLowerCase());
  if(idx>=0){
    e.preventDefault();
    hitLane(idx);
    const btn=document.querySelectorAll('.key-btn')[idx];
    btn.classList.add('active');
    setTimeout(()=>btn.classList.remove('active'),100);
  }
});

// Touch input
document.querySelectorAll('.key-btn').forEach(btn=>{
  const lane=parseInt(btn.dataset.lane);
  const activate=e=>{e.preventDefault();hitLane(lane);btn.classList.add('active');setTimeout(()=>btn.classList.remove('active'),100);};
  btn.addEventListener('touchstart',activate,{passive:false});
  btn.addEventListener('mousedown',activate);
});

// 스테이지 탭도 해당 레인 히트 (두 레인 동시 탭 지원)
(function(){
  const stageEl=document.getElementById('stage');
  stageEl.addEventListener('touchstart',e=>{
    if(!gameActive)return;
    e.preventDefault();
    const r=stageEl.getBoundingClientRect();
    for(const t of e.changedTouches){
      const lane=Math.max(0,Math.min(3,Math.floor((t.clientX-r.left)/r.width*4)));
      hitLane(lane);
      const btn=document.querySelectorAll('.key-btn')[lane];
      btn.classList.add('active');setTimeout(()=>btn.classList.remove('active'),100);
    }
  },{passive:false});
})();

// ── 컨트롤: 재생속도(메뉴)·노트속도(HUD 하이스피드)·가로모드 ──
function buildSpeedOpts(){
  const wrap=document.getElementById('playSpeedBtns');
  if(!wrap)return;
  wrap.innerHTML=[0.75,1,1.25,1.5].map(v=>
    `<button class="opt-b${v===playSpeed?' on':''}" data-ps="${v}">${v}×</button>`).join('');
  wrap.querySelectorAll('.opt-b').forEach(b=>b.addEventListener('click',()=>{
    playSpeed=parseFloat(b.dataset.ps);localStorage.setItem('rhythm_play',playSpeed);buildSpeedOpts();
  }));
}
function updateSpdLabel(){const el=document.getElementById('spdLabel');if(el)el.textContent='노트 '+scrollSpeed.toFixed(1);}
function nudgeScroll(d){
  scrollSpeed=Math.max(1.0,Math.min(3.0,Math.round((scrollSpeed+d)*100)/100));
  curTravel=BASE_TRAVEL/scrollSpeed;
  localStorage.setItem('rhythm_scroll',scrollSpeed);
  updateSpdLabel();
}
document.getElementById('spdUp').addEventListener('click',()=>nudgeScroll(0.25));
document.getElementById('spdDown').addEventListener('click',()=>nudgeScroll(-0.25));

let isLandscape=false;
function toggleLandscape(){
  const el=document.documentElement;
  if(!isLandscape){
    const fs=el.requestFullscreen?el.requestFullscreen():Promise.reject();
    Promise.resolve(fs).then(()=>{
      if(screen.orientation&&screen.orientation.lock)return screen.orientation.lock('landscape');
    }).catch(()=>{}).finally(()=>{isLandscape=true;});
  }else{
    try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock();}catch(e){}
    if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});
    isLandscape=false;
  }
}
document.getElementById('lscapeBtn').addEventListener('click',toggleLandscape);
updateSpdLabel();

// 자동 검증 훅 (Playwright QA용)
window.__rhythmDebug={get notes(){return notes;},get elapsed(){return gameActive?elapsedMs():null;},hitLane,SONGS,buildChart};

showMenu();
