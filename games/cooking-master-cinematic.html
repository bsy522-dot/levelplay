// 음식 일러스트(food/*.png)는 '투명 단일 음식'이 아니라 불투명 seamless 타일 패턴이어서
// 팬/결과/목표에 그리면 파란 사각형으로 보여 가독성을 해쳤다(검증 FAIL 원인) → 음식은 이모지로 렌더.
// 캐릭터/배경(chef/kitchen)은 cover-crop(drawArtFramed)로 깔끔히 렌더되므로 그대로 활용.
const ASSET_BASE='assets/cinematic/';
const ART_ASSETS={
 chef:'chars/chef.png',
 customer1:'chars/customer1.png', customer2:'chars/customer2.png', customer3:'chars/customer3.png',
 kitchen:'bg/kitchen_main.png'
};
const artCache={};
function _loadInto(cache,key,path){
 const img=new Image();
 img.onload=()=>{cache[key]=img;};
 img.onerror=()=>{cache[key]=null;};
 img.src=ASSET_BASE+path;
}
function preloadAssets(){
 Object.keys(ART_ASSETS).forEach(k=>_loadInto(artCache,k,ART_ASSETS[k]));
}
preloadAssets();

// 둥근 액자 안에 정사각 일러스트를 cover로 그리기(불투명 배경 PNG 대응)
function drawArtFramed(key,dx,dy,dw,dh,r,fallbackEmoji){
 const img=artCache[key];
 X.save();
 X.beginPath();X.roundRect(dx,dy,dw,dh,r);X.clip();
 if(img){
  const boxRatio=dw/dh; const s=Math.min(img.width,img.height);
  let cw=s,ch=s;
  if(boxRatio>1){ch=s/boxRatio;}else{cw=s*boxRatio;}
  X.drawImage(img,(img.width-cw)/2,(img.height-ch)/2,cw,ch,dx,dy,dw,dh);
 }else{
  const g=X.createLinearGradient(dx,dy,dx,dy+dh);
  g.addColorStop(0,'#FFE0B2');g.addColorStop(1,'#FFCC80');
  X.fillStyle=g;X.fillRect(dx,dy,dw,dh);
  if(fallbackEmoji){X.font='bold '+(dh*.5)+'px sans-serif';X.fillStyle='#000';X.textAlign='center';X.textBaseline='middle';X.fillText(fallbackEmoji,dx+dw/2,dy+dh/2);}
 }
 X.restore();
}

// Audio — lazy 생성: 첫 제스처 시점에 만들어 autoplay 정책 위반 방지
let AC=null;
function ensureAudio(){
 if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;return null;}}
 if(AC.state==='suspended')AC.resume();
 return AC;
}
function playSound(type){
 const ac=ensureAudio();
 if(!ac)return;
 const o=ac.createOscillator(),g=ac.createGain(),n=ac.createBufferSource();
 g.connect(ac.destination);
 if(type==='chop'){
  const buf=ac.createBuffer(1,ac.sampleRate*.08,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/800);
  n.buffer=buf;n.connect(g);g.gain.value=.3;n.start();
 }else if(type==='sizzle'){
  const buf=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.15*Math.exp(-i/8000);
  n.buffer=buf;n.connect(g);g.gain.value=.25;n.start();
 }else if(type==='boil'){
  const buf=ac.createBuffer(1,ac.sampleRate*.4,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){const t=i/ac.sampleRate;d[i]=Math.sin(t*200+Math.sin(t*50)*5)*.1*Math.exp(-i/15000)+(Math.random()-.5)*.05;}
  n.buffer=buf;n.connect(g);g.gain.value=.2;n.start();
 }else if(type==='ding'){
  o.connect(g);o.frequency.value=880;g.gain.setValueAtTime(.3,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.3);o.start();o.stop(ac.currentTime+.3);
 }else if(type==='star'){
  o.connect(g);o.frequency.setValueAtTime(523,ac.currentTime);o.frequency.setValueAtTime(659,ac.currentTime+.1);o.frequency.setValueAtTime(784,ac.currentTime+.2);g.gain.setValueAtTime(.2,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.4);o.start();o.stop(ac.currentTime+.4);
 }else if(type==='click'){
  o.connect(g);o.frequency.value=600;g.gain.setValueAtTime(.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.05);o.start();o.stop(ac.currentTime+.05);
 }
}

// Save/Load
function save(){
 localStorage.setItem('cookingMaster',JSON.stringify({coins,totalStars,playerLevel,equipment,earnedStars}));
}
function load(){
 const d=localStorage.getItem('cookingMaster');
 if(d){const p=JSON.parse(d);coins=p.coins||0;totalStars=p.totalStars||0;playerLevel=p.playerLevel||1;equipment=p.equipment||{stove:1,knife:1,pan:1};earnedStars=p.earnedStars||{};}
}

// Resize
function resize(){
 dpr=window.devicePixelRatio||1;
 W=window.innerWidth;H=window.innerHeight;
 C.width=W*dpr;C.height=H*dpr;
 C.style.width=W+'px';C.style.height=H+'px';
 X.setTransform(dpr,0,0,dpr,0,0);
 if(window.Kitchen3D&&window.Kitchen3D.resize)window.Kitchen3D.resize(W,H,dpr);
}
window.addEventListener('resize',resize);

// Input
function getXY(e){
 const t=e.touches?e.touches[0]:e;
 return{x:t.clientX,y:t.clientY};
}
C.addEventListener('touchstart',e=>{e.preventDefault();const p=getXY(e);tx=tapX=p.x;ty=tapY=p.y;touching=true;tapped=true;},{passive:false});
C.addEventListener('touchmove',e=>{e.preventDefault();const p=getXY(e);tx=p.x;ty=p.y;},{passive:false});
C.addEventListener('touchend',e=>{e.preventDefault();touching=false;},{passive:false});
C.addEventListener('mousedown',e=>{const p=getXY(e);tx=tapX=p.x;ty=tapY=p.y;touching=true;tapped=true;});
C.addEventListener('mousemove',e=>{if(touching){tx=e.clientX;ty=e.clientY;}});
C.addEventListener('mouseup',()=>{touching=false;});

// Drawing helpers
function fillRect(x,y,w,h,c){X.fillStyle=c;X.fillRect(x,y,w,h);}
function drawText(txt,x,y,size,color,align='center',bold=false){
 X.font=(bold?'bold ':'')+size+'px "Segoe UI",sans-serif';
 X.fillStyle=color;X.textAlign=align;X.textBaseline='middle';
 X.fillText(txt,x,y);
}
// ===== word-wrap 헬퍼 (C-7 과학상식 + D-3 헤더 + D-5 결과 공용) =====
function wrapLines(txt,maxW,size,bold,maxLines){
 X.font=(bold?'bold ':'')+size+'px "Segoe UI",sans-serif';
 const hasSpace=txt.indexOf(' ')>=0;
 const tokens=hasSpace?txt.split(' '):txt.split('');
 const join=hasSpace?' ':'';
 const lines=[]; let cur='';
 for(const t of tokens){
  const test=cur?cur+join+t:t;
  if(X.measureText(test).width>maxW&&cur){lines.push(cur);cur=t;}
  else cur=test;
 }
 if(cur)lines.push(cur);
 if(maxLines&&lines.length>maxLines){
  const kept=lines.slice(0,maxLines);
  let last=kept[maxLines-1];
  while(last.length>1&&X.measureText(last+'…').width>maxW)last=last.slice(0,-1);
  kept[maxLines-1]=last+'…';
  return kept;
 }
 return lines;
}
function wrapText(txt,x,y,maxW,lineH,size,color,align,bold,maxLines){
 const lines=wrapLines(txt,maxW,size,!!bold,maxLines);
 lines.forEach((l,i)=>drawText(l,x,y+i*lineH,size,color,align||'left',!!bold));
 return lines.length;
}
function drawRoundRect(x,y,w,h,r,fill,stroke){
 X.beginPath();X.roundRect(x,y,w,h,r);
 if(fill){X.fillStyle=fill;X.fill();}
 if(stroke){X.strokeStyle=stroke;X.lineWidth=2;X.stroke();}
}
function drawBtn(x,y,w,h,txt,color='#FF8C42'){
 const g=X.createLinearGradient(x,y,x,y+h);
 g.addColorStop(0,color);g.addColorStop(1,shadeColor(color,-.2));
 drawRoundRect(x,y,w,h,12,g);
 drawRoundRect(x,y+3,w,h-3,12,null,shadeColor(color,-.3));
 drawText(txt,x+w/2,y+h/2,Math.min(16,h*.4),'#fff','center',true);
 return{x,y,w,h};
}
function shadeColor(c,p){
 const n=parseInt(c.slice(1),16);
 const r=Math.min(255,Math.max(0,((n>>16)&0xFF)+((n>>16)&0xFF)*p));
 const g=Math.min(255,Math.max(0,((n>>8)&0xFF)+((n>>8)&0xFF)*p));
 const b=Math.min(255,Math.max(0,(n&0xFF)+(n&0xFF)*p));
 return '#'+(0x1000000+((r|0)<<16)+((g|0)<<8)+(b|0)).toString(16).slice(1);
}
function hitTest(bx,by,bw,bh,px,py){return px>=bx&&px<=bx+bw&&py>=by&&py<=by+bh;}

// Particles — 신규 타입: spice(양념), liquid(계란/오일), splash(튀김), crack(껍질), sparkle(반짝)
function addParticle(x,y,type,opt){
 opt=opt||{};
 const counts={star:8,steam:4,fire:4,spice:14,liquid:6,splash:8,crack:6,sparkle:10};
 const n=counts[type]||4;
 for(let i=0;i<n;i++){
  let vx,vy,life=1,color,size,rot=0,vrot=0;
  if(type==='star'){vx=(Math.random()-.5)*4;vy=-Math.random()*3-1;color=['#FFD700','#FFA500','#FF6347'][i%3];size=6;}
  else if(type==='steam'){vx=(Math.random()-.5)*1.5;vy=-Math.random()*1.5-.5;color='#ddd';size=8;}
  else if(type==='fire'){vx=(Math.random()-.5)*2;vy=-Math.random()*2-1;color=['#FF6F00','#FFA000','#FFD600'][i%3];size=5;}
  else if(type==='spice'){vx=(Math.random()-.5)*1.2;vy=Math.random()*2+.5;color=opt.color||['#FFFFFF','#E0E0E0','#9E9E9E'][i%3];size=2+Math.random()*1.5;life=1.2;}
  else if(type==='liquid'){vx=(Math.random()-.5)*2;vy=Math.random()*2;color=opt.color||'#FFEB3B';size=3+Math.random()*3;life=.8;}
  else if(type==='splash'){vx=(Math.random()-.5)*6;vy=-Math.random()*4-1;color=opt.color||'#FFE082';size=3;}
  else if(type==='crack'){vx=(Math.random()-.5)*5;vy=-Math.random()*3-1;color='#F5F5DC';size=4+Math.random()*3;rot=Math.random()*Math.PI*2;vrot=(Math.random()-.5)*.3;}
  else if(type==='sparkle'){const a=i*Math.PI*2/n;vx=Math.cos(a)*2;vy=Math.sin(a)*2-1;color=['#FFEB3B','#FFFFFF','#FFC107'][i%3];size=3;}
  else {vx=(Math.random()-.5)*4;vy=-Math.random()*3-1;color='#FF6347';size=4;}
  particles.push({x,y,vx,vy,life,type,color,size,rot,vrot});
 }
}
function updateParticles(){
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];p.x+=p.vx;p.y+=p.vy;
  if(p.type==='steam'){p.vy-=.02;p.life-=.015;}
  else if(p.type==='spice'){p.vy+=.05;p.vx*=.98;p.life-=.012;} // 천천히 떨어짐
  else if(p.type==='liquid'){p.vy+=.18;p.life-=.025;}            // 빨리 흐름
  else if(p.type==='splash'){p.vy+=.25;p.life-=.03;}
  else if(p.type==='crack'){p.vy+=.2;p.rot+=p.vrot;p.life-=.02;}
  else if(p.type==='sparkle'){p.vy+=.05;p.life-=.02;}
  else if(p.type==='fire'){p.vy-=.05;p.life-=.04;}
  else {p.vy+=.1;p.life-=.02;}
  if(p.life<=0)particles.splice(i,1);
 }
}
function drawParticles(){
 particles.forEach(p=>{
  X.globalAlpha=Math.max(0,Math.min(1,p.life));X.fillStyle=p.color;
  if(p.type==='crack'){
   X.save();X.translate(p.x,p.y);X.rotate(p.rot);
   X.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);
   X.restore();
  }else if(p.type==='liquid'){
   X.beginPath();X.ellipse(p.x,p.y,p.size*p.life*1.4,p.size*p.life*.7,0,0,Math.PI*2);X.fill();
  }else if(p.type==='spice'){
   X.beginPath();X.arc(p.x,p.y,p.size,0,Math.PI*2);X.fill();
  }else if(p.type==='sparkle'){
   const s=p.size*p.life;
   X.beginPath();
   for(let k=0;k<4;k++){const a=k*Math.PI/2+p.rot;X.lineTo(p.x+Math.cos(a)*s*1.4,p.y+Math.sin(a)*s*1.4);X.lineTo(p.x+Math.cos(a+Math.PI/4)*s*.5,p.y+Math.sin(a+Math.PI/4)*s*.5);}
   X.closePath();X.fill();
  }else{
   X.beginPath();X.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);X.fill();
  }
 });
 X.globalAlpha=1;
}

function recordJudge(grade,fx,fy){
 stepJudges[cookStep]=grade;
 const cfg={
  perfect:{text:'완벽해요! 🌟',color:'#FFB300',add:20,snd:'star',pt:'star'},
  good   :{text:'좋아요! 👍',  color:'#4CAF50',add:13,snd:'ding',pt:'sparkle'},
  miss   :{text:'앗, 아쉬워요 💦',color:'#FF7043',add:5, snd:'click',pt:'steam'}
 }[grade];
 cookScore+=cfg.add;
 if(grade==='perfect')perfectCount++; else if(grade==='good')goodCount++; else missCount++;
 judgeFeedback={grade,text:cfg.text,color:cfg.color,timer:50};
 playSound(cfg.snd);
 const px=(fx!=null)?fx:W/2, py=(fy!=null)?fy:H*.45;
 addParticle(px,py,cfg.pt);
 if(grade==='perfect'){addParticle(px,py,'sparkle');addParticle(px,py,'star');}

// 누적 판정 → 솜씨 점수(0~20) — 난수 presScore 대체
function craftScoreFromJudges(){
 const steps=currentRecipe.stepTypes.length;
 if(!steps)return 0;
 let pts=0;
 for(let i=0;i<steps;i++){
  const g=stepJudges[i];
  pts+=(g==='perfect')?20:(g==='good')?13:(g==='miss')?5:10;
 }
 return Math.round((pts/(steps*20))*20);
}
// 드래그 단계 재료 결정 (C-2): 단계 텍스트 우선, 없으면 drag 순번대로 정답 재료
function pickDragIngredient(recipe,step,stepText){
 const need=recipe.ingredients||[];
 const inText=need.find(ing=>stepText&&stepText.includes(ing));
 if(inText)return inText;
 let dragIdx=0;
 for(let i=0;i<step;i++)if(recipe.stepTypes[i]==='drag')dragIdx++;
 return need[dragIdx % need.length] || need[0] || '재료';
}

function drawCookingStep(){
 const recipe=currentRecipe;
 const step=recipe.steps[cookStep];
 const stype=recipe.stepTypes[cookStep];
 const isLast=cookStep>=recipe.steps.length-1;
 const P=diffParams();          // 난이도 파라미터 (B)
 initStepJudge(stype,P);        // 스텝 미니게임 1회 초기화 (B)
 // 비상구 모달 떠 있으면 조리 입력 무시 (D-4 / C-3 통합)
 if(cookExitConfirm){tapped=false;touching=false;}

 // Kitchen bg — semi-transparent so 3D Kitchen3D scene shows through
 fillRect(0,0,W,H,'rgba(239,235,233,.5)');
 // Stove area (kept mostly opaque so the cooking action reads clearly)

 // Burner with animated flame
 const bx=W/2,by=stoveY+H*.2;
 X.beginPath();X.arc(bx,by,50,0,Math.PI*2);
 X.fillStyle=stype==='hold'&&touching?'#FF5722':'#37474F';X.fill();
 // Animated flame ring when cooking
 if(stype==='hold'&&touching){
   for(let i=0;i<8;i++){
     const a=i*Math.PI/4+animT*3;
     const fx=bx+Math.cos(a)*42,fy=by+Math.sin(a)*42;
     const fs=4+Math.sin(animT*8+i)*2;
     X.fillStyle='rgba(255,100,0,'+(0.5+Math.sin(animT*6+i)*0.3)+')';
     X.beginPath();X.arc(fx,fy,fs,0,Math.PI*2);X.fill();
   }
 }
 X.beginPath();X.arc(bx,by,35,0,Math.PI*2);X.fillStyle='#263238';X.fill();

 // Pan on stove with cooking state visual
 const panY=by-20;
 X.beginPath();X.ellipse(bx,panY,65,25,0,0,Math.PI*2);X.fillStyle='#424242';X.fill();
 X.beginPath();X.ellipse(bx,panY-5,58,20,0,0,Math.PI*2);
 // Cooking state transition: raw -> cooking -> done
 const cookProgress=stype==='hold'?Math.min(1,holdProgress/holdTarget):stepComplete?1:0;
 if(cookProgress>0.7){X.fillStyle='#8B6914';} // done - golden brown
 else if(cookProgress>0.3){X.fillStyle='#A0522D';} // cooking - browning
 else{X.fillStyle='#616161';} // raw - grey pan

  }
 }

 // 완료 시 sparkle 폭발 1회
 if(stepComplete&&frame%30===0){
  addParticle(bx,panY,'sparkle');
 }

 // Next step button — 판정 등급 배지
 if(stepComplete){
  const g=stepJudges[cookStep]||'good';
  const gtxt={perfect:'⭐ 완벽!',good:'👍 좋아요',miss:'💦 아쉬워요'}[g];
  drawText('✅ '+gtxt,W/2,H*.135,18,'#4CAF50','center',true);
  const nbw=160,nbh=44;
  regBtn(W/2-nbw/2,H*.155,nbw,nbh,isLast?'요리 완성!':'다음 단계 →','#4CAF50');
  btns[btns.length-1].action=()=>{
   if(isLast){finishCooking();}
   else{cookStep++;holdProgress=0;stepComplete=false;dragItem=null;stepInited=false;}
  };
 }

 // ===== 상단 셰프 코치 헤더 (D-3) =====
 drawCookHeader(recipe,step,stype,stepComplete);

 // ===== 요리 중 비상구 ✕ + 모달 (D-4) =====
 // 목표 미리보기 카드(우상단)와 겹치지 않도록 카드 아래 우측 가장자리에 배치
 if(!cookExitConfirm){
  const xs=40, xx=W-xs-10, xy=H*.045+Math.min(96,H*.16)+10;
  drawRoundRect(xx,xy,xs,xs,12,'rgba(244,67,54,.92)','#B71C1C');
  drawText('✕',xx+xs/2,xy+xs/2,22,'#fff','center',true);
  if(tapped&&hitTest(xx,xy,xs,xs,tapX,tapY)){tapped=false;cookExitConfirm=true;playSound('click');}
 }else{
  fillRect(0,0,W,H,'rgba(0,0,0,.55)');
  const mw=Math.min(300,W-40),mh=180,mx=(W-mw)/2,my=(H-mh)/2;
  drawRoundRect(mx,my,mw,mh,18,'#FFF8E1','#FFB74D');
  drawText('🍳',W/2,my+34,34,'#000');
  drawText('요리를 그만둘까요?',W/2,my+70,17,'#3E2723','center',true);
  drawText('지금 나가면 이 요리는 사라져요',W/2,my+94,12,'#8D6E63','center');
  const bw=mw/2-22, bh=46;
  regBtn(mx+14,my+mh-58,bw,bh,'계속하기 ✨','#4CAF50');
  btns[btns.length-1].action=()=>{cookExitConfirm=false;};
  regBtn(mx+mw-bw-14,my+mh-58,bw,bh,'그만두기','#8D6E63');
  btns[btns.length-1].action=()=>{
   cookExitConfirm=false;
   if(state==='cooking_restaurant'){state='restaurant';document.getElementById('hud').classList.remove('hidden');document.getElementById('hud-timer').classList.remove('hidden');}
   else{state='recipes';scrollY=0;document.getElementById('hud').classList.add('hidden');}
   currentRecipe=null;
  };
 }

 drawJudgeFeedback();   // B
 drawParticles();
 updateParticles();
}

function finishCooking(){
 const recipe=currentRecipe;
 const ingScore=Math.round((correctCount/totalPossible)*50);              // 재료 50%
 const maxStep=recipe.stepTypes.length*20;
 const stepScore=Math.round((Math.min(cookScore,maxStep)/maxStep)*30);    // 수행 30%
 const craft=craftScoreFromJudges();                                       // 솜씨 20% (난수 제거)
 const total=Math.min(100,ingScore+stepScore+craft);
 if(state==='cooking_restaurant'){
  const reward=Math.floor(total/5)+5;
  coins+=reward;servedCount++;
  save();playSound('star');
  state='restaurant';currentRecipe=null;
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('hud-timer').classList.remove('hidden');
 }else{
  const stars=total>=90?3:total>=70?2:total>=40?1:0;
  const prevStars=earnedStars[recipe.id]||0;
  if(stars>prevStars){totalStars+=stars-prevStars;earnedStars[recipe.id]=stars;}
  coins+=stars*10+Math.floor(total/5);
  playerLevel=1+Math.floor(totalStars/5);
  cookScore=total;
  resultCelebrated=false;window._resultEnterT=undefined;window._scoreShown=undefined; // D-5b 리셋
  state='result';
  save();playSound('star');
 }
}

function drawResult(){
 fillRect(0,0,W,H,'rgba(0,0,0,.6)');
 const pw=Math.min(340,W-30),ph=460,px=(W-pw)/2,py=(H-ph)/2;
 drawRoundRect(px,py,pw,ph,20,'#FFF8E1','#FFB74D');

 const stars=earnedStars[currentRecipe.id]||0;

 if(!resultCelebrated){
  resultCelebrated=true;
  if(window.GameFX&&window.GameFX.starBurst)window.GameFX.starBurst(X,W/2,py+90,14+stars*4);
  playSound('star');
 }

 const chS=Math.min(64,pw*.22);
 X.save();X.translate(px+chS*.5+10,py+chS*.5+8);X.rotate(Math.sin(animT*6)*0.08);X.translate(-(px+chS*.5+10),-(py+chS*.5+8));
 drawArtFramed('chef',px+10,py+8,chS,chS,12,'👨‍🍳');
 X.restore();
 X.save();X.strokeStyle='#FFD54F';X.lineWidth=2;X.beginPath();X.roundRect(px+10,py+8,chS,chS,12);X.stroke();X.restore();

 drawText('🎉 요리 완성!',W/2,py+30,22,'#E65100','center',true);

 if(window._resultEnterT===undefined)window._resultEnterT=animT;
 const popT=Math.min(1,(animT-window._resultEnterT)*3);
 const popScale=1+(1-popT)*0.6;
 X.save();X.translate(W/2,py+72);X.scale(popScale,popScale);
 drawText(currentRecipe.emoji,0,0,50,'#000');
 X.restore();
 drawText(currentRecipe.name,W/2,py+120,19,'#3E2723','center',true);

 const starY=py+142;
 for(let i=0;i<3;i++){
  const got=i<stars;
  const sPop=got?1+Math.max(0,Math.sin((animT*4)-i*0.5))*0.25:1;
  X.save();X.translate(W/2-40+i*40,starY);X.scale(sPop,sPop);
  drawText(got?'⭐':'☆',0,0,30,got?'#FFB300':'#BDBDBD');
  X.restore();
 }

 if(window._scoreShown===undefined)window._scoreShown=0;
 window._scoreShown+=Math.max(1,(cookScore-window._scoreShown)*0.15);
 if(window._scoreShown>cookScore)window._scoreShown=cookScore;
 drawText(`맛 점수: ${Math.round(window._scoreShown)}점`,W/2,py+178,16,'#5D4037','center',true);

 // Nutrition
 drawText('📊 영양 분석',W/2,py+202,14,'#E65100','center',true);
 const nt=currentRecipe.nutrients;
 const nkeys=['탄수화물','단백질','지방','비타민','무기질'];
 const ncolors=['#FF9800','#F44336','#FFC107','#4CAF50','#2196F3'];
 nkeys.forEach((k,i)=>{
  const nbx=px+20,nby=py+216+i*20,nbw=pw-40;
  drawText(k,nbx+35,nby+6,11,'#5D4037','right');
  drawRoundRect(nbx+40,nby,nbw-40,12,6,'#E0E0E0');
  drawRoundRect(nbx+40,nby,(nbw-40)*nt[k]/50,12,6,ncolors[i]);
 });

 // Science fact (C-7: word-wrap, 하드컷 제거)
 const sciSize=11, sciLineH=15, sciW=pw-44;
 const sciLines=wrapLines('🔬 '+currentRecipe.science, sciW, sciSize, false, 3);
 const sciBoxH=sciLines.length*sciLineH+16;
 drawRoundRect(px+10,py+322,pw-20,sciBoxH,8,'#E3F2FD','#42A5F5');
 sciLines.forEach((l,i)=>drawText(l,W/2,py+322+12+i*sciLineH,sciSize,'#1565C0','center'));

 const bw2=160,bh2=48;
 const okBtn=regBtn(W/2-bw2/2,py+ph-58,bw2,bh2,'확인 ✨','#FF8C42');
 btns[btns.length-1].action=()=>{
  if(window.GameFX&&window.GameFX.bounceButton)window.GameFX.bounceButton(okBtn);
  state='menu';currentRecipe=null;
  window._resultEnterT=undefined;window._scoreShown=undefined;
  document.getElementById('hud').classList.add('hidden');
 };
}

// Restaurant Mode
function startRestaurant(){
 if(totalStars<3){alert('⭐ 3개 이상 모아야 레스토랑을 열 수 있어요!');return;}
 restaurantMode=true;state='restaurant';customers=[];servedCount=0;orderTimer=180*60;
 spawnCustomer();
 document.getElementById('hud').classList.remove('hidden');
 document.getElementById('hud-timer').classList.remove('hidden');
}

function spawnCustomer(){
 const available=RECIPES.filter(r=>earnedStars[r.id]>=1);
 if(available.length===0)return;
 const r=available[Math.floor(Math.random()*available.length)];
 const emojis=['👦','👧','👨','👩','👴','👵','🧑'];
 customers.push({recipe:r,emoji:emojis[Math.floor(Math.random()*emojis.length)],patience:100,x:W+60,targetX:60+customers.length*90});
}

function drawRestaurant(){
 fillRect(0,0,W,H,'#EFEBE9');
 // Restaurant bg
 fillRect(0,0,W,H*.15,'#D84315');
 drawText('🍴 레스토랑 모드',W/2,H*.08,20,'#FFF','center',true);
 drawText(`주문 완료: ${servedCount}  남은시간: ${Math.ceil(orderTimer/3600)}분`,W/2,H*.13,12,'#FFCC80');

 // Counter
 fillRect(0,H*.55,W,8,'#5D4037');
 fillRect(0,H*.56,W,H*.44,'#8D6E63');

 orderTimer--;
 if(orderTimer<=0){endRestaurant();return;}

 // Customers
 for(let i=customers.length-1;i>=0;i--){
  const c=customers[i];
  if(c.x>c.targetX)c.x-=2;
  c.patience-=.015;

  const cy=H*.45;
  // Customer
  drawText(c.emoji,c.x,cy,36,'#000');
  // Speech bubble
  drawRoundRect(c.x-35,cy-60,70,35,10,'#fff','#FFB74D');
  drawText(c.recipe.emoji+' '+c.recipe.name,c.x,cy-42,10,'#3E2723','center',true);
  // Patience bar
  drawRoundRect(c.x-25,cy+25,50,6,3,'#E0E0E0');
  const pc=c.patience/100;
  drawRoundRect(c.x-25,cy+25,50*pc,6,3,pc>.5?'#4CAF50':pc>.25?'#FF9800':'#F44336');

  if(c.patience<=0){customers.splice(i,1);continue;}

  // Tap to cook
  if(tapped&&Math.abs(tapX-c.x)<40&&Math.abs(tapY-cy)<50){
   tapped=false;
   currentRecipe=c.recipe;
   selectedIngredients=[...c.recipe.ingredients];
   correctCount=c.recipe.ingredients.length;
   totalPossible=c.recipe.ingredients.length;
   ingredientPhase=false;cookStep=0;holdProgress=0;stepComplete=false;
   cookScore=0;dragItem=null;
   stepJudges=[];stepInited=false;judgeFeedback=null;perfectCount=0;goodCount=0;missCount=0; // B
   cookExitConfirm=false;                                                                     // D-4
   if(window.Kitchen3D&&window.Kitchen3D.setRecipeFood)window.Kitchen3D.setRecipeFood(c.recipe.emoji); // A
   state='cooking_restaurant';customers.splice(i,1);
   break;
  }
 }

 // Spawn timer
 if(frame%300===0&&customers.length<4)spawnCustomer();

 // Back
 regBtn(10,H-45,70,30,'나가기','#8D6E63');
 btns[btns.length-1].action=()=>endRestaurant();
}

function endRestaurant(){
 const bonus=servedCount*15;coins+=bonus;
 restaurantMode=false;state='menu';
 document.getElementById('hud').classList.add('hidden');
 document.getElementById('hud-timer').classList.add('hidden');
 save();
 alert(`레스토랑 종료! ${servedCount}명에게 서빙!\n보너스: 🪙 ${bonus}`);
}

// Upgrade
function drawUpgrade(){
 document.getElementById('hud').classList.add('hidden'); // 화면 제목과 HUD 겹침 방지(방어적)
 fillRect(0,0,W,H,'#FFF3E0');
 drawText('🔧 주방 업그레이드',W/2,35,22,'#D84315','center',true);
 drawText(`🪙 ${coins}`,W/2,60,16,'#795548');

 regBtn(10,10,60,30,'← 뒤로','#8D6E63');
 btns[btns.length-1].action=()=>{state='menu';};

 const items=[
  {key:'stove',emoji:'🔥',name:'화구'},
  {key:'knife',emoji:'🔪',name:'칼'},
  {key:'pan',emoji:'🍳',name:'팬'}
 ];

 items.forEach((item,i)=>{
  const ey=100+i*110;
  const lv=equipment[item.key];
  drawRoundRect(20,ey,W-40,95,12,'#FFFDE7','#FFB74D');
  drawText(item.emoji,55,ey+25,28,'#000');
  drawText(item.name,90,ey+20,16,'#3E2723','left',true);
  drawText(`Lv.${lv} - ${EQUIP_NAMES[item.key][lv-1]}`,90,ey+42,13,'#795548','left');

  if(lv<3){
   const cost=EQUIP_COST[lv];
   const canBuy=coins>=cost;
   const bw=100,bh=32;
   drawRoundRect(W-130,ey+20,bw,bh,8,canBuy?'#4CAF50':'#9E9E9E');
   drawText(`🪙 ${cost}`,W-80,ey+36,13,'#fff','center',true);
   if(tapped&&hitTest(W-130,ey+20,bw,bh,tapX,tapY)&&canBuy){
    tapped=false;coins-=cost;equipment[item.key]=lv+1;save();playSound('star');
   }
  }else{
   drawText('MAX',W-80,ey+36,14,'#4CAF50','center',true);
  }

  // Bonus info
  const bonuses=['요리 시간 -10%','재료 점수 +5','맛 점수 +5'];
  drawText(`효과: ${bonuses[i]}`,60,ey+70,11,'#FF6D00','left');
 });
}

// Encyclopedia
function drawEncyclopedia(){
 document.getElementById('hud').classList.add('hidden'); // 화면 제목과 HUD 겹침 방지(방어적)
 fillRect(0,0,W,H,'#FFF3E0');
 drawText('📚 재료 도감',W/2,30,22,'#D84315','center',true);
 regBtn(10,10,60,30,'← 뒤로','#8D6E63');
 btns[btns.length-1].action=()=>{state='menu';};

 const keys=Object.keys(INGREDIENT_INFO);
 let cy=60-scrollY;
 const groups=['탄수화물','단백질','지방','비타민','무기질','기타'];
 const gcolors={'탄수화물':'#FF9800','단백질':'#F44336','지방':'#FFC107','비타민':'#4CAF50','무기질':'#2196F3','기타':'#9E9E9E'};

 for(const g of groups){
  const items=keys.filter(k=>INGREDIENT_INFO[k].group===g);
  if(items.length===0)continue;
  if(cy>-20&&cy<H+20){
   drawRoundRect(15,cy,W-30,22,5,gcolors[g]);
   drawText(g,W/2,cy+11,13,'#fff','center',true);
  }
  cy+=30;
  for(const k of items){
   if(cy>-50&&cy<H+20){
    const info=INGREDIENT_INFO[k];
    drawRoundRect(20,cy,W-40,42,8,'#FFFDE7','#FFE0B2');
    drawText(info.emoji,44,cy+21,20,'#000');
    drawText(k,70,cy+13,13,'#3E2723','left',true);
    drawText(`${info.origin} | ${info.season}`,70,cy+30,10,'#8D6E63','left');
    drawText(info.desc.substring(0,18),W-25,cy+21,10,'#5D4037','right');
   }
   cy+=48;
  }
  cy+=5;
 }
 if(touching){scrollY=Math.max(0,scrollY-(ty-tapY)*.3);}
}

// Main loop
let _lastT=0;
function gameLoop(ts){
 if(!_lastT)_lastT=ts||performance.now();
 const now=ts||performance.now();
 let dt=(now-_lastT)/1000; _lastT=now;
 if(!(dt>0)||dt>0.1)dt=1/60;
 window._dt=dt;
 frame++;clearBtns();animT+=dt;
 X.clearRect(0,0,W,H);

 switch(state){
  case'menu':drawMenu();break;
  case'recipes':drawRecipeList();break;
  case'cooking':drawCooking();break;
  case'cooking_restaurant':
   drawCooking();
   break;
  case'result':drawResult();break;
  case'restaurant':drawRestaurant();break;
  case'upgrade':drawUpgrade();break;
  case'encyclopedia':drawEncyclopedia();break;
 }

 checkBtns();
 tapped=false;
 if(window.Kitchen3D){
  const cooking=(state==='cooking'||state==='cooking_restaurant');
  const m3d = state==='menu'?'menu':cooking?'cooking_dim':state==='result'?'result':'hidden';
  if(window.Kitchen3D.setMode)window.Kitchen3D.setMode(m3d);
  if(window.Kitchen3D.render)window.Kitchen3D.render(performance.now()/1000);
  const gl=document.getElementById('gl3d');
  if(gl){
   if(cooking){ gl.classList.add('gl-cooking'); gl.classList.remove('gl-ambient'); }
   else if(state==='menu'||state==='result'){ gl.classList.add('gl-ambient'); gl.classList.remove('gl-cooking'); }
   else { gl.classList.remove('gl-cooking'); gl.classList.remove('gl-ambient'); }
  }
 }
 if(window.GameShaders){
  if(window.GameShaders.update)window.GameShaders.update(1/60);
  // Kitchen3D 렌더 후 ortho shader 씬을 같은 framebuffer 위에 합성
  if(window.GameShaders.render)window.GameShaders.render();
 }
 if(window.GameFX&&window.GameFX.renderOverlay)window.GameFX.renderOverlay(X);
 requestAnimationFrame(gameLoop);
}

// Init
function startGameAfterIntro(){
 ensureAudio(); // 첫 제스처에서 오디오 unlock
 load();resize();gameLoop();
 if(window.Kitchen3D&&window.Kitchen3D.init)window.Kitchen3D.init({canvasSelector:'#gl3d'});
 if(window.GameShaders&&window.GameShaders.init&&window.Kitchen3D)window.GameShaders.init(window.Kitchen3D._renderer,window.Kitchen3D._scene);
}
function bootCinematic(){
 if(window.GameFX&&window.GameFX.init&&window.GameFX.playIntro){window.GameFX.init();window.GameFX.playIntro(startGameAfterIntro);}
 else{
  // Fallback: hide intro on first tap
  const introEl=document.getElementById('intro');
  if(introEl){
   const dismiss=()=>{introEl.classList.add('hidden');startGameAfterIntro();window.removeEventListener('pointerdown',dismiss);window.removeEventListener('keydown',dismiss);};
   window.addEventListener('pointerdown',dismiss);window.addEventListener('keydown',dismiss);
  }else{startGameAfterIntro();}
 }
}
</script>
<script src="_modules/kitchen3d.js"></script>
<script src="_modules/shaders.js"></script>
<script src="_modules/transitions.js"></script>
<script>
// Boot after external modules have had a chance to load
if(document.readyState==='complete'||document.readyState==='interactive')bootCinematic();
else window.addEventListener('DOMContentLoaded',bootCinematic);
// WebGL 리소스 정리: 모바일 저사양 기기 누수 방지 (pagehide=모바일 우선, beforeunload=데스크톱 fallback)
(function(){var disposed=false;function cleanup(){if(disposed)return;disposed=true;try{if(window.Kitchen3D&&window.Kitchen3D.dispose)window.Kitchen3D.dispose();}catch(e){}}
window.addEventListener('pagehide',cleanup);window.addEventListener('beforeunload',cleanup);})();
</script>
