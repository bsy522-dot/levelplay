<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>집짓기 v3 - 3D 하우스 빌더</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a14;color:#eee;font-family:-apple-system,'Segoe UI',sans-serif;overflow:hidden;height:100vh;user-select:none;touch-action:none}

#topBar{position:fixed;top:0;left:0;right:0;height:44px;background:linear-gradient(135deg,#1a1040,#251555);border-bottom:2px solid #5a3a9a;display:flex;align-items:center;padding:0 10px;gap:8px;z-index:100}
#topBar h1{font-size:15px;font-weight:700;color:#d0b0ff;flex-shrink:0}
.tb{display:flex;gap:4px;margin-left:auto;flex-shrink:0}
.tb button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#d0b0ff;padding:4px 10px;border-radius:10px;font-size:11px;cursor:pointer}
.tb button:hover,.tb button.act{background:rgba(140,80,255,.3)}
#budgetDisp{font-size:12px;color:#ffd700;font-weight:700;flex-shrink:0}
#floorDisp{font-size:11px;color:#aaa;flex-shrink:0}
#weatherIcon{font-size:16px;cursor:pointer;flex-shrink:0}

#cvs{position:fixed;top:44px;left:0;bottom:70px;right:0;display:block}

#panel{position:fixed;top:44px;right:0;width:260px;bottom:70px;background:rgba(10,8,24,.97);border-left:2px solid #4a2a7a;z-index:90;display:flex;flex-direction:column;overflow:hidden;transition:transform .3s}
#panel.hide{transform:translateX(100%)}
.ptabs{display:flex;border-bottom:1px solid #4a2a7a}
.ptab{flex:1;padding:8px 4px;text-align:center;font-size:11px;cursor:pointer;border-bottom:2px solid transparent;color:#888}
.ptab.act{color:#d0b0ff;border-bottom-color:#a070ff}
#pcontent{flex:1;overflow-y:auto;padding:8px;font-size:11px}
.sec{font-size:11px;font-weight:700;color:#a070ff;margin:10px 0 6px;display:flex;align-items:center;gap:4px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.item-btn{padding:6px 4px;background:rgba(255,255,255,.04);border:2px solid transparent;border-radius:8px;cursor:pointer;text-align:center;color:#ccc;transition:all .15s}
.item-btn:hover{background:rgba(140,80,255,.12)}
.item-btn.sel{border-color:#a070ff;background:rgba(140,80,255,.18)}
.item-btn .ic{font-size:20px;display:block}
.item-btn .nm{font-size:10px}
.item-btn .pr{font-size:9px;color:#fa0}
.color-row{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.csw{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.csw.sel{border-color:#fff;box-shadow:0 0 6px rgba(255,255,255,.3)}
.mat-btn{padding:3px 8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:8px;font-size:10px;cursor:pointer;color:#ccc}
.mat-btn.sel{background:#a070ff;color:#fff}

#btmBar{position:fixed;bottom:0;left:0;right:0;height:70px;background:rgba(10,8,24,.96);border-top:2px solid #4a2a7a;z-index:90;padding:4px}
#modeBtns{display:flex;gap:3px;margin-bottom:3px;overflow-x:auto;scrollbar-width:none}
#modeBtns::-webkit-scrollbar{display:none}
.mode-btn{flex-shrink:0;padding:3px 10px;background:rgba(255,255,255,.06);border:none;border-radius:8px;font-size:10px;color:#aaa;cursor:pointer}
.mode-btn.sel{background:rgba(140,80,255,.25);color:#d0b0ff}
#actRow{display:flex;align-items:center;gap:4px;font-size:10px}
#actRow button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#eee;padding:3px 8px;border-radius:8px;font-size:10px;cursor:pointer}
#actRow .sp{flex:1}
#statusTxt{color:#888;font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

#tutModal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:none;align-items:center;justify-content:center}
#tutBox{background:#1a1a2e;border:2px solid #5a3a9a;border-radius:12px;padding:16px;width:300px;max-height:80vh;overflow-y:auto;font-size:12px;line-height:1.6}
#tutBox h3{color:#d0b0ff;margin-bottom:8px}
#tutBox button{background:rgba(140,80,255,.3);border:1px solid #a070ff;color:#fff;padding:6px 16px;border-radius:8px;font-size:12px;cursor:pointer;margin-top:8px}

#galleryModal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:none;align-items:center;justify-content:center}
#galleryBox{background:#1a1a2e;border:2px solid #5a3a9a;border-radius:12px;padding:16px;width:320px;max-height:85vh;overflow-y:auto}
#galleryBox h3{color:#d0b0ff;margin-bottom:8px;font-size:14px}
.gal-item{padding:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:8px;margin-bottom:6px;cursor:pointer;font-size:11px}
.gal-item:hover{background:rgba(140,80,255,.1)}
.gal-item .gn{font-weight:700;color:#ffd700}
#galleryBox button{background:rgba(140,80,255,.3);border:1px solid #a070ff;color:#fff;padding:4px 12px;border-radius:8px;font-size:11px;cursor:pointer;margin:2px}

#bpOverlay{position:fixed;top:44px;left:0;right:0;bottom:70px;pointer-events:none;z-index:5}

@media(max-width:600px){#panel{width:220px}}
</style>
</head>
<body>
<div id="topBar">
<h1>🏠 집짓기 v3</h1>
<span id="floorDisp">1F</span>
<span id="budgetDisp">💰 500,000</span>
<span id="weatherIcon" title="날씨 변경">☀️</span>
<div class="tb">
<button id="btnPanel">☰</button>
<button id="btnBP" title="설계도 모드">📐</button>
<button id="btnTut">❓</button>
</div>
</div>

<canvas id="cvs"></canvas>
<canvas id="bpOverlay"></canvas>

<div id="panel">
<div class="ptabs">
<div class="ptab act" data-t="rooms">방</div>
<div class="ptab" data-t="furn">가구</div>
<div class="ptab" data-t="style">스타일</div>
<div class="ptab" data-t="ext">외부</div>
</div>
<div id="pcontent"></div>
</div>

<div id="btmBar">
<div id="modeBtns"></div>
<div id="actRow">
<button id="aUndo">↩취소</button>
<button id="aDel">🗑삭제</button>
<button id="aRot">🔄회전</button>
<button id="aFloorUp">▲층</button>
<button id="aFloorDn">▼층</button>
<span class="sp"></span>
<span id="statusTxt">방을 배치하세요</span>
<span class="sp"></span>
<button id="aSave">💾</button>
<button id="aGal">🖼</button>
</div>
</div>

<div id="tutModal"><div id="tutBox"></div></div>
<div id="galleryModal"><div id="galleryBox"></div></div>

<script>
// === DATA ===
const ROOMS=[
{id:'living',n:'거실',ic:'🛋️',c:'#b0a090',w:6,h:5,cost:30000},
{id:'bedroom',n:'침실',ic:'🛏️',c:'#9090b0',w:4,h:4,cost:25000},
{id:'kitchen',n:'주방',ic:'🍳',c:'#a0b090',w:4,h:3,cost:28000},
{id:'bathroom',n:'욕실',ic:'🚿',c:'#80b0c0',w:3,h:3,cost:35000},
{id:'garage',n:'차고',ic:'🚗',c:'#808080',w:5,h:4,cost:20000},
{id:'garden',n:'정원',ic:'🌿',c:'#5a8a5a',w:5,h:5,cost:15000},
{id:'balcony',n:'발코니',ic:'🌅',c:'#a0906a',w:4,h:2,cost:18000},
{id:'rooftop',n:'옥상',ic:'🌆',c:'#7a7a8a',w:6,h:6,cost:22000},
];

const FURN=[
{id:'bed',n:'침대',ic:'🛏️',c:'#ccaaaa',w:2,h:1.4,cost:5000,room:['bedroom']},
{id:'sofa',n:'소파',ic:'🛋️',c:'#8888cc',w:2.2,h:1,cost:4000,room:['living']},
{id:'table',n:'식탁',ic:'🪵',c:'#bb8844',w:1.5,h:1,cost:3000,room:['kitchen','living']},
{id:'tv',n:'TV',ic:'📺',c:'#333',w:1.5,h:0.3,cost:6000,room:['living','bedroom']},
{id:'fridge',n:'냉장고',ic:'🧊',c:'#ccc',w:0.8,h:0.8,cost:4000,room:['kitchen']},
{id:'desk',n:'책상',ic:'🖥️',c:'#aa9966',w:1.4,h:0.7,cost:3500,room:['bedroom','living']},
{id:'chair',n:'의자',ic:'🪑',c:'#996633',w:0.5,h:0.5,cost:1000,room:['kitchen','bedroom','living']},
{id:'wardrobe',n:'옷장',ic:'👔',c:'#8b6b3d',w:1.5,h:0.5,cost:4500,room:['bedroom']},
{id:'bookshelf',n:'책장',ic:'📚',c:'#775533',w:1.2,h:0.4,cost:3000,room:['living','bedroom']},
{id:'bathtub',n:'욕조',ic:'🛁',c:'#dde',w:1.5,h:0.8,cost:8000,room:['bathroom']},
{id:'washer',n:'세탁기',ic:'🫧',c:'#eee',w:0.7,h:0.7,cost:3500,room:['bathroom']},
{id:'plant',n:'화분',ic:'🪴',c:'#5a8a5a',w:0.4,h:0.4,cost:500,room:['living','bedroom','kitchen','bathroom','balcony']},
{id:'lamp',n:'조명',ic:'💡',c:'#ffd700',w:0.3,h:0.3,cost:800,room:['living','bedroom','kitchen']},
{id:'rug',n:'러그',ic:'🟫',c:'#b08060',w:2,h:1.5,cost:2000,room:['living','bedroom']},
];

const MATERIALS=['나무','벽돌','돌','콘크리트','유리','철골','대리석'];
const MAT_COLORS=['#b08050','#a0604a','#888','#a0a0a0','#c0d8e8','#707080','#e0ddd0'];
const MAT_COSTS=[1.0,1.2,1.3,1.1,1.5,1.8,2.5];

const WALL_COLORS=[
{n:'화이트',h:'#f5f0e8'},{n:'크림',h:'#f0e8d0'},{n:'민트',h:'#c0e8d8'},{n:'라벤더',h:'#d8c8e8'},
{n:'스카이',h:'#c0d8f0'},{n:'피치',h:'#f0d0c0'},{n:'그레이',h:'#d0d0d0'},{n:'우드',h:'#c8a878'},
{n:'네이비',h:'#4a5a7a'},{n:'올리브',h:'#7a8a5a'}
];

const FLOOR_TYPES=[
{id:'wood',n:'원목',c:'#b08050'},{id:'marble',n:'대리석',c:'#e0ddd0'},{id:'tile',n:'타일',c:'#c8c8c8'},
{id:'carpet',n:'카펫',c:'#9090a0'},{id:'stone',n:'돌',c:'#888'}
];

const WINDOW_STYLES=['없음','작은창','큰창','아치창','원형창'];
const EXTERIOR=[
{id:'fence',n:'울타리',ic:'🏗️',cost:5000},
{id:'pool',n:'수영장',ic:'🏊',cost:30000},
{id:'tree',n:'나무',ic:'🌲',cost:2000},
{id:'driveway',n:'진입로',ic:'🛤️',cost:8000},
{id:'flower',n:'꽃밭',ic:'🌸',cost:3000},
];

const WEATHERS=['☀️','🌧️','❄️','🌤️'];
const W_NAMES=['맑음','비','눈','구름'];

// === STATE ===
let budget=500000;
let currentFloor=1; // -1=basement, 1-3=floors, 4=rooftop
let rooms={}; // floor -> [{id,type,x,z,w,h,wallColor,floorType,windowStyle,material,furniture:[]}]
for(let f=-1;f<=4;f++)rooms[f]=[];
let exteriors=[]; // [{type,x,z}]
let selRoom=null,selFurn=null,selRoomType='living',selFurnType='bed';
let curWallColor=WALL_COLORS[0],curFloorType=FLOOR_TYPES[0],curMaterial=0,curWindowStyle=1;
let curTab='rooms',mode='place'; // place, move, blueprint
let weather=0,blueprintMode=false;
let nextId=1,undoStack=[];
let panelVisible=true;

// ISO
const TW=40,TH=20,WALL_H_PX=50;
let camX=0,camY=0,zoom=1;
let dragging=false,dsx=0,dsy=0,csx=0,csy=0;

const cvs=document.getElementById('cvs');
const ctx=cvs.getContext('2d');
const bpCvs=document.getElementById('bpOverlay');
const bpCtx=bpCvs.getContext('2d');

function resize(){
  cvs.width=window.innerWidth;cvs.height=window.innerHeight-44-70;
  bpCvs.width=cvs.width;bpCvs.height=cvs.height;
  if(nextId<=1){camX=cvs.width/2;camY=cvs.height*0.3;}
}
resize();window.addEventListener('resize',resize);

function iso(gx,gy){return{x:(gx-gy)*(TW/2)*zoom+camX,y:(gx+gy)*(TH/2)*zoom+camY};}
function fromIso(sx,sy){const cx=(sx-camX)/zoom,cy=(sy-camY)/zoom;return{x:(cx/(TW/2)+cy/(TH/2))/2,y:(cy/(TH/2)-cx/(TW/2))/2};}

// === DRAW ===
function hexRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function lighter(h,p){let[r,g,b]=hexRgb(h);return`rgb(${Math.min(255,r+p)},${Math.min(255,g+p)},${Math.min(255,b+p)})`;}
function darker(h,p){let[r,g,b]=hexRgb(h);return`rgb(${Math.max(0,r-p)},${Math.max(0,g-p)},${Math.max(0,b-p)})`;}

function draw(){
  ctx.clearRect(0,0,cvs.width,cvs.height);

  // Weather background effects
  if(weather===1)drawRain();
  if(weather===2)drawSnow();

  const hw=(TW/2)*zoom,hh=(TH/2)*zoom;

  // Ground grid 20x20
  for(let y=0;y<20;y++)for(let x=0;x<20;x++){
    const{x:sx,y:sy}=iso(x,y);
    if(sx<-hw*2||sx>cvs.width+hw*2||sy<-50||sy>cvs.height+50)continue;
    ctx.beginPath();ctx.moveTo(sx,sy-hh);ctx.lineTo(sx+hw,sy);ctx.lineTo(sx,sy+hh);ctx.lineTo(sx-hw,sy);ctx.closePath();
    ctx.fillStyle='#2a3a2a';ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=0.5;ctx.stroke();
  }

  // Draw exterior items
  exteriors.forEach(ext=>{
    const ed=EXTERIOR.find(e=>e.id===ext.type);
    if(!ed)return;
    const{x:sx,y:sy}=iso(ext.x,ext.z);
    ctx.font=`${Math.max(14,20*zoom)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(ed.ic,sx,sy);
  });

  // Draw rooms for current floor (and below floors as ghost)
  const floorsToDraw=currentFloor===-1?[-1]:currentFloor===4?[1,2,3,4]:[1,Math.min(currentFloor,3)];
  // Draw lower floors as ghost
  for(let f=-1;f<currentFloor;f++){
    if(!rooms[f])continue;
    rooms[f].forEach(r=>drawRoom(r,0.2,f));
  }
  // Draw current floor
  const curRooms=rooms[currentFloor]||[];
  curRooms.forEach(r=>drawRoom(r,1.0,currentFloor));

  // Blueprint overlay
  if(blueprintMode){
    bpCtx.clearRect(0,0,bpCvs.width,bpCvs.height);
    curRooms.forEach(r=>{
      const{x:sx1,y:sy1}=iso(r.x,r.z);
      const{x:sx2,y:sy2}=iso(r.x+r.w,r.z);
      const{x:sx3,y:sy3}=iso(r.x+r.w,r.z+r.h);
      const{x:sx4,y:sy4}=iso(r.x,r.z+r.h);
      bpCtx.beginPath();bpCtx.moveTo(sx1,sy1);bpCtx.lineTo(sx2,sy2);bpCtx.lineTo(sx3,sy3);bpCtx.lineTo(sx4,sy4);bpCtx.closePath();
      bpCtx.strokeStyle='rgba(0,200,255,0.6)';bpCtx.lineWidth=2;bpCtx.setLineDash([6,4]);bpCtx.stroke();bpCtx.setLineDash([]);
      // Dimensions
      bpCtx.fillStyle='rgba(0,200,255,0.8)';bpCtx.font='11px sans-serif';bpCtx.textAlign='center';
      bpCtx.fillText(`${r.w}x${r.h}m`,(sx1+sx3)/2,(sy1+sy3)/2-5);
    });
  }else{
    bpCtx.clearRect(0,0,bpCvs.width,bpCvs.height);
  }

  requestAnimationFrame(draw);
}

function drawRoom(room,alpha,floor){
  const rt=ROOMS.find(r=>r.id===room.type);
  if(!rt)return;
  const hw=(TW/2)*zoom,hh=(TH/2)*zoom;
  const isSel=selRoom&&selRoom.id===room.id;
  const wc=room.wallColor||'#f5f0e8';
  const fc=room.floorColor||rt.c;
  const wallH=WALL_H_PX*zoom;
  const floorOffset=(floor>0?(floor-1)*wallH*0.3:floor===-1?wallH*0.2:0);

  ctx.globalAlpha=alpha;

  // Floor polygon
  const corners=[[room.x,room.z],[room.x+room.w,room.z],[room.x+room.w,room.z+room.h],[room.x,room.z+room.h]];
  const screenCorners=corners.map(c=>iso(c[0],c[1]));
  screenCorners.forEach(s=>s.y-=floorOffset);

  ctx.beginPath();ctx.moveTo(screenCorners[0].x,screenCorners[0].y);
  screenCorners.slice(1).forEach(s=>ctx.lineTo(s.x,s.y));ctx.closePath();
  ctx.fillStyle=fc;ctx.fill();
  ctx.strokeStyle=isSel?'#ffd700':'rgba(255,255,255,0.15)';ctx.lineWidth=isSel?2:1;ctx.stroke();

  // Walls (back and left)
  // Back wall (top edge)
  ctx.beginPath();
  ctx.moveTo(screenCorners[0].x,screenCorners[0].y);
  ctx.lineTo(screenCorners[0].x,screenCorners[0].y-wallH);
  ctx.lineTo(screenCorners[1].x,screenCorners[1].y-wallH);
  ctx.lineTo(screenCorners[1].x,screenCorners[1].y);
  ctx.closePath();
  ctx.fillStyle=wc;ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=1;ctx.stroke();

  // Window on back wall
  if(room.windowStyle&&room.windowStyle>0){
    const wcx=(screenCorners[0].x+screenCorners[1].x)/2;
    const wcy=(screenCorners[0].y+screenCorners[1].y)/2-wallH*0.5;
    const wsz=wallH*0.3;
    ctx.fillStyle='rgba(100,180,255,0.3)';
    if(room.windowStyle===1){ctx.fillRect(wcx-wsz*0.4,wcy-wsz*0.4,wsz*0.8,wsz*0.6);}
    else if(room.windowStyle===2){ctx.fillRect(wcx-wsz*0.6,wcy-wsz*0.4,wsz*1.2,wsz*0.6);}
    else if(room.windowStyle===3){ctx.beginPath();ctx.arc(wcx,wcy-wsz*0.1,wsz*0.4,Math.PI,0);ctx.lineTo(wcx+wsz*0.4,wcy+wsz*0.3);ctx.lineTo(wcx-wsz*0.4,wcy+wsz*0.3);ctx.closePath();ctx.fill();}
    else{ctx.beginPath();ctx.arc(wcx,wcy,wsz*0.3,0,Math.PI*2);ctx.fill();}
    ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.stroke();
  }

  // Left wall
  ctx.beginPath();
  ctx.moveTo(screenCorners[0].x,screenCorners[0].y);
  ctx.lineTo(screenCorners[0].x,screenCorners[0].y-wallH);
  ctx.lineTo(screenCorners[3].x,screenCorners[3].y-wallH);
  ctx.lineTo(screenCorners[3].x,screenCorners[3].y);
  ctx.closePath();
  ctx.fillStyle=darker(wc,15);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.stroke();

  // Room icon + name
  const cx=(screenCorners[0].x+screenCorners[2].x)/2;
  const cy=(screenCorners[0].y+screenCorners[2].y)/2;
  ctx.font=`${Math.max(12,16*zoom)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(rt.ic,cx,cy-8*zoom);
  ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font=`${Math.max(8,10*zoom)}px sans-serif`;
  ctx.fillText(rt.n,cx,cy+6*zoom);

  // Furniture
  (room.furniture||[]).forEach(f=>{
    const ft=FURN.find(fi=>fi.id===f.type);
    if(!ft)return;
    const fp=iso(room.x+f.rx,room.z+f.rz);
    fp.y-=floorOffset;
    const isFSel=selFurn&&selFurn.id===f.id;
    // small box
    const fw=f.w*hw*0.8,fh=f.h*hh*0.8;
    ctx.fillStyle=isFSel?'rgba(255,215,0,0.3)':ft.c;
    ctx.fillRect(fp.x-fw/2,fp.y-fh/2,fw,fh);
    if(isFSel){ctx.strokeStyle='#ffd700';ctx.lineWidth=2;ctx.strokeRect(fp.x-fw/2,fp.y-fh/2,fw,fh);}
    ctx.font=`${Math.max(10,14*zoom)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(ft.ic,fp.x,fp.y);
  });

  // Selection highlight
  if(isSel){
    ctx.beginPath();ctx.moveTo(screenCorners[0].x,screenCorners[0].y);
    screenCorners.slice(1).forEach(s=>ctx.lineTo(s.x,s.y));ctx.closePath();
    ctx.strokeStyle='#ffd700';ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.stroke();ctx.setLineDash([]);
  }

  ctx.globalAlpha=1;
}

// Weather particles
let rainDrops=[],snowFlakes=[];
for(let i=0;i<80;i++){rainDrops.push({x:Math.random()*2000,y:Math.random()*1000,s:2+Math.random()*4});}
for(let i=0;i<60;i++){snowFlakes.push({x:Math.random()*2000,y:Math.random()*1000,s:1+Math.random()*2,d:Math.random()*Math.PI*2});}

function drawRain(){
  ctx.strokeStyle='rgba(100,150,255,0.3)';ctx.lineWidth=1;
  rainDrops.forEach(d=>{
    d.y+=d.s*3;d.x+=d.s*0.5;
    if(d.y>cvs.height){d.y=0;d.x=Math.random()*cvs.width;}
    ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x+2,d.y+8);ctx.stroke();
  });
}
function drawSnow(){
  ctx.fillStyle='rgba(255,255,255,0.5)';
  snowFlakes.forEach(f=>{
    f.y+=f.s*0.5;f.x+=Math.sin(f.d)*0.5;f.d+=0.02;
    if(f.y>cvs.height){f.y=0;f.x=Math.random()*cvs.width;}
    ctx.beginPath();ctx.arc(f.x,f.y,f.s,0,Math.PI*2);ctx.fill();
  });
}

// === INPUT ===
cvs.addEventListener('mousedown',e=>{dsx=e.clientX;dsy=e.clientY;csx=camX;csy=camY;dragging=true;});
cvs.addEventListener('mousemove',e=>{if(dragging){camX=csx+(e.clientX-dsx);camY=csy+(e.clientY-dsy);}});
cvs.addEventListener('mouseup',e=>{
  const dx=Math.abs(e.clientX-dsx),dy=Math.abs(e.clientY-dsy);dragging=false;
  if(dx<5&&dy<5){const r=cvs.getBoundingClientRect();handleClick(e.clientX-r.left,e.clientY-r.top);}
});
cvs.addEventListener('wheel',e=>{
  e.preventDefault();const oz=zoom;zoom*=e.deltaY<0?1.1:0.9;zoom=Math.max(0.3,Math.min(3,zoom));
  const r=cvs.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  camX=mx-(mx-camX)*(zoom/oz);camY=my-(my-camY)*(zoom/oz);
},{passive:false});

let tDist=0,tZoom=1;
cvs.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(e.touches.length===1){dragging=true;dsx=e.touches[0].clientX;dsy=e.touches[0].clientY;csx=camX;csy=camY;}
  else if(e.touches.length===2){tDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);tZoom=zoom;}
},{passive:false});
cvs.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1&&dragging){camX=csx+(e.touches[0].clientX-dsx);camY=csy+(e.touches[0].clientY-dsy);}
  else if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);zoom=Math.max(0.3,Math.min(3,tZoom*(d/tDist)));}
},{passive:false});
cvs.addEventListener('touchend',e=>{
  if(e.changedTouches.length===1&&!e.touches.length){
    const dx=Math.abs(e.changedTouches[0].clientX-dsx),dy=Math.abs(e.changedTouches[0].clientY-dsy);
    dragging=false;
    if(dx<12&&dy<12){const r=cvs.getBoundingClientRect();handleClick(e.changedTouches[0].clientX-r.left,e.changedTouches[0].clientY-r.top);}
  }
});
cvs.addEventListener('contextmenu',e=>e.preventDefault());

function handleClick(sx,sy){
  const g=fromIso(sx,sy);
  const gx=g.x,gy=g.y;

  // Check if clicked on existing room
  const curRooms=rooms[currentFloor]||[];
  for(let i=curRooms.length-1;i>=0;i--){
    const r=curRooms[i];
    if(gx>=r.x&&gx<=r.x+r.w&&gy>=r.z&&gy<=r.z+r.h){
      selRoom=r;selFurn=null;
      status(`${ROOMS.find(rt=>rt.id===r.type).n} 선택됨`);
      updatePanel();return;
    }
  }

  // Place new room
  if(curTab==='rooms'&&mode==='place'){
    placeRoom(Math.round(gx),Math.round(gy));
  }else if(curTab==='ext'){
    placeExterior(Math.round(gx),Math.round(gy));
  }
}

// === ACTIONS ===
function saveUndo(){undoStack.push(JSON.stringify({rooms,exteriors,budget}));if(undoStack.length>30)undoStack.shift();}

function placeRoom(x,z){
  const rt=ROOMS.find(r=>r.id===selRoomType);if(!rt)return;
  const cost=Math.round(rt.cost*MAT_COSTS[curMaterial]);
  if(budget<cost){status('💰 예산 부족!');return;}
  saveUndo();budget-=cost;
  const room={id:nextId++,type:rt.id,x:x-Math.floor(rt.w/2),z:z-Math.floor(rt.h/2),w:rt.w,h:rt.h,
    wallColor:curWallColor.h,floorColor:curFloorType.c,floorType:curFloorType.id,
    material:curMaterial,windowStyle:curWindowStyle,furniture:[]};
  rooms[currentFloor].push(room);
  selRoom=room;selFurn=null;
  status(`${rt.n} 배치 완료 (-${cost.toLocaleString()})`);
  updBudget();updatePanel();
}

function addFurniture(furnId){
  if(!selRoom)return;
  const ft=FURN.find(f=>f.id===furnId);if(!ft)return;
  if(budget<ft.cost){status('💰 예산 부족!');return;}
  saveUndo();budget-=ft.cost;
  selRoom.furniture.push({id:nextId++,type:ft.id,rx:selRoom.w/2,rz:selRoom.h/2,w:ft.w,h:ft.h,rot:0});
  status(`${ft.n} 배치 (-${ft.cost.toLocaleString()})`);
  updBudget();updatePanel();
}

function placeExterior(x,z){
  const sel=document.querySelector('.ext-btn.sel');
  if(!sel)return;
  const type=sel.dataset.type;
  const ed=EXTERIOR.find(e=>e.id===type);if(!ed)return;
  if(budget<ed.cost){status('💰 예산 부족!');return;}
  saveUndo();budget-=ed.cost;
  exteriors.push({type,x,z});
  status(`${ed.n} 배치 (-${ed.cost.toLocaleString()})`);updBudget();
}

function deleteSelected(){
  if(selFurn&&selRoom){
    saveUndo();
    const ft=FURN.find(f=>f.id===selFurn.type);
    budget+=Math.round((ft?ft.cost:0)*0.5);
    selRoom.furniture=selRoom.furniture.filter(f=>f.id!==selFurn.id);
    selFurn=null;status('가구 삭제 (50% 환불)');
  }else if(selRoom){
    saveUndo();
    const rt=ROOMS.find(r=>r.id===selRoom.type);
    budget+=Math.round((rt?rt.cost:0)*0.5);
    rooms[currentFloor]=rooms[currentFloor].filter(r=>r.id!==selRoom.id);
    selRoom=null;status('방 삭제 (50% 환불)');
  }
  updBudget();updatePanel();
}

function rotateSelected(){
  if(selFurn){saveUndo();const t=selFurn.w;selFurn.w=selFurn.h;selFurn.h=t;selFurn.rot=(selFurn.rot+90)%360;}
}

document.getElementById('aUndo').onclick=()=>{
  if(!undoStack.length)return;
  const d=JSON.parse(undoStack.pop());rooms=d.rooms;exteriors=d.exteriors;budget=d.budget;
  selRoom=null;selFurn=null;updBudget();updatePanel();
};
document.getElementById('aDel').onclick=deleteSelected;
document.getElementById('aRot').onclick=rotateSelected;
document.getElementById('aFloorUp').onclick=()=>{if(currentFloor<4){currentFloor++;updFloor();}};
document.getElementById('aFloorDn').onclick=()=>{if(currentFloor>-1){currentFloor--;updFloor();}};

function updFloor(){
  const labels={'-1':'B1','1':'1F','2':'2F','3':'3F','4':'옥상'};
  document.getElementById('floorDisp').textContent=labels[currentFloor]||currentFloor+'F';
  selRoom=null;selFurn=null;updatePanel();
}
function updBudget(){document.getElementById('budgetDisp').textContent='💰 '+budget.toLocaleString();}
function status(t){document.getElementById('statusTxt').textContent=t;}

// === WEATHER ===
document.getElementById('weatherIcon').onclick=()=>{weather=(weather+1)%4;document.getElementById('weatherIcon').textContent=WEATHERS[weather];};

// === PANEL ===
document.getElementById('btnPanel').onclick=()=>{panelVisible=!panelVisible;document.getElementById('panel').classList.toggle('hide');};
document.getElementById('btnBP').onclick=()=>{blueprintMode=!blueprintMode;document.getElementById('btnBP').classList.toggle('act');};

document.querySelectorAll('.ptab').forEach(t=>t.onclick=()=>{
  curTab=t.dataset.t;
  document.querySelectorAll('.ptab').forEach(x=>x.classList.remove('act'));t.classList.add('act');
  updatePanel();
});

function updatePanel(){
  const pc=document.getElementById('pcontent');
  if(curTab==='rooms'){
    let h='<div class="sec">🏠 방 종류</div><div class="grid2">';
    ROOMS.forEach(r=>{
      const cost=Math.round(r.cost*MAT_COSTS[curMaterial]);
      h+=`<div class="item-btn ${r.id===selRoomType?'sel':''}" onclick="pickRoom('${r.id}')"><span class="ic">${r.ic}</span><span class="nm">${r.n} ${r.w}x${r.h}</span><span class="pr">$${cost.toLocaleString()}</span></div>`;
    });
    h+='</div>';
    if(selRoom){
      const rt=ROOMS.find(r=>r.id===selRoom.type);
      h+=`<div class="sec">선택: ${rt.ic} ${rt.n}</div>`;
      h+=`<div style="font-size:10px;color:#888;margin-bottom:4px">위치(${selRoom.x},${selRoom.z}) 크기${selRoom.w}x${selRoom.h}m 가구${selRoom.furniture.length}개</div>`;
    }
    pc.innerHTML=h;
  }else if(curTab==='furn'){
    let h='';
    if(!selRoom){h='<p style="padding:16px;text-align:center;color:#888">방을 먼저 선택하세요</p>';}
    else{
      const rt=ROOMS.find(r=>r.id===selRoom.type);
      h+=`<div class="sec">가구 - ${rt.ic} ${rt.n}</div><div class="grid2">`;
      FURN.forEach(f=>{
        const ok=f.room.includes(selRoom.type);
        h+=`<div class="item-btn ${!ok?'" style="opacity:.3':'sel-no'}" ${ok?`onclick="pickFurn('${f.id}')"`:''}><span class="ic">${f.ic}</span><span class="nm">${f.n}</span><span class="pr">$${f.cost.toLocaleString()}</span></div>`;
      });
      h+='</div>';
      if(selRoom.furniture.length){
        h+='<div class="sec">배치된 가구</div>';
        selRoom.furniture.forEach(f=>{
          const ft=FURN.find(fi=>fi.id===f.type);
          const isSel=selFurn&&selFurn.id===f.id;
          h+=`<div style="padding:4px 6px;background:${isSel?'rgba(255,215,0,.12)':'rgba(255,255,255,.03)'};border-radius:6px;margin:2px 0;cursor:pointer;display:flex;align-items:center;gap:6px" onclick="pickFurnItem(${f.id})"><span style="font-size:16px">${ft.ic}</span>${ft.n}<span style="margin-left:auto;font-size:9px;color:#888">${f.w}x${f.h}</span></div>`;
        });
      }
    }
    pc.innerHTML=h;
  }else if(curTab==='style'){
    let h='<div class="sec">🧱 건축 자재</div><div class="grid3">';
    MATERIALS.forEach((m,i)=>{h+=`<div class="mat-btn ${i===curMaterial?'sel':''}" onclick="pickMat(${i})" style="background:${i===curMaterial?MAT_COLORS[i]:''}"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${MAT_COLORS[i]};vertical-align:middle;margin-right:3px"></span>${m} x${MAT_COSTS[i]}</div>`;});
    h+='</div>';
    h+='<div class="sec">🎨 벽 색상</div><div class="color-row">';
    WALL_COLORS.forEach((c,i)=>{h+=`<div class="csw ${c.h===curWallColor.h?'sel':''}" style="background:${c.h}" onclick="pickWC(${i})" title="${c.n}"></div>`;});
    h+='</div>';
    h+='<div class="sec">🪵 바닥</div><div class="grid3">';
    FLOOR_TYPES.forEach((f,i)=>{h+=`<div class="mat-btn ${f.id===curFloorType.id?'sel':''}" onclick="pickFT(${i})"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${f.c};vertical-align:middle;margin-right:3px"></span>${f.n}</div>`;});
    h+='</div>';
    h+='<div class="sec">🪟 창문</div><div class="grid3">';
    WINDOW_STYLES.forEach((w,i)=>{h+=`<div class="mat-btn ${i===curWindowStyle?'sel':''}" onclick="pickWin(${i})">${w}</div>`;});
    h+='</div>';
    if(selRoom){
      h+=`<div style="margin-top:8px"><button onclick="applyStyle()" style="width:100%;padding:8px;background:rgba(140,80,255,.3);border:1px solid #a070ff;color:#fff;border-radius:8px;font-size:12px;cursor:pointer">선택 방에 적용</button></div>`;
    }
    pc.innerHTML=h;
  }else if(curTab==='ext'){
    let h='<div class="sec">🌳 외부 요소</div><div class="grid2">';
    EXTERIOR.forEach(e=>{h+=`<div class="item-btn ext-btn" data-type="${e.id}" onclick="pickExt(this)"><span class="ic">${e.ic}</span><span class="nm">${e.n}</span><span class="pr">$${e.cost.toLocaleString()}</span></div>`;});
    h+='</div>';
    h+=`<div style="margin-top:8px;font-size:10px;color:#888">외부 요소를 선택하고 맵을 클릭하세요</div>`;
    pc.innerHTML=h;
  }
}

window.pickRoom=(id)=>{selRoomType=id;updatePanel();};
window.pickFurn=(id)=>{if(selRoom)addFurniture(id);};
window.pickFurnItem=(fid)=>{if(selRoom){selFurn=selRoom.furniture.find(f=>f.id===fid);updatePanel();}};
window.pickMat=(i)=>{curMaterial=i;updatePanel();};
window.pickWC=(i)=>{curWallColor=WALL_COLORS[i];updatePanel();};
window.pickFT=(i)=>{curFloorType=FLOOR_TYPES[i];updatePanel();};
window.pickWin=(i)=>{curWindowStyle=i;updatePanel();};
window.pickExt=(el)=>{document.querySelectorAll('.ext-btn').forEach(e=>e.classList.remove('sel'));el.classList.add('sel');};
window.applyStyle=()=>{
  if(!selRoom)return;saveUndo();
  selRoom.wallColor=curWallColor.h;selRoom.floorColor=curFloorType.c;selRoom.floorType=curFloorType.id;
  selRoom.material=curMaterial;selRoom.windowStyle=curWindowStyle;
  status('스타일 적용 완료');
};

// === SAVE/GALLERY ===
document.getElementById('aSave').onclick=()=>{
  const name=prompt('저장 이름:','내 집 '+new Date().toLocaleDateString());
  if(!name)return;
  const saves=JSON.parse(localStorage.getItem('hb_v3_saves')||'[]');
  saves.push({name,date:new Date().toISOString(),data:{rooms,exteriors,budget,nextId}});
  if(saves.length>10)saves.shift();
  localStorage.setItem('hb_v3_saves',JSON.stringify(saves));
  status('💾 저장 완료!');
};

document.getElementById('aGal').onclick=()=>{
  const m=document.getElementById('galleryModal');m.style.display='flex';
  const box=document.getElementById('galleryBox');
  const saves=JSON.parse(localStorage.getItem('hb_v3_saves')||'[]');
  let h='<h3>🖼 갤러리 / 저장목록</h3>';
  if(!saves.length)h+='<p style="color:#888;font-size:12px;padding:12px">저장된 설계가 없습니다</p>';
  saves.forEach((s,i)=>{
    const totalRooms=Object.values(s.data.rooms).flat().length;
    h+=`<div class="gal-item" onclick="loadDesign(${i})"><span class="gn">${s.name}</span><br><span style="color:#888;font-size:10px">${new Date(s.date).toLocaleDateString()} | 방 ${totalRooms}개</span></div>`;
  });
  h+=`<br><button onclick="document.getElementById('galleryModal').style.display='none'">닫기</button>`;
  if(saves.length)h+=` <button onclick="clearGallery()" style="color:#f44">전체 삭제</button>`;
  box.innerHTML=h;
};

window.loadDesign=(i)=>{
  const saves=JSON.parse(localStorage.getItem('hb_v3_saves')||'[]');
  if(!saves[i])return;
  const d=saves[i].data;
  rooms=d.rooms;exteriors=d.exteriors||[];budget=d.budget;nextId=d.nextId||1;
  selRoom=null;selFurn=null;currentFloor=1;updFloor();updBudget();updatePanel();
  document.getElementById('galleryModal').style.display='none';
  status('📂 불러오기 완료!');
};
window.clearGallery=()=>{if(confirm('전체 삭제?')){localStorage.removeItem('hb_v3_saves');document.getElementById('aGal').click();}};

document.getElementById('galleryModal').onclick=e=>{if(e.target.id==='galleryModal')e.target.style.display='none';};

// === TUTORIAL ===
document.getElementById('btnTut').onclick=()=>{
  const m=document.getElementById('tutModal');m.style.display='flex';
  document.getElementById('tutBox').innerHTML=`<h3>🏠 집짓기 v3 튜토리얼</h3>
<p><b>1단계: 방 배치</b><br>좌측 패널에서 방 종류를 선택하고, 맵을 클릭하여 배치합니다.</p>
<p><b>2단계: 가구 배치</b><br>배치된 방을 클릭하여 선택한 후, '가구' 탭에서 가구를 추가합니다.</p>
<p><b>3단계: 스타일 적용</b><br>'스타일' 탭에서 벽 색상, 바닥 재질, 창문을 선택하고 '적용' 버튼을 누릅니다.</p>
<p><b>4단계: 층 이동</b><br>하단의 ▲층/▼층 버튼으로 지하~3층+옥상을 오갑니다.</p>
<p><b>5단계: 외부</b><br>'외부' 탭에서 울타리, 수영장, 나무 등을 배치합니다.</p>

<button onclick="document.getElementById('tutModal').style.display='none'">확인</button>`;
};
document.getElementById('tutModal').onclick=e=>{if(e.target.id==='tutModal')e.target.style.display='none';};

// Show tutorial on first visit
if(!localStorage.getItem('hb_v3_tut')){
  setTimeout(()=>{document.getElementById('btnTut').click();localStorage.setItem('hb_v3_tut','1');},500);
}

// === INIT ===
updBudget();updFloor();updatePanel();draw();
</script>
