<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>우주 탐험가 - Space Explorer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#e0e8ff;font-family:'Segoe UI',sans-serif;overflow:hidden;touch-action:none;user-select:none}
canvas{display:block}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
#ui>*{pointer-events:auto}
.panel{background:rgba(10,15,40,0.92);border:1px solid rgba(100,140,255,0.3);border-radius:12px;padding:16px;backdrop-filter:blur(6px)}
#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;padding:8px 16px;font-size:14px}
#hud .fuel-bar{width:120px;height:14px;background:#1a1a3a;border-radius:7px;overflow:hidden;border:1px solid #334}
#hud .fuel-fill{height:100%;background:linear-gradient(90deg,#f80,#ff0);border-radius:7px;transition:width 0.3s}
#hud .badge-count{color:#ffd700}
.btn{background:linear-gradient(135deg,#1a3a6a,#0d2040);border:1px solid rgba(100,160,255,0.4);color:#8cf;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px;transition:all 0.2s}
.btn:hover,.btn:active{background:linear-gradient(135deg,#2a5a9a,#1a3a6a);color:#fff;border-color:#6af}
.btn-gold{background:linear-gradient(135deg,#5a4a10,#3a3000);border-color:rgba(255,215,0,0.5);color:#ffd700}
#planet-info{position:absolute;bottom:0;left:0;right:0;max-height:60vh;overflow-y:auto;display:none;padding:20px;border-radius:16px 16px 0 0}
#planet-info h2{color:#ffd700;margin-bottom:8px;font-size:20px}
#planet-info .facts{color:#b0c8ff;line-height:1.7;margin:10px 0}
#quiz-panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(90vw,420px);display:none;padding:24px}
#quiz-panel h3{color:#ffd700;margin-bottom:12px}
#quiz-panel .q-option{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 14px;background:rgba(30,50,100,0.6);border:1px solid #335;border-radius:8px;color:#aac;cursor:pointer;font-size:14px}
#quiz-panel .q-option:hover{background:rgba(50,80,150,0.6);color:#fff}
#quiz-panel .q-option.correct{background:rgba(0,150,50,0.4);border-color:#0a0;color:#0f0}
#quiz-panel .q-option.wrong{background:rgba(150,0,0,0.4);border-color:#a00;color:#f66}
#builder{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(95vw,500px);display:none;padding:20px}
#builder h3{color:#ffd700;margin-bottom:12px}
.part-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.part-item{text-align:center;padding:10px;background:rgba(20,30,60,0.8);border:1px solid #335;border-radius:8px;cursor:pointer;font-size:12px}
.part-item.selected{border-color:#ffd700;background:rgba(60,60,20,0.6)}
.part-item .icon{font-size:28px;display:block;margin-bottom:4px}
#rocket-preview{text-align:center;margin:12px 0;min-height:80px}
#album{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(95vw,520px);max-height:80vh;overflow-y:auto;display:none;padding:20px}
#album h3{color:#ffd700;margin-bottom:12px}
.album-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.album-item{text-align:center;padding:12px 6px;background:rgba(20,30,60,0.7);border-radius:10px;border:1px solid #223}
.album-item.collected{border-color:#ffd700;background:rgba(40,40,10,0.5)}
.album-item .planet-icon{font-size:32px;display:block;margin-bottom:4px}
.album-item .sample-count{font-size:11px;color:#889}
#upgrade-panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(95vw,460px);display:none;padding:20px}
.upgrade-item{display:flex;justify-content:space-between;align-items:center;padding:10px;margin:6px 0;background:rgba(20,30,60,0.7);border-radius:8px;border:1px solid #334}
.upgrade-item .cost{color:#ffd700;font-size:13px}
#explore-surface{position:absolute;top:0;left:0;width:100%;height:100%;display:none}
#nav-btns{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#menu-bar{position:absolute;top:50px;right:8px;display:flex;flex-direction:column;gap:6px}
.close-btn{position:absolute;top:10px;right:14px;background:none;border:none;color:#f66;font-size:22px;cursor:pointer}
#toast{position:absolute;top:80px;left:50%;transform:translateX(-50%);background:rgba(0,80,0,0.85);color:#0f0;padding:10px 20px;border-radius:8px;font-size:14px;display:none;z-index:99;border:1px solid #0a0}
#travel-anim{position:absolute;top:0;left:0;width:100%;height:100%;display:none;z-index:50}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
<div id="hud" class="panel">
 <div>🚀 <span id="hud-loc">태양계</span></div>
 <div>⛽ <div class="fuel-bar"><div class="fuel-fill" id="fuel-bar" style="width:100%"></div></div></div>
 <div>💎 <span id="hud-samples">0</span></div>
 <div class="badge-count">🏅 <span id="hud-badges">0</span></div>
</div>
<div id="menu-bar">
 <button class="btn" onclick="G.showBuilder()">🔧 로켓</button>
 <button class="btn" onclick="G.showAlbum()">📖 앨범</button>
 <button class="btn" onclick="G.showUpgrades()">⬆ 강화</button>
</div>
<div id="nav-btns"></div>
<div id="planet-info" class="panel"></div>
<div id="quiz-panel" class="panel"></div>
<div id="builder" class="panel"></div>
<div id="album" class="panel"></div>
<div id="upgrade-panel" class="panel"></div>
<div id="explore-surface"></div>
<div id="toast"></div>
<canvas id="travel-anim"></canvas>
</div>
<script>

// ===== DATA =====

 ],surface:'#aa3311',surfaceAlt:'#882200',samples:['붉은 토양','얼음 샘플','암석 코어']},

 facts:['태양계에서 가장 큰 행성입니다','대적점은 300년 넘게 지속된 거대한 폭풍입니다','79개 이상의 위성을 가지고 있습니다','가스 행성으로 단단한 표면이 없습니다'],
 quizzes:[
  {q:'목성의 대적점은 무엇인가요?',o:['화산','거대한 폭풍','바다','산'],a:1},

 facts:['아름다운 고리로 유명합니다 (얼음과 암석 조각)','밀도가 물보다 낮아 물에 뜰 수 있습니다','타이탄 위성에는 액체 메탄 호수가 있습니다','바람 속도가 시속 1,800km에 달합니다'],
 quizzes:[
  {q:'토성의 고리는 무엇으로 이루어져 있나요?',o:['가스','얼음과 암석','금속','먼지'],a:1},
  {q:'토성의 특이한 물리적 성질은?',o:['자기장이 없다','물에 뜬다','자전하지 않는다','빛을 낸다'],a:1},

 facts:['자전축이 98도 기울어져 옆으로 누워 자전합니다','메탄 대기 때문에 청록색입니다','27개의 위성을 가지고 있습니다','고리가 있지만 매우 어둡습니다'],
 quizzes:[
  {q:'천왕성이 옆으로 누운 이유로 추정되는 것은?',o:['태양 중력','거대한 충돌','자기장','위성 영향'],a:1},

const PARTS=[

const UPGRADES=[
 {id:'suit1',name:'우주복 Mk2',desc:'행성 탐사 시간 +50%',cost:100,type:'suit',level:1},
 {id:'suit2',name:'우주복 Mk3',desc:'극한 환경 내성',cost:250,type:'suit',level:2},
 {id:'tool1',name:'채집 도구 Mk2',desc:'샘플 채집 +1',cost:80,type:'tool',level:1},
 {id:'tool2',name:'채집 도구 Mk3',desc:'샘플 채집 +2',cost:200,type:'tool',level:2},
 {id:'rocket1',name:'추진 강화',desc:'연료 효율 20% 증가',cost:150,type:'rocket',level:1},

];

// ===== GAME STATE =====
let G={
 state:'map', // map, travel, explore, quiz
 fuel:100,maxFuel:100,
 samples:0,badges:0,
 currentPlanet:null,
 rocketParts:['capsule','fuel1','engine1'],
 collected:{},// planet-id: [sample indices]
 quizDone:{},// planet-id: true
 upgrades:{suit:0,tool:0,rocket:0},
 explorerX:0,explorerY:0,
 camX:0,
 stars:[],
 orbitalAngle:0,
 hoverPlanet:null,
 touchStart:null,
 mapScale:1,
 toastTimer:null,

 save(){
  const d={fuel:this.fuel,maxFuel:this.maxFuel,samples:this.samples,badges:this.badges,
   rocketParts:this.rocketParts,collected:this.collected,quizDone:this.quizDone,
   upgrades:this.upgrades};
  localStorage.setItem('space-explorer',JSON.stringify(d));
 },
 load(){
  try{
   const d=JSON.parse(localStorage.getItem('space-explorer'));
   if(d){Object.assign(this,d);this.recalcFuel();}
  }catch(e){}
 },
 recalcFuel(){
  let f=0;
  this.rocketParts.forEach(p=>{const pt=PARTS.find(x=>x.id===p);if(pt&&pt.fuel)f+=pt.fuel;});
  this.maxFuel=Math.max(f,30);
 },
 getFuelCost(planet){
  let base=planet.orbit/10;
  let eff=1;
  if(this.upgrades.rocket>=1)eff=0.8;
  if(this.upgrades.rocket>=2)eff=0.5;
  return Math.ceil(base*eff);
 },
 getCollectMax(){return 1+this.upgrades.tool;},
 toast(msg){
  const t=$('toast');t.textContent=msg;t.style.display='block';
  clearTimeout(this.toastTimer);
  this.toastTimer=setTimeout(()=>t.style.display='none',2500);
 },
 updateHUD(){
  $('hud-loc').textContent=this.currentPlanet?this.currentPlanet.name:'태양계';

// ===== AUDIO =====
let audioCtx,gainNode,isAudioInit=false;
function initAudio(){
 if(isAudioInit)return;
 try{
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  gainNode=audioCtx.createGain();gainNode.gain.value=0.08;gainNode.connect(audioCtx.destination);
  playAmbient();isAudioInit=true;
 }catch(e){}
}
function playAmbient(){
 if(!audioCtx)return;
 const now=audioCtx.currentTime;
 const notes=[65.41,82.41,98.00,130.81];
 notes.forEach((f,i)=>{
  const osc=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  osc.type='sine';osc.frequency.value=f;
  g.gain.setValueAtTime(0,now+i*4);
  g.gain.linearRampToValueAtTime(0.03,now+i*4+2);
  g.gain.linearRampToValueAtTime(0,now+i*4+6);
  osc.connect(g);g.connect(gainNode);
  osc.start(now+i*4);osc.stop(now+i*4+8);
 });
 setTimeout(playAmbient,16000);
}
function playSfx(freq,dur){
 if(!audioCtx)return;
 const o=audioCtx.createOscillator(),g=audioCtx.createGain();
 o.type='triangle';o.frequency.value=freq;
 g.gain.setValueAtTime(0.15,audioCtx.currentTime);
 g.gain.linearRampToValueAtTime(0,audioCtx.currentTime+dur);
 o.connect(g);g.connect(audioCtx.destination);
 o.start();o.stop(audioCtx.currentTime+dur);
}

// ===== RENDER MAP =====
function drawMap(){
 ctx.fillStyle='#06060f';ctx.fillRect(0,0,W,H);
 // stars
 const t=performance.now()/1000;
 G.stars.forEach(s=>{
  ctx.fillStyle=`rgba(255,255,255,${0.3+Math.sin(t*s.sp*100)*0.3*s.b})`;
  ctx.fillRect(s.x%W,s.y%H,s.s,s.s);
 });
 const cx=W/2,cy=H/2;
 const scale=Math.min(W,H)/800*G.mapScale;
 // orbits
 PLANETS.forEach(p=>{
  if(p.orbit>0){
   ctx.beginPath();ctx.arc(cx,cy,p.orbit*scale,0,Math.PI*2);
   ctx.strokeStyle='rgba(60,80,120,0.25)';ctx.lineWidth=1;ctx.stroke();
  }
 });
 // planets
 G.orbitalAngle+=0.001;
 PLANETS.forEach(p=>{
  const a=G.orbitalAngle*p.speed*50+PLANETS.indexOf(p)*0.8;
  const px=cx+Math.cos(a)*p.orbit*scale;
  const py=cy+Math.sin(a)*p.orbit*scale;
  p._x=px;p._y=py;
  // glow
  const grad=ctx.createRadialGradient(px,py,0,px,py,p.r*scale*2);
  grad.addColorStop(0,p.color+'44');grad.addColorStop(1,'transparent');
  ctx.fillStyle=grad;ctx.fillRect(px-p.r*scale*3,py-p.r*scale*3,p.r*scale*6,p.r*scale*6);
  // body
  ctx.beginPath();ctx.arc(px,py,p.r*scale,0,Math.PI*2);
  ctx.fillStyle=p.color;ctx.fill();
  // saturn ring
  if(p.id==='saturn'){
   ctx.beginPath();ctx.ellipse(px,py,p.r*scale*2,p.r*scale*0.5,0.3,0,Math.PI*2);
   ctx.strokeStyle='#eedd8866';ctx.lineWidth=3*scale;ctx.stroke();
  }
  // name
  ctx.fillStyle='#aabbdd';ctx.font=`${Math.max(10,12*scale)}px sans-serif`;ctx.textAlign='center';
  ctx.fillText(p.name,px,py+p.r*scale+14*scale);
  // badge indicator
  if(G.quizDone[p.id]){
   ctx.fillStyle='#ffd700';ctx.font=`${Math.max(8,10*scale)}px sans-serif`;
   ctx.fillText('🏅',px+p.r*scale,py-p.r*scale);
  }
  // hover highlight
  if(G.hoverPlanet===p){
   ctx.beginPath();ctx.arc(px,py,p.r*scale+4,0,Math.PI*2);
   ctx.strokeStyle='#ffffff88';ctx.lineWidth=2;ctx.stroke();
  }
 });
 // title
 ctx.fillStyle='#ffd700';ctx.font='bold 18px sans-serif';ctx.textAlign='center';
 ctx.fillText('우주 탐험가 🚀',cx,30);
 ctx.fillStyle='#6688aa';ctx.font='12px sans-serif';
 ctx.fillText('행성을 클릭하여 탐험하세요',cx,50);
}

// ===== SURFACE EXPLORATION =====
let surfaceCanvas,surfCtx;
function drawSurface(){
 if(!surfaceCanvas){
  surfaceCanvas=document.createElement('canvas');
  surfCtx=surfaceCanvas.getContext('2d');
 }
 surfaceCanvas.width=W;surfaceCanvas.height=H;
 const p=G.currentPlanet;if(!p)return;
 // sky
 const skyGrad=surfCtx.createLinearGradient(0,0,0,H*0.4);
 skyGrad.addColorStop(0,'#050510');skyGrad.addColorStop(1,p.surface+'33');
 surfCtx.fillStyle=skyGrad;surfCtx.fillRect(0,0,W,H*0.4);
 // stars in sky
 for(let i=0;i<80;i++){
  surfCtx.fillStyle=`rgba(255,255,255,${Math.random()*0.5+0.3})`;
  surfCtx.fillRect(Math.random()*W,Math.random()*H*0.35,Math.random()*2+1,1);
 }
 // ground (isometric-ish)
 const groundY=H*0.4;
 const gGrad=surfCtx.createLinearGradient(0,groundY,0,H);
 gGrad.addColorStop(0,p.surface);gGrad.addColorStop(1,p.surfaceAlt);
 surfCtx.fillStyle=gGrad;surfCtx.fillRect(0,groundY,W,H);
 // terrain features
 const seed=p.id.charCodeAt(0)*137;
 for(let i=0;i<20;i++){
  const tx=((seed+i*197)%1000)/1000*W*3-G.camX*0.3;
  const ty=groundY+30+((seed+i*73)%100)/100*(H*0.4);
  const ts=15+((seed+i*31)%40);
  // craters/rocks
  surfCtx.beginPath();surfCtx.ellipse(tx,ty,ts,ts*0.4,0,0,Math.PI*2);
  surfCtx.fillStyle=p.surfaceAlt+'88';surfCtx.fill();
 }
 // sample spots
 const collected=G.collected[p.id]||[];
 p.samples.forEach((s,i)=>{
  if(collected.includes(i))return;
  const sx=200+i*300-G.camX;
  const sy=groundY+80+i*50;
  if(sx<-30||sx>W+30)return;
  // glowing crystal
  const glow=surfCtx.createRadialGradient(sx,sy,0,sx,sy,25);
  glow.addColorStop(0,'#ffd70066');glow.addColorStop(1,'transparent');
  surfCtx.fillStyle=glow;surfCtx.fillRect(sx-30,sy-30,60,60);
  surfCtx.fillStyle='#ffd700';surfCtx.font='24px sans-serif';surfCtx.textAlign='center';
  surfCtx.fillText('💎',sx,sy);
  surfCtx.fillStyle='#aaa';surfCtx.font='10px sans-serif';
  surfCtx.fillText(s,sx,sy+20);
 });
 // astronaut
 const ax=W/2;
 const ay=groundY+60;
 surfCtx.fillStyle='#fff';surfCtx.font='32px sans-serif';surfCtx.textAlign='center';
 surfCtx.fillText('🧑‍🚀',ax,ay);
 // draw to main
 ctx.drawImage(surfaceCanvas,0,0);
 // planet info overlay
 ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,H-120,W,120);
 ctx.fillStyle='#ffd700';ctx.font='bold 16px sans-serif';ctx.textAlign='center';
 ctx.fillText(`${p.icon} ${p.name} 표면 탐사`,W/2,H-95);
 ctx.fillStyle='#8899bb';ctx.font='12px sans-serif';
 ctx.fillText('← → 이동 | 💎에 가까이 가서 채집 | 아래 버튼 사용',W/2,H-75);
}

// ===== TRAVEL ANIMATION =====
function playTravel(planet,cb){
 G.state='travel';
 const tc=$('travel-anim'),tctx=tc.getContext('2d');
 tc.style.display='block';
 let frame=0;const maxF=90;
 function anim(){
  tctx.fillStyle=`rgba(0,0,10,0.15)`;tctx.fillRect(0,0,W,H);
  // streaking stars
  for(let i=0;i<8;i++){
   const x=Math.random()*W,y=Math.random()*H;
   const len=10+frame*0.8;
   tctx.strokeStyle=`rgba(200,220,255,${0.3+Math.random()*0.4})`;
   tctx.lineWidth=Math.random()*2+1;
   tctx.beginPath();tctx.moveTo(x,y);tctx.lineTo(x,y+len);tctx.stroke();
  }
  // planet growing
  const progress=frame/maxF;
  const pr=planet.r*2*progress;
  tctx.beginPath();tctx.arc(W/2,H/2,pr,0,Math.PI*2);
  tctx.fillStyle=planet.color+Math.floor(progress*200).toString(16).padStart(2,'0');
  tctx.fill();
  // text
  tctx.fillStyle='#fff';tctx.font='bold 20px sans-serif';tctx.textAlign='center';
  tctx.fillText(`${planet.icon} ${planet.name}(으)로 이동 중...`,W/2,H/2+pr+30);
  frame++;
  if(frame<maxF)requestAnimationFrame(anim);
  else{tc.style.display='none';tctx.clearRect(0,0,W,H);cb();}
 }
 anim();
 playSfx(220,0.5);setTimeout(()=>playSfx(330,0.4),300);setTimeout(()=>playSfx(440,0.6),600);
}

// ===== TRAVEL =====
G.travelTo=function(pid){
 const p=PLANETS.find(x=>x.id===pid);
 const cost=this.getFuelCost(p);
 if(this.fuel<cost){this.toast('연료가 부족합니다! 로켓을 업그레이드하세요.');return;}
 closePanels();
 this.fuel-=cost;
 this.currentPlanet=p;
 playTravel(p,()=>{
  this.state='explore';
  this.camX=0;
  this.explorerX=W/2;
  showExploreUI();
  this.updateHUD();
  this.save();
 });
};

function showExploreUI(){
 const nb=$('nav-btns');
 nb.innerHTML=`
  <button class="btn" onclick="G.moveExplorer(-1)">⬅ 왼쪽</button>
  <button class="btn" onclick="G.collectSample()">💎 채집</button>
  <button class="btn" onclick="G.startQuiz(G.currentPlanet.id)">❓ 퀴즈</button>
  <button class="btn" onclick="G.refuel()">⛽ 보급</button>
  <button class="btn" onclick="G.returnToMap()">🗺 귀환</button>
  <button class="btn" onclick="G.moveExplorer(1)">➡ 오른쪽</button>`;
}

G.moveExplorer=function(dir){G.camX+=dir*60;playSfx(300+dir*50,0.1);};

G.collectSample=function(){
 const p=this.currentPlanet;if(!p)return;
 if(!this.collected[p.id])this.collected[p.id]=[];
 const max=this.getCollectMax();
 const uncollected=p.samples.map((_,i)=>i).filter(i=>!this.collected[p.id].includes(i));
 if(uncollected.length===0){this.toast('이 행성의 모든 샘플을 채집했습니다!');return;}
 // find nearest sample
 let best=-1,bestDist=Infinity;
 uncollected.forEach(i=>{
  const sx=200+i*300-this.camX;
  const d=Math.abs(sx-W/2);
  if(d<bestDist&&d<150){bestDist=d;best=i;}
 });
 if(best===-1){this.toast('💎에 더 가까이 이동하세요!');return;}
 this.collected[p.id].push(best);
 this.samples++;
 playSfx(600,0.2);setTimeout(()=>playSfx(800,0.3),150);
 this.toast(`💎 "${p.samples[best]}" 채집 완료!`);
 this.updateHUD();this.save();
};

G.refuel=function(){
 if(this.samples<5){this.toast('샘플 5개로 연료를 보급할 수 있습니다.');return;}
 this.samples-=5;this.fuel=Math.min(this.fuel+30,this.maxFuel);
 playSfx(200,0.3);
 this.toast('⛽ 연료 30 보급 완료!');
 this.updateHUD();this.save();
};

G.returnToMap=function(){
 this.state='map';this.currentPlanet=null;
 closePanels();
 this.updateHUD();
};

G.startQuiz=function(pid){

 closePanels();
 G.quizState={planet:p,qIdx:0,correct:0};

};

function showQuizQuestion(){
 const qs=G.quizState;
 const p=qs.planet;
 const q=p.quizzes[qs.qIdx];
 const el=$('quiz-panel');
 el.innerHTML=`<button class="close-btn" onclick="closePanels()">✕</button>
  <h3>${p.icon} ${p.name} 퀴즈 (${qs.qIdx+1}/${p.quizzes.length})</h3>
  <p style="margin:10px 0;color:#dde">${q.q}</p>
  ${q.o.map((o,i)=>`<button class="q-option" data-idx="${i}" onclick="answerQuiz(${i})">${o}</button>`).join('')}
  <p style="margin-top:8px;color:#667;font-size:12px">맞은 개수: ${qs.correct}/${qs.qIdx}</p>`;
 el.style.display='block';
}

window.answerQuiz=function(idx){
 const qs=G.quizState;
 const q=qs.planet.quizzes[qs.qIdx];
 const btns=document.querySelectorAll('.q-option');
 btns.forEach(b=>{
  b.style.pointerEvents='none';
  const bi=parseInt(b.dataset.idx);
  if(bi===q.a)b.classList.add('correct');
  if(bi===idx&&idx!==q.a)b.classList.add('wrong');
 });
 if(idx===q.a){qs.correct++;playSfx(523,0.2);setTimeout(()=>playSfx(659,0.2),100);}
 else{playSfx(150,0.3);}
 setTimeout(()=>{
  qs.qIdx++;
  if(qs.qIdx<qs.planet.quizzes.length){
   showQuizQuestion();
  }else{
   // quiz complete
   const passed=qs.correct===qs.planet.quizzes.length;
   if(passed){
    G.quizDone[qs.planet.id]=true;G.badges++;
    G.toast(`🏅 ${qs.planet.name} 퀴즈 올클리어! 배지 획득!`);
    playSfx(440,0.2);setTimeout(()=>playSfx(554,0.2),100);setTimeout(()=>playSfx(659,0.3),200);
   }else{
    G.toast(`${qs.correct}/${qs.planet.quizzes.length} 정답. 다시 도전하세요!`);
   }
   closePanels();
   if(G.state==='explore')showExploreUI();
   G.updateHUD();G.save();
  }
 },1200);
};

G.togglePart=function(pid){
 const part=PARTS.find(x=>x.id===pid);
 if(this.rocketParts.includes(pid)){
  if(part.cost===0){this.toast('기본 부품은 제거할 수 없습니다.');return;}
  this.rocketParts=this.rocketParts.filter(x=>x!==pid);
  this.toast(`${part.name} 제거됨`);
 }else{
  if(part.cost>0&&this.samples<part.cost){this.toast(`💎 ${part.cost}개 필요합니다.`);return;}
  if(part.cost>0)this.samples-=part.cost;
  this.rocketParts.push(pid);
  playSfx(400,0.15);
  this.toast(`${part.name} 장착!`);
 }
 this.recalcFuel();
 this.fuel=Math.min(this.fuel,this.maxFuel);
 this.updateHUD();this.save();
 this.showBuilder();
};

G.getRocketPreview=function(){

 const fuelCount=this.rocketParts.filter(x=>x.startsWith('fuel')).length;
 for(let i=0;i<fuelCount;i++)preview+='🛢️';
 const engineCount=this.rocketParts.filter(x=>x.startsWith('engine')).length;
 for(let i=0;i<engineCount;i++)preview+='🔥';

 G.upgrades[u.type]=u.level;
 playSfx(500,0.2);setTimeout(()=>playSfx(700,0.2),100);
 G.toast(`⬆ ${u.name} 업그레이드 완료!`);
 G.updateHUD();G.save();
 G.showUpgrades();
};

// ===== INPUT =====
canvas.addEventListener('click',e=>{
 initAudio();
 if(G.state!=='map')return;
 const rect=canvas.getBoundingClientRect();
 const mx=e.clientX-rect.left,my=e.clientY-rect.top;
 const scale=Math.min(W,H)/800*G.mapScale;
 for(let i=PLANETS.length-1;i>=0;i--){
  const p=PLANETS[i];
  if(!p._x)continue;
  const d=Math.hypot(mx-p._x,my-p._y);
  if(d<Math.max(p.r*scale+10,20)){
   showPlanetInfo(p);playSfx(400,0.15);
   return;
  }
 }
});

canvas.addEventListener('touchstart',e=>{initAudio();},{passive:true});

// keyboard
document.addEventListener('keydown',e=>{
 if(G.state==='explore'){
  if(e.key==='ArrowLeft')G.moveExplorer(-1);
  if(e.key==='ArrowRight')G.moveExplorer(1);
  if(e.key===' ')G.collectSample();
 }
});

// touch swipe for explore
let touchSX=0;
canvas.addEventListener('touchstart',e=>{touchSX=e.touches[0].clientX;},{passive:true});
canvas.addEventListener('touchend',e=>{
 if(G.state!=='explore')return;
 const dx=e.changedTouches[0].clientX-touchSX;
 if(Math.abs(dx)>30)G.moveExplorer(dx>0?-1:1);
},{passive:true});

// ===== GAME LOOP =====
function gameLoop(){
 if(G.state==='map')drawMap();
 else if(G.state==='explore')drawSurface();
 requestAnimationFrame(gameLoop);
}

// ===== INIT =====
initStars();
G.load();
G.recalcFuel();
if(G.fuel<=0)G.fuel=G.maxFuel;
G.updateHUD();
gameLoop();
</script>
