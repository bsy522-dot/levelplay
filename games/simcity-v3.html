<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>심시티 v3 - 도시 건설</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(180deg,#cfeaf7 0%,#fafdff 100%);color:#2c3e50;font-family:-apple-system,'Segoe UI',sans-serif;overflow:hidden;height:100vh;user-select:none;touch-action:none}

#topBar{position:fixed;top:0;left:0;right:0;height:48px;background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(248,251,255,.95));border-bottom:2px solid #c8dceb;display:flex;align-items:center;padding:0 10px;gap:8px;z-index:30;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;box-shadow:0 2px 8px rgba(100,150,200,.15)}
#topBar::-webkit-scrollbar{display:none}
#cityName{font-size:14px;font-weight:900;color:#1976d2;cursor:pointer;white-space:nowrap;flex-shrink:0}
.st{display:flex;align-items:center;gap:3px;flex-shrink:0;font-size:12px}
.st .i{font-size:14px}
.st .v{font-weight:700;color:#e67e22;min-width:30px}
.st .r{font-size:10px}
.st .r.p{color:#27ae60}
.st .r.n{color:#e74c3c}
.st .l{font-size:9px;color:#7a8a9a}

#gameCanvas{position:fixed;top:48px;left:0;right:0;bottom:74px;display:block;background:linear-gradient(180deg,#d6efff 0%,#f0f9ff 50%,#ffffff 100%)}

#toolbar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(0deg,rgba(255,255,255,.98),rgba(248,251,255,.95));border-top:2px solid #c8dceb;z-index:30;padding:4px 4px 2px;box-shadow:0 -2px 8px rgba(100,150,200,.15)}
#cats{display:flex;gap:2px;margin-bottom:3px;overflow-x:auto;scrollbar-width:none}
#cats::-webkit-scrollbar{display:none}
.cat-btn{flex-shrink:0;padding:3px 10px;background:rgba(100,160,220,.1);border:none;border-radius:10px;font-size:11px;color:#5a7a9a;cursor:pointer}
.cat-btn.sel{background:rgba(33,150,243,.25);color:#1976d2;font-weight:700}
#tiles{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
#tiles::-webkit-scrollbar{display:none}
.t-btn{flex-shrink:0;padding:6px 8px;background:#fff;border:2px solid #d8e6f0;border-radius:8px;cursor:pointer;text-align:center;min-width:58px;color:#2c3e50;font-size:10px;box-shadow:0 1px 3px rgba(100,150,200,.15)}
.t-btn.sel{border-color:#ff9800;background:#fff8e1;box-shadow:0 2px 6px rgba(255,152,0,.3)}
.t-btn .ic{font-size:18px;display:block}
.t-btn .cs{font-size:8px;color:#e67e22;font-weight:700}
#btmRow{display:flex;align-items:center;gap:4px;padding:2px 4px;font-size:11px}
#btmRow button{background:#fff;border:1px solid #c8dceb;color:#2c3e50;padding:3px 8px;border-radius:8px;font-size:10px;cursor:pointer;box-shadow:0 1px 2px rgba(100,150,200,.1)}
#btmRow button.act{background:#ffe0e0;border-color:#e74c3c;color:#c0392b}
#btmRow .sp{flex:1}
#desc{color:#7a8a9a;font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

#popup{position:fixed;top:56px;left:50%;transform:translateX(-50%);padding:8px 20px;border-radius:10px;font-size:13px;font-weight:700;z-index:40;display:none;text-align:center;color:#fff;animation:sd .3s;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#popup.bad{background:rgba(231,76,60,.95)}
#popup.good{background:rgba(46,204,113,.95)}
#popup.warn{background:rgba(255,152,0,.95)}
@keyframes sd{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

#statsPanel{position:fixed;top:48px;right:0;width:280px;bottom:74px;background:rgba(255,255,255,.98);border-left:2px solid #c8dceb;z-index:25;display:none;flex-direction:column;padding:10px;overflow-y:auto;font-size:12px;box-shadow:-2px 0 8px rgba(100,150,200,.15)}
#statsPanel h3{color:#1976d2;font-size:14px;margin-bottom:6px}
.sr{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #e8eef4}
.sr .lb{color:#7a8a9a}
.sr .vl{color:#e67e22;font-weight:700}
.sec{color:#5a7a9a;font-size:11px;margin:10px 0 4px;font-weight:700}
.bar{height:12px;background:#e8eef4;border-radius:6px;overflow:hidden;margin:3px 0}
.bar-fill{height:100%;border-radius:6px;transition:width .5s}
.ach{padding:4px 6px;background:#fff8e1;border:1px solid #ffe082;border-radius:6px;margin:2px 0;font-size:11px;display:flex;align-items:center;gap:6px;color:#5d4037}
.ach.locked{opacity:.4;background:#f5f5f5;border-color:#e0e0e0}

#saveModal{position:fixed;inset:0;background:rgba(100,150,200,.4);backdrop-filter:blur(4px);z-index:50;display:none;align-items:center;justify-content:center}
#saveBox{background:#fff;border:2px solid #c8dceb;border-radius:12px;padding:16px;width:280px;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.15)}
#saveBox h3{color:#1976d2;margin-bottom:10px;font-size:14px}
.save-slot{padding:8px;background:#f5fafd;border:1px solid #d8e6f0;border-radius:8px;margin-bottom:6px;cursor:pointer;font-size:11px}
.save-slot:hover{background:#e3f2fd;border-color:#90caf9}
.save-slot .sn{font-weight:700;color:#e67e22}
.save-slot .sd{color:#7a8a9a;font-size:10px}
#saveBox button{background:#e3f2fd;border:1px solid #90caf9;color:#1976d2;padding:6px 14px;border-radius:8px;font-size:12px;cursor:pointer;margin:2px}
#saveBox button:hover{background:#bbdefb}

/* === MISSIONS BANNER === */
#MIS_banner{position:fixed;top:48px;left:0;right:0;min-height:22px;background:linear-gradient(180deg,rgba(255,248,225,.97),rgba(255,243,205,.95));border-bottom:1px solid #ffe082;display:flex;align-items:center;justify-content:center;gap:6px;padding:2px 10px;z-index:28;font-size:11px;font-weight:700;color:#8d6e00;box-shadow:0 1px 4px rgba(180,150,80,.15);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#MIS_banner.done{background:linear-gradient(180deg,rgba(200,245,210,.97),rgba(180,240,195,.95));border-bottom-color:#66bb6a;color:#1b7a3e}
#MIS_banner .MIS_rw{font-size:10px;font-weight:700;color:#e67e22;flex-shrink:0}

/* === R3: 건물 정보 팝오버 === */
#INFO_card{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);width:min(300px,90vw);background:#fff;border:2px solid #c8dceb;border-radius:14px;padding:12px 14px;z-index:45;box-shadow:0 8px 28px rgba(40,80,140,.22);animation:sd .25s}
.INFO_hd{display:flex;align-items:center;gap:8px;font-size:15px;color:#1976d2;margin-bottom:4px}
.INFO_desc{font-size:11px;color:#5a7a9a;margin-bottom:6px;line-height:1.4}
.INFO_warn{font-size:11px;font-weight:700;color:#c0392b;background:#ffe9e6;border-radius:6px;padding:3px 7px;margin-bottom:6px}
.INFO_stats{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.INFO_stats span{font-size:11px;background:#f0f6fc;border:1px solid #dbe8f4;border-radius:6px;padding:2px 7px;color:#2c3e50}
.INFO_bull{width:100%;background:#ffeceb;border:1px solid #ffb3ac;color:#c0392b;padding:7px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
.INFO_bull:active{background:#ffd6d2}

/* === R3: 첫 진입 튜토리얼 === */
#TUT_ov{position:fixed;inset:0;background:rgba(20,40,70,.55);backdrop-filter:blur(5px);z-index:60;display:flex;align-items:center;justify-content:center;animation:sd .3s}
.TUT_box{background:#fff;border-radius:18px;padding:22px 22px 18px;width:min(360px,90vw);max-height:85vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.TUT_box h2{font-size:18px;color:#1976d2;margin-bottom:12px;text-align:center}
.TUT_box ul{list-style:none;padding:0;margin:0 0 14px}
.TUT_box li{font-size:13px;color:#3a4a5a;padding:7px 0;border-bottom:1px solid #eef3f8;line-height:1.5}
.TUT_box li b{color:#e67e22}
.TUT_box button{width:100%;background:linear-gradient(180deg,#42a5f5,#1976d2);border:none;color:#fff;padding:12px;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(25,118,210,.35)}
.TUT_box button:active{transform:translateY(1px)}
</style>
</head>
<body>
<div id="topBar">
<div id="cityName">새 도시</div>
<div class="st"><span class="i">👥</span><span class="v" id="sPop">0</span><span class="l">인구</span></div>
<div class="st"><span class="i">💰</span><span class="v" id="sMon">50000</span><span class="r p" id="sNet"></span></div>
<div class="st"><span class="i">😊</span><span class="v" id="sHap">50</span></div>
<div class="st"><span class="i">⚡</span><span class="v" id="sPow">0</span></div>
<div class="st"><span class="i">💧</span><span class="v" id="sWat">0</span></div>
<div class="st"><span class="i">📅</span><span class="v" id="sDay">1</span><span class="l" id="sSea">봄</span></div>
</div>

<div id="MIS_banner">🎯 목표 로딩중...</div>
<canvas id="gameCanvas"></canvas>
<div id="popup"></div>

<div id="statsPanel"></div>

<div id="toolbar">
<div id="cats"></div>
<div id="tiles"></div>
<div id="btmRow">
<button id="bBull">🗑️철거</button>
<button id="bStat">📊</button>
<button id="bSave">💾</button>
<button id="bLoad">📂</button>
<button id="bDemo" title="예시 도시">🏙️데모</button>
<button id="bSpeed" title="속도">▶1x</button>
<button id="AUD_btn" title="소리" onclick="AUD_toggle()">🔊</button>
<span class="sp"></span>
<span id="desc">건물을 선택하세요</span>
</div>
</div>

<div id="saveModal"><div id="saveBox"></div></div>

<script>
// === BUILDING DATA ===
const B={
empty:{n:'빈 땅',ic:'',c:'#c5e8b0',cat:'',cost:0,d:'빈 땅'},
// Residential
house:{n:'주택',ic:'🏠',c:'#9ed884',cat:'주거',cost:400,d:'소형 주택. 인구+8',inc:15,pop:8,hap:2,pow:-1,wat:-1},
apt:{n:'아파트',ic:'🏢',c:'#7fc8a9',cat:'주거',cost:1500,d:'아파트. 인구+40',inc:60,pop:40,hap:1,pow:-3,wat:-3,h:2},
mansion:{n:'맨션',ic:'🏰',c:'#a8e6cf',cat:'주거',cost:5000,d:'고급 맨션. 인구+15, 행복+5',inc:100,pop:15,hap:5,pow:-2,wat:-2,h:2.5},
// Commercial
shop:{n:'상점',ic:'🏪',c:'#74c0fc',cat:'상업',cost:600,d:'소형 상점. 수입+30',inc:30,hap:3,pow:-1,wat:-1,job:5},
mall:{n:'쇼핑몰',ic:'🏬',c:'#9ec5fe',cat:'상업',cost:4000,d:'대형 쇼핑몰. 수입+120',inc:120,hap:8,pow:-5,wat:-3,job:30,h:2},
office:{n:'오피스타워',ic:'🏗️',c:'#b9d4fa',cat:'상업',cost:6000,d:'업무용 타워. 수입+150',inc:150,hap:-1,pow:-4,wat:-2,job:50,h:3},
// Industrial
factory:{n:'공장',ic:'🏭',c:'#ffd8a8',cat:'산업',cost:2000,d:'공장. 수입+80, 행복-5',inc:80,hap:-5,pow:-3,wat:-2,job:20},
warehouse:{n:'창고',ic:'📦',c:'#ffe8b8',cat:'산업',cost:1000,d:'물류 창고. 수입+40',inc:40,hap:-2,pow:-1,wat:0,job:8},
techpark:{n:'테크파크',ic:'💻',c:'#a5d8ff',cat:'산업',cost:8000,d:'첨단 산업단지. 수입+200',inc:200,hap:2,pow:-6,wat:-2,job:60,h:2},
// Special
hospital:{n:'병원',ic:'🏥',c:'#ffc9c9',cat:'특수',cost:5000,d:'의료시설. 행복+10, 안전+10',hap:10,saf:10,exp:80,pow:-3,wat:-2},
school:{n:'학교',ic:'🏫',c:'#e0c8ff',cat:'특수',cost:3000,d:'교육시설. 행복+8',hap:8,exp:50,pow:-2,wat:-1,popG:3},
police:{n:'경찰서',ic:'🚔',c:'#a5c8ff',cat:'특수',cost:3500,d:'치안시설. 안전+20',saf:20,exp:60,pow:-2,wat:-1},
fire:{n:'소방서',ic:'🚒',c:'#ffb8b8',cat:'특수',cost:3000,d:'화재 예방. 안전+15',saf:15,exp:50,pow:-2,wat:-1},
park:{n:'공원',ic:'🌳',c:'#8ce99a',cat:'특수',cost:500,d:'공원. 행복+12',hap:12,exp:10},
stadium:{n:'스타디움',ic:'🏟️',c:'#ffec99',cat:'특수',cost:12000,d:'종합경기장. 행복+20, 수입+100',hap:20,inc:100,exp:100,pow:-8,wat:-5,h:2},
// Infrastructure
road:{n:'도로',ic:'🛣️',c:'#bdc3c7',cat:'인프라',cost:50,d:'도로. 건물 연결',hap:0},
bridge:{n:'다리',ic:'🌉',c:'#cdd5db',cat:'인프라',cost:300,d:'다리. 수상 연결',hap:1},
power:{n:'발전소',ic:'⚡',c:'#fff3a3',cat:'인프라',cost:5000,d:'전력 공급. 전력+50',pow:50,exp:40,hap:-3},
water:{n:'급수탑',ic:'💧',c:'#74c0fc',cat:'인프라',cost:3000,d:'물 공급. 수도+30',wat:30,exp:30}
};
const CATS=['주거','상업','산업','특수','인프라'];
const KEYS=Object.keys(B).filter(k=>k!=='empty');

// === ACHIEVEMENTS ===
const ACHS=[
{id:'pop100',n:'🏘️ 마을',d:'인구 100명',check:s=>s.pop>=100},
{id:'pop500',n:'🏙️ 소도시',d:'인구 500명',check:s=>s.pop>=500},
{id:'pop2000',n:'🌆 도시',d:'인구 2000명',check:s=>s.pop>=2000},
{id:'pop10000',n:'🌇 대도시',d:'인구 10000명',check:s=>s.pop>=10000},
{id:'rich',n:'💎 부자도시',d:'자금 100,000',check:s=>s.money>=100000},
{id:'happy',n:'😄 행복도시',d:'행복 90+',check:s=>s.hap>=90},
{id:'safe',n:'🛡️ 안전도시',d:'안전 90+',check:s=>s.saf>=90},
{id:'build50',n:'🏗️ 건설왕',d:'건물 50개',check:s=>s.bcount>=50},
];

// === STATE ===
const GW=30,GH=30;
let grid=[];
for(let y=0;y<GH;y++){grid[y]=[];for(let x=0;x<GW;x++)grid[y][x]={t:'empty',dmg:0};}

let money=50000,pop=0,hap=50,saf=50,day=1;
let totalPow=0,totalWat=0,usedPow=0,usedWat=0;
let selTile='house',selCat='주거',bulldoze=false;
let camX=0,camY=0,zoom=1;
let dragging=false,dsx=0,dsy=0,csx=0,csy=0;
let speed=1,simTimer=null;
let popHistory=[],incHistory=[];
let achievements=new Set();
let loans=0,loanRate=0.05;
let season=0; // 0spring 1summer 2autumn 3winter
const SEASONS=['봄','여름','가을','겨울'];
const SEASON_MULT=[1.0,1.1,1.0,0.8];
let hovG={x:-1,y:-1};
let nightPhase=0; // 0-1 for day/night

// ISO
const TW=48,TH=24;
function iso(gx,gy){return{x:(gx-gy)*(TW/2)*zoom+camX,y:(gx+gy)*(TH/2)*zoom+camY};}
function fromIso(sx,sy){const cx=(sx-camX)/zoom,cy=(sy-camY)/zoom;return{x:Math.round((cx/(TW/2)+cy/(TH/2))/2),y:Math.round((cy/(TH/2)-cx/(TW/2))/2)};}

// === ASSET IMAGES (ComfyUI 생성 PNG) ===
const IMG={};let IMG_READY=false,IMG_LOADED=0,IMG_TOTAL=0;
function loadAssets(){
  // 22 건물 + empty + road = 24장
  const names=['empty','road','house','apt','mansion','shop','mall','office','factory','warehouse','techpark','hospital','school','police','fire','park','stadium','bridge','power','water'];
  IMG_TOTAL=names.length;
  names.forEach(n=>{
    const im=new Image();
    im.onload=()=>{IMG_LOADED++;if(IMG_LOADED>=IMG_TOTAL*0.7)IMG_READY=true;};
    im.onerror=()=>{IMG_LOADED++;};
    im.src=`v4_assets/${n}.png?v=${Date.now()}`;
    IMG[n]=im;
  });
}
loadAssets();

// === CANVAS ===
const cvs=document.getElementById('gameCanvas');
const ctx=cvs.getContext('2d');
function resize(){cvs.width=window.innerWidth;cvs.height=window.innerHeight-48-74;if(day<=1){camX=cvs.width/2;camY=60;}}
resize();window.addEventListener('resize',resize);

// === DRAW ===
function hexToRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function lighten(h,p){let[r,g,b]=hexToRgb(h);return`rgb(${Math.min(255,r+p)},${Math.min(255,g+p)},${Math.min(255,b+p)})`;}
function darken(h,p){let[r,g,b]=hexToRgb(h);return`rgb(${Math.max(0,r-p)},${Math.max(0,g-p)},${Math.max(0,b-p)})`;}

// R4: 화면 흔들림 (재해 임팩트)
let FX_shakeT=0;
function FX_shake(){FX_shakeT=performance.now()+450;}
function draw(){
  ctx.clearRect(0,0,cvs.width,cvs.height);
  // 야간 오버레이 완전히 제거 - 항상 밝게 유지
  // (계절감/시간감은 통계패널의 Day/계절 텍스트로 표현)

  // R4: 재해 흔들림 — camX/camY에 일시 오프셋 후 복원
  let _shX=0,_shY=0;
  if(FX_shakeT>0){
    const left=FX_shakeT-performance.now();
    if(left>0){const m=Math.min(8,left/55);_shX=(Math.random()-0.5)*m*2;_shY=(Math.random()-0.5)*m*2;camX+=_shX;camY+=_shY;}
    else FX_shakeT=0;
  }

  const hw=(TW/2)*zoom,hh=(TH/2)*zoom;
  for(let y=0;y<GH;y++){
    for(let x=0;x<GW;x++){
      const{x:sx,y:sy}=iso(x,y);
      if(sx<-hw*2||sx>cvs.width+hw*2||sy<-100||sy>cvs.height+100)continue;
      const cell=grid[y][x];
      const b=B[cell.t];
      const baseC=b.c;
      const useImg=IMG_READY&&IMG[cell.t]&&IMG[cell.t].complete&&IMG[cell.t].naturalWidth>0;
      // Ground tile
      ctx.beginPath();ctx.moveTo(sx,sy-hh);ctx.lineTo(sx+hw,sy);ctx.lineTo(sx,sy+hh);ctx.lineTo(sx-hw,sy);ctx.closePath();
      // empty/road는 단색이 더 깔끔 (PNG 텍스처 반복 시 지저분). 빈 땅은 계절색 적용.
      ctx.fillStyle=cell.dmg>0?'#ffb8a8':(cell.t==='empty'?SEASON_ground():baseC);ctx.fill();
      ctx.strokeStyle='rgba(120,160,200,0.12)';ctx.lineWidth=1;ctx.stroke();

      // 빈 땅에 나무/꽃 디테일 (랜덤이지만 좌표 기반 stable)
      if(cell.t==='empty'&&zoom>0.7){
        const seed=(x*73+y*131)%100;
        if(seed<22){
          // 작은 나무
          const tx=sx+((seed%7)-3)*hw*0.15, ty=sy+((seed%5)-2)*hh*0.2;
          ctx.fillStyle=seed<11?SEASON_treeCol(0):SEASON_treeCol(1);
          ctx.beginPath();ctx.arc(tx,ty,3*zoom,0,Math.PI*2);ctx.fill();
          ctx.fillStyle='#6b4423';
          ctx.fillRect(tx-zoom*0.4,ty,zoom*0.8,2*zoom);
        }else if(seed<32){
          // 꽃 점
          const fx=sx+((seed%5)-2)*hw*0.2, fy=sy+((seed%4)-1)*hh*0.2;
          ctx.fillStyle=['#ff6b9d','#ffd166','#ef476f','#ffffff'][seed%4];
          ctx.fillRect(fx-zoom,fy-zoom,2*zoom,2*zoom);
        }
      }

      if(useImg&&cell.t!=='empty'&&cell.t!=='road'){
        // ComfyUI 이미지로 건물 그리기
        RND_groundShadow(sx,sy,hw,hh);
        const imgH=RND_drawSprite(IMG[cell.t],sx,sy,hw,hh,x,y);
        if(cell.dmg>0){
          ctx.font=`${Math.max(12,16*zoom)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillText('🔥',sx,sy-imgH*0.4);
        }else if(cell._dc&&zoom>0.6){
          ctx.font=`${Math.max(10,13*zoom)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillText('⚠️',sx,sy-imgH*0.45);
        }
      }else if(cell.t!=='empty'&&cell.t!=='road'){
        // 이미지 없으면 fallback: 기존 박스 렌더링
        RND_groundShadow(sx,sy,hw,hh);
        const bh=(b.h||1)*18*zoom;
        ctx.beginPath();ctx.moveTo(sx-hw,sy);ctx.lineTo(sx-hw,sy-bh);ctx.lineTo(sx,sy+hh-bh);ctx.lineTo(sx,sy+hh);ctx.closePath();
        ctx.fillStyle=darken(baseC,25);ctx.fill();ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.stroke();
        ctx.beginPath();ctx.moveTo(sx+hw,sy);ctx.lineTo(sx+hw,sy-bh);ctx.lineTo(sx,sy+hh-bh);ctx.lineTo(sx,sy+hh);ctx.closePath();
        ctx.fillStyle=darken(baseC,15);ctx.fill();ctx.stroke();
        ctx.beginPath();ctx.moveTo(sx,sy-hh-bh);ctx.lineTo(sx+hw,sy-bh);ctx.lineTo(sx,sy+hh-bh);ctx.lineTo(sx-hw,sy-bh);ctx.closePath();
        ctx.fillStyle=lighten(baseC,25);ctx.fill();ctx.stroke();
        if(b.ic){
          const isz=Math.max(10,14*zoom);
          ctx.font=`${isz}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillText(b.ic,sx,sy-bh/2-hh*0.3);
        }
        if(cell.dmg>0){
          ctx.font=`${Math.max(8,10*zoom)}px sans-serif`;
          ctx.fillText('🔥',sx,sy-bh-hh*0.5);
        }else if(cell._dc&&zoom>0.6){
          ctx.font=`${Math.max(8,11*zoom)}px sans-serif`;ctx.textAlign='center';
          ctx.fillText('⚠️',sx,sy-bh-hh*0.5);
        }
      }else if(cell.t==='road'){
        ctx.fillStyle='#95a5a6';
        ctx.beginPath();ctx.moveTo(sx,sy-hh*0.35);ctx.lineTo(sx+hw*0.35,sy);ctx.lineTo(sx,sy+hh*0.35);ctx.lineTo(sx-hw*0.35,sy);ctx.closePath();ctx.fill();
        ctx.strokeStyle='#fff176';ctx.lineWidth=1.2;ctx.setLineDash([2*zoom,2*zoom]);
        ctx.beginPath();ctx.moveTo(sx-hw*0.15,sy-hh*0.05);ctx.lineTo(sx+hw*0.15,sy+hh*0.05);ctx.stroke();
        ctx.setLineDash([]);
        // 도로 위 자동차 (좌표+day 기반으로 천천히 이동)
        if(zoom>0.8){
          const seedC=(x*37+y*97)%100;
          if(seedC<35){
            const phase=((day*0.1+seedC*0.07)%1);
            const cx2=sx+(phase-0.5)*hw*0.6;
            const cy2=sy+(phase-0.5)*hh*0.6;
            const colors=['#e74c3c','#3498db','#f39c12','#2ecc71','#ecf0f1','#9b59b6'];
            ctx.fillStyle=colors[seedC%6];
            ctx.fillRect(cx2-3*zoom,cy2-2*zoom,6*zoom,3*zoom);
            // 차창
            ctx.fillStyle='rgba(150,200,255,0.7)';
            ctx.fillRect(cx2-2*zoom,cy2-1.5*zoom,4*zoom,1.5*zoom);
          }
        }
      }
    }
  }
  // Hover
  if(hovG.x>=0&&hovG.x<GW&&hovG.y>=0&&hovG.y<GH){
    const{x:sx,y:sy}=iso(hovG.x,hovG.y);
    ctx.beginPath();ctx.moveTo(sx,sy-hh);ctx.lineTo(sx+hw,sy);ctx.lineTo(sx,sy+hh);ctx.lineTo(sx-hw,sy);ctx.closePath();
    ctx.strokeStyle=bulldoze?'rgba(244,67,54,0.8)':'rgba(255,215,0,0.6)';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle=bulldoze?'rgba(244,67,54,0.12)':'rgba(255,215,0,0.08)';ctx.fill();
    GHOST_preview(hovG.x,hovG.y,sx,sy,hw,hh);
  }
  SEASON_snow();
  FX_update();FX_draw(ctx);
  // R4: 흔들림 오프셋 복원 (누적 방지)
  if(_shX||_shY){camX-=_shX;camY-=_shY;}
  requestAnimationFrame(draw);
}

});

cvs.addEventListener('mouseup',e=>{

cvs.addEventListener('wheel',e=>{
  e.preventDefault();const oz=zoom;zoom*=e.deltaY<0?1.1:0.9;zoom=Math.max(0.25,Math.min(3,zoom));
  const r=cvs.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  camX=mx-(mx-camX)*(zoom/oz);camY=my-(my-camY)*(zoom/oz);
},{passive:false});

let tDist=0,tZoom=1;
cvs.addEventListener('touchstart',e=>{

  else if(e.touches.length===2){tDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);tZoom=zoom;}
},{passive:false});
cvs.addEventListener('touchmove',e=>{

  if(e.touches.length===1&&dragging){camX=csx+(e.touches[0].clientX-dsx);camY=csy+(e.touches[0].clientY-dsy);}

},{passive:false});
cvs.addEventListener('touchend',e=>{

function place(g){
  if(g.x<0||g.x>=GW||g.y<0||g.y>=GH)return;
  if(bulldoze){
    if(grid[g.y][g.x].t!=='empty'){
      const old=B[grid[g.y][g.x].t];
      money+=Math.floor((old.cost||0)*0.3);
      grid[g.y][g.x]={t:'empty',dmg:0};
      if(window.INFO_close)INFO_close(g.x,g.y);
      window.playSfx('bull');
      popup('🗑️ 철거 완료 (환불 30%)',false);
    }
    return;
  }
  if(grid[g.y][g.x].t!=='empty'){INFO_show(g.x,g.y);return;}
  const b=B[selTile];
  if(money<b.cost){window.playSfx('error');popup('💰 자금 부족!',false);return;}
  money-=b.cost;
  grid[g.y][g.x]={t:selTile,dmg:0};
  window.playSfx('place');
  FX_spawnPlace(g.x,g.y,b);
  updUI();
}

// === SIMULATION ===
function simulate(){
  day++;
  nightPhase=(day%20)/20; // simple day/night cycle
  if(day%30===0){season=(season+1)%4;SEASON_applySky();popup(SEASONS[season]+'이 찾아왔습니다',true);} // season every 30 days

  let inc=0,exp=0,tHap=0,tSaf=0,tPop=0,tPow=0,tWat=0,uPow=0,uWat=0,jobs=0,bcount=0,popG=0;
  let fireStations=0,policeStations=0;

  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    const c=grid[y][x];if(c.t==='empty')continue;
    const b=B[c.t];bcount++;
    if(c.dmg>0){c.dmg--;if(c.dmg<=0)c.dmg=0;continue;} // damaged buildings don't produce
    var _adjF=ADJ_factor(x,y,b); if(b.inc)inc+=Math.round(b.inc*ADJ_commBonus(x,y,b)*_adjF);
    if(b.exp)exp+=b.exp;
    if(b.hap)tHap+=b.hap;
    tHap+=ADJ_hap(x,y,b);
    if(b.saf)tSaf+=b.saf;
    if(b.pop)tPop+=Math.round(b.pop*_adjF);
    if(b.pow>0)tPow+=b.pow; else if(b.pow<0)uPow-=b.pow;
    if(b.wat>0)tWat+=b.wat; else if(b.wat<0)uWat-=b.wat;
    if(b.job)jobs+=b.job;
    if(b.popG)popG+=b.popG;
    if(c.t==='fire')fireStations++;
    if(c.t==='police')policeStations++;
  }

  // Power/water penalty
  totalPow=tPow;totalWat=tWat;usedPow=uPow;usedWat=uWat;
  let infraPenalty=0;
  if(uPow>tPow)infraPenalty+=10;
  if(uWat>tWat)infraPenalty+=10;

  // Season multiplier
  const sMult=SEASON_MULT[season];
  // R4: 도시 행정비용 — 인구가 커질수록 운영비 증가 (무한 흑자 억제, 후반 긴장감)
  const adminCost=Math.round(pop*0.6+bcount*8);
  const netInc=Math.round(inc*sMult*(1+pop/1000))-exp-adminCost-Math.round(loans*loanRate);
  money+=netInc;

  // R4: 재정 위기 — 자금 고갈 시 긴장감 (적자 + 잔고 부족 → 인구 이탈 + 경고)
  if(money<0){
    const deficit=-money;money=0;
    pop=Math.max(0,pop-Math.ceil(pop*0.03)-2); // 재정난으로 시민 이탈
    if(day%2===0)popup('🚨 재정 위기! 적자로 시민 이탈 — 수입을 늘리세요',false);
  }else if(money<2000&&netInc<0){
    if(day%6===0)popup('⚠ 자금 부족 경고 — 곧 파산합니다',false);
  }

  // Happiness
  hap=Math.max(0,Math.min(100,50+tHap-infraPenalty));
  if(pop>0&&jobs<pop*0.3)hap=Math.max(0,hap-10); // unemployment penalty

  // Safety
  saf=Math.max(0,Math.min(100,50+tSaf));

  // Population
  const maxPop=tPop*15;
  if(hap>50&&tPop>0){
    const gr=Math.floor((hap-50)/8)+popG+1;
    pop=Math.min(maxPop,pop+gr);
  }else if(hap<30&&pop>0){
    pop=Math.max(0,pop-Math.floor((30-hap)/4));
  }

  // Loan auto-deduction already in netInc

  // Random events (every ~15 days)
  if(day%15===0&&Math.random()<0.42){
    const r=Math.random();
    // 화재: 안전도 낮을수록 잦지만, 높아도 완전히 막진 못함 (소방서가 피해 경감)
    const fireChance=0.12+(100-saf)/300; // saf95→0.13, saf50→0.29
    if(r<fireChance){
      disaster('fire',fireStations);
    }else if(r<fireChance+0.07){
      // 지진: 천재지변 — 안전도 무관 (낮은 확률)
      disaster('quake',Math.floor(policeStations/2));
    }else if(r<fireChance+0.14){
      // 홍수: 여름에 더 빈번 (천재지변)
      if(season===1||Math.random()<0.4)disaster('flood',0);
    }else if(r<0.6&&hap<40){
      // Crime wave
      money=Math.max(0,money-2000);
      pop=Math.max(0,pop-Math.floor(pop*0.05));
      popup('🦹 범죄 급증! 자금-2000, 인구 감소',false);
    }else if(r<0.5&&hap>60){
      money+=3000;pop+=30;
      popup('🎉 경기 호황! 자금+3000, 인구+30',true);
    }else if(r<0.6){
      hap=Math.min(100,hap+8);
      popup('🎊 축제 개최! 행복+8',true);
    }else if(r<0.7&&season===2){
      inc*=1.3;money+=2000;
      popup('🍂 추수 보너스! 자금+2000',true);
    }
  }

  // Track history
  popHistory.push(pop);if(popHistory.length>60)popHistory.shift();
  incHistory.push(netInc);if(incHistory.length>60)incHistory.shift();

  // Check achievements
  const st={pop,money,hap,saf,bcount};
  ACHS.forEach(a=>{if(!achievements.has(a.id)&&a.check(st)){achievements.add(a.id);popup(`🏆 업적 달성: ${a.n}`,true);}});
  MIS_check(st); // missions: check current objective after achievements

  updUI();
}

function disaster(type,stations){
  const buildings=[];
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++)
    if(grid[y][x].t!=='empty'&&grid[y][x].t!=='road'&&grid[y][x].dmg===0)buildings.push({x,y});
  if(!buildings.length)return;

  let count=type==='quake'?Math.min(5,buildings.length):type==='flood'?Math.min(3,buildings.length):1;
  // Fire stations reduce fire damage
  if(type==='fire')count=Math.max(1,count-stations);

  const msgs={fire:'🔥 화재 발생!',quake:'🌍 지진 발생!',flood:'🌊 홍수 발생!'};
  let destroyed=0,repairCost=0;
  for(let i=0;i<count;i++){
    const idx=Math.floor(Math.random()*buildings.length);
    const b=buildings.splice(idx,1)[0];
    if(type==='quake'&&Math.random()<0.3){
      grid[b.y][b.x]={t:'empty',dmg:0};destroyed++; // destroyed
    }else{
      grid[b.y][b.x].dmg=5; // damaged for 5 turns
      repairCost+=300; // 복구 비용 발생 (긴장감)
    }
  }
  if(repairCost>0)money=Math.max(0,money-repairCost);
  if(window.playSfx)window.playSfx('disaster');
  if(typeof FX_shake==='function')FX_shake();
  const extra=destroyed?` (${destroyed}개 붕괴)`:'';
  const cost=repairCost?` 복구비 -${repairCost.toLocaleString()}`:'';
  popup(`${msgs[type]} ${count}개 피해${extra}${cost}`,false);
}

function drawChart(id,data,color){
  const c=document.getElementById(id);if(!c)return;
  const cx=c.getContext('2d');
  if(!data.length)return;
  const max=Math.max(1,...data.map(Math.abs));
  const w=c.width,h=c.height;
  cx.clearRect(0,0,w,h);
  cx.beginPath();cx.strokeStyle=color;cx.lineWidth=1.8;
  const zero=data.some(v=>v<0)?h/2:h-4;
  data.forEach((v,i)=>{
    const x=i/(data.length-1)*w;
    const y=zero-v/max*(zero-4);
    i===0?cx.moveTo(x,y):cx.lineTo(x,y);
  });
  cx.stroke();
  // zero line if mixed
  if(data.some(v=>v<0)){cx.strokeStyle='rgba(100,140,180,0.3)';cx.beginPath();cx.moveTo(0,h/2);cx.lineTo(w,h/2);cx.stroke();}
}

// === ADJ: ADJACENCY + ROAD CONNECTIVITY (prefix ADJ) ===================
// All location-strategy logic lives here. simulate() calls these helpers
// inside its existing per-cell accumulation loop. O(4) per cell => O(900).
//
// Building-type sets (kept local; do not redeclare existing globals).
const ADJ_RESIDENTIAL={house:1,apt:1,mansion:1};
const ADJ_COMMERCIAL={shop:1,mall:1,office:1};
const ADJ_POLLUTERS={factory:1,warehouse:1}; // hurt nearby residents
const ADJ_DISCONN=0.5; // production multiplier when not road-connected

// 4-neighbour helper: returns the tile type at (x+dx,y+dy) or '' if OOB.
function ADJ_typeAt(x,y){
  if(x<0||x>=GW||y<0||y>=GH)return '';
  return grid[y][x].t;
}

// Does this cell qualify as a "producer" for road-connectivity purposes?
// (has income, population, or jobs). Roads & 인프라 are exempt.
function ADJ_isProducer(t,b){
  if(t==='road'||t==='bridge')return false;
  if(b.cat==='인프라')return false; // power/water/road/bridge exempt
  return !!(b.inc||b.pop||b.job);
}

// True if (x,y) is 4-neighbour-adjacent to at least one 'road' tile.
function ADJ_roadAdjacent(x,y){
  return ADJ_typeAt(x-1,y)==='road'||ADJ_typeAt(x+1,y)==='road'||
         ADJ_typeAt(x,y-1)==='road'||ADJ_typeAt(x,y+1)==='road';
}

// ROAD CONNECTIVITY (1): producers not touching a road operate at 50%.
// Returns the multiplier (0.5 or 1) AND records grid[y][x]._dc so the
// renderer can flag disconnected producers later. Non-producers => 1, _dc=false.
function ADJ_factor(x,y,b){
  const cell=grid[y][x];
  if(!ADJ_isProducer(cell.t,b)){cell._dc=false;return 1;}
  const ok=ADJ_roadAdjacent(x,y);
  cell._dc=!ok;
  return ok?1:ADJ_DISCONN;
}

// PARK ADJACENCY (2): residential gets +2 happiness per adjacent park,
// -3 per adjacent factory/warehouse (pollution). Returns the tHap delta
// (0 for non-residential).
function ADJ_hap(x,y,b){
  if(!ADJ_RESIDENTIAL[grid[y][x].t])return 0;
  let d=0;
  const n=[ADJ_typeAt(x-1,y),ADJ_typeAt(x+1,y),ADJ_typeAt(x,y-1),ADJ_typeAt(x,y+1)];
  for(let i=0;i<4;i++){
    const t=n[i];
    if(t==='park')d+=2;
    else if(ADJ_POLLUTERS[t])d-=3;
  }
  return d;
}

// COMMERCIAL SYNERGY (3): commercial adjacent to any residential earns
// +10% of its own income. Returns an income multiplier (1.1 or 1.0).
function ADJ_commBonus(x,y,b){
  if(!ADJ_COMMERCIAL[grid[y][x].t])return 1;
  const n=[ADJ_typeAt(x-1,y),ADJ_typeAt(x+1,y),ADJ_typeAt(x,y-1),ADJ_typeAt(x,y+1)];
  for(let i=0;i<4;i++)if(ADJ_RESIDENTIAL[n[i]])return 1.1;
  return 1;
}

/* ===== RND: sprite consistency + grounding + contact shadow =====
   Fixes "scattered sticker" look: uniform footprint, aspect-correct
   clamped height, bottom-center grounded on the tile front, plus a soft
   elliptical contact shadow. Reuses module-level ctx/zoom; reads optional
   window.FX_scale only via typeof guard so offline/no-FX builds are safe. */

// Soft elliptical contact shadow on the ground at the tile front.
// sx,sy = tile center (screen); hw,hh = diamond half-width/half-height (already zoom-scaled).
function RND_groundShadow(sx, sy, hw, hh){
  ctx.save();
  ctx.fillStyle = 'rgba(35,55,30,0.22)';
  ctx.beginPath();
  ctx.ellipse(sx, sy + hh * 0.30, hw * 0.85, hh * 0.72, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// Draw one building sprite, grounded & uniformly scaled.
// Returns the drawn height (drawH) so the existing damage-🔥 marker
// (which reads `imgH` as sy-imgH*0.4) keeps positioning above the building.
function RND_drawSprite(img, sx, sy, hw, hh, gx, gy){
  // (a) uniform footprint width regardless of native sprite size
  const footprintW = (hw * 2) * 0.92;
  const nw = (img.naturalWidth  > 0) ? img.naturalWidth  : 1;
  const nh = (img.naturalHeight > 0) ? img.naturalHeight : 1;
  let drawW = footprintW;
  let drawH = footprintW * (nh / nw);
  // clamp very tall/narrow sprites (e.g. water tower) so they don't tower absurdly
  const maxH = footprintW * 2.2;
  if (drawH > maxH) drawH = maxH;
  // (d) optional pop scale (FX module) anchored at bottom-center -> grows from the ground
  if (typeof window !== 'undefined' && typeof window.FX_scale === 'function'){
    const s = window.FX_scale(gx, gy) || 1;
    drawW *= s;
    drawH *= s;
  }
  // (b) bottom-center anchored on the tile's front
  const bottomY = sy + hh * 0.30;
  ctx.drawImage(img, sx - drawW / 2, bottomY - drawH, drawW, drawH);
  return drawH;
}

// === JUICE / GAME FEEL (prefix FX) ===
// Pure additive visual feedback on building placement. No state mutation of game data.
const FX_pops=new Map();        // key 'x,y' -> {t0} placement pop start time
const FX_floats=[];             // {x,y,vy,text,color,t0,life}
const FX_particles=[];          // {x,y,vx,vy,t0,life,r,color}
const FX_MAX_PARTICLES=120;     // hard cap to stay performant
const FX_POP_MS=320;            // pop duration

// (1) Placement pop scale 0->1 with slight overshoot. Returns 1 when settled/absent.
function FX_scale(gx,gy){
  const e=FX_pops.get(gx+','+gy);
  if(!e)return 1;
  const k=(performance.now()-e.t0)/FX_POP_MS;
  if(k>=1){FX_pops.delete(gx+','+gy);return 1;}
  // easeOutBack-style overshoot: starts at 0, passes through ~1.05, settles at 1
  const c1=1.70158,c3=c1+1,p=k-1;
  const s=1+c3*p*p*p+c1*p*p;
  return Math.max(0.05,s);
}

// (2) Floating text
function FX_float(sx,sy,text,color){
  FX_floats.push({x:sx,y:sy,vy:-0.55,text:text,color:color||'#fff',t0:performance.now(),life:900});
  if(FX_floats.length>40)FX_floats.shift();
}

// (3) Small particle burst (gravity + fade), total capped
function FX_burst(sx,sy,color){
  const n=10;
  for(let i=0;i<n;i++){
    if(FX_particles.length>=FX_MAX_PARTICLES)break;
    const ang=Math.random()*Math.PI*2,sp=0.8+Math.random()*1.8;
    FX_particles.push({
      x:sx,y:sy,
      vx:Math.cos(ang)*sp,
      vy:Math.sin(ang)*sp-1.4,
      t0:performance.now(),life:520+Math.random()*220,
      r:(1.5+Math.random()*2),color:color
    });
  }
}

// Spawn all placement effects for a building. b is the building def (B[selTile]).
function FX_spawnPlace(gx,gy,b){
  if(typeof iso!=='function')return;
  const p=iso(gx,gy);
  FX_pops.set(gx+','+gy,{t0:performance.now()});
  const cost=(b&&b.cost)||0;
  if(cost>0)FX_float(p.x,p.y-10,'-$'+cost,'#e74c3c');
  const gain=(b&&b.pop)?('+인구'+b.pop):'완료';
  FX_float(p.x,p.y-28,gain,'#2ecc71');
  FX_burst(p.x,p.y,(b&&b.c)||'#ffd54f');
}

// Advance all effects (call once per frame)
function FX_update(){
  const now=performance.now();
  // Prune stale pops (FX_scale may never be polled if render module absent)
  FX_pops.forEach((_,key)=>{
    const e=FX_pops.get(key);
    if(e&&now-e.t0>=FX_POP_MS)FX_pops.delete(key);
  });
  for(let i=FX_floats.length-1;i>=0;i--){
    const f=FX_floats[i];
    if(now-f.t0>=f.life){FX_floats.splice(i,1);continue;}
    f.y+=f.vy;
  }
  for(let i=FX_particles.length-1;i>=0;i--){
    const pt=FX_particles[i];
    if(now-pt.t0>=pt.life){FX_particles.splice(i,1);continue;}
    pt.vy+=0.09;             // gravity
    pt.x+=pt.vx;pt.y+=pt.vy;
  }
}

// Render all effects on top of the scene
function FX_draw(c){
  const now=performance.now();
  // particles
  for(let i=0;i<FX_particles.length;i++){
    const pt=FX_particles[i];
    const a=1-(now-pt.t0)/pt.life;
    if(a<=0)continue;
    c.globalAlpha=Math.max(0,a);
    c.fillStyle=pt.color;
    c.beginPath();c.arc(pt.x,pt.y,pt.r,0,Math.PI*2);c.fill();
  }
  // floating text
  c.textAlign='center';c.textBaseline='middle';
  for(let i=0;i<FX_floats.length;i++){
    const f=FX_floats[i];
    const a=1-(now-f.t0)/f.life;
    if(a<=0)continue;
    c.globalAlpha=Math.max(0,a);
    c.font='bold 13px -apple-system,"Segoe UI",sans-serif';
    c.lineWidth=3;c.strokeStyle='rgba(255,255,255,0.85)';
    c.strokeText(f.text,f.x,f.y);
    c.fillStyle=f.color;
    c.fillText(f.text,f.x,f.y);
  }
  c.globalAlpha=1;
}


// === MISSIONS / GOALS / WIN CONDITION ===
// Sequential objectives that give the player a reason to keep playing.
// State: MIS_idx = index of the CURRENT (not-yet-completed) mission.
let MIS_idx=0;
let MIS_won=false;

// Helper: count buildings by category from the live grid (runs at 0.5Hz, cheap enough).
function MIS_counts(){
  let com=0,ind=0,spc=0;
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    const t=grid[y][x].t;
    if(t==='empty'||t==='road')continue;
    const cat=B[t]&&B[t].cat;
    if(cat==='상업')com++;
    else if(cat==='산업')ind++;
    else if(cat==='특수')spc++;
  }
  return{com,ind,spc};
}

// Each mission: {id, desc, check:(s)=>bool, reward}. s = {pop,money,hap,saf,bcount}.
const MIS_LIST=[
  {id:'m_pop100', desc:'인구 100명 달성', reward:2000,  check:s=>s.pop>=100},
  {id:'m_hap80',  desc:'행복도 80 이상 유지', reward:3000,  check:s=>s.hap>=80},
  {id:'m_mix',    desc:'상업·산업·특수 시설 각 3개 이상 건설', reward:5000, check:s=>{const c=MIS_counts();return c.com>=3&&c.ind>=3&&c.spc>=3;}},
  {id:'m_pop500', desc:'인구 500명 달성', reward:6000,  check:s=>s.pop>=500},
  {id:'m_money',  desc:'자금 150,000 모으기', reward:10000, check:s=>s.money>=150000},
  {id:'m_build40',desc:'건물 40개 건설', reward:8000,  check:s=>s.bcount>=40},
  {id:'m_pop1000',desc:'인구 1,000명 달성', reward:15000, check:s=>s.pop>=1000},
  {id:'m_pop5000',desc:'🏆 인구 5,000명 — 도시 마스터!', reward:50000, check:s=>s.pop>=5000}
];

// Update the always-visible banner.
function MIS_render(){
  const el=document.getElementById('MIS_banner');
  if(!el)return;
  if(MIS_won||MIS_idx>=MIS_LIST.length){
    el.className='done';
    el.innerHTML='👑 모든 목표 달성! 당신은 도시 마스터입니다!';
    return;
  }
  const m=MIS_LIST[MIS_idx];
  el.className='';
  el.innerHTML='🎯 ['+(MIS_idx+1)+'/'+MIS_LIST.length+'] '+m.desc+' <span class="MIS_rw">+'+m.reward.toLocaleString()+'</span>';
}

// Called from simulate() after the achievements block. st has {pop,money,hap,saf,bcount}.
function MIS_check(st){
  if(MIS_won||MIS_idx>=MIS_LIST.length)return;
  const m=MIS_LIST[MIS_idx];
  if(m.check(st)){
    money+=m.reward;
    const isFinal=(MIS_idx>=MIS_LIST.length-1);
    popup('🎯 목표 달성! +'+m.reward.toLocaleString(),true);
    MIS_idx++;
    if(window.playSfx)window.playSfx('mission');
    if(isFinal){
      MIS_won=true;
      popup('👑 축하합니다! 도시 마스터 달성 — 승리!',true);
    }
    MIS_render();
  }
}

// === AUDIO SFX (Web Audio, no external files) ===
var AUD_ctx=null;
var AUD_master=null;
var AUD_muted=false;
try{AUD_muted=localStorage.getItem('simcity_v3_mute')==='1';}catch(e){}

function AUD_ensure(){
  // Lazily create AudioContext + master gain; safe if unsupported.
  if(AUD_ctx)return AUD_ctx;
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return null;
    AUD_ctx=new AC();
    AUD_master=AUD_ctx.createGain();
    AUD_master.gain.value=AUD_muted?0:0.18;
    AUD_master.connect(AUD_ctx.destination);
  }catch(e){AUD_ctx=null;}
  return AUD_ctx;
}

function AUD_resume(){
  // Called on first user gesture so audio can play (autoplay policy).
  try{
    var c=AUD_ensure();
    if(c&&c.state==='suspended'&&c.resume)c.resume();
  }catch(e){}
}

function AUD_tone(freq,start,dur,type,peak){
  // Schedule one oscillator+gain envelope on the master bus.
  try{
    var c=AUD_ctx;if(!c||!AUD_master)return;
    var t0=c.currentTime+start;
    var osc=c.createOscillator();
    var g=c.createGain();
    osc.type=type||'sine';
    osc.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001,peak||0.6),t0+Math.min(0.02,dur*0.3));
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.connect(g);g.connect(AUD_master);
    osc.start(t0);
    osc.stop(t0+dur+0.02);
  }catch(e){}
}

function AUD_play(name){
  // Public SFX entry. Never throws; silently no-ops when audio unsupported/muted.
  try{
    if(AUD_muted)return;
    var c=AUD_ensure();if(!c)return;
    if(c.state==='suspended'&&c.resume)c.resume();
    if(name==='place'){
      // short bright pluck
      AUD_tone(880,0,0.10,'triangle',0.7);
      AUD_tone(1320,0.02,0.08,'sine',0.4);
    }else if(name==='bull'){
      // low thunk
      AUD_tone(150,0,0.14,'square',0.6);
      AUD_tone(90,0.01,0.16,'sine',0.5);
    }else if(name==='error'){
      // short low buzz
      AUD_tone(160,0,0.16,'sawtooth',0.5);
      AUD_tone(120,0.04,0.14,'square',0.35);
    }else if(name==='mission'){
      // rising 3-note jingle
      AUD_tone(523,0.00,0.14,'triangle',0.6);
      AUD_tone(659,0.13,0.14,'triangle',0.6);
      AUD_tone(784,0.26,0.22,'triangle',0.7);
    }else if(name==='disaster'){
      // alarm two-tone
      AUD_tone(440,0.00,0.20,'square',0.55);
      AUD_tone(330,0.22,0.20,'square',0.55);
      AUD_tone(440,0.44,0.20,'square',0.55);
      AUD_tone(330,0.66,0.24,'square',0.55);
    }
  }catch(e){}
}
window.playSfx=AUD_play;

window.AUD_toggle=function(){
  AUD_muted=!AUD_muted;
  try{localStorage.setItem('simcity_v3_mute',AUD_muted?'1':'0');}catch(e){}
  try{if(AUD_master)AUD_master.gain.value=AUD_muted?0:0.18;}catch(e){}
  var btn=document.getElementById('AUD_btn');
  if(btn)btn.textContent=AUD_muted?'🔇':'🔊';
  if(!AUD_muted){AUD_resume();window.playSfx('place');}
};

function AUD_initBtn(){
  var btn=document.getElementById('AUD_btn');
  if(btn)btn.textContent=AUD_muted?'🔇':'🔊';
}

// === R1: 배치 고스트 프리뷰 + 인접 보너스 미리보기 ===
function GHOST_preview(gx,gy,sx,sy,hw,hh){
  if(bulldoze)return;
  if(grid[gy][gx].t!=='empty')return;
  const b=B[selTile];if(!b||selTile==='empty')return;
  const img=IMG[selTile];
  ctx.save();ctx.globalAlpha=0.5;
  if(IMG_READY&&img&&img.complete&&img.naturalWidth>0){
    RND_drawSprite(img,sx,sy,hw,hh,gx,gy);
  }else{
    const bh=(b.h||1)*18*zoom;
    ctx.fillStyle=b.c;ctx.fillRect(sx-hw*0.4,sy-bh,hw*0.8,bh);
  }
  ctx.restore();
  const canAfford=money>=b.cost;
  const tips=[];
  const isProducer=(b.cat!=='인프라')&&(b.inc||b.pop||b.job);
  if(isProducer)tips.push(ADJ_roadAdjacent(gx,gy)?'🛣️연결':'⚠도로필요');
  const nb=[ADJ_typeAt(gx-1,gy),ADJ_typeAt(gx+1,gy),ADJ_typeAt(gx,gy-1),ADJ_typeAt(gx,gy+1)];
  if(selTile==='house'||selTile==='apt'||selTile==='mansion'){
    let pk=0,po=0;nb.forEach(t=>{if(t==='park')pk++;else if(t==='factory'||t==='warehouse')po++;});
    if(pk)tips.push('🌳행복+'+(pk*2));
    if(po)tips.push('🏭행복-'+(po*3));
  }
  if(selTile==='shop'||selTile==='mall'||selTile==='office'){
    if(nb.some(t=>t==='house'||t==='apt'||t==='mansion'))tips.push('💰수입+10%');
  }
  if(tips.length||!canAfford){
    const label=(!canAfford?'💸자금부족 ':'')+tips.join('  ');
    ctx.save();
    ctx.font='bold 11px -apple-system,"Segoe UI",sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    const tw=ctx.measureText(label).width+12;
    const ly=sy-hh-10;
    ctx.fillStyle='rgba(20,30,45,0.85)';
    if(ctx.roundRect){ctx.beginPath();ctx.roundRect(sx-tw/2,ly-9,tw,18,6);ctx.fill();}
    else ctx.fillRect(sx-tw/2,ly-9,tw,18);
    ctx.fillStyle=canAfford?'#ffe082':'#ff8a80';
    ctx.fillText(label,sx,ly);
    ctx.restore();
  }
}

// === R2: 계절 시각 변화 (지면색/하늘/눈) ===
const SEASON_GROUND=['#c5e8b0','#a6dd86','#e8d09e','#e9eff2']; // 봄 여름 가을 겨울
const SEASON_TREE=[['#5cb85c','#7cc77c'],['#3a9d3a','#5cb85c'],['#e8a33d','#d4762a'],['#cfd8dc','#eceff1']];
const SEASON_SKY=[
  'linear-gradient(180deg,#d6efff 0%,#f0f9ff 55%,#ffffff 100%)',
  'linear-gradient(180deg,#bce4ff 0%,#e8f7ff 55%,#ffffff 100%)',
  'linear-gradient(180deg,#ffe6c0 0%,#fff4e0 55%,#fffaf2 100%)',
  'linear-gradient(180deg,#d4dee8 0%,#eef3f7 55%,#ffffff 100%)'
];
function SEASON_ground(){return SEASON_GROUND[season]||SEASON_GROUND[0];}
function SEASON_treeCol(i){return (SEASON_TREE[season]||SEASON_TREE[0])[i];}
function SEASON_applySky(){const c=document.getElementById('gameCanvas');if(c)c.style.background=SEASON_SKY[season]||SEASON_SKY[0];}
function SEASON_snow(){
  if(season!==3)return;
  ctx.save();ctx.fillStyle='rgba(255,255,255,0.85)';
  const now=performance.now();
  for(let i=0;i<48;i++){
    const fx=(i*137.5+Math.sin(now*0.0006+i)*26)%cvs.width;
    const fy=(i*53+now*0.035*(0.6+(i%4)*0.18))%cvs.height;
    const r=1.2+(i%3)*0.7;
    ctx.beginPath();ctx.arc(fx,fy,r,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

window.INFO_show=function(gx,gy){
  const cell=grid[gy][gx];if(!cell||cell.t==='empty')return;
  const b=B[cell.t];if(!b)return;
  const old=document.getElementById('INFO_card');if(old)old.remove();
  const card=document.createElement('div');card.id='INFO_card';
  card.dataset.g=gx+','+gy;
  // 툴바를 가리지 않도록 툴바 높이 위에 배치
  const _tb=document.getElementById('toolbar');
  if(_tb)card.style.bottom=(_tb.offsetHeight+10)+'px';
  const stats=[];
  if(b.inc)stats.push('💰 수입 +'+b.inc);
  if(b.pop)stats.push('👥 인구 +'+b.pop);
  if(b.job)stats.push('💼 일자리 +'+b.job);
  if(b.hap)stats.push('😊 행복 '+(b.hap>0?'+':'')+b.hap);
  if(b.saf)stats.push('🛡️ 안전 +'+b.saf);
  if(b.pow)stats.push('⚡ 전력 '+(b.pow>0?'+':'')+b.pow);
  if(b.wat)stats.push('💧 수도 '+(b.wat>0?'+':'')+b.wat);
  if(b.exp)stats.push('📉 유지비 -'+b.exp);
  let status='';
  if(cell.dmg>0)status='<div class="INFO_warn">🔥 손상됨 ('+cell.dmg+'턴 복구중)</div>';
  else if(cell._dc)status='<div class="INFO_warn">⚠ 도로 미연결 — 생산 50%</div>';
  card.innerHTML='<div class="INFO_hd"><span style="font-size:22px">'+(b.ic||'🏢')+'</span> <b>'+b.n+'</b>'
    +'<span style="margin-left:auto;cursor:pointer;font-size:18px" onclick="this.parentNode.parentNode.remove()">✕</span></div>'
    +'<div class="INFO_desc">'+(b.d||'')+'</div>'+status
    +'<div class="INFO_stats">'+stats.map(s=>'<span>'+s+'</span>').join('')+'</div>'
    +'<button class="INFO_bull" onclick="INFO_demolish('+gx+','+gy+')">🗑️ 철거 (환불 '+Math.floor((b.cost||0)*0.3).toLocaleString()+')</button>';
  document.body.appendChild(card);
};
window.INFO_demolish=function(gx,gy){
  const cell=grid[gy][gx];
  if(cell&&cell.t!=='empty'){
    const old=B[cell.t];money+=Math.floor((old.cost||0)*0.3);
    grid[gy][gx]={t:'empty',dmg:0};
    if(window.playSfx)window.playSfx('bull');
    popup('🗑️ 철거 완료 (환불 30%)',false);updUI();
  }
  const c=document.getElementById('INFO_card');if(c)c.remove();
};
