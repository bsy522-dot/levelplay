<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>문명진화 - 원소재에서 완제품까지</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#1a1a2e;color:#e0e0e0;font-family:'Malgun Gothic','맑은 고딕',sans-serif;overflow:hidden;height:100vh;width:100vw;user-select:none}
#gameCanvas{display:block;cursor:pointer}
#ui-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
#ui-layer>*{pointer-events:auto}
#era-bar{position:absolute;top:0;left:0;right:0;height:40px;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:13px;z-index:10}
#era-bar .era-name{font-size:16px;font-weight:bold;color:#ffd700}
#era-bar .stats{display:flex;gap:14px}
#era-bar .stat{display:flex;align-items:center;gap:4px}
#objectives{position:absolute;top:48px;right:8px;width:200px;background:rgba(0,0,0,.75);border-radius:8px;padding:10px;font-size:12px;max-height:250px;overflow-y:auto}
#objectives h3{color:#ffd700;margin-bottom:6px;font-size:13px}
.obj-item{margin:3px 0;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.obj-done{color:#4caf50;text-decoration:line-through}
#inventory-bar{position:absolute;bottom:0;left:0;right:0;height:64px;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;gap:4px;padding:4px;z-index:10}
.inv-slot{width:52px;height:52px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;position:relative;cursor:pointer}
.inv-slot.selected{border-color:#ffd700;background:rgba(255,215,0,.15)}
.inv-slot .count{position:absolute;bottom:1px;right:3px;font-size:10px;color:#fff;text-shadow:1px 1px 1px #000}
.inv-slot .iname{font-size:7px;color:#ccc;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48px}
#minimap{position:absolute;top:48px;left:8px;width:140px;height:140px;background:rgba(0,0,0,.7);border-radius:8px;border:1px solid rgba(255,255,255,.2);overflow:hidden}
#minimap canvas{width:100%;height:100%}
#craft-panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:420px;max-width:92vw;max-height:80vh;background:rgba(20,20,40,.95);border:2px solid #ffd700;border-radius:12px;padding:16px;display:none;z-index:100;overflow-y:auto}
#craft-panel h2{color:#ffd700;text-align:center;margin-bottom:10px}
.craft-recipe{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:10px;margin:6px 0;cursor:pointer;transition:.2s}
.craft-recipe:hover{background:rgba(255,215,0,.1);border-color:#ffd700}
.craft-recipe.disabled{opacity:.4;cursor:not-allowed}
.craft-flow{text-align:center;font-size:13px;margin:4px 0;color:#aaa}
.craft-flow .arrow{color:#ffd700;margin:0 4px}
.craft-result{text-align:center;font-size:20px}
.craft-btn{display:block;margin:4px auto 0;padding:4px 16px;background:#ffd700;color:#000;border:none;border-radius:4px;cursor:pointer;font-weight:bold}
#edu-popup{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:380px;max-width:90vw;background:rgba(10,30,60,.95);border:2px solid #4fc3f7;border-radius:12px;padding:20px;display:none;z-index:110;text-align:center}
#edu-popup h3{color:#4fc3f7;margin-bottom:10px}
#edu-popup p{font-size:13px;line-height:1.6;margin:6px 0}
#edu-popup .close-btn{margin-top:12px;padding:6px 24px;background:#4fc3f7;color:#000;border:none;border-radius:6px;cursor:pointer;font-weight:bold}
#era-transition{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);display:none;z-index:200;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#era-transition h1{font-size:36px;color:#ffd700;margin-bottom:16px}
#era-transition p{font-size:16px;max-width:500px;line-height:1.8;margin:6px 0}
#era-transition .continue-btn{margin-top:24px;padding:10px 40px;background:#ffd700;color:#000;border:none;border-radius:8px;font-size:16px;cursor:pointer;font-weight:bold}
#build-panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:400px;max-width:90vw;max-height:80vh;background:rgba(20,20,40,.95);border:2px solid #8bc34a;border-radius:12px;padding:16px;display:none;z-index:100;overflow-y:auto}
#build-panel h2{color:#8bc34a;text-align:center;margin-bottom:10px}
.build-item{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:10px;margin:6px 0;cursor:pointer;transition:.2s}
.build-item:hover{background:rgba(139,195,74,.1);border-color:#8bc34a}
.build-item.disabled{opacity:.4;cursor:not-allowed}
#recipe-book{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:440px;max-width:92vw;max-height:80vh;background:rgba(20,15,10,.95);border:2px solid #a1887f;border-radius:12px;padding:16px;display:none;z-index:100;overflow-y:auto}
#recipe-book h2{color:#a1887f;text-align:center;margin-bottom:10px}
#save-panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:360px;max-width:90vw;background:rgba(20,20,40,.95);border:2px solid #ab47bc;border-radius:12px;padding:16px;display:none;z-index:100}
#save-panel h2{color:#ab47bc;text-align:center;margin-bottom:10px}
.save-slot{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:12px;margin:8px 0;cursor:pointer;transition:.2s;display:flex;justify-content:space-between;align-items:center}
.save-slot:hover{background:rgba(171,71,188,.1);border-color:#ab47bc}
#action-buttons{position:absolute;bottom:72px;right:8px;display:flex;gap:6px;z-index:10}
.action-btn{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.6);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.action-btn:hover{background:rgba(255,255,255,.15)}
#toast{position:absolute;top:50px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#ffd700;padding:8px 20px;border-radius:20px;font-size:13px;display:none;z-index:50;white-space:nowrap}
#day-night{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;transition:background .5s}
.panel-close{position:absolute;top:8px;right:12px;font-size:20px;cursor:pointer;color:#fff;background:none;border:none}
#menu-screen{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:300}
#menu-screen h1{font-size:42px;color:#ffd700;margin-bottom:8px;text-shadow:2px 2px 4px rgba(0,0,0,.5)}
#menu-screen .subtitle{font-size:14px;color:#aaa;margin-bottom:32px}
#menu-screen button{width:200px;padding:12px;margin:6px;background:rgba(255,215,0,.15);border:2px solid #ffd700;color:#ffd700;border-radius:8px;font-size:16px;cursor:pointer;font-family:inherit;transition:.2s}
#menu-screen button:hover{background:rgba(255,215,0,.3)}
@keyframes eraZoomIn{0%{transform:scale(0.5);opacity:0;filter:blur(20px)}50%{filter:blur(0)}100%{transform:scale(1);opacity:1}}
@keyframes eraGlow{0%,100%{text-shadow:0 0 20px #ffd700,0 0 40px #ffd700}50%{text-shadow:0 0 40px #fff,0 0 80px #ffd700}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
#era-transition.show h1{animation:eraZoomIn .8s ease-out, eraGlow 2s ease-in-out infinite .8s}
#era-transition .era-bg-fx{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%, rgba(255,215,0,.15), transparent 70%);pointer-events:none}
#screen-flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:250;mix-blend-mode:overlay}
#screen-flash.flash{animation:flashFade .5s ease-out}
@keyframes flashFade{0%{opacity:.6}100%{opacity:0}}
.craft-recipe.disabled{position:relative;overflow:hidden}
.craft-recipe:not(.disabled){background:linear-gradient(90deg,rgba(255,255,255,.05) 0%,rgba(255,215,0,.08) 50%,rgba(255,255,255,.05) 100%);background-size:200% 100%;animation:shimmer 3s linear infinite}
#craft-success-vfx{position:absolute;inset:0;pointer-events:none;z-index:120;display:none}
.vfx-burst{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none}
.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,3px)}}
/* ===== 조이스틱 비활성화 (D-pad 단독 사용) ===== */
#joystick{display:none !important}
/* ===== D-pad (좌하단, 큼지막한 십자형) — 모바일 게임 표준 ===== */
#dpad{position:absolute;left:16px;bottom:80px;width:180px;height:180px;z-index:30;touch-action:none;user-select:none;-webkit-user-select:none;pointer-events:none}
#dpad button{position:absolute;width:60px;height:60px;background:radial-gradient(circle,rgba(60,40,20,.85) 0%,rgba(20,10,5,.95) 80%);border:3px solid rgba(255,215,0,.7);color:#FFD700;font-size:30px;font-weight:bold;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.6),inset 0 2px 4px rgba(255,215,0,.15);pointer-events:auto;-webkit-tap-highlight-color:transparent;font-family:sans-serif}
#dpad button:active{background:radial-gradient(circle,rgba(255,215,0,.65) 0%,rgba(180,140,30,.9) 80%);transform:scale(0.92);box-shadow:0 0 18px rgba(255,215,0,.7)}
#dpad .up{top:0;left:60px}
#dpad .down{bottom:0;left:60px}
#dpad .left{left:0;top:60px}
#dpad .right{right:0;top:60px}
#dpad .center{top:60px;left:60px;width:60px;height:60px;background:radial-gradient(circle,rgba(76,175,80,.85) 0%,rgba(46,125,50,.95) 80%);border-color:#8BC34A;color:#fff;font-size:14px;font-weight:900;letter-spacing:-1px}
#dpad .center:active{background:radial-gradient(circle,rgba(139,195,74,.9) 0%,rgba(76,175,80,1) 80%)}
/* 모바일 화면 480px 이하: 약간 축소 */
@media(max-width:480px){
  #dpad{left:10px;bottom:74px;width:160px;height:160px}
  #dpad button{width:53px;height:53px;font-size:26px}
  #dpad .up,#dpad .down{left:53px}
  #dpad .left,#dpad .right{top:53px}
  #dpad .center{top:53px;left:53px;width:53px;height:53px;font-size:12px}
  /* 미니맵을 우상단으로, 작게 — D-pad 자리 비우기 */
  #minimap{left:auto !important;right:8px !important;top:48px !important;width:100px !important;height:100px !important}
  #objectives{top:158px !important;width:160px !important;font-size:10px !important}
}
</style>
</head>
<body>
<div id="menu-screen">
<h1>문명진화</h1>
<div class="subtitle">원소재에서 완제품까지 - 인류 문명의 여정</div>
<button onclick="startNewGame()">새 게임</button>
<button onclick="showLoadMenu()">불러오기</button>
</div>
<canvas id="gameCanvas"></canvas>
<div id="day-night"></div>
<div id="ui-layer">
<div id="era-bar">
<div class="era-name" id="era-name">석기시대</div>
<div class="stats">
<div class="stat">👤 <span id="pop-count">1</span></div>
<div class="stat">🌾 <span id="food-count">0</span></div>
<div class="stat">🕐 <span id="day-count">1일차</span></div>
<div class="stat" id="season-display">🌸 봄</div>
</div>
</div>
<div id="minimap"><canvas id="minimapCanvas" width="140" height="140"></canvas></div>
<div id="objectives"><h3>📋 목표</h3><div id="obj-list"></div></div>
<div id="inventory-bar"></div>
<div id="joystick">
<div id="joystick-stick"></div>
<div id="joystick-label">이동</div>
</div>
<div id="dpad">
<button class="up" onmousedown="dpadDown('up')" onmouseup="dpadUp()" onmouseleave="dpadUp()" ontouchstart="dpadDown('up');event.preventDefault()" ontouchend="dpadUp();event.preventDefault()" ontouchcancel="dpadUp()">▲</button>
<button class="down" onmousedown="dpadDown('down')" onmouseup="dpadUp()" onmouseleave="dpadUp()" ontouchstart="dpadDown('down');event.preventDefault()" ontouchend="dpadUp();event.preventDefault()" ontouchcancel="dpadUp()">▼</button>
<button class="left" onmousedown="dpadDown('left')" onmouseup="dpadUp()" onmouseleave="dpadUp()" ontouchstart="dpadDown('left');event.preventDefault()" ontouchend="dpadUp();event.preventDefault()" ontouchcancel="dpadUp()">◄</button>
<button class="right" onmousedown="dpadDown('right')" onmouseup="dpadUp()" onmouseleave="dpadUp()" ontouchstart="dpadDown('right');event.preventDefault()" ontouchend="dpadUp();event.preventDefault()" ontouchcancel="dpadUp()">►</button>
<button class="center" onclick="gatherNearest()" ontouchstart="event.preventDefault();gatherNearest()">채집</button>
</div>
<div id="action-buttons">
<div class="action-btn" onclick="toggleCraftPanel()" title="제작">🔨</div>
<div class="action-btn" onclick="toggleBuildPanel()" title="건설">🏗</div>
<div class="action-btn" onclick="toggleRecipeBook()" title="레시피북">📖</div>
<div class="action-btn" onclick="toggleSavePanel()" title="저장/불러오기">💾</div>
</div>
<div id="screen-flash"></div>
<div id="toast"></div>
<div id="audio-toggle" style="position:absolute;top:48px;right:220px;z-index:11;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.3);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:#fff" onclick="toggleAudio()" title="배경음">🔊</div>
<div id="ai-toggle" style="position:absolute;top:48px;right:262px;z-index:11;background:rgba(0,0,0,.6);border:1px solid rgba(255,215,0,.4);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:#FFD700" onclick="toggleAI()" title="AI 내레이터">🤖</div>
<div id="craft-panel"><button class="panel-close" onclick="toggleCraftPanel()">✕</button><h2>🔨 제작</h2><div id="craft-list"></div></div>
<div id="build-panel"><button class="panel-close" onclick="toggleBuildPanel()">✕</button><h2>🏗 건설</h2><div id="build-list"></div></div>
<div id="recipe-book"><button class="panel-close" onclick="toggleRecipeBook()">✕</button><h2>📖 레시피북</h2><div id="recipe-list"></div></div>
<div id="edu-popup"><h3 id="edu-title"></h3><div id="edu-body"></div><button class="close-btn" onclick="closeEdu()">확인!</button></div>
<div id="era-transition">
<video id="era-video" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s;z-index:1;pointer-events:none" muted playsinline></video>
<div style="position:relative;z-index:2;text-align:center;padding:20px;background:rgba(0,0,0,0.4);border-radius:16px">
<h1 id="era-trans-title"></h1><p id="era-trans-desc"></p>
<button class="continue-btn" onclick="closeEraTransition()">계속하기</button>
</div>
</div>
<div id="save-panel"><button class="panel-close" onclick="toggleSavePanel()">✕</button><h2>💾 저장/불러오기</h2><div id="save-list"></div></div>
</div>

<script>
// ========== GAME DATA ==========
const ERAS=[
{id:0,name:'석기시대',nameEn:'Stone Age',color:'#2d5016',bgColors:['#1a3a0a','#2d5016','#1a1a2e'],desc:'인류 최초의 시대. 돌과 나무로 도구를 만들어 생존하세요.',fact:'인류는 약 250만 년 전부터 돌을 깨뜨려 도구를 만들기 시작했습니다. 이것이 인류 문명의 첫 걸음이었습니다.'},
{id:1,name:'신석기시대',nameEn:'Neolithic',color:'#5d4037',bgColors:['#3e2723','#5d4037','#1a1a2e'],desc:'농경과 목축의 시작! 토기를 빚고, 직물을 짜고, 정착 생활을 시작하세요.',fact:'약 1만 년 전, 인류는 야생 밀과 보리를 재배하기 시작했습니다. 이 "신석기 혁명"으로 정착 생활이 가능해졌습니다.'},
{id:2,name:'청동기시대',nameEn:'Bronze Age',color:'#bf8040',bgColors:['#8d6e63','#bf8040','#2e1a00'],desc:'구리와 주석을 합금하여 청동을 만드세요! 금속 문명의 시작입니다.',fact:'청동은 구리에 주석을 약 10% 섞어 만듭니다. 순수한 구리보다 훨씬 단단하여 혁명적인 소재였습니다.'},
{id:3,name:'철기시대',nameEn:'Iron Age',color:'#616161',bgColors:['#424242','#616161','#1a1a2e'],desc:'철광석을 제련하여 더 강한 도구와 무기를 만드세요.',fact:'철은 청동보다 녹는점이 높아 제련이 어렵지만, 훨씬 단단하고 원료가 풍부합니다. 철기의 보급은 농업 생산성을 획기적으로 높였습니다.'},
{id:4,name:'중세',nameEn:'Medieval',color:'#5c6bc0',bgColors:['#283593','#5c6bc0','#1a237e'],desc:'성을 쌓고, 강철을 만들고, 유리를 제작하세요.',fact:'중세 유럽의 대장장이들은 철에 탄소를 첨가하여 강철을 만드는 법을 발전시켰습니다. 스테인드글라스는 금속 산화물로 색을 냈습니다.'},
{id:5,name:'산업혁명',nameEn:'Industrial',color:'#78909c',bgColors:['#455a64','#78909c','#263238'],desc:'증기기관을 발명하고, 공장을 세우고, 대량생산을 시작하세요!',fact:'1769년 제임스 와트의 증기기관은 인류 역사를 바꿨습니다. 석탄의 열에너지를 운동에너지로 변환하는 원리입니다.'},
{id:6,name:'현대',nameEn:'Modern',color:'#0288d1',bgColors:['#01579b','#0288d1','#0d47a1'],desc:'전기, 컴퓨터, 마천루! 현대 문명을 완성하세요.',fact:'실리콘(모래의 주성분)에서 반도체를 만들고, 석유에서 플라스틱을 만드는 기술이 현대 문명의 기초입니다.'}
];

const RESOURCES={
stick:{name:'나뭇가지',icon:'🪵',era:0},stone:{name:'돌',icon:'🪨',era:0},flint:{name:'부싯돌',icon:'💎',era:0},
wood:{name:'목재',icon:'🪓',era:0},fiber:{name:'식물섬유',icon:'🌿',era:0},meat:{name:'고기',icon:'🥩',era:0},
berry:{name:'열매',icon:'🫐',era:0},hide:{name:'가죽',icon:'🟤',era:0},
clay:{name:'점토',icon:'🟫',era:1},wheat:{name:'밀',icon:'🌾',era:1},rice:{name:'쌀',icon:'🍚',era:1},
cotton:{name:'목화',icon:'☁',era:1},seed:{name:'씨앗',icon:'🌱',era:1},
copperOre:{name:'구리광석',icon:'🟧',era:2},tinOre:{name:'주석광석',icon:'⬜',era:2},gold:{name:'금',icon:'✨',era:2},
ironOre:{name:'철광석',icon:'⬛',era:3},coal:{name:'석탄',icon:'◼',era:3},limestone:{name:'석회석',icon:'🔲',era:3},
sand:{name:'모래',icon:'🟡',era:4},saltpeter:{name:'초석',icon:'💠',era:4},
oil:{name:'석유',icon:'🛢',era:5},rubber:{name:'고무',icon:'⚫',era:5},
silicon:{name:'실리콘',icon:'💜',era:6},uranium:{name:'우라늄',icon:'☢',era:6}

function spawnParticles(x,y,opts={}){
  const count=opts.count||20;
  const colors=opts.colors||['#FFD700','#FFA500','#FFFFFF'];
  const speed=opts.speed||4;
  const life=opts.life||40;
  const gravity=opts.gravity!==undefined?opts.gravity:0.15;
  const size=opts.size||3;
  const shape=opts.shape||'circle';
  for(let i=0;i<count;i++){
    const ang=Math.random()*Math.PI*2;
    const sp=speed*(0.5+Math.random()*0.5);
    G.particles.push({
      x,y,
      vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-(opts.upward?2:0),
      life:life*(0.7+Math.random()*0.6),maxLife:life,
      color:colors[Math.floor(Math.random()*colors.length)],
      size:size*(0.7+Math.random()*0.6),
      gravity,shape,
      rot:Math.random()*Math.PI*2,vrot:(Math.random()-0.5)*0.2,
      world:opts.world!==false
    });
  }
}

const SPRITES={

  tiles:{}, // 시대별 타일

function loadSprite(category,name,subPath){
  const key=subPath?subPath+'/'+name:name;
  if(SPRITES[category][key])return SPRITES[category][key];
  const img=new Image();
  img.onload=()=>{img._loaded=true;};
  img.onerror=()=>{img._failed=true;};
  const path=subPath?`assets/sprites/${subPath}/${name}.png`:`assets/sprites/${category}/${name}.png`;
  img.src=path;
  SPRITES[category][key]=img;
  return img;
}
function preloadSprites(){
  // 건물
  BUILDINGS.forEach(b=>loadSprite('buildings',b.id));
  // 캐릭터 (legacy 1방향)
  ['stoneAgePerson','neolithicPerson','bronzePerson','ironPerson','medievalPerson','industrialPerson','modernPerson'].forEach(c=>loadSprite('characters',c));
  // 캐릭터 (신규 앞/뒤)
  ['stoneAgePerson','neolithicPerson','bronzePerson','ironPerson','medievalPerson','industrialPerson','modernPerson'].forEach(c=>{
    SPRITES.charsFront[c]=Object.assign(new Image(),{src:`assets/sprites/characters/front/${c}.png`,onload:function(){this._loaded=true;},onerror:function(){this._failed=true;}});
    SPRITES.charsBack[c]=Object.assign(new Image(),{src:`assets/sprites/characters/back/${c}.png`,onload:function(){this._loaded=true;},onerror:function(){this._failed=true;}});
  });
  // 자원 노드
  Object.keys(RESOURCES).forEach(r=>loadSprite('resources',r));
  // 시대별 타일 (7시대 × 3타입 = 21개)
  for(let e=0;e<7;e++){
    SPRITES.tiles[e]={};
    ['grass','dirt','stone'].forEach(t=>{
      const img=new Image();
      img.onload=function(){this._loaded=true;};
      img.onerror=function(){this._failed=true;};
      img.src=`assets/sprites/tiles/era${e}/${t}.png`;
      SPRITES.tiles[e][t]=img;
    });
  }
  // VFX 텍스처
  ['flame','smoke','sparkle','dust','water_splash','electric','leaf','rune'].forEach(v=>loadSprite('vfx',v));
}

let joyState={active:false,dx:0,dy:0,touchId:null,baseX:0,baseY:0,radius:50};
let padMode='joystick'; // 'joystick' | 'dpad'

function initJoystick(){
  const pad=document.getElementById('joystick');
  const stick=document.getElementById('joystick-stick');
  if(!pad)return;

  function start(e){
    e.preventDefault();
    const rect=pad.getBoundingClientRect();
    joyState.baseX=rect.left+rect.width/2;
    joyState.baseY=rect.top+rect.height/2;
    joyState.radius=rect.width/2-20;
    joyState.active=true;
    pad.classList.add('active');
    if(e.touches){
      joyState.touchId=e.touches[0].identifier;
      move(e);
    }else{
      move(e);
    }
  }
  function move(e){
    if(!joyState.active)return;
    let cx,cy;
    if(e.touches){
      let t=null;
      for(let i=0;i<e.touches.length;i++){
        if(e.touches[i].identifier===joyState.touchId){t=e.touches[i];break;}
      }
      if(!t)return;
      cx=t.clientX;cy=t.clientY;
    }else{
      cx=e.clientX;cy=e.clientY;
    }
    let dx=cx-joyState.baseX, dy=cy-joyState.baseY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>joyState.radius){
      dx=dx*joyState.radius/dist;
      dy=dy*joyState.radius/dist;
    }
    joyState.dx=dx/joyState.radius; // -1~+1
    joyState.dy=dy/joyState.radius;
    stick.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  }
  function end(e){
    if(e&&e.preventDefault)e.preventDefault();
    joyState.active=false;
    joyState.dx=0;joyState.dy=0;
    joyState.touchId=null;
    pad.classList.remove('active');
    stick.style.transform='translate(-50%,-50%)';
  }

  pad.addEventListener('touchstart',start,{passive:false});
  pad.addEventListener('touchmove',move,{passive:false});
  pad.addEventListener('touchend',end,{passive:false});
  pad.addEventListener('touchcancel',end,{passive:false});
  pad.addEventListener('mousedown',e=>{start(e);
    const mm=ev=>move(ev);
    const mu=ev=>{end(ev);window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);};
    window.addEventListener('mousemove',mm);
    window.addEventListener('mouseup',mu);
  });
}

    ctx.fillStyle='#D4760A';ctx.beginPath();ctx.arc(sx-3,sy+bob-2,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#E8A735';ctx.beginPath();ctx.arc(sx+4,sy+bob-5,4,0,Math.PI*2);ctx.fill();

function getResourceCategory(type){
if(['stone','flint','limestone','sand','saltpeter'].includes(type))return 'stone';
if(['stick','wood','fiber','rubber'].includes(type))return 'wood';
if(['copperOre','tinOre','gold','ironOre','coal','silicon','uranium','oil'].includes(type))return 'ore';
if(['clay'].includes(type))return 'clay';
return 'other';
}

function getEraResources(era){
const base=['stick','stone','wood','fiber','berry'];
if(era>=0) base.push('flint','meat','hide');
if(era>=1) base.push('clay','wheat','rice','cotton','seed');
if(era>=2) base.push('copperOre','tinOre','gold');
if(era>=3) base.push('ironOre','coal','limestone');
if(era>=4) base.push('sand','saltpeter');
if(era>=5) base.push('oil','rubber','cotton');
if(era>=6) base.push('silicon','uranium');
return base;
}

// ========== GAME LOOP ==========
function gameLoop(){
if(!gameStarted)return;
update();
render();
animFrame++;
requestAnimationFrame(gameLoop);
}

function update(){
// Movement
const spd=3;
// 가상 조이스틱 입력
if(joyState.active&&(Math.abs(joyState.dx)>0.15||Math.abs(joyState.dy)>0.15)){
  G.px+=joyState.dx*spd;
  G.py+=joyState.dy*spd;
  G.targetX=null;G.walking=true;G.walkFrame++;
  G._lastDx=joyState.dx;G._lastDy=joyState.dy;
}
// D-pad 입력
if(dpadHeld==='up'){G.py-=spd;G.targetX=null;G.walking=true;G.walkFrame++;G._lastDy=-1;}
if(dpadHeld==='down'){G.py+=spd;G.targetX=null;G.walking=true;G.walkFrame++;G._lastDy=1;}
if(dpadHeld==='left'){G.px-=spd;G.targetX=null;G.walking=true;G.walkFrame++;G._lastDx=-1;}
if(dpadHeld==='right'){G.px+=spd;G.targetX=null;G.walking=true;G.walkFrame++;G._lastDx=1;}
// 키보드 (PC)
if(keys['ArrowUp']||keys['w']){G.py-=spd;G.targetX=null;G.walking=true;G.walkFrame++;}
if(keys['ArrowDown']||keys['s']){G.py+=spd;G.targetX=null;G.walking=true;G.walkFrame++;}
if(keys['ArrowLeft']||keys['a']){G.px-=spd;G.targetX=null;G.walking=true;G.walkFrame++;}
if(keys['ArrowRight']||keys['d']){G.px+=spd;G.targetX=null;G.walking=true;G.walkFrame++;}
// Walk to target (click-to-move)
if(G.targetX!==null&&G.targetY!==null){
  const dx=G.targetX-G.px,dy=G.targetY-G.py;
  const d=Math.sqrt(dx*dx+dy*dy);
  if(d>3){G.px+=dx/d*spd;G.py+=dy/d*spd;G.walking=true;G.walkFrame++;}
  else{G.targetX=null;G.targetY=null;G.walking=false;}
}else if(!keys['ArrowUp']&&!keys['w']&&!keys['ArrowDown']&&!keys['s']&&
         !keys['ArrowLeft']&&!keys['a']&&!keys['ArrowRight']&&!keys['d']){
  G.walking=false;
}
G.px=Math.max(10,Math.min(WORLD_W*TILE-10,G.px));
G.py=Math.max(10,Math.min(WORLD_H*TILE-10,G.py));
// Update floating texts
if(G.floatingTexts){G.floatingTexts.forEach(ft=>{ft.y-=1;ft.t--});
  G.floatingTexts=G.floatingTexts.filter(ft=>ft.t>0);}

// Update particles
if(G.particles){
  G.particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    p.vy+=p.gravity;
    p.vx*=0.99;
    p.life--;
    if(p.shape==='smoke'){p.size+=0.15;p.vx*=0.95;}
    if(p.vrot)p.rot+=p.vrot;
  });
  G.particles=G.particles.filter(p=>p.life>0);
  if(G.particles.length>500)G.particles=G.particles.slice(-500);
}

// Building ambient particles
G.buildings.forEach(b=>{
  const sx=b.x-G.camX,sy=b.y-G.camY;
  if(sx<-60||sx>W+60||sy<-60||sy>H+60)return;
  if(b.type==='campfire'||b.type==='kiln'||b.type==='smelter'||b.type==='forge'){
    spawnAmbientFire(b.x,b.y);
  }
  if(b.type==='forge'||b.type==='factory'){
    spawnAmbientSparks(b.x,b.y);
  }
  if(b.type==='powerPlant'){
    if(Math.random()<0.2)spawnParticles(b.x,b.y-5,{count:1,colors:['#00E5FF','#FFFFFF'],speed:2,life:20,gravity:0,size:2,upward:true});
  }
});

// Screen shake decay
if(G.shakeAmount>0){
  G.shakeAmount*=G.shakeDecay||0.85;
  if(G.shakeAmount<0.1)G.shakeAmount=0;
}

// Camera follow + shake
G.camX=G.px-W/2;
G.camY=G.py-H/2;
if(G.shakeAmount>0){
  G.camX+=(Math.random()-0.5)*G.shakeAmount;
  G.camY+=(Math.random()-0.5)*G.shakeAmount;
}

// Day/night cycle
G.time++;
if(G.time>=DAY_LENGTH){
G.time=0;G.day++;
if(G.day%30===0){
G.season=(G.season+1)%4;
document.getElementById('season-display').textContent=SEASON_ICONS[G.season]+' '+SEASONS[G.season];
}
// Spawn resources periodically
if(G.day%5===0 && G.worldResources.length<200){
const rTypes=getEraResources(G.era);
for(let i=0;i<10;i++){
const rt=rTypes[Math.floor(Math.random()*rTypes.length)];
G.worldResources.push({type:rt,x:Math.random()*WORLD_W*TILE,y:Math.random()*WORLD_H*TILE,hp:3});
}
}
// Food consumption
const foodNeeded=Math.ceil(G.population/3);
const totalFood=(G.inv.meat||0)+(G.inv.berry||0)+(G.inv.bread||0)+(G.inv.wheat||0)+(G.inv.rice||0);
if(totalFood>=foodNeeded){
for(const f of['bread','meat','berry','wheat','rice']){
if(G.inv[f]&&G.inv[f]>0){const take=Math.min(G.inv[f],foodNeeded);G.inv[f]-=take;break;}
}
}
document.getElementById('day-count').textContent=G.day+'일차';
}

// Day/night visual
const dayProgress=G.time/DAY_LENGTH;
let nightAlpha=0;
if(dayProgress<0.25)nightAlpha=0.3*(1-dayProgress/0.25);
else if(dayProgress>0.75)nightAlpha=0.3*((dayProgress-0.75)/0.25);
document.getElementById('day-night').style.background=`rgba(0,0,40,${nightAlpha})`;

// Update food display
const totalFood=(G.inv.meat||0)+(G.inv.berry||0)+(G.inv.bread||0)+(G.inv.wheat||0)+(G.inv.rice||0);
document.getElementById('food-count').textContent=totalFood;
document.getElementById('pop-count').textContent=G.population;
document.getElementById('era-name').textContent=ERAS[G.era].name;

// Check objectives
updateObjectives();

// Villager AI
G.villagers.forEach(v=>{
v.moveTimer=(v.moveTimer||0)+1;
if(v.moveTimer>120){
v.moveTimer=0;
v.tx=v.x+(Math.random()-0.5)*100;
v.ty=v.y+(Math.random()-0.5)*100;
}
if(v.tx!==undefined){
const dx=v.tx-v.x,dy=v.ty-v.y;
const d=Math.sqrt(dx*dx+dy*dy);
if(d>2){v.x+=dx/d*1.5;v.y+=dy/d*1.5;}
}
});

// Keyboard shortcuts
if(keys['c']){keys['c']=false;toggleCraftPanel();}
if(keys['b']){keys['b']=false;toggleBuildPanel();}
if(keys['r']){keys['r']=false;toggleRecipeBook();}
if(keys[' ']){keys[' ']=false;gatherNearest();}
for(let i=1;i<=9;i++){if(keys[String(i)]){keys[String(i)]=false;G.selectedSlot=i-1;updateInventoryBar();}}
}

// ========== RENDERING ==========
function render(){
ctx.clearRect(0,0,W,H);

// Background
const era=ERAS[G.era];
const grad=ctx.createLinearGradient(0,0,0,H);
grad.addColorStop(0,era.bgColors[0]);
grad.addColorStop(0.5,era.bgColors[1]);
grad.addColorStop(1,era.bgColors[2]);
ctx.fillStyle=grad;
ctx.fillRect(0,0,W,H);

// Ground tiles - AI 시대별 텍스처
const startTX=Math.max(0,Math.floor(G.camX/TILE));
const startTY=Math.max(0,Math.floor(G.camY/TILE));
const endTX=Math.min(WORLD_W,Math.ceil((G.camX+W)/TILE));
const endTY=Math.min(WORLD_H,Math.ceil((G.camY+H)/TILE));

const tileGrass=getTileSprite('grass');
const tileDirt=getTileSprite('dirt');
const tileStone=getTileSprite('stone');
const useAITiles=tileGrass&&tileGrass._loaded&&!tileGrass._failed;

for(let tx=startTX;tx<endTX;tx++){
for(let ty=startTY;ty<endTY;ty++){
const sx=tx*TILE-G.camX;
const sy=ty*TILE-G.camY;
if(useAITiles){
  // 결정론적 시드(타일좌표 기반) — 같은 위치 항상 같은 타일
  const h=((tx*73856093)^(ty*19349663))>>>0;
  const pick=h%10;
  let sprite=tileGrass;
  if(pick<2&&tileStone&&tileStone._loaded)sprite=tileStone;
  else if(pick<5&&tileDirt&&tileDirt._loaded)sprite=tileDirt;
  ctx.drawImage(sprite,sx,sy,TILE,TILE);
}else{
  ctx.fillStyle=((tx+ty)%2===0)?'rgba(255,255,255,.03)':'rgba(0,0,0,.03)';
  ctx.fillRect(sx,sy,TILE,TILE);
  ctx.strokeStyle='rgba(255,255,255,.04)';
  ctx.strokeRect(sx,sy,TILE,TILE);
}
}
}

// Buildings
G.buildings.forEach(b=>{
const bDef=BUILDINGS.find(bd=>bd.id===b.type);
if(!bDef)return;
const sx=b.x-G.camX;
const sy=b.y-G.camY;
if(sx<-60||sx>W+60||sy<-60||sy>H+60)return;
// Shadow
ctx.fillStyle='rgba(0,0,0,.35)';
ctx.beginPath();ctx.ellipse(sx,sy+22,28,7,0,0,Math.PI*2);ctx.fill();
// AI sprite or emoji fallback
const spr=SPRITES.buildings[b.type];
if(spr&&spr._loaded&&!spr._failed){
  ctx.drawImage(spr,sx-32,sy-40,64,64);
}else{
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.fillRect(sx-18,sy-18,36,36);
  ctx.font='28px serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(bDef.icon,sx,sy);
}
ctx.font='9px sans-serif';
ctx.fillStyle='#FFD700';
ctx.textAlign='center';
ctx.fillText(bDef.name,sx,sy+30);
});

// Resources (visible nodes with distinct visuals)
G.worldResources.forEach(r=>{
const res=RESOURCES[r.type];
if(!res)return;
const sx=r.x-G.camX;
const sy=r.y-G.camY;
if(sx<-30||sx>W+30||sy<-30||sy>H+30)return;
const dx=G.px-r.x,dy=G.py-r.y;
const dist=Math.sqrt(dx*dx+dy*dy);
drawResourceNode(ctx,r,sx,sy,dist,animFrame);
});

// Villagers
G.villagers.forEach(v=>{
const sx=v.x-G.camX;
const sy=v.y-G.camY;
if(sx<-20||sx>W+20||sy<-20||sy>H+20)return;
ctx.font='16px serif';
ctx.textAlign='center';
ctx.fillText('👤',sx,sy);
});

// Player with walking animation
const px=G.px-G.camX;
const py=G.py-G.camY;
// Shadow
ctx.fillStyle='rgba(0,0,0,.35)';
ctx.beginPath();
ctx.ellipse(px,py+14,14,5,0,0,Math.PI*2);
ctx.fill();
const bobY=G.walking?Math.sin(G.walkFrame*0.3)*3:Math.sin(animFrame*0.05)*1;
// 이동 방향 추적 (마지막 dx 저장)
if(G.targetX!==null&&G.targetY!==null){
  G._lastDx=G.targetX-G.px;G._lastDy=G.targetY-G.py;
}else if(keys['ArrowLeft']||keys['a']){G._lastDx=-1;}
else if(keys['ArrowRight']||keys['d']){G._lastDx=1;}
else if(keys['ArrowUp']||keys['w']){G._lastDy=-1;}
else if(keys['ArrowDown']||keys['s']){G._lastDy=1;}
const dir=getPlayerDirection();
const facingLeft=(G._lastDx||0)<-0.1;
const charSpr=getCurrentCharacterSprite(dir);
if(charSpr&&charSpr._loaded&&!charSpr._failed){
  // AI 캐릭터 스프라이트 + 좌우 flip
  const sw=48, sh=56;
  ctx.save();
  if(facingLeft){
    ctx.translate(px,0);
    ctx.scale(-1,1);
    ctx.drawImage(charSpr,-sw/2,py-sh+10+bobY,sw,sh);
  }else{
    ctx.drawImage(charSpr,px-sw/2,py-sh+10+bobY,sw,sh);
  }
  ctx.restore();
}else{
  // Fallback: 도형 캐릭터
  const legAnim=G.walking?Math.sin(G.walkFrame*0.4)*4:0;
  ctx.fillStyle='#F5CBA7';ctx.beginPath();ctx.arc(px,py-10+bobY,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#3498DB';ctx.fillRect(px-5,py-3+bobY,10,12);
  ctx.fillStyle='#F5CBA7';
  ctx.fillRect(px-8,py-1+bobY+legAnim*0.3,3,8);
  ctx.fillRect(px+5,py-1+bobY-legAnim*0.3,3,8);
  ctx.fillStyle='#2C3E50';
  ctx.fillRect(px-4,py+9+bobY,3,6+legAnim);
  ctx.fillRect(px+1,py+9+bobY,3,6-legAnim);
  ctx.fillStyle='#333';ctx.fillRect(px-3,py-11+bobY,2,2);ctx.fillRect(px+1,py-11+bobY,2,2);
}
// Name
ctx.font='10px sans-serif';
ctx.fillStyle='#ffd700';ctx.textAlign='center';ctx.textBaseline='middle';
ctx.fillText('플레이어',px,py-22);
// Walking target indicator
if(G.targetX!==null){
  const tx=G.targetX-G.camX,ty=G.targetY-G.camY;
  ctx.strokeStyle='rgba(255,215,0,.4)';ctx.lineWidth=1;ctx.setLineDash([3,3]);
  ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(tx,ty);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,215,0,.5)';ctx.beginPath();ctx.arc(tx,ty,4,0,Math.PI*2);ctx.fill();
}
// Floating texts
if(G.floatingTexts){G.floatingTexts.forEach(ft=>{
  ctx.globalAlpha=Math.min(1,ft.t/20);
  ctx.fillStyle=ft.color||'#FFD700';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
  ctx.fillText(ft.text,ft.x-G.camX,ft.y-G.camY);ctx.globalAlpha=1;
});}

// Particles (rendered above world, below UI)
if(G.particles){
  ctx.save();
  G.particles.forEach(p=>{
    const psx=p.world?p.x-G.camX:p.x;
    const psy=p.world?p.y-G.camY:p.y;
    if(psx<-50||psx>W+50||psy<-50||psy>H+50)return;
    const alpha=Math.min(1,p.life/p.maxLife);
    ctx.globalAlpha=alpha;
    if(p.blend)ctx.globalCompositeOperation=p.blend;else ctx.globalCompositeOperation='source-over';
    // VFX 텍스처 우선
    let vfxName=null;
    if(p.shape==='smoke')vfxName='smoke';
    else if(p.shape==='spark')vfxName='electric';
    else if(p.shape==='star')vfxName='sparkle';
    else if(p.texture)vfxName=p.texture;
    const vfxImg=vfxName?SPRITES.vfx[vfxName]:null;
    if(vfxImg&&vfxImg._loaded&&!vfxImg._failed){
      const s=p.size*4;
      ctx.drawImage(vfxImg,psx-s/2,psy-s/2,s,s);
      return;
    }
    if(p.shape==='smoke'){
      ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(psx,psy,p.size,0,Math.PI*2);ctx.fill();
    }else if(p.shape==='spark'){
      ctx.strokeStyle=p.color;ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(psx-p.vx,psy-p.vy);ctx.lineTo(psx,psy);ctx.stroke();
    }else if(p.shape==='star'){
      ctx.translate(psx,psy);ctx.rotate(p.rot);ctx.fillStyle=p.color;
      ctx.beginPath();
      for(let i=0;i<5;i++){
        const a=i*Math.PI*2/5-Math.PI/2;
        ctx.lineTo(Math.cos(a)*p.size,Math.sin(a)*p.size);
        const a2=a+Math.PI/5;
        ctx.lineTo(Math.cos(a2)*p.size*0.5,Math.sin(a2)*p.size*0.5);
      }
      ctx.closePath();ctx.fill();
      ctx.setTransform(1,0,0,1,0,0);
    }else{
      ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(psx,psy,p.size,0,Math.PI*2);ctx.fill();
    }
  });
  ctx.restore();
}

// Gather range indicator
ctx.strokeStyle='rgba(255,215,0,.15)';
ctx.setLineDash([4,4]);
ctx.beginPath();
ctx.arc(px,py,50,0,Math.PI*2);
ctx.stroke();
ctx.setLineDash([]);

// Minimap
renderMinimap();
updateInventoryBar();
}

function renderMinimap(){
mmCtx.fillStyle='#111';
mmCtx.fillRect(0,0,140,140);
const scale=140/(WORLD_W*TILE);
// Resources as dots
G.worldResources.forEach(r=>{
const res=RESOURCES[r.type];
mmCtx.fillStyle=getResColor(r.type);
mmCtx.fillRect(r.x*scale,r.y*scale,2,2);
});
// Buildings
G.buildings.forEach(b=>{
mmCtx.fillStyle='#ffd700';
mmCtx.fillRect(b.x*scale-1,b.y*scale-1,3,3);
});
// Player
mmCtx.fillStyle='#ff0000';
mmCtx.fillRect(G.px*scale-2,G.py*scale-2,4,4);
// Camera view
mmCtx.strokeStyle='rgba(255,255,255,.4)';
mmCtx.strokeRect(G.camX*scale,G.camY*scale,W*scale,H*scale);
}

function getResColor(type){
const colors={stick:'#8B4513',stone:'#808080',flint:'#B0C4DE',wood:'#A0522D',fiber:'#228B22',
meat:'#DC143C',berry:'#4B0082',hide:'#8B7355',clay:'#CD853F',wheat:'#DAA520',rice:'#FFFFF0',
cotton:'#F5F5DC',seed:'#32CD32',copperOre:'#FF8C00',tinOre:'#C0C0C0',gold:'#FFD700',
ironOre:'#2F4F4F',coal:'#1C1C1C',limestone:'#D3D3D3',sand:'#F0E68C',saltpeter:'#00CED1',
oil:'#1a1a1a',rubber:'#333',silicon:'#9370DB',uranium:'#00FF00'};
return colors[type]||'#888';
}

// ========== INVENTORY ==========
function updateInventoryBar(){
const bar=document.getElementById('inventory-bar');
const allItems=Object.entries(G.inv).filter(([k,v])=>v>0);
let html='';
for(let i=0;i<10;i++){
const item=allItems[i];
const sel=i===G.selectedSlot?'selected':'';
if(item){
const[key,qty]=item;
const def=RESOURCES[key]||ITEMS[key]||{icon:'?',name:key};
html+=`<div class="inv-slot ${sel}" onclick="G.selectedSlot=${i};updateInventoryBar()"><span>${def.icon}</span><span class="count">${qty}</span><span class="iname">${def.name}</span></div>`;
}else{
html+=`<div class="inv-slot ${sel}" onclick="G.selectedSlot=${i}"></div>`;
}
}
bar.innerHTML=html;
}

function addItem(key,qty){
G.inv[key]=(G.inv[key]||0)+qty;
}
function hasItems(recipe){
for(const[k,v] of Object.entries(recipe)){
if((G.inv[k]||0)<v)return false;
}
return true;
}
function removeItems(recipe){
for(const[k,v] of Object.entries(recipe)){
G.inv[k]-=v;
if(G.inv[k]<=0)delete G.inv[k];
}
}

// ========== GATHERING ==========
function gatherNearest(){
let closest=null,minD=50;
G.worldResources.forEach(r=>{
const dx=G.px-r.x,dy=G.py-r.y;
const d=Math.sqrt(dx*dx+dy*dy);
if(d<minD){minD=d;closest=r;}
});
if(closest){
closest.hp--;
const res=RESOURCES[closest.type];
if(closest.hp<=0){
addItem(closest.type,1);
showToast(`${res.icon} ${res.name} 획득!`);
G.worldResources=G.worldResources.filter(r=>r!==closest);
// Discover recipes
discoverRecipesFor(closest.type);
}else{
showToast(`${res.icon} 채집 중... (${3-closest.hp}/3)`);
}
}else{
showToast('근처에 수집할 자원이 없습니다. (이동: 방향키/WASD, 수집: 스페이스/클릭)');
}
}

function discoverRecipesFor(resourceType){
RECIPES.forEach(r=>{
if(r.era<=G.era && !G.discoveredRecipes.includes(r.result)){
if(r.ingredients[resourceType]){
G.discoveredRecipes.push(r.result);
const item=ITEMS[r.result];
if(item)showToast(`📖 새 레시피 발견: ${item.name}!`);
}
}
});
}

function onCanvasClick(e){
if(!gameStarted)return;
// canvas 좌표 정확화 (모바일/줌/스크롤 대응)
const rect=canvas.getBoundingClientRect();
const cx=(e.clientX-rect.left)*(canvas.width/rect.width);
const cy=(e.clientY-rect.top)*(canvas.height/rect.height);
const mx=cx+G.camX;
const my=cy+G.camY;

// Check if clicked on resource
let clicked=null,minD=30;
G.worldResources.forEach(r=>{
const dx=mx-r.x,dy=my-r.y;
const d=Math.sqrt(dx*dx+dy*dy);
if(d<minD){minD=d;clicked=r;}
});

if(clicked){
const dx=G.px-clicked.x,dy=G.py-clicked.y;
const d=Math.sqrt(dx*dx+dy*dy);
if(d<80){
// Gather
clicked.hp--;
const res=RESOURCES[clicked.type];
if(clicked.hp<=0){
addItem(clicked.type,1);
showToast(`${res.icon} ${res.name} 획득!`);
// Floating text + harvest burst particles
if(!G.floatingTexts)G.floatingTexts=[];
G.floatingTexts.push({text:'+1 '+res.name,x:clicked.x,y:clicked.y-10,t:50,color:'#4CAF50'});
const cat=getResourceCategory(clicked.type);
const palette={stone:['#8a8a8a','#aaaaaa','#bbbbbb'],wood:['#5D4037','#8D6E63','#A1887F'],ore:['#FFD700','#D4760A','#E8A735'],clay:['#D2691E','#E8A060','#CD853F'],other:['#4CAF50','#81C784','#FFEB3B']}[cat]||['#FFD700'];
spawnParticles(clicked.x,clicked.y,{count:15,colors:palette,speed:3,life:35,gravity:0.2,size:3});
playSound(800+Math.random()*200,0.06,0.08);
G.worldResources=G.worldResources.filter(r=>r!==clicked);
discoverRecipesFor(clicked.type);
}else{
showToast(`${res.icon} 채집 중... (${3-clicked.hp}/3)`);
if(!G.floatingTexts)G.floatingTexts=[];
G.floatingTexts.push({text:(3-clicked.hp)+'/3',x:clicked.x,y:clicked.y-10,t:30,color:'#FFD700'});
spawnParticles(clicked.x,clicked.y,{count:5,colors:['#FFD700','#FFA500'],speed:2,life:20,gravity:0.15,size:2});
playSound(400+Math.random()*100,0.04,0.05);
}
}else{
// Walk toward resource
G.targetX=clicked.x;G.targetY=clicked.y;
}
}else{
// Walk to click position (정확한 캔버스 좌표 사용)
G.targetX=mx;
G.targetY=my;
}
}

function onCanvasTouch(e){
e.preventDefault();
const t=e.touches[0];
onCanvasClick({clientX:t.clientX,clientY:t.clientY});
}

// ========== CRAFTING ==========
function toggleCraftPanel(){
if(panelOpen==='craft'){
document.getElementById('craft-panel').style.display='none';
panelOpen=null;return;
}
closeAllPanels();
panelOpen='craft';
const panel=document.getElementById('craft-panel');
panel.style.display='block';
renderCraftList();
}

function renderCraftList(){
const list=document.getElementById('craft-list');
const available=RECIPES.filter(r=>r.era<=G.era);
let html='';
available.forEach((r,idx)=>{
const item=ITEMS[r.result];
if(!item)return;
const canCraft=hasItems(r.ingredients);
const ingStr=Object.entries(r.ingredients).map(([k,v])=>{
const def=RESOURCES[k]||ITEMS[k]||{icon:'?',name:k};
const have=G.inv[k]||0;
const color=have>=v?'#4caf50':'#f44336';
return `<span style="color:${color}">${def.icon}${def.name}×${v}(${have})</span>`;
}).join(' + ');
html+=`<div class="craft-recipe ${canCraft?'':'disabled'}" onclick="${canCraft?`craftItem(${idx})`:''}">
<div style="font-size:11px;color:#999">${r.process}</div>
<div class="craft-flow">${ingStr} <span class="arrow">→</span></div>
<div class="craft-result">${item.icon} ${item.name} ×${r.qty}</div>
${canCraft?`<button class="craft-btn">제작</button>`:'<div style="text-align:center;font-size:11px;color:#f44336">재료 부족</div>'}
</div>`;
});
if(!html)html='<p style="text-align:center;color:#888">현재 시대에서 제작할 수 있는 레시피가 없습니다.</p>';
list.innerHTML=html;
}

function craftItem(idx){
const r=RECIPES.filter(r=>r.era<=G.era)[idx];
if(!r||!hasItems(r.ingredients))return;
removeItems(r.ingredients);
addItem(r.result,r.qty);
G.crafted[r.result]=(G.crafted[r.result]||0)+r.qty;
if(!G.discoveredRecipes.includes(r.result))G.discoveredRecipes.push(r.result);
const item=ITEMS[r.result];
showToast(`✅ ${item.icon} ${item.name} 제작 완료!`);
// VFX: burst particles + screen shake
spawnParticles(G.px,G.py-10,{count:30,colors:['#FFD700','#FFA500','#FFEB3B','#FFFFFF'],speed:5,life:50,gravity:0.1,size:3,shape:'star'});
spawnParticles(G.px,G.py-10,{count:20,colors:['#FFD700'],speed:8,life:30,gravity:0.05,size:2});
screenShake(4);
// Play craft chime (3-tone arpeggio)
playChord([523,659,784],0.15);
// AI 내레이션 (첫 발견 시 30% 확률)
const isFirst=(G.crafted[r.result]||0)===r.qty;
if(isFirst)aiCraftDiscovery(item.name);
// Show educational popup
if(r.edu){
setTimeout(()=>showEdu(r.edu.title,r.edu.body),500);
}
renderCraftList();
updateObjectives();
}

// ========== BUILDING ==========
function toggleBuildPanel(){
if(panelOpen==='build'){
document.getElementById('build-panel').style.display='none';
panelOpen=null;return;
}

function renderBuildList(){
const list=document.getElementById('build-list');
const available=BUILDINGS.filter(b=>b.era<=G.era);
let html='';
available.forEach((b,idx)=>{
const costItems={};
Object.entries(b.cost).forEach(([k,v])=>costItems[k]=v);
const canBuild=hasItems(costItems);
const costStr=Object.entries(b.cost).map(([k,v])=>{
const def=RESOURCES[k]||ITEMS[k]||{icon:'?',name:k};
const have=G.inv[k]||0;
const color=have>=v?'#4caf50':'#f44336';
return `<span style="color:${color}">${def.icon}${v}(${have})</span>`;
}).join(' ');
html+=`<div class="build-item ${canBuild?'':'disabled'}" onclick="${canBuild?`buildItem('${b.id}')`:''}">
<div style="font-size:20px">${b.icon} ${b.name}</div>
<div style="font-size:11px;color:#aaa;margin:4px 0">${b.desc}</div>
<div style="font-size:12px">필요: ${costStr}</div>
${b.pop>0?`<div style="font-size:11px;color:#4caf50">인구 +${b.pop}</div>`:''}
${canBuild?`<button class="craft-btn" style="background:#8bc34a">건설</button>`:'<div style="text-align:center;font-size:11px;color:#f44336">재료 부족</div>'}
</div>`;
});
list.innerHTML=html;
}

function buildItem(id){
const b=BUILDINGS.find(bd=>bd.id===id);
if(!b)return;
const costItems={};
Object.entries(b.cost).forEach(([k,v])=>costItems[k]=v);
if(!hasItems(costItems))return;
removeItems(costItems);
// Place near player
const bx=G.px+(Math.random()-0.5)*80;
const by=G.py+(Math.random()-0.5)*80;
G.buildings.push({type:id,x:bx,y:by});
G.built[id]=(G.built[id]||0)+1;
// Add population
if(b.pop>0){
G.population+=b.pop;
for(let i=0;i<b.pop;i++){
G.villagers.push({x:bx+(Math.random()-0.5)*40,y:by+(Math.random()-0.5)*40});
}
}
showToast(`🏗 ${b.icon} ${b.name} 건설 완료!`);
// VFX: dust burst + heavy shake
spawnParticles(bx,by+15,{count:40,colors:['#8d6e63','#bcaaa4','#a1887f'],speed:3,life:60,gravity:0.08,size:4});
spawnParticles(bx,by-5,{count:15,colors:['#FFD700','#FFFFFF'],speed:5,life:40,gravity:0.1,size:3,shape:'star'});
screenShake(6);
playChord([392,494,587],0.18);
// AI 내레이션 (40% 확률)
aiBuildingEvent(b.name);
renderBuildList();
updateObjectives();
}

// ========== WEB AUDIO ==========
let audioCtx=null,audioMuted=false,ambientNodes=null,masterGain=null;
function getAudioCtx(){
if(!audioCtx){
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  masterGain=audioCtx.createGain();
  masterGain.gain.value=audioMuted?0:0.6;
  masterGain.connect(audioCtx.destination);
}
return audioCtx;
}
function playSound(freq,dur,vol,type){
try{
const ac=getAudioCtx();
const osc=ac.createOscillator();
const gain=ac.createGain();
osc.type=type||'sine';
osc.frequency.value=freq;
gain.gain.value=vol||0.1;
gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
osc.connect(gain);
gain.connect(masterGain);
osc.start();
osc.stop(ac.currentTime+dur);
}catch(e){}
}
function playChord(freqs,dur,vol){
  freqs.forEach((f,i)=>{
    setTimeout(()=>playSound(f,dur||0.2,(vol||0.12)*(1-i*0.1),'triangle'),i*40);
  });
}
// ========== AMBIENT BGM (시대별 procedural pad) ==========
const ERA_AMBIENT=[
  // 석기시대: low drone + occasional bird
  {root:130.81,scale:[0,3,5,7,10],tempo:8000,pad:'sawtooth',color:'primal'},
  // 신석기시대: warmer pad
  {root:146.83,scale:[0,2,4,7,9],tempo:7000,pad:'triangle',color:'pastoral'},
  // 청동기시대: brass-like
  {root:164.81,scale:[0,2,4,5,7,9],tempo:6500,pad:'sawtooth',color:'heroic'},
  // 철기시대: metallic
  {root:174.61,scale:[0,3,5,6,7,10],tempo:6000,pad:'square',color:'industrial'},
  // 중세: minor harmonic
  {root:196.00,scale:[0,2,3,5,7,8,11],tempo:5500,pad:'triangle',color:'medieval'},
  // 산업혁명: rhythmic mechanical
  {root:220.00,scale:[0,2,3,5,7,9,10],tempo:4000,pad:'sawtooth',color:'mechanical'},
  // 현대: ambient electronic
  {root:261.63,scale:[0,2,4,5,7,9,11],tempo:5000,pad:'sine',color:'modern'}
];
function switchEraAmbient(era){
  stopAmbient();
  startAmbient(era);
}
function startAmbient(era){
  if(audioMuted)return;
  try{
    const ac=getAudioCtx();
    const cfg=ERA_AMBIENT[era]||ERA_AMBIENT[0];
    ambientNodes={cfg,timer:null,oscs:[]};
    // Persistent drone (root + fifth)
    [cfg.root/2, cfg.root, cfg.root*1.5].forEach((f,i)=>{
      const osc=ac.createOscillator();
      const g=ac.createGain();
      const lfo=ac.createOscillator();
      const lfoG=ac.createGain();
      osc.type=cfg.pad;
      osc.frequency.value=f;
      g.gain.value=0;
      g.gain.linearRampToValueAtTime(0.025-i*0.005,ac.currentTime+3);
      lfo.frequency.value=0.1+i*0.05;
      lfoG.gain.value=2;
      lfo.connect(lfoG);lfoG.connect(osc.frequency);
      osc.connect(g);g.connect(masterGain);
      osc.start();lfo.start();
      ambientNodes.oscs.push({osc,lfo,g});
    });
    // Melodic notes (procedural pentatonic)
    const playMelody=()=>{
      if(!ambientNodes||audioMuted)return;
      const note=cfg.scale[Math.floor(Math.random()*cfg.scale.length)];
      const oct=[1,2,2,4][Math.floor(Math.random()*4)];
      const f=cfg.root*oct*Math.pow(2,note/12);
      playSound(f,1.5,0.04,'triangle');
      ambientNodes.timer=setTimeout(playMelody,cfg.tempo*0.5+Math.random()*cfg.tempo);
    };
    ambientNodes.timer=setTimeout(playMelody,2000);
  }catch(e){console.warn('ambient err',e);}
}
function stopAmbient(){
  if(!ambientNodes)return;
  try{
    const ac=audioCtx;
    if(ambientNodes.timer)clearTimeout(ambientNodes.timer);
    ambientNodes.oscs.forEach(({osc,lfo,g})=>{
      g.gain.linearRampToValueAtTime(0,ac.currentTime+0.5);
      setTimeout(()=>{try{osc.stop();lfo.stop();}catch(e){}},600);
    });
  }catch(e){}
  ambientNodes=null;
}
function toggleAudio(){
  audioMuted=!audioMuted;
  document.getElementById('audio-toggle').textContent=audioMuted?'🔇':'🔊';
  if(masterGain)masterGain.gain.value=audioMuted?0:0.6;
  if(audioMuted){stopAmbient();}else{startAmbient(G.era);}
}

// ========== OLLAMA AI NARRATOR (동적 이벤트) ==========
const OLLAMA_URL='http://127.0.0.1:11434';
const OLLAMA_MODEL='gemma4:e4b-it-q4_K_M';
let aiEnabled=localStorage.getItem('civevo_ai_enabled')!=='0'; // default on
let aiFailed=false;

async function aiGenerate(prompt,maxTokens){
  if(!aiEnabled||aiFailed)return null;
  try{
    const ctrl=new AbortController();
    const timeoutId=setTimeout(()=>ctrl.abort(),5000);
    const r=await fetch(OLLAMA_URL+'/api/generate',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:OLLAMA_MODEL,
        prompt:prompt,
        stream:false,
        options:{temperature:0.9,num_predict:maxTokens||40,top_p:0.9}
      }),
      signal:ctrl.signal
    });
    clearTimeout(timeoutId);
    const j=await r.json();
    let text=(j.response||'').trim();
    // Strip markdown/quotes
    text=text.replace(/^["'`*\s]+|["'`*\s]+$/g,'').replace(/\n+/g,' ');
    if(text.length<2||text.length>200)return null;
    return text;
  }catch(e){
    console.warn('AI offline:',e.message);
    aiFailed=true;
    setTimeout(()=>{aiFailed=false;},30000); // retry after 30s
    return null;
  }
}

async function aiEraEvent(era){
  const eraName=ERAS[era].name;
  const prompt=`너는 문명 게임 내레이터다. "${eraName}" 시대에 진입한 부족에게 일어난 흥미로운 사건을 한국어 한 문장으로 묘사해라. 따옴표 없이 문장만:`;
  const result=await aiGenerate(prompt,60);
  if(result){
    showAINarration(`📜 ${eraName} - ${result}`);
  }
}

    document.body.appendChild(n);
