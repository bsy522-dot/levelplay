// Audio — lazy 생성: 첫 제스처 시점에 만들어 autoplay 정책 위반 방지
let AC=null;
function ensureAudio(){
 if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;return null;}}
 if(AC.state==='suspended')AC.resume();
 return AC;
}
function playSound(type){
 const ac=ensureAudio();
 if(!ac)return;
 const o=ac.createOscillator(),g=ac.createGain(),n=ac.createBufferSource();
 g.connect(ac.destination);
 if(type==='chop'){
  const buf=ac.createBuffer(1,ac.sampleRate*.08,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/800);
  n.buffer=buf;n.connect(g);g.gain.value=.3;n.start();
 }else if(type==='sizzle'){
  const buf=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.15*Math.exp(-i/8000);
  n.buffer=buf;n.connect(g);g.gain.value=.25;n.start();
 }else if(type==='boil'){
  const buf=ac.createBuffer(1,ac.sampleRate*.4,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){const t=i/ac.sampleRate;d[i]=Math.sin(t*200+Math.sin(t*50)*5)*.1*Math.exp(-i/15000)+(Math.random()-.5)*.05;}
  n.buffer=buf;n.connect(g);g.gain.value=.2;n.start();
 }else if(type==='ding'){
  o.connect(g);o.frequency.value=880;g.gain.setValueAtTime(.3,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.3);o.start();o.stop(ac.currentTime+.3);
 }else if(type==='star'){
  o.connect(g);o.frequency.setValueAtTime(523,ac.currentTime);o.frequency.setValueAtTime(659,ac.currentTime+.1);o.frequency.setValueAtTime(784,ac.currentTime+.2);g.gain.setValueAtTime(.2,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.4);o.start();o.stop(ac.currentTime+.4);
 }else if(type==='click'){
  o.connect(g);o.frequency.value=600;g.gain.setValueAtTime(.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.05);o.start();o.stop(ac.currentTime+.05);
 }
}

// Resize
function resize(){
 dpr=window.devicePixelRatio||1;
 W=window.innerWidth;H=window.innerHeight;
 C.width=W*dpr;C.height=H*dpr;
 C.style.width=W+'px';C.style.height=H+'px';
 X.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize);

// Input
function getXY(e){
 const t=e.touches?e.touches[0]:e;
 return{x:t.clientX,y:t.clientY};
}
C.addEventListener('touchstart',e=>{e.preventDefault();const p=getXY(e);tx=tapX=p.x;ty=tapY=p.y;touching=true;tapped=true;},{passive:false});
C.addEventListener('touchmove',e=>{e.preventDefault();const p=getXY(e);tx=p.x;ty=p.y;},{passive:false});
C.addEventListener('touchend',e=>{e.preventDefault();touching=false;if(Math.abs(tx-tapX)<12&&Math.abs(ty-tapY)<12)upTap=true;},{passive:false});
C.addEventListener('mousedown',e=>{const p=getXY(e);tx=tapX=p.x;ty=tapY=p.y;touching=true;tapped=true;});
C.addEventListener('mousemove',e=>{if(touching){tx=e.clientX;ty=e.clientY;}});
C.addEventListener('mouseup',()=>{touching=false;if(Math.abs(tx-tapX)<12&&Math.abs(ty-tapY)<12)upTap=true;});

// Drawing helpers
function fillRect(x,y,w,h,c){X.fillStyle=c;X.fillRect(x,y,w,h);}
function drawText(txt,x,y,size,color,align='center',bold=false){
 X.font=(bold?'bold ':'')+size+'px "Segoe UI",sans-serif';
 X.fillStyle=color;X.textAlign=align;X.textBaseline='middle';
 X.fillText(txt,x,y);
}
function wrapLines(txt,maxW,size,bold,maxLines){
 X.font=(bold?'bold ':'')+size+'px "Segoe UI",sans-serif';
 const hasSpace=txt.indexOf(' ')>=0;
 const tokens=hasSpace?txt.split(' '):txt.split('');
 const join=hasSpace?' ':'';
 const lines=[]; let cur='';
 for(const t of tokens){
  const test=cur?cur+join+t:t;
  if(X.measureText(test).width>maxW&&cur){lines.push(cur);cur=t;}
  else cur=test;
 }
 if(cur)lines.push(cur);
 if(maxLines&&lines.length>maxLines){
  const kept=lines.slice(0,maxLines);
  let last=kept[maxLines-1];
  while(last.length>1&&X.measureText(last+'…').width>maxW)last=last.slice(0,-1);
  kept[maxLines-1]=last+'…';
  return kept;
 }
 return lines;
}
function pickDragIngredient(recipe,step,stepText){
 const need=recipe.ingredients||[];
 const inText=need.find(ing=>stepText&&stepText.includes(ing));
 if(inText)return inText;
 let dragIdx=0;
 for(let i=0;i<step;i++)if(recipe.stepTypes[i]==='drag')dragIdx++;
 return need[dragIdx % need.length] || need[0] || '재료';
}
function drawRoundRect(x,y,w,h,r,fill,stroke){
 X.beginPath();X.roundRect(x,y,w,h,r);
 if(fill){X.fillStyle=fill;X.fill();}
 if(stroke){X.strokeStyle=stroke;X.lineWidth=2;X.stroke();}
}
function drawBtn(x,y,w,h,txt,color='#FF8C42'){
 const g=X.createLinearGradient(x,y,x,y+h);
 g.addColorStop(0,color);g.addColorStop(1,shadeColor(color,-.2));
 drawRoundRect(x,y,w,h,12,g);
 drawRoundRect(x,y+3,w,h-3,12,null,shadeColor(color,-.3));
 drawText(txt,x+w/2,y+h/2,Math.min(16,h*.4),'#fff','center',true);
 return{x,y,w,h};
}
function shadeColor(c,p){
 const n=parseInt(c.slice(1),16);
 const r=Math.min(255,Math.max(0,((n>>16)&0xFF)+((n>>16)&0xFF)*p));
 const g=Math.min(255,Math.max(0,((n>>8)&0xFF)+((n>>8)&0xFF)*p));
 const b=Math.min(255,Math.max(0,(n&0xFF)+(n&0xFF)*p));
 return '#'+(0x1000000+((r|0)<<16)+((g|0)<<8)+(b|0)).toString(16).slice(1);
}
function hitTest(bx,by,bw,bh,px,py){return px>=bx&&px<=bx+bw&&py>=by&&py<=by+bh;}

// Particles
function addParticle(x,y,type){
 for(let i=0;i<(type==='star'?8:4);i++){
  particles.push({x,y,vx:(Math.random()-.5)*4,vy:-Math.random()*3-1,life:1,type,
   color:type==='star'?['#FFD700','#FFA500','#FF6347'][i%3]:type==='steam'?'#ddd':'#FF6347',
   size:type==='star'?6:type==='steam'?8:4});
 }
}
function updateParticles(){
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life-=.02;
  if(p.type==='steam')p.vy-=.02;else p.vy+=.1;
  if(p.life<=0)particles.splice(i,1);
 }
}
function drawParticles(){
 particles.forEach(p=>{
  X.globalAlpha=p.life;X.fillStyle=p.color;
  X.beginPath();X.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);X.fill();
 });
 X.globalAlpha=1;
}

// Buttons tracking
let btns=[];
function clearBtns(){btns=[];}
function regBtn(x,y,w,h,label,color){
 btns.push({x,y,w,h,action:null,label});
 return drawBtn(x,y,w,h,label,color);
}
function checkBtns(){
 if(!tapped)return;
 for(const b of btns){
  if(hitTest(b.x,b.y,b.w,b.h,tapX,tapY)){
   playSound('click');b.action();tapped=false;return;
  }
 }
}

 totalPossible=recipe.ingredients.length;dragItem=null;

 cookExitConfirm=false;   // C-3
 document.getElementById('hud').classList.remove('hidden');
 updateHUD();
}

function drawCooking(){
 if(ingredientPhase){drawIngredientSelect();}
 else{drawCookingStep();}
}

function drawCookingStep(){
 const recipe=currentRecipe;
 const step=recipe.steps[cookStep];
 const stype=recipe.stepTypes[cookStep];
 const isLast=cookStep>=recipe.steps.length-1;
 // 비상구 모달 떠 있으면 조리(연속) 입력만 무시. tapped은 모달 버튼(checkBtns)용으로 유지 (C-3)
 if(cookExitConfirm){touching=false;}

 // Kitchen bg
 fillRect(0,0,W,H,'#EFEBE9');
 // Stove area
 const stoveY=H*.3;
 fillRect(0,stoveY,W,H*.4,'#78909C');
 fillRect(0,stoveY,W,4,'#546E7A');
 // Burner with animated flame
 const bx=W/2,by=stoveY+H*.2;
 X.beginPath();X.arc(bx,by,50,0,Math.PI*2);
 X.fillStyle=stype==='hold'&&touching?'#FF5722':'#37474F';X.fill();
 // Animated flame ring when cooking
 if(stype==='hold'&&touching){
   for(let i=0;i<8;i++){
     const a=i*Math.PI/4+animT*3;
     const fx=bx+Math.cos(a)*42,fy=by+Math.sin(a)*42;
     const fs=4+Math.sin(animT*8+i)*2;
     X.fillStyle='rgba(255,100,0,'+(0.5+Math.sin(animT*6+i)*0.3)+')';
     X.beginPath();X.arc(fx,fy,fs,0,Math.PI*2);X.fill();
   }
 }
 X.beginPath();X.arc(bx,by,35,0,Math.PI*2);X.fillStyle='#263238';X.fill();

 // Pan on stove with cooking state visual
 const panY=by-20;
 X.beginPath();X.ellipse(bx,panY,65,25,0,0,Math.PI*2);X.fillStyle='#424242';X.fill();
 X.beginPath();X.ellipse(bx,panY-5,58,20,0,0,Math.PI*2);
 // Cooking state transition: raw -> cooking -> done
 const cookProgress=stype==='hold'?Math.min(1,holdProgress/holdTarget):stepComplete?1:0;
 if(cookProgress>0.7){X.fillStyle='#8B6914';} // done - golden brown
 else if(cookProgress>0.3){X.fillStyle='#A0522D';} // cooking - browning
 else{X.fillStyle='#616161';} // raw - grey pan
 X.fill();

 // Stirring animation (circular motion of food in pan)
 if(stype==='hold'&&touching&&!stepComplete){
   const stirAngle=animT*4;
   const stirR=15;
   for(let i=0;i<3;i++){
     const sa=stirAngle+i*Math.PI*2/3;
     const sx=bx+Math.cos(sa)*stirR,sy=panY-5+Math.sin(sa)*stirR*0.4;
     X.fillStyle=['#FFE0B2','#FFCC80','#FFB74D'][i];
     X.beginPath();X.arc(sx,sy,5,0,Math.PI*2);X.fill();
   }
 }

 // Recipe emoji in pan (bounce when cooking)
 const emojiShake=stype==='hold'&&touching?Math.sin(animT*10)*3:0;
 drawText(recipe.emoji,bx+emojiShake,panY-5+emojiShake*0.5,30,'#000');

 // Boiling bubbles
 if(stype==='hold'&&touching&&(step.includes('끓') ||step.includes('익'))){
   for(let i=0;i<5;i++){
     const bub=Math.sin(animT*3+i*1.5);
     const bubX=bx-20+i*10+Math.sin(animT*2+i)*5;
     const bubY=panY-10-Math.abs(bub)*20;
     const bubR=2+Math.abs(bub)*2;
     X.fillStyle='rgba(255,255,255,'+(0.3+Math.abs(bub)*0.3)+')';
     X.beginPath();X.arc(bubX,bubY,bubR,0,Math.PI*2);X.fill();
   }
 }

 // Chopping animation
 if(stype==='tap'&&!stepComplete&&(step.includes('잘') ||step.includes('썰'))){
   const chopAngle=Math.sin(animT*8)*0.3;
   X.save();X.translate(bx+50,panY-30);X.rotate(chopAngle);
   X.fillStyle='#9E9E9E';X.fillRect(-2,-15,4,15);
   X.fillStyle='#BDBDBD';X.fillRect(-6,-18,12,5);
   X.restore();
 }

 // Counter
 fillRect(0,H*.7,W,H*.3,'#6D4C41');fillRect(0,H*.7,W,4,'#4E342E');

 // Step info
 drawRoundRect(10,H*.72,W-20,H*.12,10,'rgba(255,253,231,.95)','#FFB74D');
 drawText(`단계 ${cookStep+1}/${recipe.steps.length}`,W/2,H*.75,12,'#E65100','center',true);
 drawText(step,W/2,H*.79,14,'#3E2723','center',true);

 // Step type instruction
 let instrText='';
 if(stype==='hold')instrText='꾹 누르고 있으세요!';
 else if(stype==='drag')instrText='재료를 냄비로 드래그!';
 else instrText='화면을 터치하세요!';
 drawText(instrText,W/2,H*.84,12,'#FF6D00');

 // Progress bar for hold
 if(stype==='hold'){
  holdTarget=(step.includes('4초')?4:3)*(1-0.1*(equipment.stove-1)); // 화구 업그레이드 '요리 시간 -10%' 실제 적용
  if(touching&&!stepComplete){
   holdProgress+=(window._dt||1/60);
   // Fire effect
   if(frame%3===0)addParticle(bx+Math.random()*40-20,panY+10,'fire');
   if(frame%10===0)addParticle(bx+Math.random()*30-15,panY-20,'steam');
  }
  const pct=Math.min(1,holdProgress/holdTarget);
  drawRoundRect(W*.15,H*.87,W*.7,14,7,'#E0E0E0');
  drawRoundRect(W*.15,H*.87,W*.7*pct,14,7,pct>=1?'#4CAF50':'#FF9800');
  drawText(Math.floor(pct*100)+'%',W/2,H*.875+7,11,'#fff','center',true);

  if(holdProgress>=holdTarget&&!stepComplete){
   stepComplete=true;cookScore+=20;playSound('ding');
   addParticle(W/2,H*.5,'star');
  }
 }else if(stype==='drag'){
  // Drag zone
  if(!stepComplete){
   const dzw=72,dzh=72,dzx=Math.max(12,W*.06),dzy=64;
   drawRoundRect(dzx,dzy,dzw,dzh,10,'#FFF9C4','#FFC107');
   const dragIngr=pickDragIngredient(recipe,cookStep,step);
   const info=INGREDIENT_INFO[dragIngr];
   drawText(info?info.emoji:'🍽️',dzx+dzw/2,dzy+dzh/2-6,26,'#000');
   drawText(dragIngr,dzx+dzw/2,dzy+dzh/2+20,9,'#5D4037','center',true);

   if(tapped&&!cookExitConfirm&&hitTest(dzx,dzy,dzw,dzh,tapX,tapY)){
    dragItem={x:dzx,y:dzy};tapped=false;
   }
   if(dragItem&&touching){
    // Smooth drag with trail effect
    X.globalAlpha=0.3;drawText(info?info.emoji:'🍽️',dragItem.x+(tx-dragItem.x)*0.3,dragItem.y+(ty-dragItem.y)*0.3,28,'#000');
    X.globalAlpha=1;drawText(info?info.emoji:'🍽️',tx,ty,32,'#000');
    // Animated dashed arrow to pan
    X.strokeStyle='#FF9800';X.lineWidth=2;
    const dashOffset=animT*20;
    X.setLineDash([8,8]);X.lineDashOffset=-dashOffset;
    X.beginPath();X.moveTo(tx,ty+20);X.lineTo(bx,panY);X.stroke();X.setLineDash([]);X.lineDashOffset=0;
    // Target glow on pan
    X.fillStyle='rgba(255,152,0,'+(0.2+Math.sin(animT*5)*0.15)+')';
    X.beginPath();X.ellipse(bx,panY,70,28,0,0,Math.PI*2);X.fill();
   }
   if(dragItem&&!touching){
    if(Math.abs(tx-bx)<80&&Math.abs(ty-panY)<60){
     stepComplete=true;cookScore+=20;playSound('sizzle');
     addParticle(bx,panY,'star');
    }
    dragItem=null;
   }
  }
 }else{
  // Tap (비상구 ✕ 영역은 제외 — 탭 단계에서 ✕를 눌러도 단계가 완료돼버리던 문제)
  if(tapped&&!stepComplete&&!cookExitConfirm&&!hitTest(W-48,H*.045,40,40,tapX,tapY)){
   stepComplete=true;cookScore+=20;playSound('chop');
   addParticle(tapX,tapY,'star');
   tapped=false;
  }
 }

 // Steam/fire particles
 if(!stepComplete&&frame%8===0){
  addParticle(bx+Math.random()*60-30,panY-25,'steam');
 }

 // Next step button
 if(stepComplete){
  drawText('✅ 완료!',W/2,H*.15,20,'#4CAF50','center',true);
  const nbw=160,nbh=40;
  regBtn(W/2-nbw/2,H*.18,nbw,nbh,isLast?'요리 완성!':'다음 단계 →','#4CAF50');
  btns[btns.length-1].action=()=>{
   if(isLast){finishCooking();}
   else{cookStep++;holdProgress=0;stepComplete=false;dragItem=null;}
  };
 }

 // ===== 요리 중 비상구 ✕ + 모달 (C-3) =====
 if(!cookExitConfirm){
  const xs=40, xx=W-xs-8, xy=H*.045;
  drawRoundRect(xx,xy,xs,xs,12,'rgba(244,67,54,.92)','#B71C1C');
  drawText('✕',xx+xs/2,xy+xs/2,22,'#fff','center',true);
  if(tapped&&hitTest(xx,xy,xs,xs,tapX,tapY)){tapped=false;cookExitConfirm=true;playSound('click');}
 }else{
  fillRect(0,0,W,H,'rgba(0,0,0,.55)');
  const mw=Math.min(300,W-40),mh=180,mx=(W-mw)/2,my=(H-mh)/2;
  drawRoundRect(mx,my,mw,mh,18,'#FFF8E1','#FFB74D');
  drawText('🍳',W/2,my+34,34,'#000');
  drawText('요리를 그만둘까요?',W/2,my+70,17,'#3E2723','center',true);
  drawText('지금 나가면 이 요리는 사라져요',W/2,my+94,12,'#8D6E63','center');
  const bw=mw/2-22, bh=46;
  regBtn(mx+14,my+mh-58,bw,bh,'계속하기 ✨','#4CAF50');
  btns[btns.length-1].action=()=>{cookExitConfirm=false;};
  regBtn(mx+mw-bw-14,my+mh-58,bw,bh,'그만두기','#8D6E63');
  btns[btns.length-1].action=()=>{
   cookExitConfirm=false;
   if(state==='cooking_restaurant'){state='restaurant';document.getElementById('hud').classList.remove('hidden');document.getElementById('hud-timer').classList.remove('hidden');}
   else{state='recipes';scrollY=0;document.getElementById('hud').classList.add('hidden');}
   currentRecipe=null;
  };
 }

 drawParticles();
 updateParticles();
}

function finishCooking(){
 const recipe=currentRecipe;
 // 틀린 재료 선택 감점(-0.5개분) — 기존엔 아무 페널티가 없어 재료를 아무거나 더 담아도 만점이었음
 const wrongCount=selectedIngredients.filter(x=>!recipe.ingredients.includes(x)).length;
 // 칼/팬 업그레이드 '재료 점수 +5'/'맛 점수 +5' 실제 적용 (레벨당 +5)
 const ingScore=Math.max(0,Math.round(((correctCount-wrongCount*0.5)/totalPossible)*50))+(equipment.knife-1)*5;
 const maxStep=recipe.steps.length*20;
 const stepScore=Math.round((Math.min(cookScore,maxStep)/maxStep)*30);
 const presScore=Math.round((Math.min(cookScore,maxStep)/maxStep)*20)+(equipment.pan-1)*5; // C-5: 난수 제거, 수행도 기반
 const total=Math.min(100,ingScore+stepScore+presScore);
 if(state==='cooking_restaurant'){
  const reward=Math.floor(total/5)+5;
  coins+=reward;servedCount++;
  save();playSound('star');
  state='restaurant';currentRecipe=null;
  document.getElementById('hud-timer').classList.remove('hidden');
 }else{
  state='result';
  const stars=total>=90?3:total>=70?2:total>=40?1:0;
  const prevStars=earnedStars[recipe.id]||0;
  if(stars>prevStars){totalStars+=stars-prevStars;earnedStars[recipe.id]=stars;}
  coins+=stars*10+Math.floor(total/5);
  playerLevel=1+Math.floor(totalStars/5);
  cookScore=total;
  save();playSound('star');
 }
}

// Restaurant Mode
function startRestaurant(){
 if(totalStars<3){alert('⭐ 3개 이상 모아야 레스토랑을 열 수 있어요!');return;}
 restaurantMode=true;state='restaurant';customers=[];servedCount=0;orderTimer=180*60;spawnAcc=0;
 spawnCustomer();
 document.getElementById('hud').classList.remove('hidden');
 document.getElementById('hud-timer').classList.remove('hidden');
}

function spawnCustomer(){
 const available=RECIPES.filter(r=>earnedStars[r.id]>=1);
 if(available.length===0)return;
 const r=available[Math.floor(Math.random()*available.length)];
 const emojis=['👦','👧','👨','👩','👴','👵','🧑'];
 customers.push({recipe:r,emoji:emojis[Math.floor(Math.random()*emojis.length)],patience:100,x:W+60,targetX:60+customers.length*90});
}

function drawRestaurant(){
 fillRect(0,0,W,H,'#EFEBE9');
 // Restaurant bg
 fillRect(0,0,W,H*.15,'#D84315');
 drawText('🍴 레스토랑 모드',W/2,H*.08,20,'#FFF','center',true);
 drawText(`주문 완료: ${servedCount}  남은시간: ${Math.ceil(orderTimer/3600)}분`,W/2,H*.13,12,'#FFCC80');

 // Counter
 fillRect(0,H*.55,W,8,'#5D4037');
 fillRect(0,H*.56,W,H*.44,'#8D6E63');

 // 실제 경과시간 기반(60fps 프레임 단위 환산) — 120Hz 기기에서 타이머/인내심이 2배속으로 돌던 문제
 const rdt=(window._dt||1/60)*60;
 orderTimer-=rdt;
 // HUD 타이머 칩 실시간 갱신 (기존엔 ⏱ 0:00으로 얼어 있었음)
 const remS=Math.max(0,Math.ceil(orderTimer/60));
 document.getElementById('hud-timer').textContent='⏱ '+Math.floor(remS/60)+':'+String(remS%60).padStart(2,'0');
 if(orderTimer<=0){endRestaurant();return;}

 // Customers
 for(let i=customers.length-1;i>=0;i--){
  const c=customers[i];
  if(c.x>c.targetX)c.x=Math.max(c.targetX,c.x-2*rdt);
  c.patience-=.015*rdt;

  const cy=H*.45;
  // Customer
  drawText(c.emoji,c.x,cy,36,'#000');
  // Speech bubble
  drawRoundRect(c.x-35,cy-60,70,35,10,'#fff','#FFB74D');
  drawText(c.recipe.emoji+' '+c.recipe.name,c.x,cy-42,10,'#3E2723','center',true);
  // Patience bar
  drawRoundRect(c.x-25,cy+25,50,6,3,'#E0E0E0');
  const pc=c.patience/100;
  drawRoundRect(c.x-25,cy+25,50*pc,6,3,pc>.5?'#4CAF50':pc>.25?'#FF9800':'#F44336');

  if(c.patience<=0){customers.splice(i,1);continue;}

  // Tap to cook
  if(tapped&&Math.abs(tapX-c.x)<40&&Math.abs(tapY-cy)<50){
   tapped=false;
   currentRecipe=c.recipe;
   selectedIngredients=[...c.recipe.ingredients];
   correctCount=c.recipe.ingredients.length;
   totalPossible=c.recipe.ingredients.length;
   ingredientPhase=false;cookStep=0;holdProgress=0;stepComplete=false;
   cookScore=0;dragItem=null;
   state='cooking_restaurant';customers.splice(i,1);
   break;
  }
 }

 // Spawn timer (프레임 카운트 대신 실시간 누적 — 주사율 무관 5초 간격)
 spawnAcc+=rdt;
 if(spawnAcc>=300){spawnAcc=0;if(customers.length<4)spawnCustomer();}

 // Back
 regBtn(10,H-45,70,30,'나가기','#8D6E63');
 btns[btns.length-1].action=()=>endRestaurant();
}

function endRestaurant(){
 const bonus=servedCount*15;coins+=bonus;
 restaurantMode=false;state='menu';
 document.getElementById('hud').classList.add('hidden');
 document.getElementById('hud-timer').classList.add('hidden');
 save();
 alert(`레스토랑 종료! ${servedCount}명에게 서빙!\n보너스: 🪙 ${bonus}`);
}

// Upgrade
function drawUpgrade(){
 fillRect(0,0,W,H,'#FFF3E0');
 drawText('🔧 주방 업그레이드',W/2,35,22,'#D84315','center',true);
 drawText(`🪙 ${coins}`,W/2,60,16,'#795548');

 regBtn(10,10,60,30,'← 뒤로','#8D6E63');
 btns[btns.length-1].action=()=>{state='menu';};

 const items=[
  {key:'stove',emoji:'🔥',name:'화구'},
  {key:'knife',emoji:'🔪',name:'칼'},
  {key:'pan',emoji:'🍳',name:'팬'}
 ];

 items.forEach((item,i)=>{
  const ey=100+i*110;
  const lv=equipment[item.key];
  drawRoundRect(20,ey,W-40,95,12,'#FFFDE7','#FFB74D');
  drawText(item.emoji,55,ey+25,28,'#000');
  drawText(item.name,90,ey+20,16,'#3E2723','left',true);
  drawText(`Lv.${lv} - ${EQUIP_NAMES[item.key][lv-1]}`,90,ey+42,13,'#795548','left');

  if(lv<3){
   const cost=EQUIP_COST[lv];
   const canBuy=coins>=cost;
   const bw=100,bh=32;
   drawRoundRect(W-130,ey+20,bw,bh,8,canBuy?'#4CAF50':'#9E9E9E');
   drawText(`🪙 ${cost}`,W-80,ey+36,13,'#fff','center',true);
   if(tapped&&hitTest(W-130,ey+20,bw,bh,tapX,tapY)&&canBuy){
    tapped=false;coins-=cost;equipment[item.key]=lv+1;save();playSound('star');
   }
  }else{
   drawText('MAX',W-80,ey+36,14,'#4CAF50','center',true);
  }

  // Bonus info
  const bonuses=['요리 시간 -10%','재료 점수 +5','맛 점수 +5'];
  drawText(`효과: ${bonuses[i]}`,60,ey+70,11,'#FF6D00','left');
 });
}

// Encyclopedia
function drawEncyclopedia(){
 fillRect(0,0,W,H,'#FFF3E0');
 drawText('📚 재료 도감',W/2,30,22,'#D84315','center',true);
 regBtn(10,10,60,30,'← 뒤로','#8D6E63');
 btns[btns.length-1].action=()=>{state='menu';};

 const keys=Object.keys(INGREDIENT_INFO);
 let cy=60-scrollY;
 const groups=['탄수화물','단백질','지방','비타민','무기질','기타'];
 const gcolors={'탄수화물':'#FF9800','단백질':'#F44336','지방':'#FFC107','비타민':'#4CAF50','무기질':'#2196F3','기타':'#9E9E9E'};

 for(const g of groups){
  const items=keys.filter(k=>INGREDIENT_INFO[k].group===g);
  if(items.length===0)continue;
  if(cy>-20&&cy<H+20){
   drawRoundRect(15,cy,W-30,22,5,gcolors[g]);
   drawText(g,W/2,cy+11,13,'#fff','center',true);
  }
  cy+=30;
  for(const k of items){
   if(cy>-50&&cy<H+20){
    const info=INGREDIENT_INFO[k];
    drawRoundRect(20,cy,W-40,42,8,'#FFFDE7','#FFE0B2');
    drawText(info.emoji,44,cy+21,20,'#000');
    drawText(k,70,cy+13,13,'#3E2723','left',true);
    drawText(`${info.origin} | ${info.season}`,70,cy+30,10,'#8D6E63','left');
    drawText(info.desc.substring(0,18),W-25,cy+21,10,'#5D4037','right');
   }
   cy+=48;
  }
  cy+=5;
 }
 if(touching){const off=ty-tapY;if(Math.abs(off)>14)scrollY=Math.max(0,scrollY-off*.3);} // 14px 데드존: 탭 중 미세 떨림으로 목록이 흐르지 않게
}

// Main loop
let _lastT=0;
function gameLoop(ts){
 if(!_lastT)_lastT=ts||performance.now();
 const now=ts||performance.now();
 let dt=(now-_lastT)/1000; _lastT=now;
 if(!(dt>0)||dt>0.1)dt=1/60;
 window._dt=dt;
 frame++;clearBtns();animT+=dt;
 X.clearRect(0,0,W,H);

 switch(state){
  case'menu':drawMenu();break;
  case'recipes':drawRecipeList();break;
  case'cooking':drawCooking();break;
  case'cooking_restaurant':
   drawCooking();
   // After finishing in restaurant
   break;
  case'result':drawResult();break;
  case'restaurant':drawRestaurant();break;
  case'upgrade':drawUpgrade();break;
  case'encyclopedia':drawEncyclopedia();break;
 }

 checkBtns();
 tapped=false;upTap=false;
 requestAnimationFrame(gameLoop);
}

// Init
load();resize();
const _unlock=()=>{ensureAudio();window.removeEventListener('pointerdown',_unlock);window.removeEventListener('touchstart',_unlock);};
window.addEventListener('pointerdown',_unlock);
window.addEventListener('touchstart',_unlock,{passive:true});
gameLoop();
</script>
</body>
</html>
