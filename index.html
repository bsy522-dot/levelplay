function openU(id){let h='';
if(id==='calc')h='<b>🧮 계산기</b><input class="fi" id="cV" placeholder="수식" style="margin:6px 0"><button class="bt bp" onclick="try{document.getElementById(\'cR\').textContent=\'= \'+Function(\'return \'+document.getElementById(\'cV\').value)()}catch(e){document.getElementById(\'cR\').textContent=\'오류\'}">계산</button><div style="margin-top:6px;padding:8px;background:var(--bg);border-radius:6px;color:var(--cy);font-size:14px" id="calcR"></div>';
else if(id==='unit')h='<b>📏 단위변환</b><select class="fi" id="uT" style="margin:4px 0"><option value="l">길이</option><option value="w">무게</option><option value="t">온도</option></select><input class="fi" type="number" id="uV" placeholder="값" oninput="uCv()"><div style="margin-top:6px;padding:8px;background:var(--bg);border-radius:6px;color:var(--cy)" id="uR"></div>';
else if(id==='timer')h='<b>⏱️ 스톱워치</b><div id="tmD" style="font-size:32px;font-weight:900;text-align:center;background:var(--g1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:12px 0">00:00.0</div><div style="display:flex;gap:6px;justify-content:center"><button class="bt bp" onclick="tTg()">시작/중지</button><button class="bt bs" onclick="tRs()">리셋</button></div>';
else if(id==='dday')h='<b>📅 D-Day</b><input type="date" class="fi" style="margin:6px 0" onchange="const d=new Date(this.value),t=new Date();t.setHours(0,0,0,0);const df=Math.ceil((d-t)/864e5);document.getElementById(\'ddR\').textContent=df===0?\'D-Day!\':df>0?\'D-\'+df:\'D+\'+Math.abs(df)"><div style="padding:12px;background:var(--bg);border-radius:6px;font-size:24px;text-align:center;font-weight:900;color:var(--cy)" id="ddR"></div>';
else if(id==='bmi')h='<b>🏋️ BMI</b><input class="fi" type="number" id="bH" placeholder="키(cm)" style="margin:4px 0"><input class="fi" type="number" id="bW" placeholder="몸무게(kg)"><button class="bt bp" style="margin-top:6px" onclick="const h=document.getElementById(\'bH\').value/100,w=document.getElementById(\'bW\').value,b=(w/(h*h)).toFixed(1),s=b<18.5?\'저체중\':b<25?\'정상\':b<30?\'과체중\':\'비만\';document.getElementById(\'bR\').textContent=\'BMI \'+b+\' (\'+s+\')\'">계산</button><div style="padding:12px;background:var(--bg);border-radius:6px;font-size:18px;text-align:center;font-weight:700;color:var(--cy);margin-top:6px" id="bR"></div>';
else if(id==='rand')h='<b>🎲 랜덤</b><div style="display:flex;gap:4px;margin:6px 0"><button class="bt bp" onclick="document.getElementById(\'rR\').textContent=Math.floor(Math.random()*100+1)">1~100</button><button class="bt bs" onclick="document.getElementById(\'rR\').textContent=Array.from(crypto.getRandomValues(new Uint8Array(12))).map(b=>\'abcdefghjkmnpqrstuvwxyz23456789\'[b%30]).join(\'\')">비밀번호</button></div><div style="padding:12px;background:var(--bg);border-radius:6px;font-size:20px;text-align:center;font-weight:700;color:var(--cy)" id="rR">-</div>';
document.getElementById('moB').innerHTML=h;document.getElementById('mo').classList.add('sh');}
function uCv(){const t=document.getElementById('uT').value,v=+document.getElementById('uV').value||0,r=document.getElementById('uR');if(t==='l')r.textContent=v+'cm = '+(v/2.54).toFixed(2)+'in = '+(v/100).toFixed(3)+'m';else if(t==='w')r.textContent=v+'kg = '+(v*2.205).toFixed(2)+'lb';else r.textContent=v+'C = '+(v*9/5+32).toFixed(1)+'F';}
let tmOn=0,tmSt=0,tmEl=0,tmRf;function tTg(){if(tmOn){tmOn=0;tmEl+=performance.now()-tmSt;cancelAnimationFrame(tmRf);}else{tmOn=1;tmSt=performance.now();tmTk();}}function tmTk(){if(!tmOn)return;const t=tmEl+performance.now()-tmSt;document.getElementById('tmD').textContent=String(t/6e4|0).padStart(2,'0')+':'+String((t%6e4)/1e3|0).padStart(2,'0')+'.'+(t%1e3/100|0);tmRf=requestAnimationFrame(tmTk);}function tRs(){tmOn=0;tmEl=0;cancelAnimationFrame(tmRf);document.getElementById('tmD').textContent='00:00.0';}

function pH(p){return'<div class="po" onclick="sPost('+p.id+')"><div class="po-t">'+p.t+'</div><div class="po-m"><span>👤'+p.a+'</span><span>❤️'+p.l+'</span><span>💬'+(p.c||[]).length+'</span><span>'+tA(p.m)+'</span></div></div>';}
function sPost(id){const p=[...P,...U.mp].find(x=>x.id===id);if(!p)return;document.getElementById('moB').innerHTML='<div style="font-size:14px;font-weight:700;margin-bottom:4px">'+p.t+'</div><div style="font-size:9px;color:var(--t3);margin-bottom:8px">👤'+p.a+' · '+tA(p.m)+' · ❤️'+p.l+'</div><div style="font-size:12px;color:var(--t2);line-height:1.7;white-space:pre-wrap">'+(p.b||'')+'</div>'+(p.c||[]).map(c=>'<div style="padding:4px 0;border-bottom:1px solid rgba(139,92,246,.03)"><div style="font-size:10px;font-weight:600;color:var(--cy)">'+c.a+'</div><div style="font-size:11px;color:var(--t2)">'+c.t+'</div></div>').join('');document.getElementById('mo').classList.add('sh');xp(3,'글읽기');}
function shW(){document.getElementById('moB').innerHTML='<div style="font-size:14px;font-weight:700;margin-bottom:8px">✏️ 글쓰기</div><input class="fi" id="wT" placeholder="제목" style="margin-bottom:6px"><textarea class="fi" id="wB" rows="4" placeholder="내용"></textarea><div style="display:flex;gap:4px;justify-content:flex-end;margin-top:6px"><button class="bt bs" onclick="cMo()">취소</button><button class="bt bp" onclick="sbP()">등록</button></div>';document.getElementById('mo').classList.add('sh');}
function sbP(){const t=document.getElementById('wT').value.trim(),b=document.getElementById('wB').value.trim();if(!t)return;U.mp.unshift({id:Date.now(),g:'자유',t,b,a:U.nk||'익명',l:0,c:[],m:0});xp(15,'글작성');cMo();rAll();toast('+15XP');}
function cMo(){document.getElementById('mo').classList.remove('sh');document.getElementById('moB').innerHTML='';}
function xp(a,t){U.xp+=a;U.ac.push({t,xp:a,m:0});while(U.xp>=U.xm){U.xp-=U.xm;U.lv++;U.xm=Math.floor(U.xm*1.1);const k=Object.keys(U.st),r=k[Math.random()*k.length|0];U.st[r]=Math.min(100,U.st[r]+(Math.random()*2|0)+1);toast('Lv.'+U.lv+'!');}sv();rProf();uN();}
function dH(){const c=document.getElementById('sC');if(!c)return;const x=c.getContext('2d'),w=c.width,h=c.height,cx=w/2,cy=h/2,r=w*.35,st=U.st,k=Object.keys(st),n=k.length,lb=['지식','체력','창의력','소통','리더십','기술'];x.clearRect(0,0,w,h);for(let g=5;g>=1;g--){x.beginPath();for(let i=0;i<n;i++){const a=Math.PI*2/n*i-Math.PI/2;i?x.lineTo(cx+Math.cos(a)*r*(g/5),cy+Math.sin(a)*r*(g/5)):x.moveTo(cx+Math.cos(a)*r*(g/5),cy+Math.sin(a)*r*(g/5));}x.closePath();x.strokeStyle='rgba(139,92,246,'+(0.04+g*.03)+')';x.stroke();}x.beginPath();const v=Object.values(st);for(let i=0;i<n;i++){const a=Math.PI*2/n*i-Math.PI/2;i?x.lineTo(cx+Math.cos(a)*r*(v[i]/100),cy+Math.sin(a)*r*(v[i]/100)):x.moveTo(cx+Math.cos(a)*r*(v[i]/100),cy+Math.sin(a)*r*(v[i]/100));}x.closePath();const gd=x.createLinearGradient(cx-r,cy-r,cx+r,cy+r);gd.addColorStop(0,'rgba(139,92,246,.2)');gd.addColorStop(1,'rgba(6,214,160,.2)');x.fillStyle=gd;x.fill();x.strokeStyle='rgba(139,92,246,.5)';x.lineWidth=1.5;x.stroke();x.fillStyle='#94a3b8';x.font='9px Noto Sans KR';x.textAlign='center';for(let i=0;i<n;i++){const a=Math.PI*2/n*i-Math.PI/2;x.fillText(lb[i]+' '+v[i],cx+Math.cos(a)*(r+14),cy+Math.sin(a)*(r+14)+3);}}
function rProf(){document.getElementById('pL').textContent=U.lv;document.getElementById('xC').textContent=U.xp;document.getElementById('xM').textContent=U.xm;setTimeout(()=>document.getElementById('lB').style.width=(U.xp/U.xm*100)+'%',80);dH();const ac=U.ac.length?U.ac.slice(-5).reverse():[{t:'가입!',xp:0,m:0}];document.getElementById('tl').innerHTML=ac.map(a=>'<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid rgba(139,92,246,.04)"><div style="width:6px;height:6px;border-radius:50%;background:var(--p);margin-top:4px;flex-shrink:0"></div><div style="font-size:11px">'+a.t+(a.xp?' <span style="color:var(--gd)">+'+a.xp+'</span>':'')+'</div></div>').join('');}
let tt;function toast(m){const t=document.getElementById('tst');t.textContent=m;t.classList.add('sh');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('sh'),1800);}

function rAll(){
  // 홈: 과목별 영상 행 (넷플릭스 스타일)
  const cats=[...new Set(V.map(v=>v.c))];
  const catIcons={음악:'🎵',체육:'⚽',과학:'🔬',언어:'🗣️',두뇌:'🧠',동화:'📖',건강:'💪',감성:'🤝',미술:'🎨',안전:'🛡️'};
  document.getElementById('homeRows').innerHTML=cats.map(c=>{
    const items=V.filter(v=>v.c===c);
    if(items.length<2)return '';
    return '<div class="sec">'+(catIcons[c]||'▶️')+' '+c+' <span style="margin-left:auto;font-size:10px;font-weight:400;color:var(--cy);cursor:pointer" onclick="go(1)">더보기 ›</span></div><div class="row">'+items.map(vc).join('')+'</div>';
  }).join('');
  document.getElementById('sR').innerHTML=SIMS.slice(0,4).map(sc).join('');
  document.getElementById('sR2').innerHTML=SIMS.slice(4,8).map(sc).join('');
  document.getElementById('gR').innerHTML=GMS.map(g=>'<div class="gc" onclick="oG(\''+g.u+'\',\''+g.nm+'\')"><div class="gi">'+g.em+'</div><div class="gn">'+g.nm+'</div><div class="gd">'+g.d+'</div></div>').join('');
  renderQuiz(document.getElementById('qR'),QUIZ);
  document.getElementById('hU').innerHTML=UTS.map(u=>'<div class="gc" onclick="openU(\''+u.id+'\')"><div class="gi">'+u.ic+'</div><div class="gn">'+u.nm+'</div></div>').join('');
  document.getElementById('calcR').innerHTML=[...P,...U.mp].sort((a,b)=>b.l-a.l).slice(0,3).map(pH).join('');
  const cats2=[...new Set(V.map(v=>v.c))];
  document.getElementById('allV').innerHTML=cats2.map(c=>'<div class="sec" style="font-size:13px">'+(c)+'</div><div class="row">'+V.filter(v=>v.c===c).map(vc).join('')+'</div>').join('');
  document.getElementById('allS').innerHTML=SIMS.map(sc).join('');
  renderQuiz(document.getElementById('allQ'),QUIZ);
  renderUtils(document.getElementById('allU'));
  document.getElementById('allP').innerHTML=[...P,...U.mp].map(pH).join('');
  rProf();uN();
}

function init(){
  setTimeout(()=>document.getElementById('splash').classList.add('h'),600);
  setTimeout(()=>{ckNk();rAll();},700);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
document.addEventListener('DOMContentLoaded',init);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){cG();cMo();}});
</script>
</body>
